      ${r.kmExceso?`<div><span>Km excedentes</span>${num(r.kmExceso)} km${r.cargoKm?`, ${money(r.cargoKm)}`:' (no cobrados)'}</div>`:''}
      ${(()=>{resolveNames([r.creadoPor,r.entregadoPor,r.recibidoPor]);const t=[r.creadoPor&&`registró ${who(r.creadoPor)}`,r.entregadoPor&&`entregó ${who(r.entregadoPor)}`,r.recibidoPor&&`recibió ${who(r.recibidoPor)}`].filter(Boolean);return t.length?`<div class="full muted" style="font-size:13px">${esc(t.join(', '))}</div>`:''})()}
      ${(r.extensiones||[]).length?`<div class="full"><span>Extensiones</span>${r.extensiones.map(x=>`Del ${fDT(x.de)} al ${fDT(x.a)}${x.nota?` (${esc(x.nota)})`:''}`).join('<br>')}</div>`:''}
    </div>
    <div class="dsec"><h3>Cuenta</h3><div class="sum">
      <div><span>Renta: ${money(r.tarifa)} x ${r.dias} día${r.dias==1?'':'s'}</span><span>${money(r.tarifa*r.dias)}</span></div>
      ${r.cdw?`<div><span>CDW: ${money(r.cdw)} x ${r.dias}</span><span>${money(r.cdw*r.dias)}</span></div>`:''}
      ${r.cargos?`<div><span>Cargos extra y daños</span><span>${money(r.cargos)}</span></div>`:''}${r.descuento?`<div><span>Descuento</span><span>-${money(r.descuento)}</span></div>`:''}
      <div class="tot"><span>Total</span><span>${money(T)}</span></div>
      ${iva?`<div class="muted" style="font-size:13px"><span>Incluye IVA</span><span>${money(iva)}</span></div>`:''}
      <div><span>Pagado</span><span>${money(rPaid(r))}</span></div>
      <div><b>Saldo</b><b class="${sal>0.009?'neg':'pos'}">${sal>0.009?money(sal):sal<-0.009?'Pagó de más '+money(-sal):'Pagado completo'}</b></div></div></div>
    ${(r.danosCobro||[]).length?`<div class="dsec"><h3>Daños cobrados</h3>${r.danosCobro.map(d=>`<div class="pay"><span>${esc(d.pieza||'Daño')}</span><b>${money(d.monto)}</b></div>`).join('')}</div>`:''}
    <div class="dsec"><h3>Pagos ${r.estado!=='cancelada'?`<button class="btn sm" data-act="pay-new" data-id="${r.id}">${ic('plus')}Registrar pago</button>`:''}</h3>
      ${pays.length?pays.map(p=>`<div class="pay"><div><b>${money(p.monto)}</b> <span class="muted">${esc(p.metodo||'')}${p.nota?', '+esc(p.nota):''}</span></div><div style="display:flex;gap:8px;align-items:center"><span class="muted">${fDate(p.fecha,{day:'numeric',month:'short'})}</span><button class="btn sm ghost danger" data-act="pay-del" data-id="${r.id}" data-pid="${p.id}" aria-label="Borrar pago">${ic('x')}</button></div></div>`).join(''):'<p class="muted" style="margin:0">Todavía no hay pagos registrados.</p>'}</div>
    ${inspSummary(r)}`;
  let main='';
  if(r.estado==='reservada')main=`<button class="btn primary" data-act="checkout" data-id="${r.id}">Entregar carro</button>`;
  if(r.estado==='en_curso')main=`<button class="btn sm" data-act="extend" data-id="${r.id}">Extender</button><button class="btn sm" data-act="swap" data-id="${r.id}">Cambiar de carro</button><button class="btn primary" data-act="checkin" data-id="${r.id}">Recibir carro</button>`;
  const left=`<div class="left">${r.estado!=='cancelada'?`<button class="btn sm" data-act="docs" data-id="${r.id}">${ic('doc')}Contrato y hoja</button><button class="btn sm" data-act="wa" data-id="${r.id}">WhatsApp</button>`:''}${r.estado==='reservada'||r.estado==='en_curso'?`<button class="btn sm" data-act="rent-edit" data-id="${r.id}">Editar</button>`:''}
    ${r.estado==='reservada'?`<button class="btn sm danger" data-act="rent-cancel" data-id="${r.id}">Cancelar reserva</button>`:''}
    ${r.estado==='finalizada'||r.estado==='cancelada'?`<button class="btn sm danger" data-act="rent-del" data-id="${r.id}">Eliminar</button>`:''}</div>`;
  openModal('Detalle de renta',body,left+main,null,true);
}

function checkoutForm(id){
  const r=byId('rentas',id);if(!r)return;const v=byId('vehiculos',r.vehiculo_id);const now=toLocalISO(nowSV());
  const init=(r.insp&&r.insp.salida)||{llantas:(v&&v.llantas)||{}};
  openModal('Entregar carro',`<p style="margin-top:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${plate(v)} <span><b>${esc(vShort(v))}</b> para <b>${esc(cliName(r))}</b>${r.numContrato?`, contrato N° ${fmtNum(r.numContrato)}`:''}</span></p>${(()=>{const w=cliAlerts(cli(r),r.entrega);return w.length?`<div class="warnbox" style="margin-bottom:12px">Revisa antes de entregar: ${w.map(esc).join(' ')}</div>`:''})()}
    <form id="cf" class="form"><label class="f">Fecha y hora de salida<input name="salidaReal" type="datetime-local" value="${now}"></label>
    <label class="f">Kilometraje al salir<input name="km" type="number" min="0" value="${v?.km||''}"></label>

    ${rSaldo(r)>0.009?`<label class="f">Cobrar ahora ($) <span class="hint">Saldo: ${money(rSaldo(r))}</span><input name="pago" type="number" min="0" step="0.01" placeholder="0.00"></label><label class="f">Forma de pago<select name="metodo">${opts(METODOS)}</select></label>`:''}
    ${inspHTML()}
    <label class="f full">Observaciones al salir<textarea name="obs">${esc(r.obs||'')}</textarea></label></form>`,
    `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="cfSave">Confirmar entrega</button>`,m=>{
      const getInsp=mountInsp(m,init,null);
      $('#cfSave',m).onclick=async()=>{const f=$('#cf',m);const km=nv(f,'km');const insp=getInsp();
        const rec={...r,entregadoPor:myId(),estado:'en_curso',salidaReal:fv(f,'salidaReal')||now,kmSalida:km||null,combSalida:fv(f,'comb'),deposito:nv(f,'deposito'),obs:fv(f,'obs'),pagos:[...(r.pagos||[])],insp:{...(r.insp||{}),salida:insp}};
        if(!rec.numContrato)rec.numContrato=nextContrato();
        const p=f.elements.pago?nv(f,'pago'):0;if(p>0)rec.pagos.push({id:uid(),por:myId(),fecha:now,monto:p,metodo:fv(f,'metodo'),nota:'Al entregar'});
        if(conflicts(r.vehiculo_id,rec.salidaReal,rec.entrega,r.id).length){toast('El carro todavía está con otro cliente');return}
        $('#cfSave',m).disabled=true;
        try{await save('rentas',rec);if(v)await save('vehiculos',{...v,km:Math.max(+v.km||0,km||0),llantas:insp.llantas});
          toast('Carro entregado. Imprime el contrato y la hoja.');await waitFor(()=>{const x=byId('rentas',id);return x&&x.estado==='en_curso'});openDocs(id)}
        catch(e){$('#cfSave',m).disabled=false;toast(errMsg(e))}};
    },true);
}

function checkinForm(id,xo={}){
  const r=byId('rentas',id);if(!r)return;const nextId=xo.next||(r.cambioA&&byId('rentas',r.cambioA)?.estado==='reservada'?r.cambioA:null);const v=byId('vehiculos',r.vehiculo_id);const now=toLocalISO(nowSV());
  const d0=calcDias(r.salidaReal||r.salida,now);const sI=(r.insp&&r.insp.salida)||{};
  const init=(r.insp&&r.insp.entrada)||{danos:{...(sI.danos||{})},acc:{...(sI.acc||{})},llantas:{...(sI.llantas||{})},fotos:[]};
  openModal('Recibir carro',`<p style="margin-top:0">${plate(v)} <b>${esc(vShort(v))}</b> de <b>${esc(cliName(r))}</b>. Salió ${fDT(r.salidaReal||r.salida)}, debía regresar ${fDT(r.entrega)}</p>

    <label class="f">Kilometraje al regresar${r.kmSalida?` <span class="hint">Salió con ${num(r.kmSalida)} km</span>`:''}<input name="km" type="number" min="0"></label>
    <label class="f">Combustible<select name="comb">${opts(COMB,r.combSalida||'Lleno')}</select></label>
    <label class="f">Días a cobrar <span class="hint">Pactados: ${r.dias}. Según hora real: <span id="dReal">${d0}</span></span><input name="dias" type="number" min="1" value="${Math.max(r.dias,d0)}"></label>
    ${inspHTML()}
    <div class="grp">Cargos al cliente</div>
    <label class="f">Combustible, limpieza u otros ($)<input name="extra" type="number" min="0" step="0.01" placeholder="0.00"></label>
    <label class="f">Motivo<input name="extraMotivo" placeholder="Ej. faltó 1/4 de tanque"></label>
    ${r.kmDia&&+r.kmExtra?`<label class="chk full"><input type="checkbox" name="cobrarKm" checked> <span id="kmExc">Cobrar kilometraje excedente (${num(r.kmDia)} km libres por día, ${money(r.kmExtra)} por km adicional)</span></label>`:''}
    <div class="full"><div style="font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px">Daños a cobrar</div><div id="dcBox"></div><button type="button" class="linkbtn" id="dcAdd">+ Agregar daño a cobrar</button></div>
    <div class="full sum" id="ksum"></div>
    <label class="f">Cobrar ahora ($)<input name="pago" type="number" min="0" step="0.01"></label>
    <label class="f">Forma de pago<select name="metodo">${opts(METODOS)}</select></label>
    ${r.deposito&&!r.depositoTransferido&&!nextId?`<label class="chk full"><input type="checkbox" name="dev" checked> Devolver depósito de ${money(r.deposito)}</label>`:''}
    ${nextId?`<div class="full infobox">Es un cambio de carro: el depósito pasa a la renta nueva. Al cerrar esta, se abre la entrega del carro nuevo.</div>`:''}
    <label class="f full">Observaciones al recibir<textarea name="obs" placeholder="Estado en que regresó el carro"></textarea></label></form>`,
    `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="kfSave">${nextId?'Recibir y entregar el carro nuevo':'Cerrar renta'}</button>`,m=>{
      const f=$('#kf',m);let payTouched=false;const dc=[];
      const drawDc=()=>{$('#dcBox',m).innerHTML=dc.map((d,i)=>`<div class="dc"><input data-dci="${i}" data-k="pieza" value="${esc(d.pieza)}" placeholder="Pieza dañada"><input data-dci="${i}" data-k="monto" type="number" min="0" step="0.01" value="${d.monto||''}" placeholder="$"><button type="button" class="btn sm ghost" data-dcdel="${i}" aria-label="Quitar">${ic('x')}</button></div>`).join('')};
      const kmC=()=>{const k=nv(f,'km');if(!r.kmDia||!+r.kmExtra||!k||!r.kmSalida)return{exc:0,c:0};const exc=Math.max(0,k-r.kmSalida-r.kmDia*nv(f,'dias'));return{exc,c:f.elements.cobrarKm&&f.elements.cobrarKm.checked?exc*r.kmExtra:0}};
      const calc=()=>{const sumDc=dc.reduce((a,d)=>a+(+d.monto||0),0);const kc=kmC();const ke=$('#kmExc',m);if(ke)ke.textContent=kc.exc?`Cobrar ${num(kc.exc)} km excedentes (${money(kc.exc*r.kmExtra)})`:`Sin kilometraje excedente (${num(r.kmDia)} km libres por día)`;
        const x={tarifa:r.tarifa,cdw:r.cdw,dias:nv(f,'dias'),cargos:(+r.cargos||0)+nv(f,'extra')+sumDc+kc.c,descuento:r.descuento};const t=rTotal(x),s=t-rPaid(r);
        if(!payTouched)f.elements.pago.value=s>0?s.toFixed(2):'';
        $('#ksum',m).innerHTML=`<div><span>Total final</span><span>${money(t)}</span></div>${sumDc?`<div><span>Incluye daños</span><span>${money(sumDc)}</span></div>`:''}<div><span>Ya pagó</span><span>${money(rPaid(r))}</span></div><div class="tot"><span>Saldo</span><span>${money(s)}</span></div>`};
      const getInsp=mountInsp(m,init,sI,k=>{if(!dc.some(d=>d.pieza===ZN[k])){dc.push({pieza:ZN[k],monto:''});drawDc();calc()}});
      drawDc();calc();
      $('#dcAdd',m).onclick=()=>{dc.push({pieza:'',monto:''});drawDc();const ins=$$('[data-k="pieza"]',m);ins[ins.length-1].focus()};
      f.addEventListener('click',e=>{const d=e.target.closest('[data-dcdel]');if(d){dc.splice(+d.dataset.dcdel,1);drawDc();calc()}});f.addEventListener('change',e=>{if(e.target.name==='cobrarKm')calc()});
      f.addEventListener('input',e=>{const t=e.target;if(t.dataset.dci!=null){dc[+t.dataset.dci][t.dataset.k]=t.value;calc();return}
        if(t.name==='pago')payTouched=true;if(t.name==='entregaReal'){const d=calcDias(r.salidaReal||r.salida,t.value);$('#dReal',m).textContent=d;f.elements.dias.value=Math.max(r.dias,d)}calc()});
      $('#kfSave',m).onclick=async()=>{const km=nv(f,'km');const extra=nv(f,'extra');const dcs=dc.filter(d=>d.pieza||+d.monto).map(d=>({pieza:d.pieza,monto:+d.monto||0}));const sumDc=dcs.reduce((a,d)=>a+d.monto,0);
        const rec={...r,estado:'finalizada',entregaReal:fv(f,'entregaReal')||now,kmEntrada:km||null,combEntrada:fv(f,'comb'),dias:Math.max(1,Math.round(nv(f,'dias'))),recibidoPor:myId(),kmExceso:kmC().exc,cargoKm:kmC().c,cargos:(+r.cargos||0)+extra+sumDc+kmC().c,danosCobro:[...(r.danosCobro||[]),...dcs],
          obsEntrada:[extra?`Cargo de ${money(extra)}${fv(f,'extraMotivo')?': '+fv(f,'extraMotivo'):''}`:'',fv(f,'obs')].filter(Boolean).join('. '),pagos:[...(r.pagos||[])],insp:{...(r.insp||{}),entrada:getInsp()}};
        if(f.elements.dev)rec.depositoDevuelto=f.elements.dev.checked;
        if(km&&r.kmSalida&&km<r.kmSalida){toast('El kilometraje de regreso es menor al de salida');return}
        if(parse(rec.entregaReal)<parse(r.salidaReal||r.salida)){toast('La hora de regreso no puede ser antes de la salida');return}
        const p=nv(f,'pago');if(p>0)rec.pagos.push({id:uid(),por:myId(),fecha:rec.entregaReal,monto:p,metodo:fv(f,'metodo'),nota:'Al recibir'});
        $('#kfSave',m).disabled=true;
        try{await save('rentas',rec);if(v)await save('vehiculos',{...v,km:Math.max(+v.km||0,km||0),llantas:rec.insp.entrada.llantas});if(nextId){toast('Carro recibido. Ahora entrega el carro nuevo.');await waitFor(()=>byId('rentas',id)?.estado==='finalizada');checkoutForm(nextId);return}
          closeModal();toast(rSaldo(rec)>0.009?`Renta cerrada con saldo de ${money(rSaldo(rec))}`:'Renta cerrada y pagada')}catch(e){$('#kfSave',m).disabled=false;toast(errMsg(e))}};
    },true);
}

/* --- importación de clientes --- */
function parseTable(text){
  text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/)[0]||'';
  const d=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"'&&cell==='')q=true;
    else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x));
}
function mapClients(rows){
  if(!rows.length)return[];
  const keys={documento:['documento','dui','doc','identificacion','pasaporte','nit','id'],licencia:['licencia','lic'],nombre:['nombre','cliente','nombres'],direccion:['direccion','domicilio'],telefono:['telefono','tel','fijo'],celular:['celular','movil','cel','whatsapp'],email:['correo','email','e-mail','mail'],estado:['estado']};
  const h=rows[0].map(norm);const map={};
  h.forEach((x,i)=>{for(const[k,list]of Object.entries(keys)){if(map[k]==null&&list.some(w=>x===w||x.startsWith(w))){map[k]=i;break}}});
  let data=rows;
  if(map.nombre!=null)data=rows.slice(1);
  else{['documento','licencia','nombre','direccion','telefono','celular'].forEach((k,i)=>map[k]=i)}
  return data.map(r=>{const o={};for(const k of Object.keys(keys))if(map[k]!=null)o[k]=(r[map[k]]||'').trim();
    o.estado=norm(o.estado).startsWith('inac')?'inactivo':'activo';o.nombre=(o.nombre||'').toUpperCase();return o}).filter(o=>o.nombre);
}

function vehMonths(id){
  const v=byId('vehiculos',id);if(!v)return;const now=nowSV();const lt=lifetime(v);const eq=equilibrio(v);const st=vStart(v);
  const cur=new Date(now.getFullYear(),now.getMonth(),1);let first=new Date(cur.getFullYear(),cur.getMonth()-11,1);
  if(st){const s0=new Date(st.getFullYear(),st.getMonth(),1);if(s0>first)first=s0}else first=cur;
  const months=[];for(let m=new Date(cur);m>=first;m=new Date(m.getFullYear(),m.getMonth()-1,1))months.push(m);
  const rows=months.map(m=>{const x=profitOne(v,m,new Date(m.getFullYear(),m.getMonth()+1,1));const isCur=m.getTime()===cur.getTime();
    return`<tr><td>${esc(fDate(m,{month:'long',year:'numeric'}))}${isCur?' <span class="muted">(en curso)</span>':''}</td><td class="n">${x.dias.toFixed(1)}</td><td class="n">${money(x.ing)}</td><td class="n">${money(x.gas+x.fijos)}</td><td class="n">${money(x.cuota)}</td><td class="n ${x.util<0?'neg':''}"><b>${money(x.util)}</b></td><td><span class="tag ${x.ver.k}">${x.ver.t}</span></td></tr>`}).join('');

  openModal(esc(vShort(v))+' mes a mes',`<div style="display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap">${plate(v,true)}<div style="flex:1;min-width:180px"><div style="font:600 21px/1.1 'Barlow Condensed',sans-serif">${esc(vName(v))}</div><div class="muted">${st?'En operación desde '+fDate(st,{month:'long',year:'numeric'}):'Sin fecha de compra'}</div></div></div>

      <div><span>Costo fijo al mes</span><b>${eq?money(eq.m):'—'}</b></div>
      <div><span>Para cubrirlo necesita</span><b>${eq&&eq.d!=null?Math.ceil(eq.d)+' días al mes':'—'}</b></div>
      <div><span>Ha dejado en total</span><b class="${lt.util<0?'neg':''}">${money(lt.util)}</b></div>
      ${v.financiado?`<div><span>Cuotas pagadas</span><b>${lt.cuotasPag}${+v.plazo?' de '+v.plazo:''}</b></div><div><span>Falta pagar al banco</span><b>${lt.pendiente!=null?money(lt.pendiente):'—'}</b></div>`:''}
      <div><span>Inversión recuperada</span><b>${recLabel(lt)}</b></div>
    </div>
    ${lt.rec!=null?`<div class="oil" style="height:10px;margin-bottom:8px"><i class="${lt.rec>=1?'':'warn'}" style="width:${Math.max(0,Math.min(1,lt.rec))*100}%"></i></div>`:''}
    <p class="muted" style="margin:0 0 16px;font-size:14px">${recTxt}</p>
    <div class="twrap"><table><thead><tr><th>Mes</th><th class="n">Días</th><th class="n">Ingresos</th><th class="n">Gastos y fijos</th><th class="n">Cuota</th><th class="n">Quedó</th><th>Resultado</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="muted">Sin movimientos todavía.</td></tr>'}</tbody></table></div>`,

/* --- exportar --- */
async function exportCSV(){
  const R=UI.rep;const from=parse(R.from),to=addDays(parse(R.to),1);const P=profit(from,to).sort((a,b)=>b.util-a.util);
  const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const lines=[['Placa','Vehículo','Tipo','Rentas','Días rentado','Ocupación %','Ingresos','Gastos','Seguro y GPS','Cuota','Quedó','Resultado'].map(q).join(',')];
  P.forEach(p=>lines.push([p.v.placa,vName(p.v),p.v.categoria,p.n,p.dias.toFixed(1),Math.round(p.ocup*100),p.ing.toFixed(2),p.gas.toFixed(2),p.fijos.toFixed(2),p.cuota.toFixed(2),p.util.toFixed(2),p.ver.t].map(q).join(',')));
  const csv='\uFEFF'+lines.join('\r\n');const name=`rentabilidad_${R.from}_al_${R.to}.csv`;
  if(DL){try{await DL.save({filename:name,data:csv});return}catch(e){if(e&&(e.code==='cancelled'||e.code==='declined'))return}}
  try{await navigator.clipboard.writeText(lines.join('\n'));toast('Tabla copiada. Pégala en Excel.')}catch(e){toast('No se pudo descargar el archivo en este navegador.')}
}

async function ensureNum(id){const r=byId('rentas',id);if(r&&!r.numContrato){try{await save('rentas',{...r,numContrato:nextContrato()});await waitFor(()=>byId('rentas',id)?.numContrato)}catch(e){}}return byId('rentas',id)}
const DOCK='riveras-docopts';

function docsHTML(r,logo,preview){const o=docOpts();const parts=[];let hojas=0;
  const add=(cp,hoja)=>{parts.push(docContrato(r,logo,cp));hojas+=o.duplex?1:2;if(hoja){parts.push(docHoja(r,logo,cp));hojas+=1;if(o.duplex&&!preview)parts.push('<div class="pg"></div>')}};
  if(o.copias!=='copia')add('Original: arrendante',true);
  if(o.copias!=='original')add('Copia: arrendatario',o.copias==='copia'||o.hojaCopia);
  return{html:parts.join(''),hojas}}

const DIAS_C=['L','M','M','J','V','S','D'];
const TIMES=(()=>{const a=[];for(let h=0;h<24;h++)for(const m of[0,30])a.push(`${pad(h)}:${pad(m)}`);return a})();
const timeLabel=hm=>{const[h,m]=hm.split(':').map(Number);return`${h%12||12}:${pad(m)} ${h>=12?'p.m.':'a.m.'}`};
function parseDMY(t){const x=String(t||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/);if(!x)return null;let y=+x[3];if(y<100)y+=2000;const mo=+x[2]-1,d=+x[1];const dt=new Date(y,mo,d);return dt.getFullYear()===y&&dt.getMonth()===mo&&dt.getDate()===d?dt:null}
const toDMY=iso=>{if(!iso)return'';const[y,m,d]=iso.slice(0,10).split('-');return`${d}/${m}/${y}`};
let _calPop=null;
function closeCalPop(){if(_calPop){_calPop.remove();_calPop=null}}
function openCalPop(w,sel,onPick){
  closeCalPop();let vm=new Date(sel.getFullYear(),sel.getMonth(),1);const pop=document.createElement('div');pop.className='cal-pop';
  const draw=()=>{const first=(vm.getDay()+6)%7;const dim=new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate();const t0=startOfDay(nowSV()).getTime(),s0=startOfDay(sel).getTime();
    let cells='';for(let i=0;i<first;i++)cells+='<span></span>';
    for(let d=1;d<=dim;d++){const t=new Date(vm.getFullYear(),vm.getMonth(),d).getTime();cells+=`<button type="button" data-d="${d}" class="${t===s0?'sel':''}${t===t0?' td':''}">${d}</button>`}
    pop.innerHTML=`<div class="ch"><button type="button" data-m="-1" aria-label="Mes anterior">${ic('left')}</button><span>${MESES[vm.getMonth()]} ${vm.getFullYear()}</span><button type="button" data-m="1" aria-label="Mes siguiente">${ic('right')}</button></div><div class="cg">${DIAS_C.map(x=>`<span>${x}</span>`).join('')}${cells}</div><div class="cf"><button type="button" class="linkbtn" data-hoy>Hoy</button></div>`};
  draw();
  pop.addEventListener('click',e=>{e.stopPropagation();const m=e.target.closest('[data-m]');if(m){vm=new Date(vm.getFullYear(),vm.getMonth()+(+m.dataset.m),1);draw();return}
    const d=e.target.closest('[data-d]');if(d){onPick(new Date(vm.getFullYear(),vm.getMonth(),+d.dataset.d));closeCalPop();return}
    if(e.target.closest('[data-hoy]')){onPick(startOfDay(nowSV()));closeCalPop()}});
  w.appendChild(pop);_calPop=pop;
}
document.addEventListener('click',e=>{if(_calPop&&!e.target.closest('.dtp'))closeCalPop()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&_calPop){closeCalPop();e.preventDefault()}},true);
function enhanceDates(root){
  root.querySelectorAll('input[type="date"],input[type="datetime-local"]').forEach(inp=>{
    const wt=inp.type==='datetime-local';
    const hid=document.createElement('input');hid.type='hidden';hid.name=inp.name;if(inp.id)hid.id=inp.id;if(inp.dataset.in)hid.dataset.in=inp.dataset.in;hid.value=inp.value||'';
    const w=document.createElement('div');w.className='dtp';w.style.cssText=inp.style.cssText;
    const iso=hid.value;const hm=wt&&iso.length>=16?iso.slice(11,16):'09:00';
    const topts=TIMES.slice();if(wt&&!topts.includes(hm)){topts.push(hm);topts.sort()}
    w.innerHTML=`<div class="dtp-d"><input type="text" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" aria-label="Fecha" value="${toDMY(iso)}"><button type="button" class="dtp-b" aria-label="Abrir calendario">${ic('cal')}</button></div>${wt?`<select aria-label="Hora">${topts.map(t=>`<option value="${t}" ${t===hm?'selected':''}>${timeLabel(t)}</option>`).join('')}</select>`:''}`;
    inp.replaceWith(w);w.appendChild(hid);
    const ti=w.querySelector('input[type="text"]');const sel=w.querySelector('select');
    const fire=()=>{hid.dispatchEvent(new Event('input',{bubbles:true}));hid.dispatchEvent(new Event('change',{bubbles:true}))};
    const commit=d=>{const v=d?dateOnly(d)+(wt?'T'+sel.value:''):'';if(v===hid.value)return;hid.value=v;fire()};
    const cur=()=>parseDMY(ti.value);
    ti.addEventListener('input',e=>{e.stopPropagation();
      if(!(e.inputType||'').startsWith('delete')){const dg=ti.value.replace(/\D/g,'').slice(0,8);ti.value=dg.length>4?dg.slice(0,2)+'/'+dg.slice(2,4)+'/'+dg.slice(4):dg.length>2?dg.slice(0,2)+'/'+dg.slice(2):dg}
      w.classList.remove('bad');const d=cur();if(d&&ti.value.length>=8)commit(d)});
    ti.addEventListener('change',e=>e.stopPropagation());
    ti.addEventListener('blur',()=>{if(!ti.value.trim()){if(hid.value){hid.value='';fire()}return}const d=cur();w.classList.toggle('bad',!d);if(d){ti.value=toDMY(dateOnly(d));commit(d)}});
    if(sel){sel.addEventListener('input',e=>e.stopPropagation());sel.addEventListener('change',e=>{e.stopPropagation();const d=cur();if(d)commit(d)})}
    w.querySelector('.dtp-b').addEventListener('click',()=>openCalPop(w,cur()||nowSV(),d=>{ti.value=toDMY(dateOnly(d));w.classList.remove('bad');commit(d)}));
  });
}

/* ---------- mantenimiento preventivo ---------- */
const PLAN=()=>Array.isArray(CFG.planMant)&&CFG.planMant.length?CFG.planMant:CFG_DEF.planMant;
function kmPorDia(v){const since=addDays(nowSV(),-120);let km=0;
  S.rentas.forEach(r=>{if(r.vehiculo_id===v.id&&r.kmSalida&&r.kmEntrada&&parse(r.salidaReal||r.salida)>=since)km+=Math.max(0,r.kmEntrada-r.kmSalida)});return km>0?km/120:0}
function lastMant(v,t){const m=v.mant&&v.mant[t.id];if(m)return m;
  if(t.id==='aceite'&&v.aceiteUltimoKm!=null&&v.aceiteUltimoKm!=='')return{km:+v.aceiteUltimoKm,fecha:''};return null}
function mantStatus(v,t,now=nowSV()){
  const last=lastMant(v,t);if(!last)return{k:'nodata',o:3,txt:'Sin registro',short:'Sin dato',score:1e9};
  const aK=+CFG.avisoKm||500,aD=+CFG.avisoDias||7;const kpd=kmPorDia(v);
  let kmLeft=null,dLeft=null,est=null;
  if(+t.km&&last.km!=null&&last.km!==''){kmLeft=(+last.km)+(+t.km)-(+v.km||0);if(kpd>0)est=kmLeft/kpd}
  if(+t.dias&&last.fecha){dLeft=(+parse(last.fecha)-+startOfDay(now))/DAY+(+t.dias)}
  if(kmLeft==null&&dLeft==null)return{k:'nodata',o:3,txt:'Falta la fecha o el km del último servicio',short:'Sin dato',score:1e9};
  const overdue=(kmLeft!=null&&kmLeft<=0)||(dLeft!=null&&dLeft<=0);
  const soon=(kmLeft!=null&&kmLeft<=aK)||(dLeft!=null&&dLeft<=aD)||(est!=null&&est<=aD);
  const k=overdue?'due':soon?'soon':'ok';
  const parts=[];
  if(kmLeft!=null)parts.push(kmLeft<=0?`pasado por ${num(-kmLeft)} km`:`faltan ${num(kmLeft)} km${est!=null?`, aprox. ${Math.max(1,Math.round(est))} días`:''}`);
  if(dLeft!=null)parts.push(dLeft<=0?`vencido hace ${Math.max(1,Math.round(-dLeft))} días`:`toca en ${Math.ceil(dLeft)} días`);
  const kmDays=kmLeft==null?1e6:kmLeft<=0?kmLeft/100:(est!=null?est:kmLeft/60);const score=Math.min(kmDays,dLeft==null?1e6:dLeft);
  const short=kmLeft!=null&&(dLeft==null||kmDays<=dLeft)?`${kmLeft<=0?'-':''}${num(Math.abs(kmLeft))} km`:`${dLeft<=0?'-':''}${Math.abs(Math.ceil(dLeft))} días`;
  return{k,o:k==='due'?0:k==='soon'?1:2,txt:parts.join('; '),short,score,kmLeft,dLeft,est};
}
const MS_LABEL={due:'Vencido',soon:'Pronto',ok:'Al día',nodata:'Sin dato'};
function docStatus(v){const out=[];const now=startOfDay(nowSV());
  [['vencSeguro','Seguro'],['vencCirculacion','Tarjeta de circulación']].forEach(([k,n])=>{const d=parse(v[k]);if(!d)return;const left=Math.round((+d-+now)/DAY);
    if(left<=30)out.push({v,n,left,k:left<0?'due':'soon',txt:left<0?`${n} vencido desde el ${dD(v[k])}`:left===0?`${n} vence hoy`:`${n} vence en ${left} días (${dD(v[k])})`})});return out}
function freeWindow(v){const now=nowSV();
  if(v.estado==='taller')return'En el taller';
  const act=S.rentas.find(r=>r.vehiculo_id===v.id&&r.estado==='en_curso');if(act)return`Rentado, regresa ${fDT(act.entrega)}`;
  const nx=S.rentas.filter(r=>r.vehiculo_id===v.id&&r.estado==='reservada'&&parse(r.salida)>now).sort((a,b)=>parse(a.salida)-parse(b.salida))[0];
  return nx?`Libre hasta ${fDT(nx.salida)}`:'Libre, sin reservas'}
function mantPendientes(){const res=[];
  activeVehicles().forEach(v=>{const tasks=PLAN().map(t=>({t,st:mantStatus(v,t)})).filter(x=>x.st.k==='due'||x.st.k==='soon');
    const docs=docStatus(v);if(tasks.length||docs.length)res.push({v,tasks,docs,score:Math.min(...tasks.map(x=>x.st.score),...docs.map(d=>d.left),1e9)})});
  return res.sort((a,b)=>a.score-b.score)}
function mantNoData(){return activeVehicles().filter(v=>PLAN().some(t=>mantStatus(v,t).k==='nodata'))}
function mantWarnFor(v,dias){if(!v)return'';const kpd=kmPorDia(v)||0;const w=[];
  PLAN().forEach(t=>{const st=mantStatus(v,t);if(st.k==='due')w.push(`${t.nombre} (${st.txt})`);else if(st.kmLeft!=null&&kpd&&dias&&st.kmLeft<=kpd*dias)w.push(`${t.nombre}: le tocaría durante esta renta`)});
  docStatus(v).filter(d=>d.left<=(dias||0)).forEach(d=>w.push(d.txt));return w.join('; ')}

VIEWS.taller=()=>{
  const pend=mantPendientes();const nd=mantNoData();const plan=PLAN();const vs=activeVehicles();
  const nDue=pend.reduce((a,p)=>a+p.tasks.filter(x=>x.st.k==='due').length+p.docs.filter(d=>d.k==='due').length,0);
  const nSoon=pend.reduce((a,p)=>a+p.tasks.filter(x=>x.st.k==='soon').length+p.docs.filter(d=>d.k==='soon').length,0);
  const rows=pend.map(p=>`<div class="item" style="flex-wrap:wrap;align-items:flex-start">${plate(p.v)}<div class="grow" style="min-width:220px"><div class="t">${esc(vShort(p.v))} <span class="muted" style="font-weight:400;font-size:13px">${esc(freeWindow(p.v))}</span></div>
      ${p.tasks.map(x=>`<div class="d" style="margin-top:3px"><span class="tag ${x.st.k==='due'?'late':'even'}" style="margin-right:6px">${MS_LABEL[x.st.k]}</span>${esc(x.t.nombre)}: ${esc(x.st.txt)}</div>`).join('')}
      ${p.docs.map(d=>`<div class="d" style="margin-top:3px"><span class="tag ${d.k==='due'?'late':'even'}" style="margin-right:6px">${d.k==='due'?'Vencido':'Pronto'}</span>${esc(d.txt)}</div>`).join('')}</div>
      <div class="acts">${p.v.estado==='taller'?`<button class="btn sm" data-act="taller-out" data-id="${p.v.id}">Sacar del taller</button>`:`<button class="btn sm" data-act="taller-in" data-id="${p.v.id}">Mandar al taller</button>`}${p.tasks.length?`<button class="btn sm primary" data-act="mant-new" data-id="${p.v.id}" data-tasks="${p.tasks.map(x=>x.t.id).join(',')}">Registrar hecho</button>`:`<button class="btn sm" data-act="veh-edit" data-id="${p.v.id}">Actualizar fechas</button>`}</div></div>`).join('');
  const mtx=vs.map(v=>`<tr><td>${plate(v)}</td><td><b>${esc(vShort(v))}</b><div class="muted" style="font-size:12.5px">${v.km?num(v.km)+' km':'Sin km'}</div></td>${plan.map(t=>{const st=mantStatus(v,t);return`<td class="n"><button class="mcell ${st.k}" data-act="mant-new" data-id="${v.id}" data-tasks="${t.id}" title="${esc(t.nombre+': '+st.txt)}">${esc(st.short)}</button></td>`}).join('')}</tr>`).join('');
  return`<div class="ph"><div><h1>Mantenimiento</h1><p>${nDue||nSoon?`${nDue} vencido${nDue==1?'':'s'} y ${nSoon} próximo${nSoon==1?'':'s'}.`:'Toda la flota está al día.'}</p></div>
    <div class="acts"><button class="btn" data-act="mant-share">Lista para el taller</button><button class="btn" data-act="mant-ics">${ic('cal')}Recordatorios en mi calendario</button><button class="btn primary" data-act="mant-new">${ic('plus')}Registrar mantenimiento</button></div></div>
    ${nd.length?`<div class="infobox" style="margin-bottom:16px">${nd.length} carro${nd.length==1?'':'s'} no ${nd.length==1?'tiene':'tienen'} registrado su último servicio. Regístralo una vez por carro, aunque sea con fecha aproximada, y desde ahí el sistema lleva la cuenta solo. <button class="linkbtn" data-act="mant-new" data-id="${nd[0].id}">Empezar con ${esc(vShort(nd[0]))}</button></div>`:''}
    <h2 class="sec" style="margin-top:0">Qué toca hacer<small>ordenado por urgencia</small></h2>
    ${pend.length?`<div class="rlist">${rows}</div>`:'<div class="empty"><h3>Nada pendiente</h3><p>Cuando a un carro le falten menos de '+num(+CFG.avisoKm||500)+' km o '+num(+CFG.avisoDias||7)+' días para un servicio, aparecerá aquí.</p></div>'}
    <h2 class="sec">Estado de cada carro<small>toca una casilla para registrar ese servicio</small></h2>
    <div class="twrap"><table><thead><tr><th>Placa</th><th>Vehículo</th>${plan.map(t=>`<th class="n" style="white-space:normal;min-width:92px">${esc(t.nombre)}<div style="font-weight:400">${[+t.km?num(t.km)+' km':'',+t.dias?t.dias+' días':''].filter(Boolean).join(' o ')}</div></th>`).join('')}</tr></thead><tbody>${mtx}</tbody></table></div>
    <div class="legend"><span><i style="background:var(--out)"></i>Vencido</span><span><i style="background:var(--signal)"></i>Pronto</span><span><i style="background:var(--free)"></i>Al día</span><span><i style="background:var(--done)"></i>Sin dato</span></div>
    <p class="muted" style="font-size:13px;margin-top:14px">El kilometraje se actualiza solo cada vez que recibes un carro. Los días aproximados se calculan con lo que ha recorrido cada carro en los últimos 4 meses. <button class="linkbtn" data-act="mant-plan">Cambiar el plan de mantenimiento</button></p>`;
};

async function mantIcs(){
  const now=nowSV();const ev=[];const icsDate=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  activeVehicles().forEach(v=>{PLAN().forEach(t=>{const st=mantStatus(v,t);if(st.k==='nodata')return;
      let days=Math.min(st.dLeft!=null?st.dLeft:1e6,st.kmLeft!=null?(st.kmLeft<=0?0:(st.est!=null?st.est:1e6)):1e6);if(days>=1e6||days>120)return;

  });
  if(!ev.length){toast('No hay mantenimientos estimados en los próximos 4 meses');return}
  const escI=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');

  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Riveras Rent a Car//Mantenimiento//ES','CALSCALE:GREGORIAN',

  if(DL){try{await DL.save({filename:`mantenimientos_${icsDate(now)}.ics`,data:ics});toast('Abre el archivo para agregarlo a tu calendario');return}catch(e){if(e&&e.code)return}}

}

    flota:vs.map(v=>({placa:v.placa||'(sin placa)',carro:vName(v),tipo:v.categoria,tarifa:+v.tarifa||0,km:+v.km||0,estado:VS_LABEL[vStatus(v).k]||v.estado,financiado:!!v.financiado,cuota:+v.cuota||0})),
    rentasActivas:S.rentas.filter(r=>r.estado==='en_curso').map(r=>({contrato:fmtNum(r.numContrato),cliente:cliName(r),placa:byId('vehiculos',r.vehiculo_id)?.placa,regresa:`${dD(r.entrega)} ${fTime(r.entrega)}`,atrasada:rStatus(r)==='atrasada',saldo:+rSaldo(r).toFixed(2)})),
    reservasProximas:S.rentas.filter(r=>r.estado==='reservada'&&parse(r.salida)<addDays(now,30)).map(r=>({cliente:cliName(r),placa:byId('vehiculos',r.vehiculo_id)?.placa,sale:`${dD(r.salida)} ${fTime(r.salida)}`,regresa:dD(r.entrega),total:+rTotal(r).toFixed(2)})),
    resultadoPorMes:months.map(m=>{const m1=new Date(m.getFullYear(),m.getMonth()+1,1);const P=profit(m,m1);return{mes:`${MESES[m.getMonth()]} ${m.getFullYear()}`,porCarro:P.map(p=>({placa:p.v.placa||vShort(p.v),ingresos:Math.round(p.ing),gastos:Math.round(p.gas+p.fijos),cuota:Math.round(p.cuota),quedo:Math.round(p.util),diasRentado:+p.dias.toFixed(1)}))}}),
    inversionRecuperada:vs.map(v=>{const lt=lifetime(v);return{placa:v.placa||vShort(v),recuperadoPct:lt.rec==null?null:Math.round(lt.rec*100),faltaPagarBanco:lt.pendiente}}),
    cuentasPorCobrar:porCobrar().map(r=>({cliente:cliName(r),contrato:fmtNum(r.numContrato),saldo:+rSaldo(r).toFixed(2)})),
    mantenimientoPendiente:mantPendientes().map(p=>({placa:p.v.placa||vShort(p.v),pendiente:[...p.tasks.map(x=>`${x.t.nombre}: ${x.st.txt}`),...p.docs.map(d=>d.txt)]})),
    mejoresClientes12m:(()=>{const t={};const since=addDays(now,-365);S.rentas.forEach(r=>{if(r.estado==='cancelada'||parse(r.salida)<since)return;const k=r.cliente_id;t[k]=t[k]||{cliente:cliName(r),rentas:0,total:0};t[k].rentas++;t[k].total+=rTotal(r)});return Object.values(t).sort((a,b)=>b.total-a.total).slice(0,10).map(x=>({...x,total:Math.round(x.total)}))})(),
    totalClientes:S.clientes.length};
}

function setPreset(k){const t=startOfDay(nowSV());let a,b;
  if(k==='mes'){a=new Date(t.getFullYear(),t.getMonth(),1);b=new Date(t.getFullYear(),t.getMonth()+1,0)}
  if(k==='mesant'){a=new Date(t.getFullYear(),t.getMonth()-1,1);b=new Date(t.getFullYear(),t.getMonth(),0)}
  if(k==='3m'){a=new Date(t.getFullYear(),t.getMonth()-2,1);b=new Date(t.getFullYear(),t.getMonth()+1,0)}
  if(k==='anio'){a=new Date(t.getFullYear(),0,1);b=new Date(t.getFullYear(),11,31)}
  UI.rep={preset:k,from:dateOnly(a),to:dateOnly(b)}}

document.getElementById('main').addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;const val=e.target.value;
  if(k==='rQ'){UI.rQ=val}else if(k==='cQ'){UI.cQ=val;UI.cLimit=60}else if(k==='gV'){UI.gV=val}else if(k==='gM'){UI.gM=val}
  else if(k==='repFrom'){if(!val)return;UI.rep.from=val;UI.rep.preset=''}else if(k==='repTo'){if(!val)return;UI.rep.to=val;UI.rep.preset=''}
  clearTimeout(_qT);_qT=setTimeout(render,k==='rQ'||k==='cQ'?120:0)});
setInterval(()=>{if(!dlg.open&&(UI.view==='inicio'||UI.view==='calendario'))render()},60000);

syncHash();render();initStore();
</script>
</body>
</html>
