<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riveras Rent a Car – Control de rentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F1;--surface:#FFFFFF;--surface-2:#F7F8F6;--ink:#1A1E23;--ink-2:#545B65;--ink-3:#8A919B;--line:#E1E3DF;
  --rail:#1A1E23;--rail-2:#262B31;--rail-ink:#C3C8CF;--signal:#F4B400;
  --free:#1C9463;--out:#D6453A;--booked:#2D6CDF;--shop:#7B5CC4;--done:#98A0A9;
  --free-bg:#E2F3EA;--out-bg:#FBE6E3;--booked-bg:#E3ECFC;--shop-bg:#EEE8F8;--done-bg:#EEF0F2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417;--surface:#1B1E23;--surface-2:#22262C;--ink:#ECEEF0;--ink-2:#AFB5BD;--ink-3:#7C838C;--line:#2F343B;
  --rail:#0D0F11;--rail-2:#1E2227;--free-bg:#16342A;--out-bg:#3B1E1B;--booked-bg:#19294A;--shop-bg:#2B2242;--done-bg:#2A2E34;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#121417;--surface:#1B1E23;--surface-2:#22262C;--ink:#ECEEF0;--ink-2:#AFB5BD;--ink-3:#7C838C;--line:#2F343B;
  --rail:#0D0F11;--rail-2:#1E2227;--free-bg:#16342A;--out-bg:#3B1E1B;--booked-bg:#19294A;--shop-bg:#2B2242;--done-bg:#2A2E34;color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--booked);outline-offset:2px}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
img,svg{max-width:100%}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 20px}
.brand-mark{width:36px;height:36px;border-radius:8px;background:var(--signal);color:#1A1E23;display:grid;place-items:center;font:700 24px/1 'Barlow Condensed',sans-serif;flex:none}
.brand b{display:block;color:#fff;font:600 20px/1 'Barlow Condensed',sans-serif}
.brand small{color:#8C939C;font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;color:var(--rail-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--rail-2);color:#fff}
.nav a[aria-current="page"]{background:var(--rail-2);color:#fff;box-shadow:inset 3px 0 0 var(--signal)}
.rail-foot{margin-top:auto;padding:12px;font-size:12.5px;color:#7F868F;line-height:1.4}
.rail-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--free);margin-right:6px;vertical-align:middle}
.rail-foot .dot.local{background:var(--signal)}

.main{padding:28px clamp(16px,3vw,40px) 64px;width:100%;max-width:1440px}
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.ph h1{font:600 36px/1.05 'Barlow Condensed',sans-serif;margin:0}
.ph p{margin:4px 0 0;color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h2.sec{font:600 22px/1.2 'Barlow Condensed',sans-serif;margin:30px 0 12px}
h2.sec small{font:400 14px 'Barlow',sans-serif;color:var(--ink-3);margin-left:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font-size:14.5px;font-weight:500;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#1A1E23;font-weight:600}
.btn.primary:hover{filter:brightness(.96)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--out)}
.btn.sm{padding:6px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.plate{display:inline-flex;flex-direction:column;align-items:stretch;background:#fff;border:1.5px solid #13305F;border-radius:5px;min-width:82px;overflow:hidden;line-height:1;flex:none}
.plate i{font:600 6.5px/1 'Barlow',sans-serif;letter-spacing:.9px;color:#fff;background:#13305F;text-align:center;padding:2px 0 1.5px;font-style:normal}
.plate span{font:700 17px/1 'Barlow Condensed',sans-serif;letter-spacing:1.2px;color:#16191D;text-align:center;padding:2px 7px 3px}
.plate.lg{min-width:110px}.plate.lg span{font-size:24px}.plate.lg i{font-size:8px}
.plate.noplate span{color:#A2A8B0;font-size:13px;letter-spacing:0;font-family:'Barlow',sans-serif;font-weight:500;padding:4px 7px 3px}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.3}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tag.free{color:var(--free);background:var(--free-bg)}
.tag.out,.tag.en_curso{color:var(--out);background:var(--out-bg)}
.tag.late,.tag.atrasada{color:#fff;background:var(--out)}
.tag.booked,.tag.reservada{color:var(--booked);background:var(--booked-bg)}
.tag.shop{color:var(--shop);background:var(--shop-bg)}
.tag.gain{color:var(--free);background:var(--free-bg)}.tag.loss{color:var(--out);background:var(--out-bg)}.tag.even{color:#8A6200;background:#FFF1C7}.tag.none{color:var(--ink-3);background:var(--done-bg)}.tag.fin{color:var(--ink-2);background:var(--done-bg)}.tag.fin::before{display:none}
.cell{display:inline-block;padding:3px 8px;border-radius:6px;font-weight:600;min-width:84px;text-align:right}
.cell.gain{color:var(--free);background:var(--free-bg)}.cell.loss{color:var(--out);background:var(--out-bg)}.cell.even{color:#8A6200;background:#FFF1C7}
.tag.finalizada,.tag.cancelada,.tag.baja{color:var(--ink-2);background:var(--done-bg)}

.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--free);border-radius:10px;padding:14px 14px 13px;text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:12px;font-size:inherit}
.tile:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tile.free{border-left-color:var(--free)}.tile.out{border-left-color:var(--out)}.tile.late{border-left-color:var(--out);background:linear-gradient(90deg,var(--out-bg),var(--surface) 70%)}
.tile.booked{border-left-color:var(--booked)}.tile.shop{border-left-color:var(--shop)}
.tile-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vname{font-weight:600;font-size:15.5px}
.who{font-size:13.5px;color:var(--ink-2);margin-top:2px}

.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.fig{padding:16px 18px;border-left:1px solid var(--line)}
.fig:first-child{border-left:0}
.fig .k{color:var(--ink-2);font-size:13.5px}
.fig .v{font:600 30px/1.15 'Barlow Condensed',sans-serif;margin-top:2px}
.fig .v.neg{color:var(--out)}
.fig .s{font-size:12.5px;color:var(--ink-3)}

.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.box-h{padding:14px 16px 10px;font:600 19px/1.2 'Barlow Condensed',sans-serif;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{display:flex;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .d{font-size:13.5px;color:var(--ink-2)}
.when{font:600 15px/1.1 'Barlow Condensed',sans-serif;min-width:62px;color:var(--ink-2)}
.when b{display:block;font-size:20px;color:var(--ink)}
.none{padding:18px 16px;color:var(--ink-3);border-top:1px solid var(--line);font-size:14px}
.alert-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--signal)}
.alert-dot.red{background:var(--out)}.alert-dot.violet{background:var(--shop)}

.bar-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.seg{display:inline-flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:9px;border:1px solid var(--line);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:14px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button .n{font-size:12px;color:var(--ink-3);margin-left:4px}
.range-title{font:600 22px/1.1 'Barlow Condensed',sans-serif;margin:0 6px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:10px;border-radius:3px;display:inline-block}

.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.gantt{--vw:176px;min-width:calc(var(--vw) + var(--days) * var(--dw))}
.g-row{display:grid;grid-template-columns:var(--vw) minmax(0,1fr);border-top:1px solid var(--line)}
.g-row.g-head{border-top:0}
.g-veh{position:sticky;left:0;z-index:4;background:var(--surface);padding:8px 10px;border-right:1px solid var(--line);display:flex;align-items:center;gap:9px;min-width:0}
.g-veh .vn{font-size:13px;font-weight:600;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis}
.g-veh .vn small{display:block;font-weight:400;color:var(--ink-3)}
.g-days{display:grid;grid-template-columns:repeat(var(--days),minmax(0,1fr))}
.g-day{padding:8px 2px 7px;text-align:center;font-size:12px;color:var(--ink-3);border-left:1px solid var(--line);text-transform:lowercase}
.g-day b{display:grid;place-items:center;margin:2px auto 0;width:28px;height:28px;font:600 18px/1 'Barlow Condensed',sans-serif;color:var(--ink)}
.g-day.today{color:var(--booked)}
.g-day.today b{background:var(--booked);color:#fff;border-radius:50%}
.g-day.we,.g-cells button.we{background:var(--surface-2)}
.g-track{position:relative}
.g-cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--days),minmax(0,1fr))}
.g-cells button{border:0;border-left:1px solid var(--line);background:transparent;cursor:copy;padding:0}
.g-cells button:hover{background:color-mix(in srgb,var(--signal) 16%,transparent)}
.g-bar{position:absolute;height:28px;border-radius:6px;color:#fff;font-size:12.5px;font-weight:600;padding:0 10px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;cursor:pointer;border:0;text-align:left;z-index:2;min-width:6px}
.g-bar span{overflow:hidden;text-overflow:ellipsis}
.g-bar em{font-style:normal;font-weight:500;opacity:.85}
.g-bar:hover{filter:brightness(1.08);z-index:3}
.g-bar.reservada{background:var(--booked)}
.g-bar.en_curso{background:var(--out)}
.g-bar.atrasada{background:repeating-linear-gradient(135deg,var(--out) 0 10px,#B7342B 10px 20px)}
.g-bar.finalizada{background:var(--done)}
.g-bar.cl{clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%);padding-left:14px;border-radius:0 6px 6px 0}
.g-bar.cr{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%);padding-right:14px;border-radius:6px 0 0 6px}
.g-bar.cl.cr{clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%);border-radius:0}
.g-now{position:absolute;top:0;bottom:0;width:2px;background:var(--signal);z-index:1;pointer-events:none}
.g-shop{position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--shop) 12%,transparent) 8px 16px);pointer-events:none}

.search{position:relative;flex:1;min-width:220px;max-width:420px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:36px}

.rlist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rrow{display:grid;grid-template-columns:96px minmax(150px,1.2fr) minmax(200px,1.5fr) 100px 100px 118px;gap:14px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left;color:inherit;font-size:inherit;cursor:pointer}
.rrow:first-child{border-top:0}
.rrow:hover{background:var(--surface-2)}
.rrow .t{font-weight:600}
.rrow .d{font-size:13px;color:var(--ink-2)}
.rrow .money{text-align:right;font-variant-numeric:tabular-nums}
.rrow .money small{display:block;font-size:12px;color:var(--ink-3)}
.owe{color:var(--out);font-weight:600}
.rhead{display:grid;grid-template-columns:96px minmax(150px,1.2fr) minmax(200px,1.5fr) 100px 100px 118px;gap:14px;padding:10px 16px;font-size:12.5px;color:var(--ink-3);border-bottom:1px solid var(--line);background:var(--surface-2)}
.rhead .r{text-align:right}

.twrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:500;font-size:12.5px;color:var(--ink-3);text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;border-top:2px solid var(--line);background:var(--surface-2)}
.muted{color:var(--ink-3)}
.pos{color:var(--free)}.neg{color:var(--out)}
.ubar{height:8px;border-radius:4px;background:var(--surface-2);min-width:90px;position:relative;overflow:hidden}
.ubar i{position:absolute;top:0;bottom:0;left:0;background:var(--free);border-radius:4px}
.ubar i.neg{background:var(--out)}
.more{display:flex;justify-content:center;padding:14px}

.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.vcard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.vcard h3{margin:0;font:600 21px/1.1 'Barlow Condensed',sans-serif}
.vcard .meta{font-size:13.5px;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13.5px}
.kv div span{display:block;color:var(--ink-3);font-size:12.5px}
.kv div b{font-weight:600}
.oil{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.oil i{display:block;height:100%;background:var(--free)}
.oil i.warn{background:var(--signal)}.oil i.bad{background:var(--out)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty h3{margin:0 0 6px;color:var(--ink);font:600 22px 'Barlow Condensed',sans-serif}
.empty p{margin:0 0 16px}

dialog{border:0;border-radius:14px;padding:0;width:min(680px,calc(100vw - 20px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.35);overflow:auto}
dialog::backdrop{background:rgba(12,14,17,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dh h2{margin:0;font:600 25px/1.1 'Barlow Condensed',sans-serif}
.dh .x{border:0;background:transparent;color:var(--ink-2);cursor:pointer;padding:6px;border-radius:6px;display:grid}
.dh .x:hover{background:var(--surface-2)}
.db{padding:18px 20px}
.df{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);z-index:2}
.df .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.form .grp{grid-column:1/-1;font:600 17px 'Barlow Condensed',sans-serif;margin:8px 0 -2px;padding-top:10px;border-top:1px solid var(--line)}
.form .grp:first-child{border-top:0;padding-top:0;margin-top:0}
.form.three{grid-template-columns:repeat(3,minmax(0,1fr))}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--ink-2);min-width:0}
label.f .hint{font-weight:400;color:var(--ink-3);font-size:12px}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--booked) 40%,transparent);border-color:var(--booked)}
textarea{min-height:70px;resize:vertical}
.linkbtn{border:0;background:none;color:var(--booked);padding:0;cursor:pointer;font-size:13px;font-weight:500;text-align:left}
.sum{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font:600 24px/1.1 'Barlow Condensed',sans-serif;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.warnbox{background:var(--out-bg);color:var(--out);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:500}
.infobox{background:var(--booked-bg);color:var(--booked);border-radius:8px;padding:10px 12px;font-size:14px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;font-size:14.5px}
.dl div span{display:block;font-size:12.5px;color:var(--ink-3)}
.dl .full{grid-column:1/-1}
.dsec{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.dsec h3{margin:0 0 10px;font:600 18px 'Barlow Condensed',sans-serif;display:flex;justify-content:space-between;align-items:center}
.pay{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.pay:first-of-type{border-top:0}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--ink-2)}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--signal);width:0;transition:width .2s}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;font-size:14.5px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

<script>
/* ---------- utilidades ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtMoney=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});

// Hora de El Salvador (UTC-6, sin horario de verano), sin importar la zona del dispositivo
const SV_OFFSET_MIN=360;
const nowSV=()=>new Date(Date.now()+(new Date().getTimezoneOffset()-SV_OFFSET_MIN)*60000);
const toLocalISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dateOnly=d=>toLocalISO(d).slice(0,10);
const parse=s=>{if(!s)return null;const d=new Date(s.length===10?s+'T00:00':s);return isNaN(d)?null:d};
const startOfDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,d.getHours(),d.getMinutes());
const fDate=(s,o={weekday:'short',day:'numeric',month:'short'})=>{const d=typeof s==='string'?parse(s):s;return d?d.toLocaleDateString('es-SV',o).replace(/\./g,''):''};
const fTime=s=>{const d=typeof s==='string'?parse(s):s;if(!d)return'';const h=d.getHours();return`${h%12||12}:${pad(d.getMinutes())} ${h>=12?'p.m.':'a.m.'}`};
const fDT=s=>s?`${fDate(s)}, ${fTime(s)}`:'';

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const I={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',

};

/* ---------- datos ---------- */
const COLS=['vehiculos','clientes','rentas','gastos'];
const S={vehiculos:[],clientes:[],rentas:[],gastos:[],ready:false,mode:'local',loaded:{}};
let DB=null,DL=null,USR=null,ME=null,CAN_WRITE=null,SMP=null;
const LSK='riveras-rentas-v1';

function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LSK)||'{}');COLS.forEach(c=>S[c]=Array.isArray(j[c])?j[c]:[])}catch(e){}}
function saveLocal(){try{const o={};COLS.forEach(c=>o[c]=S[c]);localStorage.setItem(LSK,JSON.stringify(o))}catch(e){toast('¡Atención! No se pudo guardar: el espacio de este navegador está lleno. Descarga un respaldo ya.')}}

async function withRetry(fn,tries=5){for(let i=0;;i++){try{return await fn()}catch(e){const c=e&&e.code;if(i<tries&&(c==='unavailable'||c==='resource_exhausted')){await sleep(500*(i+1)+Math.random()*400);continue}throw e}}}

async function save(col,data){
  const id=data.id||uid();const body={...data};delete body.id;body.actualizado=new Date().toISOString();if(myId())body.actualizadoPor=myId();
  if(SB){await sbSave(col,id,body)}
  else if(DB){
    await withRetry(()=>DB.collection(col).doc(id).set(body));
  }else{
    const i=S[col].findIndex(x=>x.id===id);const rec={id,...body};
    if(i>=0)S[col][i]=rec;else S[col].push(rec);saveLocal();scheduleRender();
  }
  return id;
}
async function remove(col,id){
  if(SB){await sbRemove(col,id)}
  else if(DB){await withRetry(()=>DB.collection(col).doc(id).delete())}
  else{S[col]=S[col].filter(x=>x.id!==id);saveLocal();scheduleRender()}
}
function errMsg(e){
  const c=e&&e.code;
  if(c==='quota_exceeded')return'Se llenó el espacio de la base de datos. Borra registros viejos antes de agregar más.';
  if(c==='invalid_argument')return'No tienes permiso para guardar cambios en este sistema.';
  return'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';
}

/* ---------- servidor propio (Supabase) ---------- */

const SUPA_URL='https://pkcvkoqwdfpjssyipbor.supabase.co';
const SUPA_KEY='sb_publishable_hvsbEvH0IjKzij3wYzRGtQ_HBwW9bDQ';
const SBK='riveras-supabase';
let SB=null;const SB_USERS={};
function sbConf(){if(SUPA_URL&&SUPA_KEY)return{url:SUPA_URL.replace(/\/+$/,''),key:SUPA_KEY,fijo:true};try{const j=JSON.parse(localStorage.getItem(SBK)||'null');if(j&&j.url&&j.key)return{url:j.url.replace(/\/+$/,''),key:j.key}}catch(e){}return null}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
async function initSupabase(){
  const c=sbConf();S.mode='sb';
  try{if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js')}
  catch(e){S.sbError='No se pudo conectar con el servidor. Revisa el internet y recarga la página.';S.ready=true;scheduleRender();return}
  SB=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});
  SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});
  const {data}=await SB.auth.getSession();
  if(!data||!data.session){S.needLogin=true;S.ready=true;scheduleRender();return}
  await sbStart(data.session.user);
}
async function sbStart(user){
  S.needLogin=false;
  ME={id:user.id,name:(user.user_metadata&&user.user_metadata.nombre)||user.email,email:user.email,isOwner:false,canEdit:true};CAN_WRITE=true;
  USR={profiles:async ids=>{const o={};[].concat(ids).forEach(i=>o[i]={id:i,name:SB_USERS[i]||''});return o}};
  AS={upload:async blob=>{const t=blob.type||'image/jpeg';const ext=t.includes('png')?'png':t.includes('svg')?'svg':t.includes('webp')?'webp':'jpg';const path=`${uid()}.${ext}`;
    const {error}=await SB.storage.from('archivos').upload(path,blob,{contentType:t,upsert:false});if(error)throw{code:'upload_failed',message:error.message};return{id:path,url:blobUrl(path)}}};
  try{const all=[];const step=1000;
    for(let from=0;;from+=step){const {data,error}=await SB.from('registros').select('col,id,data').range(from,from+step-1);if(error)throw error;all.push(...data);if(data.length<step)break}
    COLS.forEach(c=>S[c]=[]);all.forEach(r=>sbApply(r,false));S.sbError='';
  }catch(e){S.sbError='No se pudieron cargar los datos: '+(e.message||e)}
  SB_USERS[user.id]=ME.name;

  SB.channel('registros-cambios').on('postgres_changes',{event:'*',schema:'public',table:'registros'},p=>{
    if(p.eventType==='DELETE'){const o=p.old||{};if(o.col&&S[o.col]){S[o.col]=S[o.col].filter(x=>x.id!==o.id);scheduleRender()}return}
    sbApply(p.new,true)}).subscribe();
  S.ready=true;setFoot();scheduleRender();
}
function sbApply(row,render){if(!row)return;const c=row.col;

  const next=S.rentas.filter(r=>r.vehiculo_id===v.id&&r.estado==='reservada'&&parse(r.entrega)>now).sort((a,b)=>parse(a.salida)-parse(b.salida))[0];
  if(next&&parse(next.salida)-now<2*DAY)return{k:'booked',r:next};
  return{k:'free',r:next};
}
const VS_LABEL={free:'Disponible',out:'Rentado',late:'Atrasado',booked:'Reservado',shop:'En taller'};

const addMonths=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,d.getDate());
function monthsFrac(a,b){if(!a||!b||!(b>a))return 0;let t=0;let cur=new Date(a.getFullYear(),a.getMonth(),1);
  while(cur<b){const nx=new Date(cur.getFullYear(),cur.getMonth()+1,1);const ov=Math.min(b,nx)-Math.max(a,cur);if(ov>0)t+=ov/(nx-cur);cur=nx}return t}
function vStart(v){const d=parse(v.fechaCompra)||parse(v.inicioFin);if(d)return d;let m=null;
  S.rentas.forEach(r=>{if(r.vehiculo_id===v.id&&r.estado!=='cancelada'){const x=parse(r.salida);if(x&&(!m||x<m))m=x}});
  S.gastos.forEach(g=>{if(g.vehiculo_id===v.id){const x=parse(g.fecha);if(x&&(!m||x<m))m=x}});return m}
const fijosMes=v=>(+v.seguro||0)+(+v.gps||0)+(+v.otrosFijos||0);
function finRange(v){if(!v.financiado||!(+v.cuota))return null;const st=parse(v.inicioFin)||vStart(v);if(!st)return null;
  return[st,+v.plazo>0?addMonths(st,+v.plazo):new Date(8.64e15)]}
function cuotaActiva(v,d=nowSV()){const fr=finRange(v);return!!fr&&d>=fr[0]&&d<fr[1]}
function fixedCost(v,from,to){const st=vStart(v);let fijos=0,cuota=0;
  if(st&&fijosMes(v))fijos=fijosMes(v)*monthsFrac(new Date(Math.max(from,st)),to);
  const fr=finRange(v);if(fr)cuota=(+v.cuota)*monthsFrac(new Date(Math.max(from,fr[0])),new Date(Math.min(to,fr[1])));
  return{fijos,cuota}}
function verdict(res,costs,ing){if(!costs&&!ing)return{k:'none',t:'Sin uso'};const tol=Math.max(10,.03*costs);
  if(res>tol)return{k:'gain',t:'Ganancia'};if(res<-tol)return{k:'loss',t:'Pérdida'};return{k:'even',t:'Cubrió su costo'}}
function profitOne(v,from,to){
  const span=to-from;let ing=0,ms=0,n=0;
  S.rentas.forEach(r=>{
    if(r.vehiculo_id!==v.id||r.estado==='cancelada'||r.estado==='reservada')return;
    const[a,b]=rInterval(r);const len=b-a;if(!(len>0))return;
    const ov=Math.min(b,to)-Math.max(a,from);if(ov<=0)return;
    ing+=rNeto(r)*ov/len;ms+=ov;n++;
  });
  const gas=S.gastos.filter(g=>{if(g.vehiculo_id!==v.id)return false;const d=parse(g.fecha);return d&&d>=from&&d<to}).reduce((a,g)=>a+(+g.monto||0),0);
  const fc=fixedCost(v,from,to);const op=ing-gas-fc.fijos;const util=op-fc.cuota;const costs=gas+fc.fijos+fc.cuota;
  const dias=ms/DAY;
  return{v,ing,gas,fijos:fc.fijos,cuota:fc.cuota,op,util,costs,ver:verdict(util,costs,ing),dias,ocup:span>0?ms/span:0,porDia:dias>0?ing/dias:0,n};
}
function profit(from,to){return S.vehiculos.map(v=>profitOne(v,from,to)).filter(p=>p.v.estado!=='baja'||p.ing||p.gas)}
function lifetime(v){
  const now=nowSV();const st=vStart(v);
  const p=st?profitOne(v,st,now):{ing:0,gas:0,fijos:0,cuota:0,op:0,util:0};
  const fr=finRange(v);let cuotasPag=0,pendiente=0,desemb=0;
  if(fr){cuotasPag=Math.ceil(monthsFrac(fr[0],new Date(Math.min(now,fr[1])))-1e-9);if(+v.plazo>0)cuotasPag=Math.min(cuotasPag,+v.plazo);
    desemb=(+v.prima||0)+cuotasPag*(+v.cuota);pendiente=+v.plazo>0?Math.max(0,+v.plazo-cuotasPag)*(+v.cuota):null}
  else desemb=+v.costo||0;
  const rec=desemb>0?p.op/desemb:null;
  return{...p,cuotasPag,pendiente,desemb,rec};
}
function equilibrio(v){const m=fijosMes(v)+(cuotaActiva(v)?+v.cuota:0);if(!m)return null;if(!(+v.tarifa))return{m,d:null};return{m,d:m/(+v.tarifa)}}
function recLabel(lt){if(lt.rec==null)return'<span class="muted">Faltan datos</span>';if(lt.rec>=1)return'<span class="pos">Ya se pagó solo</span>';return Math.max(0,Math.round(lt.rec*100))+'%'}
function paymentsIn(from,to){
  const out=[];S.rentas.forEach(r=>(r.pagos||[]).forEach(p=>{const d=parse(p.fecha);if(d&&d>=from&&d<to)out.push({...p,r})}));return out;
}
function oilInfo(v){
  const every=+v.aceiteCada||0;if(!every||v.aceiteUltimoKm==null||v.aceiteUltimoKm==='')return null;
  const used=(+v.km||0)-(+v.aceiteUltimoKm||0);const left=every-used;return{every,used,left,pct:Math.min(1,Math.max(0,used/every))};
}

VIEWS.rentas=()=>{

  const groups={activas:r=>r.estado==='reservada'||r.estado==='en_curso',saldo:r=>r.estado!=='cancelada'&&rSaldo(r)>0.009,finalizadas:r=>r.estado==='finalizada',canceladas:r=>r.estado==='cancelada',todas:()=>true};
  const cnt=k=>S.rentas.filter(groups[k]).length;
  let list=S.rentas.filter(groups[UI.rTab]);
  if(q)list=list.filter(r=>{const v=byId('vehiculos',r.vehiculo_id);const c=cli(r);return norm([cliName(r),c&&c.documento,v&&v.placa,vShort(v),r.numContrato,fmtNum(r.numContrato)].join(' ')).includes(q)});
  list.sort(UI.rTab==='activas'?(a,b)=>parse(a.salida)-parse(b.salida):(a,b)=>parse(b.salida)-parse(a.salida));
  const shown=list.slice(0,150);
  const rows=shown.map(r=>{const v=byId('vehiculos',r.vehiculo_id);const c=cli(r);const st=rStatus(r,now);const sal=rSaldo(r);
    return`<button class="rrow" data-act="renta" data-id="${r.id}">
      <div>${plate(v)}</div>
      <div style="min-width:0"><div class="t">${esc(cliName(r))}</div><div class="d">${r.numContrato?`Contrato ${fmtNum(r.numContrato)}, `:''}${esc(vShort(v))}</div></div>
      <div><div>${fDT(r.salidaReal||r.salida)} a ${fDT(rEndPlanned(r))}</div><div class="d">${r.dias} día${r.dias==1?'':'s'}, ${esc(r.lugarSalida||'')}</div></div>
      <div class="money">${money(rTotal(r))}<small>total</small></div>
      <div class="money ${sal>0.009?'owe':''}">${sal>0.009?money(sal):'Pagado'}<small>${sal>0.009?'saldo':''}</small></div>
      <div style="text-align:right"><span class="tag ${st}">${ST_LABEL[st]}</span></div></button>`}).join('');
  const tabs=[['activas','Activas'],['saldo','Con saldo'],['finalizadas','Finalizadas'],['canceladas','Canceladas'],['todas','Todas']];
  return`<div class="ph"><div><h1>Rentas</h1><p>Quién tiene cada carro, desde cuándo y cuánto debe.</p></div>
    <div class="acts"><button class="btn" data-act="multa">Multa o infracción</button><button class="btn" data-act="dispo">${ic('search')}¿Qué hay libre?</button><button class="btn primary" data-act="rent-new">${ic('plus')}Nueva renta</button></div></div>
    <div class="bar-tools"><div class="seg">${tabs.map(([k,t])=>`<button aria-pressed="${UI.rTab===k}" data-act="r-tab" data-v="${k}">${t}<span class="n">${cnt(k)}</span></button>`).join('')}</div>
      <div class="search">${ic('search')}<input id="rQ" data-in="rQ" type="search" placeholder="Buscar por cliente, DUI, placa o contrato" value="${esc(UI.rQ)}"></div></div>
    ${list.length?`<div class="rlist"><div class="rhead"><div>Vehículo</div><div>Cliente</div><div>Fechas</div><div class="r">Total</div><div class="r">Saldo</div><div class="r">Estado</div></div>${rows}</div>${list.length>150?'<p class="muted">Mostrando las primeras 150. Usa el buscador para encontrar otras.</p>':''}`
      :`<div class="empty"><h3>${q?'Sin resultados':'No hay rentas aquí'}</h3><p>${q?'Prueba con otro nombre, DUI o placa.':'Cuando registres una renta aparecerá en esta lista.'}</p>${q?'':`<button class="btn primary" data-act="rent-new">${ic('plus')}Nueva renta</button>`}</div>`}`;
};

VIEWS.clientes=()=>{
  const q=norm(UI.cQ);const stats={};
  S.rentas.forEach(r=>{if(r.estado==='cancelada')return;const s=stats[r.cliente_id]||(stats[r.cliente_id]={n:0,t:0,last:null});s.n++;s.t+=rTotal(r);const d=parse(r.salida);if(!s.last||d>s.last)s.last=d});
  let list=S.clientes.slice();
  if(q)list=list.filter(c=>norm([c.nombre,c.documento,c.licencia,c.celular,c.telefono].join(' ')).includes(q));
  list.sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  const act=S.clientes.filter(c=>c.estado!=='inactivo').length;
  const shown=list.slice(0,UI.cLimit);
  const rows=shown.map(c=>{const s=stats[c.id]||{n:0,t:0};return`<tr class="click" data-act="cli" data-id="${c.id}">
    <td><b>${esc(c.nombre)}</b>${c.estado==='inactivo'?' <span class="tag baja">Inactivo</span>':''}${c.bloqueado?' <span class="tag late">No rentar</span>':''}</td>
    <td>${esc(c.documento||'')}</td><td>${esc(c.licencia||'')}</td><td>${esc(c.celular||c.telefono||'')}</td>
    <td class="n">${s.n||'<span class="muted">0</span>'}</td><td class="n">${s.t?money(s.t):'<span class="muted">$0.00</span>'}</td><td class="muted">${s.last?fDate(s.last,{day:'numeric',month:'short',year:'numeric'}):''}</td></tr>`}).join('');
  return`<div class="ph"><div><h1>Clientes</h1><p>${num(S.clientes.length)} registrados, ${num(act)} activos.</p></div>
    <div class="acts"><button class="btn" data-act="cli-import">${ic('up')}Importar clientes</button><button class="btn primary" data-act="cli-new">${ic('plus')}Nuevo cliente</button></div></div>
    <div class="bar-tools"><div class="search">${ic('search')}<input id="cQ" data-in="cQ" type="search" placeholder="Buscar por nombre, DUI, licencia o teléfono" value="${esc(UI.cQ)}"></div></div>
    ${S.clientes.length?(list.length?`<div class="twrap"><table><thead><tr><th>Nombre</th><th>Documento</th><th>Licencia</th><th>Celular</th><th class="n">Rentas</th><th class="n">Total rentado</th><th>Última renta</th></tr></thead><tbody>${rows}</tbody></table>
      ${list.length>UI.cLimit?`<div class="more"><button class="btn" data-act="cli-more">Ver más (${num(list.length-UI.cLimit)} restantes)</button></div>`:''}</div>`
      :`<div class="empty"><h3>Sin resultados</h3><p>No hay clientes que coincidan con “${esc(UI.cQ)}”.</p></div>`)
    :`<div class="empty"><h3>Trae tus clientes del sistema anterior</h3><p>Exporta la lista a Excel o CSV y súbela aquí, o pégala directamente. También puedes crearlos uno por uno.</p><div class="acts" style="justify-content:center"><button class="btn primary" data-act="cli-import">${ic('up')}Importar clientes</button><button class="btn" data-act="cli-new">Nuevo cliente</button></div></div>`}`;
};

VIEWS.flota=()=>{
  const now=nowSV();
  const list=S.vehiculos.slice().sort((a,b)=>(a.estado==='baja')-(b.estado==='baja')||(a.categoria||'').localeCompare(b.categoria||'')||vShort(a).localeCompare(vShort(b)));
  const m0=new Date(now.getFullYear(),now.getMonth(),1),m1=new Date(now.getFullYear(),now.getMonth()+1,1);
  const cards=list.map(v=>{const st=v.estado==='baja'?{k:'baja'}:vStatus(v,now);const o=oilInfo(v);const lt=lifetime(v);const p=profitOne(v,m0,m1);const eq=equilibrio(v);
    return`<div class="vcard"><div class="vcard-h"><div><h3>${esc(vShort(v))}</h3><div class="meta">${esc([v.anio,v.color,v.categoria].filter(Boolean).join(', '))}</div></div>${plate(v,true)}</div>
      <div class="acts"><span class="tag ${st.k}">${st.k==='baja'?'Dado de baja':VS_LABEL[st.k]}</span>${v.financiado?'<span class="tag fin">Financiado</span>':''}</div>
      <div class="kv">
        <div><span>Tarifa diaria</span><b>${+v.tarifa?money(v.tarifa):'<span class="neg">Sin definir</span>'}</b></div>
        <div><span>Costo fijo al mes</span><b>${eq?money(eq.m):'<span class="muted">Sin datos</span>'}</b></div>
        <div><span>Este mes dejó</span><b class="${p.util<0?'neg':''}">${money(p.util)}</b></div>
        <div><span>Para cubrir su costo</span><b>${eq&&eq.d!=null?`${Math.ceil(eq.d)} días rentado al mes`:'<span class="muted">—</span>'}</b></div>
        <div><span>Ocupación este mes</span><b>${Math.round(p.ocup*100)}%</b></div>
        <div><span>Inversión recuperada</span><b>${recLabel(lt)}</b></div>
      </div>
      ${(()=>{const sts=PLAN().map(t=>({t,st:mantStatus(v,t)})).filter(x=>x.st.k!=='nodata').sort((a,b)=>a.st.score-b.st.score);const x=sts[0];
        return x?`<div style="font-size:13.5px"><span class="muted">Próximo servicio:</span> <b>${esc(x.t.nombre)}</b> <span class="${x.st.k==='due'?'neg':''}">(${esc(x.st.txt)})</span></div>`:`<div style="font-size:13.5px" class="muted">Sin mantenimientos registrados. <button class="linkbtn" data-act="mant-new" data-id="${v.id}">Registrar el último</button></div>`})()}
      <div class="acts"><button class="btn sm" data-act="veh-months" data-id="${v.id}">Mes a mes</button><button class="btn sm" data-act="veh-edit" data-id="${v.id}">Editar</button><button class="btn sm" data-act="gasto-new" data-id="${v.id}">Gasto</button>${v.estado!=='baja'&&st.k==='free'?`<button class="btn sm primary" data-act="rent-veh" data-id="${v.id}">Rentar</button>`:''}</div></div>`}).join('');
  return`<div class="ph"><div><h1>Flota</h1><p>${S.vehiculos.filter(v=>v.estado!=='baja').length} vehículos en operación.</p></div>
    <div class="acts"><button class="btn primary" data-act="veh-new">${ic('plus')}Agregar vehículo</button></div></div>
    ${list.length?`<div class="vcards">${cards}</div>`:`<div class="empty"><h3>Todavía no hay vehículos</h3><p>Agrega cada carro con su placa y tarifa diaria.</p><button class="btn primary" data-act="veh-new">${ic('plus')}Agregar vehículo</button></div>`}`;
};

VIEWS.gastos=()=>{
  let list=S.gastos.slice();
  if(UI.gV)list=list.filter(g=>g.vehiculo_id===UI.gV);
  if(UI.gM)list=list.filter(g=>(g.fecha||'').startsWith(UI.gM));
  list.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const tot=list.reduce((a,g)=>a+(+g.monto||0),0);
  const byType={};list.forEach(g=>byType[g.tipo]=(byType[g.tipo]||0)+(+g.monto||0));
  const rows=list.map(g=>{const v=byId('vehiculos',g.vehiculo_id);return`<tr class="click" data-act="gasto-edit" data-id="${g.id}"><td>${fDate(g.fecha,{day:'numeric',month:'short',year:'numeric'})}</td><td>${plate(v)}</td><td>${esc(vShort(v))}</td><td>${esc(g.tipo||'')}</td><td class="muted">${esc(g.descripcion||'')}</td><td class="n">${g.km?num(g.km)+' km':''}</td><td class="n"><b>${money(g.monto)}</b></td></tr>`}).join('');
  return`<div class="ph"><div><h1>Gastos de la flota</h1><p>Todo lo que cuesta mantener cada carro. Se descuenta de su utilidad.</p></div>
    <div class="acts"><button class="btn primary" data-act="gasto-new">${ic('plus')}Registrar gasto</button></div></div>
    <div class="bar-tools"><div class="acts">
      <select id="gV" data-in="gV" style="width:auto;min-width:200px"><option value="">Todos los vehículos</option>${S.vehiculos.map(v=>`<option value="${v.id}" ${UI.gV===v.id?'selected':''}>${esc(vShort(v))} ${esc(v.placa||'')}</option>`).join('')}</select>
      <select id="gM" data-in="gM" style="width:auto"><option value="">Todos los meses</option>${(()=>{const t=nowSV();const o=[];for(let i=0;i<24;i++){const d=new Date(t.getFullYear(),t.getMonth()-i,1);const k=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;o.push(`<option value="${k}" ${UI.gM===k?'selected':''}>${MESES[d.getMonth()]} ${d.getFullYear()}</option>`)}return o.join('')})()}</select>
    </div><div class="range-title">${money(tot)}</div></div>
    ${Object.keys(byType).length>1?`<p class="muted" style="margin:-4px 0 14px">${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k)}: ${money(v)}`).join(', ')}</p>`:''}
    ${list.length?`<div class="twrap"><table><thead><tr><th>Fecha</th><th>Placa</th><th>Vehículo</th><th>Tipo</th><th>Detalle</th><th class="n">Km</th><th class="n">Monto</th></tr></thead><tbody>${rows}</tbody></table></div>`
      :`<div class="empty"><h3>No hay gastos en este periodo</h3><p>Registra cambios de aceite, llantas, seguros y reparaciones para conocer la utilidad real de cada carro.</p><button class="btn primary" data-act="gasto-new">${ic('plus')}Registrar gasto</button></div>`}`;
};

VIEWS.reportes=()=>{
  const R=UI.rep;const from=parse(R.from),to=addDays(parse(R.to),1);
  if(!from||!to||to<=from)return'<div class="empty">Revisa las fechas del periodo.</div>';
  const P=profit(from,to).sort((a,b)=>b.util-a.util);
  const T=P.reduce((a,p)=>({ing:a.ing+p.ing,gas:a.gas+p.gas,fijos:a.fijos+p.fijos,cuota:a.cuota+p.cuota,util:a.util+p.util,dias:a.dias+p.dias,n:a.n+p.n}),{ing:0,gas:0,fijos:0,cuota:0,util:0,dias:0,n:0});
  const maxU=Math.max(1,...P.map(p=>Math.abs(p.util)));
  const occ=P.length?P.reduce((a,p)=>a+p.ocup,0)/P.length:0;
  const vc={gain:0,even:0,loss:0};P.forEach(p=>vc[p.ver.k]++);
  const pays=paymentsIn(from,to);const byM={};pays.forEach(p=>byM[p.metodo||'Otro']=(byM[p.metodo||'Otro']||0)+(+p.monto||0));
  const cliT={};S.rentas.forEach(r=>{if(r.estado==='cancelada'||r.estado==='reservada')return;const d=parse(r.salida);if(d>=from&&d<to){cliT[r.cliente_id]=cliT[r.cliente_id]||{r,t:0,n:0};cliT[r.cliente_id].t+=rTotal(r);cliT[r.cliente_id].n++}});
  const topC=Object.values(cliT).sort((a,b)=>b.t-a.t).slice(0,5);
  const rows=P.map(p=>{const lt=lifetime(p.v);
    return`<tr class="click" data-act="veh-months" data-id="${p.v.id}"><td>${plate(p.v)}</td><td><b>${esc(vShort(p.v))}</b><div class="muted" style="font-size:12.5px">${esc(p.v.categoria||'')}</div></td>
    <td class="n">${p.dias.toFixed(1)}</td><td class="n">${Math.round(p.ocup*100)}%</td>
    <td class="n">${money(p.ing)}</td><td class="n">${money(p.gas)}</td><td class="n">${money(p.fijos)}</td><td class="n">${money(p.cuota)}</td><td class="n ${p.util<0?'neg':''}"><b>${money(p.util)}</b></td>
    <td><div class="ubar"><i class="${p.util<0?'neg':''}" style="width:${Math.abs(p.util)/maxU*100}%"></i></div></td><td><span class="tag ${p.ver.k}">${p.ver.t}</span></td><td class="n">${recLabel(lt)}</td></tr>`}).join('');
  // mes a mes: 6 meses que terminan en el mes final del periodo
  const endM=new Date(to.getFullYear(),to.getMonth()-(to.getDate()===1?1:0),1);const months=[];for(let i=5;i>=0;i--)months.push(new Date(endM.getFullYear(),endM.getMonth()-i,1));
  const vs=P.map(p=>p.v);
  const mm=vs.map(v=>{const cells=months.map(m=>{const x=profitOne(v,m,new Date(m.getFullYear(),m.getMonth()+1,1));const st=vStart(v);const pre=!st||st>=new Date(m.getFullYear(),m.getMonth()+1,1);
      return x.ver.k==='none'?'<td class="n muted">—</td>':`<td class="n"><span class="cell ${x.ver.k}">${money(x.util)}</span></td>`}).join('');
    return`<tr class="click" data-act="veh-months" data-id="${v.id}"><td>${plate(v)}</td><td><b>${esc(vShort(v))}</b></td>${cells}</tr>`}).join('');
  const n12=nowSV();const m12=[];for(let i=11;i>=0;i--){const mm=new Date(n12.getFullYear(),n12.getMonth()-i,1);const PP=profit(mm,new Date(mm.getFullYear(),mm.getMonth()+1,1));m12.push({mm,ing:PP.reduce((a,p)=>a+p.ing,0),util:PP.reduce((a,p)=>a+p.util,0)})}
  const mx=Math.max(1,...m12.map(x=>Math.max(x.ing,Math.abs(x.util))));
  const bars=`<h2 class="sec">Últimos 12 meses<small>ingresos y lo que quedó</small></h2><div class="mbars">${m12.map(x=>`<div class="mb" title="${esc(MESES[x.mm.getMonth()]+' '+x.mm.getFullYear()+': ingresos '+money(x.ing)+', quedó '+money(x.util))}"><div class="mbc"><i class="a" style="height:${x.ing/mx*100}%"></i><i class="b${x.util<0?' neg':''}" style="height:${Math.abs(x.util)/mx*100}%"></i></div><span>${MESES[x.mm.getMonth()].slice(0,3)}</span></div>`).join('')}</div><div class="legend"><span><i style="background:var(--ink-3)"></i>Ingresos</span><span><i style="background:var(--free)"></i>Quedó</span><span><i style="background:var(--out)"></i>Pérdida</span></div>`;
  const pr=[['mes','Este mes'],['mesant','Mes pasado'],['3m','Últimos 3 meses'],['anio','Este año']];
  return`<div class="ph"><div><h1>Rentabilidad por vehículo</h1><p>Cuánto dejó cada carro después de gastos, seguro, GPS y cuota.</p></div>
    <div class="acts"><button class="btn" data-act="rep-csv">${ic('down')}Descargar CSV</button></div></div>
    <div class="bar-tools"><div class="seg">${pr.map(([k,t])=>`<button aria-pressed="${R.preset===k}" data-act="rep-preset" data-v="${k}">${t}</button>`).join('')}</div>
      <div class="acts"><label class="muted" for="repFrom">Del</label><input id="repFrom" data-in="repFrom" type="date" value="${R.from}" style="width:auto"><label class="muted" for="repTo">al</label><input id="repTo" data-in="repTo" type="date" value="${R.to}" style="width:auto"></div></div>
    <div class="figs">
      <div class="fig"><div class="k">Ingresos${ivaRate()?' sin IVA':''}</div><div class="v">${money(T.ing)}</div><div class="s">${T.n} renta${T.n==1?'':'s'}, ${Math.round(occ*100)}% de ocupación</div></div>
      <div class="fig"><div class="k">Gastos, seguro y GPS</div><div class="v">${money(T.gas+T.fijos)}</div><div class="s">Operación de toda la flota</div></div>
      <div class="fig"><div class="k">Cuotas del financiamiento</div><div class="v">${money(T.cuota)}</div><div class="s">Pagos al banco del periodo</div></div>
      <div class="fig"><div class="k">Lo que quedó</div><div class="v ${T.util<0?'neg':''}">${money(T.util)}</div><div class="s">${vc.gain} con ganancia, ${vc.even} a la par, ${vc.loss} en pérdida</div></div>
    </div>
    ${bars}
    <h2 class="sec">Por vehículo<small>toca un carro para ver su historia mes a mes</small></h2>
    ${P.length?`<div class="twrap"><table><thead><tr><th>Placa</th><th>Vehículo</th><th class="n">Días</th><th class="n">Ocupación</th><th class="n">Ingresos</th><th class="n">Gastos</th><th class="n">Seguro y GPS</th><th class="n">Cuota</th><th class="n">Quedó</th><th></th><th>Resultado</th><th class="n">Recuperado</th></tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><td></td><td>Total</td><td class="n">${T.dias.toFixed(1)}</td><td class="n">${Math.round(occ*100)}%</td><td class="n">${money(T.ing)}</td><td class="n">${money(T.gas)}</td><td class="n">${money(T.fijos)}</td><td class="n">${money(T.cuota)}</td><td class="n">${money(T.util)}</td><td></td><td></td><td></td></tr></tfoot></table></div>`
      :'<div class="empty"><h3>Sin vehículos</h3><p>Agrega tu flota para ver su rentabilidad.</p></div>'}
    ${P.length?`<h2 class="sec">Mes a mes<small>lo que dejó cada carro en los últimos 6 meses</small></h2>
    <div class="twrap"><table><thead><tr><th>Placa</th><th>Vehículo</th>${months.map(m=>`<th class="n">${fDate(m,{month:'short',year:'2-digit'})}</th>`).join('')}</tr></thead><tbody>${mm}</tbody></table></div>
    <div class="legend"><span><i style="background:var(--free)"></i>Ganancia</span><span><i style="background:var(--signal)"></i>Cubrió su costo</span><span><i style="background:var(--out)"></i>Pérdida</span></div>`:''}
    <p class="muted" style="font-size:13px;margin-top:16px">Si una renta cruza de un mes a otro, su ingreso se reparte según los días que cayeron en cada mes. La cuota, el seguro y el GPS se cargan cada mes desde la fecha de compra. "Inversión recuperada" compara lo que el carro ha dejado antes de pagar cuotas contra lo que ustedes han desembolsado: la prima más las cuotas pagadas (o el precio, si fue al contado).</p>
    <div class="cols" style="margin-top:18px">
      <div class="box"><div class="box-h">Mejores clientes del periodo</div>${topC.length?topC.map(x=>`<div class="item" style="cursor:pointer" data-act="cli" data-id="${x.r.cliente_id}"><div class="grow"><div class="t">${esc(cliName(x.r))}</div><div class="d">${x.n} renta${x.n==1?'':'s'}</div></div><b>${money(x.t)}</b></div>`).join(''):'<div class="none">Sin rentas en este periodo.</div>'}</div>
      <div class="box"><div class="box-h">Cobros por forma de pago</div>${Object.keys(byM).length?Object.entries(byM).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><div class="grow t">${esc(k)}</div><b>${money(v)}</b></div>`).join(''):'<div class="none">No se registraron pagos en este periodo.</div>'}</div>
    </div>`;
};

/* ---------- modales ---------- */
const dlg=$('#dlg');
function openModal(title,body,foot,onMount,wide){
  dlg.innerHTML=`<div class="dh"><h2>${title}</h2><button class="x" data-close aria-label="Cerrar">${ic('x')}</button></div><div class="db">${body}</div>${foot?`<div class="df">${foot}</div>`:''}`;closeCalPop();enhanceDates(dlg);
  dlg.style.width=wide==='docs'?'min(900px,calc(100vw - 20px))':wide?'min(820px,calc(100vw - 20px))':'';
  if(!dlg.open)dlg.showModal();dlg.scrollTop=0;
  onMount&&onMount(dlg);
}
function closeModal(){if(dlg.open)dlg.close()}
dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal();if(e.target===dlg)closeModal()});

const fv=(f,n)=>{const el=f.elements[n];return el?el.value.trim():''};

/* --- diagrama del carro --- */
const ZONAS=[['bdel','Bómper delantero'],['capo','Capó'],['gdi','Guardafango delantero izq.'],['gdd','Guardafango delantero der.'],['parab','Parabrisas'],['pdi','Puerta delantera izq.'],['pdd','Puerta delantera der.'],['pti','Puerta trasera izq.'],['ptd','Puerta trasera der.'],['techo','Techo'],['vtras','Vidrio trasero'],['baul','Baúl'],['gti','Guardafango trasero izq.'],['gtd','Guardafango trasero der.'],['btras','Bómper trasero'],['ei','Estribo izq.'],['ed','Estribo der.']];
const ZN=Object.fromEntries(ZONAS);
const ZSHAPE={bdel:'<rect x="62" y="8" width="116" height="20" rx="10"/>',capo:'<rect x="80" y="32" width="80" height="72" rx="8"/>',gdi:'<rect x="40" y="32" width="36" height="80" rx="8"/>',gdd:'<rect x="164" y="32" width="36" height="80" rx="8"/>',
 parab:'<path d="M82 108H158L150 134H90Z"/>',pdi:'<rect x="40" y="116" width="36" height="72" rx="4"/>',pdd:'<rect x="164" y="116" width="36" height="72" rx="4"/>',pti:'<rect x="40" y="192" width="36" height="72" rx="4"/>',ptd:'<rect x="164" y="192" width="36" height="72" rx="4"/>',
 techo:'<rect x="90" y="138" width="60" height="118" rx="6"/>',vtras:'<path d="M90 260H150L158 286H82Z"/>',baul:'<rect x="80" y="290" width="80" height="64" rx="8"/>',gti:'<rect x="40" y="268" width="36" height="86" rx="8"/>',gtd:'<rect x="164" y="268" width="36" height="86" rx="8"/>',
 btras:'<rect x="62" y="358" width="116" height="20" rx="10"/>',ei:'<rect x="22" y="116" width="14" height="148" rx="4"/>',ed:'<rect x="204" y="116" width="14" height="148" rx="4"/>'};
const ZC={bdel:[120,18],capo:[120,68],gdi:[58,72],gdd:[182,72],parab:[120,121],pdi:[58,152],pdd:[182,152],pti:[58,228],ptd:[182,228],techo:[120,197],vtras:[120,273],baul:[120,322],gti:[58,311],gtd:[182,311],btras:[120,368],ei:[29,190],ed:[211,190]};
function carSVG(marks={},prev={},interactive=false,cls='car'){
  const keys=ZONAS.map(z=>z[0]).filter(k=>k in marks);
  const wheels='<rect class="wh" x="29" y="44" width="9" height="46" rx="3"/><rect class="wh" x="202" y="44" width="9" height="46" rx="3"/><rect class="wh" x="29" y="286" width="9" height="46" rx="3"/><rect class="wh" x="202" y="286" width="9" height="46" rx="3"/>';
  const zones=ZONAS.map(([k,n])=>`<g class="z${k in marks?' hit':''}${k in prev?' prev':''}" ${interactive?`data-z="${k}" role="button" aria-label="${esc(n)}"`:''}><title>${esc(n)}</title>${ZSHAPE[k]}</g>`).join('');
  const mk=keys.map((k,i)=>`<g class="mk"><circle cx="${ZC[k][0]}" cy="${ZC[k][1]}" r="9"/><text x="${ZC[k][0]}" y="${ZC[k][1]+4}">${i+1}</text></g>`).join('');
  return`<svg class="${cls}" viewBox="0 0 240 386" xmlns="http://www.w3.org/2000/svg">${wheels}${zones}${mk}</svg>`;
}
const orderedZones=d=>ZONAS.map(z=>z[0]).filter(k=>d&&k in d);

/* --- editor de inspección (salida o regreso) --- */
function inspHTML(){
  return`<div class="grp">Inspección del carro</div>
  <div class="full insp"><div id="carBox"></div><div><p class="muted" style="margin:0 0 10px;font-size:13.5px">Toca la parte del carro donde hay un golpe o rayón y describe el daño. Vuelve a tocarla para quitarla.</p><div id="danoList"></div></div></div>
  <details class="full more-f"><summary id="accSum">Accesorios</summary><div class="acc" id="accBox"></div></details>
  <div class="grp sub">Marca de llantas y batería</div>
  <label class="f">Llantas delanteras<input name="llDel"></label>
  <label class="f">Llantas traseras<input name="llTras"></label>
  <label class="f">Batería<input name="bat"></label><div></div>
  ${AS?`<div class="full"><div class="fotos"><label class="btn sm">${ic('plus')}Agregar fotos<input type="file" accept="image/*" multiple hidden id="fotoIn"></label><span class="muted" id="fotoMsg" style="font-size:13px">Toma fotos de los 4 lados, del tablero y de cualquier daño</span></div><div class="thumbs" id="fotoBox"></div></div>`:''}`;
}
function mountInsp(m,init,prev,onNewZone){
  const f=$('form',m);const st={danos:{...(init.danos||{})},fotos:[...(init.fotos||[])]};const acc={...(init.acc||{})};
  const pd=(prev&&prev.danos)||{};
  const ll=init.llantas||{};f.elements.llDel.value=ll.del||'';f.elements.llTras.value=ll.tras||'';f.elements.bat.value=ll.bat||'';
  const drawCar=()=>{$('#carBox',m).innerHTML=carSVG(st.danos,pd,true)};
  const drawList=()=>{const keys=orderedZones(st.danos);
    $('#danoList',m).innerHTML=keys.length?keys.map((k,i)=>`<div class="dz"><span class="dzn ${k in pd?'old':''}">${i+1}</span><label class="f grow">${esc(ZN[k])}${k in pd?' <span class="hint">ya estaba al salir</span>':''}<input data-dz="${k}" value="${esc(st.danos[k]||'')}" placeholder="Ej. rayón de 10 cm"></label><button type="button" class="btn sm ghost" data-dzdel="${k}" aria-label="Quitar">${ic('x')}</button></div>`).join('')
      :'<p class="muted" style="margin:4px 0">Sin golpes ni rayones marcados.</p>'};
  const drawAcc=()=>{const items=ACC();const miss=items.filter(x=>acc[x]===false).length;
    $('#accSum',m).textContent=miss?`Accesorios: faltan ${miss} de ${items.length}`:`Accesorios: todos presentes (${items.length})`};
  $('#accBox',m).innerHTML=ACC().map(x=>`<label class="chk"><input type="checkbox" data-acc="${esc(x)}" ${acc[x]===false?'':'checked'}> ${esc(x)}</label>`).join('');
  const drawFotos=()=>{const b=$('#fotoBox',m);if(!b)return;b.innerHTML=st.fotos.map(id=>`<div class="th"><img src="${blobUrl(id)}" alt="Foto de inspección"><button type="button" data-fdel="${id}" aria-label="Quitar foto">${ic('x')}</button></div>`).join('')};
  drawCar();drawList();drawAcc();drawFotos();
  f.addEventListener('click',e=>{
    const z=e.target.closest('[data-z]');
    if(z&&z.closest('#carBox')){const k=z.dataset.z;
      if(k in st.danos){if(!String(st.danos[k]||'').trim()){delete st.danos[k];drawCar();drawList();return}const inp=f.querySelector(`[data-dz="${k}"]`);inp&&inp.focus();return}
      st.danos[k]='';drawCar();drawList();if(!(k in pd)&&onNewZone)onNewZone(k);const inp=f.querySelector(`[data-dz="${k}"]`);inp&&inp.focus();return}
    const d=e.target.closest('[data-dzdel]');if(d){delete st.danos[d.dataset.dzdel];drawCar();drawList();return}
    const fd=e.target.closest('[data-fdel]');if(fd){st.fotos=st.fotos.filter(x=>x!==fd.dataset.fdel);drawFotos()}
  });
  f.addEventListener('input',e=>{if(e.target.dataset.dz)st.danos[e.target.dataset.dz]=e.target.value});
  f.addEventListener('change',e=>{const a=e.target.dataset.acc;if(a!=null){acc[a]=e.target.checked;drawAcc()}});
  const fi=$('#fotoIn',m);
  if(fi)fi.addEventListener('change',async()=>{const files=[...fi.files];fi.value='';const msg=$('#fotoMsg',m);let k=0;
    for(const file of files){msg.textContent=`Subiendo ${++k} de ${files.length}…`;try{st.fotos.push(await uploadImg(file));drawFotos()}catch(err){toast('No se pudo subir una foto')}}
    msg.textContent=`${st.fotos.length} foto${st.fotos.length==1?'':'s'} guardada${st.fotos.length==1?'':'s'}`});
  return()=>{const a={};ACC().forEach(x=>a[x]=acc[x]!==false);
    const dn={};orderedZones(st.danos).forEach(k=>dn[k]=String(st.danos[k]||'').trim());
    return{danos:dn,acc:a,llantas:{del:fv(f,'llDel'),tras:fv(f,'llTras'),bat:fv(f,'bat')},fotos:st.fotos,fecha:toLocalISO(nowSV())}};
}

    <label class="f">Lugar de entrega<input name="lugarEntrega" list="lugares" value="${esc(r.lugarEntrega||'Oficina')}"></label>

    <label class="f">Cobertura del seguro<select name="cobertura"><option value="">Sin definir</option><option value="acepta" ${r.cobertura==='acepta'?'selected':''}>El cliente la acepta</option><option value="declina" ${r.cobertura==='declina'?'selected':''}>El cliente la declina</option></select></label>
    ${ivaRate()?`<label class="chk" style="margin-top:22px"><input type="checkbox" name="conIva" ${conIva?'checked':''}> El precio incluye IVA (${esc(CFG.iva)}%)</label>`:'<div></div>'}

    <details class="full more-f" ${r.adicNombre||r.tarjeta?'open':''}><summary>Tarjeta de garantía y conductor adicional</summary><div class="form">
      <label class="f">Tarjeta, últimos 4 dígitos <span class="hint">No guardes el número completo</span><input name="tarjeta" inputmode="numeric" maxlength="4" pattern="[0-9]*" value="${esc(r.tarjeta||'')}"></label>
      <label class="f">N° de autorización<input name="autorizacion" value="${esc(r.autorizacion||'')}"></label>
      <label class="f">Monto autorizado ($)<input name="autMonto" type="number" min="0" step="0.01" value="${r.autMonto||''}"></label>
      <label class="f">Fecha de autorización<input name="autFecha" type="date" value="${esc(r.autFecha||'')}"></label>
      <div class="grp sub">Conductor adicional</div>
      <label class="f full">Nombre<input name="adicNombre" value="${esc(r.adicNombre||'')}"></label>
      <label class="f">Licencia N°<input name="adicLic" value="${esc(r.adicLic||'')}"></label>
      <label class="f">Licencia vence<input name="adicLicVence" type="date" value="${esc(r.adicLicVence||'')}"></label>
      <label class="f">Fecha de nacimiento<input name="adicNac" type="date" value="${esc(r.adicNac||'')}"></label>
      <label class="f">País<input name="adicPais" value="${esc(r.adicPais||'')}"></label>
    </div></details>
    <label class="f full">Observaciones<textarea name="obs" placeholder="Condiciones y acuerdos con el cliente">${esc(r.obs||'')}</textarea></label>
    ${editing?'':`<div class="grp">Al guardar</div>
    <label class="f full"><select name="modo"><option value="reservada">Dejarla como reserva</option><option value="entregar">Entregar el carro ahora (hacer la inspección)</option></select></label>`}
  </form>`;
  const foot=`<button class="btn" data-close>Cancelar</button><button class="btn primary" id="rfSave">${editing?'Guardar cambios':'Guardar renta'}</button>`;
  openModal(editing?`Editar renta ${r.numContrato?'N° '+fmtNum(r.numContrato):''}`:'Nueva renta',body,foot,m=>{
    const f=$('#rf',m);let diasTouched=!!editing;let tarifaTouched=!!editing;
    const findCli=()=>{const val=norm(f.elements.cliente.value);return clis.find(x=>norm(cliLabel(x))===val)||clis.find(x=>x.documento&&norm(x.documento)===val)};
    const fillVeh=()=>{

        $('#vehWarn',m).innerHTML=v&&cf.length?`<div class="warnbox">${esc(vShort(v))} ya está ocupado: ${cf.map(x=>`${esc(shortName(cliName(x)))} del ${fDT(x.salida)} al ${fDT(x.entrega)}`).join('; ')}. Elige otro carro o cambia las fechas.</div>`:''}

    };
    const recalc=()=>{
      const a=f.elements.salida.value,b=f.elements.entrega.value;
      if(!diasTouched&&a&&b)f.elements.dias.value=calcDias(a,b);
      const v=byId('vehiculos',f.elements.vehiculo_id.value);if(!tarifaTouched&&v){const tt=tarifaPara(v,+f.elements.dias.value||1);if(tt)f.elements.tarifa.value=tt}
      {const c=findCli();const w=cliAlerts(c,b);$('#cliWarn',m).innerHTML=c&&w.length?`<div class="warnbox" style="margin-top:8px">${w.map(esc).join(' ')}</div>`:''}
      const x={tarifa:nv(f,'tarifa'),cdw:nv(f,'cdw'),dias:nv(f,'dias'),cargos:nv(f,'cargos'),descuento:nv(f,'descuento')};const T=rTotal(x);
      const iva=f.elements.conIva&&f.elements.conIva.checked?T-T/(1+ivaRate()):0;
      const paid=editing?rPaid(r):(f.elements.anticipo?nv(f,'anticipo'):0);const bad=parse(b)<=parse(a);

        adicNombre:fv(f,'adicNombre').toUpperCase(),adicLic:fv(f,'adicLic'),adicLicVence:fv(f,'adicLicVence'),adicNac:fv(f,'adicNac'),adicPais:fv(f,'adicPais'),

      const btn=$('#rfSave',m);btn.disabled=true;
      try{const nid=await save('rentas',rec);
        if(!editing&&modo==='entregar'){await waitFor(()=>byId('rentas',nid));checkoutForm(nid)}
        else{closeModal();toast(editing?'Renta actualizada':`Reserva guardada, contrato N° ${fmtNum(rec.numContrato)}`)}
      }catch(e){btn.disabled=false;toast(errMsg(e))}
    };
  },true);
}

/* --- buscar disponibilidad --- */
function dispoForm(pre={}){
  const now=nowSV();const d1=pre.salida||toLocalISO(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,9,0));const d2=pre.entrega||toLocalISO(addDays(parse(d1),1));
  const cats=[...new Set(activeVehicles().map(v=>v.categoria).filter(Boolean))];
  openModal('¿Qué carros hay libres?',`<form id="av" class="form three" onsubmit="return false">
    <label class="f">Desde<input name="a" type="datetime-local" value="${d1}"></label>
    <label class="f">Hasta<input name="b" type="datetime-local" value="${d2}"></label>
    ${cats.length>1?`<label class="f">Tipo<select name="cat"><option value="">Todos</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label>`:'<div></div>'}
  </form><p class="muted" style="font-size:13px;margin:8px 0 0">Se dejan ${num(+CFG.margenHoras||0)} h entre una renta y otra para limpiar y revisar el carro. Se cambia en Ajustes.</p><div id="avRes" style="margin-top:14px"></div>`,
  `<button class="btn" data-close>Cerrar</button>`,m=>{
    const f=$('#av',m);const res=$('#avRes',m);
    const draw=()=>{
      const a=fv(f,'a'),b=fv(f,'b');const A=parse(a),B=parse(b);const now=nowSV();
      if(!A||!B||B<=A){res.innerHTML='<div class="warnbox">La fecha de regreso debe ser después de la salida.</div>';return}
      if(B<now){res.innerHTML='<div class="warnbox">Esas fechas ya pasaron.</div>';return}
      const dias=calcDias(a,b);const buf=(+CFG.margenHoras||0)*HOUR;const cat=f.elements.cat?f.elements.cat.value:'';
      const rows=activeVehicles().filter(v=>!cat||v.categoria===cat).map(v=>{
        const nextR=S.rentas.filter(x=>x.vehiculo_id===v.id&&x.estado==='reservada'&&parse(x.salida)>=B).sort((p,q)=>parse(p.salida)-parse(q.salida))[0];
        const after=nextR?` Después tiene reserva el ${fDT(nextR.salida)}`:'';
        if(v.estado==='taller')return{v,k:'shop',o:3,t:'En taller',d:'Está fuera de servicio por mantenimiento.'};
        const cf=conflicts(v.id,a,b);
        if(cf.length){const last=cf.map(x=>rInterval(x)[1]).sort((p,q)=>q-p)[0];
          return{v,k:'out',o:2,t:'Ocupado',d:cf.map(x=>`${shortName(cliName(x))}, ${fDT(x.salidaReal||x.salida)} a ${fDT(x.entrega)}`).join('; ')+`. Queda libre desde ${fDT(new Date(+last+buf))}`}}
        const act=S.rentas.find(x=>x.vehiculo_id===v.id&&x.estado==='en_curso');
        if(act){const e=parse(act.entrega);
          if(e<now)return{v,k:'late',o:1,t:'Sin confirmar',d:`Sigue con ${shortName(cliName(act))} y debía regresar ${fDT(act.entrega)} Confirma que ya lo entregó antes de prometerlo.${after}`};
          return{v,k:'booked',o:1,t:'Libre si regresa a tiempo',d:`Ahora está con ${shortName(cliName(act))}. Regresa ${fDT(act.entrega)} y queda listo desde ${fDT(new Date(+e+buf))}${after}`}}
        const mw=mantWarnFor(v,dias);return{v,k:'free',o:0,t:'Disponible',d:(nextR?`Libre.${after}`:'Libre, sin reservas después.')+(mw?` Ojo, mantenimiento: ${mw}.`:'')};
      }).sort((x,y)=>x.o-y.o||(+x.v.tarifa||0)-(+y.v.tarifa||0));
      const nF=rows.filter(x=>x.k==='free').length,nC=rows.filter(x=>x.o===1).length;
      last={a,b,list:rows.filter(x=>x.k==='free').map(x=>x.v)};
      res.innerHTML=`<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 10px"><p style="margin:0"><b>${nF} disponible${nF==1?'':'s'}</b>${nC?`, ${nC} dependen de que les entreguen un carro a tiempo`:''}. Son ${dias} día${dias==1?'':'s'} de renta.</p>${nF?'<button type="button" class="btn sm" data-quote>Cotizar por WhatsApp</button>':''}</div>
      <div class="rlist">${rows.map(x=>`<div class="item" style="flex-wrap:wrap">${plate(x.v)}<div class="grow" style="min-width:180px"><div class="t">${esc(vShort(x.v))} <span class="tag ${x.k}">${x.t}</span></div><div class="d">${esc(x.d)}</div></div>
        ${x.o<2?`<div style="text-align:right"><b>${tarifaPara(x.v,dias)?money(tarifaPara(x.v,dias)*dias):''}</b><div class="d">${tarifaPara(x.v,dias)?money(tarifaPara(x.v,dias))+' por día':'Sin tarifa'}</div></div><button class="btn sm ${x.k==='free'?'primary':''}" data-act="av-book" data-vid="${x.v.id}" data-a="${a}" data-b="${b}">Reservar</button>`:''}</div>`).join('')}</div>`;
    };
    let last=null;res.addEventListener('click',e=>{if(e.target.closest('[data-quote]')&&last)waModal('Cotización para el cliente',quoteText(last.a,last.b,last.list),'')});
    f.addEventListener('input',draw);f.addEventListener('change',draw);draw();
  },true);
}

/* --- extender renta --- */
const bufMs=()=>(+CFG.margenHoras||0)*HOUR;
function extendForm(id,preset){
  const r=byId('rentas',id);if(!r)return;const v=byId('vehiculos',r.vehiculo_id);const cur=r.entrega;
  const def=preset||toLocalISO(addDays(parse(cur),1));
  openModal('Extender renta',`<p style="margin-top:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${plate(v)}<span><b>${esc(vShort(v))}</b> con <b>${esc(shortName(cliName(r)))}</b>. Regreso actual: <b>${fDT(cur)}</b></span></p>
    <form id="xf" class="form">
      <label class="f">Nuevo regreso<input name="entrega" type="datetime-local" value="${def}"></label>
      <label class="f">Días a cobrar en total <span class="hint">Antes: ${r.dias}</span><input name="dias" type="number" min="1"></label>
      <label class="f">Cobrar ahora ($)<input name="pago" type="number" min="0" step="0.01" placeholder="0.00"></label>
      <label class="f">Forma de pago<select name="metodo">${opts(METODOS)}</select></label>
      <label class="f full">Nota <span class="hint">Cómo y cuándo avisó el cliente</span><input name="nota" placeholder="Ej. avisó por WhatsApp el 02/10"></label>
      <div class="full" id="xres"></div></form>`,
    `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="xfSave">Guardar extensión</button>`,m=>{
      const f=$('#xf',m);let diasTouched=false;const btn=$('#xfSave',m);
      const check=()=>{const b=fv(f,'entrega');const B=parse(b);const res=$('#xres',m);
        if(!B||B<=parse(cur)){res.innerHTML='<div class="warnbox">El nuevo regreso debe ser después del regreso actual.</div>';btn.disabled=true;return}
        if(!diasTouched)f.elements.dias.value=calcDias(r.salidaReal||r.salida,b);
        const x={...r,dias:nv(f,'dias')};const extra=rTotal(x)-rTotal(r);
        const cf=conflicts(r.vehiculo_id,cur,b,r.id).sort((p,q)=>parse(p.salida)-parse(q.salida));
        if(!cf.length){btn.disabled=false;
          res.innerHTML=`<div class="sum"><div><span>Días extra</span><span>${x.dias-r.dias}</span></div><div><span>Monto adicional</span><span>${money(extra)}</span></div><div class="tot"><span>Nuevo total</span><span>${money(rTotal(x))}</span></div><div><span>Saldo después de la extensión</span><b>${money(rTotal(x)-rPaid(r))}</b></div></div>`;return}
        btn.disabled=true;const nx=cf[0];const maxEnd=new Date(+parse(nx.salida)-bufMs());const canPart=maxEnd>parse(cur);
        res.innerHTML=`<div class="warnbox">${esc(vShort(v))} ya tiene reserva de ${esc(shortName(cliName(nx)))} desde el ${fDT(nx.salida)}${cf.length>1?` y ${cf.length-1} más`:''}. Elige cómo resolverlo:</div>
        <div class="rlist" style="margin-top:10px">
          <div class="item"><div class="grow"><div class="t">Cambiarle el carro al cliente</div><div class="d">Sigue con ${esc(vShort(v))} hasta ${canPart?fDT(maxEnd):'ahora'} y después se lleva otro carro hasta ${fDT(b)}</div></div><button type="button" class="btn sm primary" data-x="swap" data-when="${toLocalISO(canPart?maxEnd:nowSV())}">Cambiar carro</button></div>
          ${cf.length===1?`<div class="item"><div class="grow"><div class="t">Pasar la otra reserva a otro carro</div><div class="d">El cliente conserva su carro y a ${esc(shortName(cliName(nx)))} se le asigna otro disponible.</div></div><button type="button" class="btn sm" data-x="move" data-rid="${nx.id}">Ver carros</button></div>`:''}
          ${canPart?`<div class="item"><div class="grow"><div class="t">Extender solo lo que se puede</div><div class="d">Hasta el ${fDT(maxEnd)}, justo antes de la otra reserva.</div></div><button type="button" class="btn sm" data-x="max" data-when="${toLocalISO(maxEnd)}">Usar esa fecha</button></div>`:''}
        </div>`;
      };
      check();
      f.addEventListener('input',e=>{if(e.target.name==='dias')diasTouched=true;check()});
      f.addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(!x)return;const b=fv(f,'entrega');
        if(x.dataset.x==='max')extendForm(id,x.dataset.when);
        if(x.dataset.x==='swap')cambioForm(id,{cuando:x.dataset.when,hasta:b});
        if(x.dataset.x==='move')moveResForm(x.dataset.rid,()=>extendForm(id,b))});
      btn.onclick=async()=>{const b=fv(f,'entrega');if(conflicts(r.vehiculo_id,cur,b,r.id).length)return;
        const rec={...r,entrega:b,dias:Math.max(1,Math.round(nv(f,'dias'))),extensiones:[...(r.extensiones||[]),{fecha:toLocalISO(nowSV()),de:cur,a:b,nota:fv(f,'nota')}],pagos:[...(r.pagos||[])]};
        const p=nv(f,'pago');if(p>0)rec.pagos.push({id:uid(),por:myId(),fecha:toLocalISO(nowSV()),monto:p,metodo:fv(f,'metodo'),nota:'Extensión'});
        btn.disabled=true;try{await save('rentas',rec);toast(`Renta extendida hasta ${fDT(b)}`);closeModal()}catch(e){btn.disabled=false;toast(errMsg(e))}};
    });
}

/* --- pasar una reserva a otro carro --- */
function moveResForm(rid,after){
  const r=byId('rentas',rid);if(!r)return;const v0=byId('vehiculos',r.vehiculo_id);
  const opts2=activeVehicles().filter(v=>v.id!==r.vehiculo_id&&v.estado!=='taller'&&!conflicts(v.id,r.salida,r.entrega,r.id).length)
    .sort((a,b)=>(a.categoria===v0?.categoria?0:1)-(b.categoria===v0?.categoria?0:1)||Math.abs((+a.tarifa||0)-(+r.tarifa||0))-Math.abs((+b.tarifa||0)-(+r.tarifa||0)));
  openModal('Pasar reserva a otro carro',`<p style="margin-top:0">Reserva de <b>${esc(cliName(r))}</b> del ${fDT(r.salida)} al ${fDT(r.entrega)}, hoy asignada a ${plate(v0)} ${esc(vShort(v0))}.</p>
    ${opts2.length?`<div class="rlist">${opts2.map(v=>`<div class="item">${plate(v)}<div class="grow"><div class="t">${esc(vShort(v))}</div><div class="d">${esc(v.categoria||'')}${+v.tarifa?`, ${money(v.tarifa)} por día`:''}</div></div><button class="btn sm primary" data-mv="${v.id}">Pasar aquí</button></div>`).join('')}</div>
      <p class="muted" style="font-size:13px">La reserva conserva la tarifa que ya se le cotizó al cliente (${money(r.tarifa)} por día). Avísale del cambio de carro.</p>`
      :'<div class="warnbox">No hay otro carro libre en esas fechas.</div>'}`,
    `<button class="btn" data-close>Cancelar</button>`,m=>{
      m.querySelectorAll('[data-mv]').forEach(b=>b.onclick=async()=>{const nv2=byId('vehiculos',b.dataset.mv);b.disabled=true;
        try{await save('rentas',{...r,vehiculo_id:nv2.id,obs:[r.obs,`Se cambió de ${vShort(v0)} ${v0?.placa||''} a ${vShort(nv2)} ${nv2.placa||''} el ${dD(nowSV())} por extensión de otra renta.`].filter(Boolean).join(' ')});
          toast(`Reserva pasada a ${vShort(nv2)}`);await waitFor(()=>byId('rentas',rid)?.vehiculo_id===nv2.id);if(after)after();else closeModal()}catch(e){b.disabled=false;toast(errMsg(e))}});
    },true);
}

/* --- cambio de vehículo --- */
function cambioForm(id,pre={}){
  const r=byId('rentas',id);if(!r)return;const v=byId('vehiculos',r.vehiculo_id);
  const cuando0=pre.cuando||toLocalISO(nowSV());const hasta0=pre.hasta||r.entrega;
  openModal('Cambiar de carro',`<p style="margin-top:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${plate(v)}<span><b>${esc(vShort(v))}</b> con <b>${esc(shortName(cliName(r)))}</b>, contrato N° ${fmtNum(r.numContrato)}</span></p>
    <form id="sw" class="form">
      <label class="f">Cuándo se hace el cambio<input name="cuando" type="datetime-local" value="${cuando0}"></label>
      <label class="f">Regreso del carro nuevo<input name="hasta" type="datetime-local" value="${hasta0}"></label>
      <label class="f full">Carro nuevo<select name="nuevo"></select></label>
      <label class="f">Tarifa por día del carro nuevo ($) <span class="hint">Por defecto, la misma que ya paga</span><input name="tarifa" type="number" min="0" step="0.01" value="${r.tarifa||''}"></label>
      <label class="f">Motivo<input name="motivo" placeholder="Ej. extendió y el carro tenía reserva"></label>
      <div class="full" id="swres"></div></form>`,
    `<button class="btn" data-close>Cancelar</button><button class="btn primary" id="swSave">Programar cambio</button>`,m=>{
      const f=$('#sw',m);const btn=$('#swSave',m);
      const fill=()=>{const a=fv(f,'cuando'),b=fv(f,'hasta');const sel=f.elements.nuevo;const cur=sel.value;
        const list=activeVehicles().filter(x=>x.id!==r.vehiculo_id&&x.estado!=='taller');
        sel.innerHTML='<option value="">Elige el carro nuevo</option>'+list.map(x=>{const busy=a&&b&&conflicts(x.id,a,b).length>0;return`<option value="${x.id}" ${busy?'disabled':''} ${x.id===cur?'selected':''}>${esc(vShort(x))} ${esc(x.placa||'')}${+x.tarifa?' – '+money(x.tarifa)+'/día':''}${busy?' – ocupado':''}</option>`}).join('');
        if(sel.value!==cur)sel.value='';check()};
      const check=()=>{const a=fv(f,'cuando'),b=fv(f,'hasta');const A=parse(a),B=parse(b);const res=$('#swres',m);const soon=A&&A<=new Date(+nowSV()+30*60000);
        btn.textContent=soon?'Hacer el cambio ahora':'Programar cambio';
        let msg='';
        if(!A||!B||B<=A)msg='El regreso del carro nuevo debe ser después del cambio.';
        else if(A<parse(r.salidaReal||r.salida))msg='El cambio no puede ser antes de que el cliente recibiera el carro.';
        else if(A>parse(r.entrega)&&conflicts(r.vehiculo_id,r.entrega,a,r.id).length)msg=`${vShort(v)} tiene otra reserva antes de esa hora. Haz el cambio más temprano.`;
        if(msg){res.innerHTML=`<div class="warnbox">${esc(msg)}</div>`;btn.disabled=true;return}
        btn.disabled=!f.elements.nuevo.value;
        res.innerHTML=`<div class="infobox">La renta de ${esc(vShort(v))} se cierra el ${fDT(a)} (${calcDias(r.salidaReal||r.salida,a)} día${calcDias(r.salidaReal||r.salida,a)==1?'':'s'}) y se abre una renta nueva con el otro carro hasta el ${fDT(b)} (${calcDias(a,b)} día${calcDias(a,b)==1?'':'s'}). Así cada carro registra sus propios días e ingresos, y el depósito pasa a la renta nueva.${soon?' Ahora vas a recibir el carro actual y luego entregar el nuevo, cada uno con su inspección.':' Ese día verás en Inicio el carro por recibir y el que hay que entregar.'}</div>`};
      fill();
      f.addEventListener('input',e=>{if(e.target.name==='cuando'||e.target.name==='hasta')fill();else check()});
      f.addEventListener('change',e=>{if(e.target.name==='nuevo')check()});
      btn.onclick=async()=>{const a=fv(f,'cuando'),b=fv(f,'hasta');const nid0=f.elements.nuevo.value;if(!nid0)return;if(conflicts(nid0,a,b).length){toast('Ese carro está ocupado en esas fechas');fill();return}
        const soon=parse(a)<=new Date(+nowSV()+30*60000);const nv2=byId('vehiculos',nid0);
        const nr={cliente_id:r.cliente_id,cliente_nombre:r.cliente_nombre,vehiculo_id:nid0,salida:a,entrega:b,lugarSalida:r.lugarEntrega||'Oficina',lugarEntrega:r.lugarEntrega||'Oficina',
          tarifa:nv(f,'tarifa'),dias:calcDias(a,b),cdw:r.cdw||0,deducible:r.deducible||0,cobertura:r.cobertura||'',conIva:r.conIva,cargos:0,descuento:0,deposito:r.deposito||0,
          tarjeta:r.tarjeta||'',autorizacion:r.autorizacion||'',autMonto:r.autMonto||0,autFecha:r.autFecha||'',adicNombre:r.adicNombre||'',adicLic:r.adicLic||'',adicLicVence:r.adicLicVence||'',adicNac:r.adicNac||'',adicPais:r.adicPais||'',
          obs:`Cambio de vehículo: continúa el contrato N° ${fmtNum(r.numContrato)} (${vShort(v)} ${v?.placa||''}).${fv(f,'motivo')?' '+fv(f,'motivo')+'.':''}`,
          estado:'reservada',numContrato:nextContrato(),pagos:[],creado:new Date().toISOString(),cambioDe:r.id};
        btn.disabled=true;
        try{const nid=await save('rentas',nr);
          await save('rentas',{...r,entrega:a,dias:calcDias(r.salidaReal||r.salida,a),cambioA:nid,depositoTransferido:!!r.deposito,cambioNota:fv(f,'motivo')});
          await waitFor(()=>byId('rentas',nid)&&byId('rentas',id)?.cambioA===nid);
          if(soon){toast(`Primero recibe ${vShort(v)}`);checkinForm(id,{next:nid})}
          else{closeModal();toast(`Cambio programado para el ${fDT(a)} con ${vShort(nv2)}`)}
        }catch(e){btn.disabled=false;toast(errMsg(e))}};
    },true);
}

/* --- detalle de renta --- */
function inspSummary(r){
  const s=r.insp&&r.insp.salida,e=r.insp&&r.insp.entrada;if(!s&&!e)return'';
  const col=(x,prev,t)=>{if(!x)return`<div><h4>${t}</h4><p class="muted" style="margin:0">Sin inspección registrada.</p></div>`;
    const ks=orderedZones(x.danos);const miss=Object.entries(x.acc||{}).filter(([k,v])=>v===false).map(([k])=>k);
    return`<div><h4>${t}</h4><div style="max-width:170px">${carSVG(x.danos||{},prev?prev.danos||{}:{})}</div>
      ${ks.length?`<ul>${ks.map((k,i)=>`<li>${i+1}. ${esc(ZN[k])}${x.danos[k]?': '+esc(x.danos[k]):''}${prev&&prev.danos&&!(k in prev.danos)?' <b class="neg">(nuevo)</b>':''}</li>`).join('')}</ul>`:'<p class="muted" style="margin:8px 0 0">Sin golpes marcados.</p>'}
      ${miss.length?`<p style="margin:8px 0 0;font-size:14px"><b>Faltan:</b> ${esc(miss.join(', '))}</p>`:''}
      ${(x.fotos||[]).length?`<div class="thumbs">${x.fotos.map(id=>`<a class="th" href="${blobUrl(id)}" target="_blank" rel="noopener"><img src="${blobUrl(id)}" alt="Foto de inspección"></a>`).join('')}</div>`:''}</div>`};
  return`<div class="dsec"><h3>Inspección</h3><div class="inspcols">${col(s,null,'Al salir')}${col(e,s,'Al regresar')}</div></div>`;
}

      ${r.kmSalida||r.kmEntrada?`<div><span>Kilometraje</span>${r.kmSalida?num(r.kmSalida):'—'} a ${r.kmEntrada?num(r.kmEntrada):'—'}${r.kmSalida&&r.kmEntrada?` <span class="muted">(${num(r.kmEntrada-r.kmSalida)} km)</span>`:''}</div>`:''}
