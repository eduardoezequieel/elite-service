<!doctype html>
<!--
  Elite Service · Inicio de la renta (/rentals), prototipo aislado.
  Toma la idea del Inicio de Riveras (flota en tarjetas, próximos 7 días, el mes,
  salidas y pendientes) y la arma con las piezas que la app ya tiene:
  ScreenHeader, Button, PlateChip, Stamp (tonos de FleetAvailabilityStamp),
  StatCard y los bloques DayBlock/OutBlock de today-screen.tsx.
  Tokens de apps/web/DESIGN.md. Datos en memoria. No es una spec.
-->
<html lang="es" data-theme="dark" data-density="mostrador">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio de la renta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,600;0,700;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #070e1c; --surface: #0b1730; --surface-2: #101e3c; --surface-3: #152747;
        --line: #1e3358; --line-soft: #182b4c; --rail: #050a15; --plate-bg: #0e1b33;
        --text: #eaf0fa; --text-dim: #8fa4c6; --text-faint: #7387ac;
        --flame: #f04e23; --flame-hot: #f58220; --flame-deep: #c4161c; --flame-text: #f58220;
        --gradient-action: linear-gradient(100deg, var(--flame-hot), var(--flame) 55%, var(--flame-deep));
        --gradient-rail-active: linear-gradient(180deg, var(--flame-hot), var(--flame-deep));
        --gradient-bar-active: linear-gradient(90deg, var(--flame-hot), var(--flame-deep));
        --go: #2fbf7c; --go-text: #2fbf7c; --danger-text: #f08089;
        --warn-text: #e5a64b; --info-text: #7fb0ff;
        --rail-text: #e6edf9; --rail-dim: #a8b6ce; --on-flame: #ffffff;
        --rail-w: 248px; --active-mark: 3px;
        --shadow-dialog: 0 24px 60px -12px rgb(0 0 0 / 0.85), 0 0 0 1px rgb(255 255 255 / 0.08);
        --radius-sm: 6px; --radius-control: 10px; --radius-row: 12px; --radius-card: 14px; --radius-pill: 999px;
        --nav-item-radius: 9px;
        --page-max: 1440px; --page-px: 34px; --page-pt: 30px; --page-pb: 60px;
        --display-size: 38px; --stat-size: 28px; --stat-size-wide: 32px; --title-size: 17px; --name-size: 17px;
        --plate-size-sm: 12px;
        --tint-fill: 12%; --tint-line: 40%;
        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
        --duration-state: 140ms; --duration-enter: 180ms; --duration-mount: 280ms; --stagger-step: 35ms;
        --row-h: 52px; --control-h: 40px; --touch-min: 36px; --icon-size: 16px;
        --body-size: 14.5px; --dense-size: 12.5px;
        --card-min: 270px; --stage-h: 150px; --stat-name-size: 20px;
        --font-sans: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-display: Saira, 'Arial Narrow', system-ui, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      [data-theme='light'] {
        --bg: #eef1f6; --surface: #ffffff; --surface-2: #f6f8fc; --surface-3: #e6ebf3;
        --line: #d9e0ec; --line-soft: #e6ebf3; --rail: #0b1730; --plate-bg: #f1f4fa;
        --text: #0b1730; --text-dim: #4e5d77; --text-faint: #626c80;
        --flame-text: #a8480c; --go-text: #0f6b41; --danger-text: #a8232b; --warn-text: #8a5510; --info-text: #1d4ed8;
        --shadow-dialog: 0 24px 60px -12px rgb(11 23 48 / 0.28), 0 0 0 1px rgb(11 23 48 / 0.08);
      }
      [data-density='bahia'] {
        --row-h: 56px; --control-h: 48px; --touch-min: 44px; --icon-size: 20px;
        --body-size: 15.5px; --dense-size: 14px; --title-size: 18px; --name-size: 19px;
        --page-pb: 120px; --card-min: 330px; --stage-h: 190px; --stat-name-size: 25px; --plate-size-sm: 13.5px;
      }
      * { box-sizing: border-box }
      html { color-scheme: dark }
      html[data-theme='light'] { color-scheme: light }
      html, body { margin: 0 }
      body {
        background: var(--bg); color: var(--text); font-family: var(--font-sans);
        font-size: var(--body-size); line-height: 1.45; -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent }
      a { color: inherit; text-decoration: none }
      :focus-visible { outline: 2px solid var(--flame-hot); outline-offset: 2px }
      svg.i { width: var(--icon-size); height: var(--icon-size); stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none }
      .num { font-variant-numeric: tabular-nums }

      /* Barra del prototipo */
      .proto-bar {
        position: sticky; top: 0; z-index: 45; display: flex; flex-wrap: wrap; align-items: center;
        gap: 8px 12px; padding: 10px 16px; background: var(--rail); color: var(--rail-text);
        border-bottom: 1px solid var(--line); font-size: 13px;
      }
      .proto-bar strong { margin-right: auto; font-weight: 600 }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-control); overflow: hidden }
      .seg button { min-height: 32px; padding: 0 12px; border: 0; background: transparent; color: var(--rail-dim); cursor: pointer; font-size: 12.5px; font-weight: 600 }
      .seg button[aria-pressed='true'] { background: color-mix(in srgb, var(--rail-text) 14%, var(--rail)); color: var(--rail-text); box-shadow: inset 0 -2px 0 var(--flame) }

      /* Shell: riel + página, barra inferior en bahía/tablet */
      .shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100vh - 53px) }
      .rail {
        position: sticky; top: 53px; height: calc(100vh - 53px); background: var(--rail); color: var(--rail-dim);
        border-right: 1px solid rgb(255 255 255 / 0.06); display: flex; flex-direction: column; gap: 24px; padding: 16px 14px;
      }
      .logo { display: flex; align-items: center; gap: 10px; padding: 4px 6px; color: var(--rail-text) }
      .logo svg { width: 46px; height: 28px; flex: none }
      .wordmark { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 21px; line-height: 0.88 }
      .wordmark small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.2em; margin-top: 2px; color: var(--rail-dim) }
      .nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
      .nav-item {
        position: relative; width: 100%; display: flex; align-items: center; gap: 10px; min-height: 40px;
        padding: 8px 10px; border-radius: var(--nav-item-radius); border: 0; background: none;
        color: var(--rail-dim); cursor: pointer; font-weight: 500; font-size: 14.5px; text-align: left;
      }
      .nav-item:hover { background: rgb(255 255 255 / 0.05); color: var(--rail-text) }
      .nav-item[aria-current='page'] { background: color-mix(in srgb, var(--flame) 14%, transparent); color: var(--on-flame) }
      .nav-item[aria-current='page'] svg.i { color: var(--flame) }
      .nav-item[aria-current='page']::before {
        content: ''; position: absolute; left: -14px; top: 8px; bottom: 8px; width: var(--active-mark);
        border-radius: 0 3px 3px 0; background: var(--gradient-rail-active);
      }
      .bottom {
        display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--rail);
        border-top: 1px solid rgb(255 255 255 / 0.08); padding: 8px 6px max(8px, env(safe-area-inset-bottom));
      }
      .bottom button {
        position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
        min-height: 52px; justify-content: center; border: 0; background: none; color: var(--rail-dim); font-size: 11px; font-weight: 500;
      }
      .bottom button svg.i { width: 22px; height: 22px }
      .bottom button[aria-current='page'] { color: var(--flame-hot) }

      .page { width: 100%; max-width: var(--page-max); margin: 0 auto; padding: var(--page-pt) var(--page-px) var(--page-pb) }

      /* ScreenHeader */
      .screen-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 24px; min-height: 48px }
      h1 { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: var(--display-size); line-height: 0.95; letter-spacing: -0.01em; margin: 0 }
      .head-actions { display: flex; flex-wrap: wrap; gap: 10px }

      /* Button */
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        height: var(--control-h); min-height: var(--touch-min); padding: 0 16px;
        border-radius: var(--radius-control); border: 1px solid var(--line); background: var(--surface-2);
        color: var(--text); font-size: var(--body-size); font-weight: 600; cursor: pointer; white-space: nowrap;
        transition: filter var(--duration-state) var(--ease-standard), border-color var(--duration-state) var(--ease-standard);
      }
      .btn:hover { border-color: var(--flame) }
      .btn:active { transform: translateY(1px) }
      .btn.primary { background-image: var(--gradient-action); color: var(--on-flame); border-color: transparent; padding: 0 20px }
      .btn.primary:hover { filter: brightness(1.1) }
      .btn.outline { background: transparent }
      .btn.sm { height: calc(var(--control-h) - 4px); padding: 0 12px; font-size: var(--dense-size) }

      /* PlateChip + Stamp */
      .plate {
        display: inline-block; width: fit-content; font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums; font-size: var(--plate-size-sm); padding: 2px 8px; background: var(--plate-bg);
        border: 1px solid var(--line); border-radius: var(--radius-sm); white-space: nowrap;
      }
      .stamp {
        display: inline-flex; align-items: center; gap: 7px; width: fit-content; flex: none; padding: 5px 11px;
        border: 1px solid; border-radius: var(--radius-pill); font-size: var(--dense-size); font-weight: 600; white-space: nowrap;
        background-color: color-mix(in oklab, currentColor var(--tint-fill), transparent);
        border-color: color-mix(in oklab, currentColor var(--tint-line), transparent);
      }
      .stamp::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
      .t-FREE { --tone: var(--go-text) }
      .t-RENTED { --tone: var(--flame-text) }
      .t-OVERDUE { --tone: var(--danger-text) }
      .t-RESERVED { --tone: var(--info-text) }
      .t-WORKSHOP { --tone: var(--warn-text) }

      /* Filtros de la flota (FilterChip) */
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px }
      .chip {
        display: inline-flex; align-items: center; gap: 8px; min-height: var(--touch-min); padding: 0 14px;
        border-radius: var(--radius-pill); border: 1.5px solid var(--line); background: var(--surface);
        color: var(--text-dim); cursor: pointer; font-weight: 600; font-size: var(--dense-size);
      }
      .chip b { color: var(--text); font-variant-numeric: tabular-nums }
      .chip[aria-pressed='true'] { border-color: var(--flame); color: var(--text); background: color-mix(in srgb, var(--flame) 12%, var(--surface)) }
      .chip[disabled] { opacity: 0.45; cursor: default }

      /* FleetVehicleCard: escenario con el carro en 3D y el sello, nombre + placa, actividad, avisos, tarifa */
      .cars { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--card-min), 100%), 1fr)); gap: 14px }
      .car {
        display: flex; flex-direction: column; overflow: hidden; background: var(--surface);
        border: 1px solid var(--line-soft); border-radius: var(--radius-card); cursor: pointer;
        transition: border-color var(--duration-state) var(--ease-standard);
      }
      .car:hover { border-color: var(--line) }
      .stage { position: relative; height: var(--stage-h); overflow: hidden; background: var(--surface-2) }
      .stage .stamp { position: absolute; top: 12px; right: 12px; z-index: 1; color: var(--tone) }
      .stage img, .stage .ph { position: absolute; top: 36px; left: 14px; width: calc(100% - 28px); height: calc(100% - 44px); object-fit: contain; object-position: bottom }
      .stage .ph { display: grid; place-items: center; color: var(--text-faint) }
      .stage .ph svg.i { width: 48px; height: 48px; stroke-width: 1 }
      .car-body { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px }
      .car-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px }
      .car-name { margin: 0; min-width: 0; font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: var(--stat-name-size); line-height: 1.15 }
      .car-head .plate { flex: none }
      .car-line { margin: 0; display: flex; align-items: flex-start; gap: 8px; color: var(--text-dim); font-size: var(--dense-size) }
      .car-line svg.i { margin-top: 2px; color: var(--text-faint) }
      .car-line.late svg.i { color: var(--danger-text) }
      .car-line b { color: var(--text); font-weight: 600 }
      .alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px }
      .alerts li { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; color: var(--warn-text) }
      .alerts li.due { color: var(--danger-text) }
      .alerts svg.i { width: 14px; height: 14px; margin-top: 1px }
      .rate { margin: auto 0 0; padding-top: 4px; font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: var(--stat-name-size); line-height: 1; font-variant-numeric: tabular-nums }
      .rate span { margin-left: 4px; font-family: var(--font-sans); font-style: normal; font-weight: 500; font-size: var(--dense-size); color: var(--text-dim) }

      /* Bloques */
      .block { margin-top: 32px }
      h2 { font-size: var(--title-size); font-weight: 600; margin: 0 0 12px }

      .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px }
      .wday { padding: 12px 14px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-row) }
      .wday.today { border-color: color-mix(in srgb, var(--flame) 55%, var(--line)) }
      .wday .d { color: var(--text-dim); font-size: var(--dense-size); font-weight: 500 }
      .wday .v { margin-top: 4px; font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 24px; line-height: 1 }
      .wday .v span { font-family: var(--font-sans); font-style: normal; font-weight: 500; font-size: var(--dense-size); color: var(--text-faint) }
      .bar { margin-top: 10px; height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden }
      .bar i { display: block; height: 100%; border-radius: 4px; background: var(--gradient-bar-active) }

      /* StatCard */
      .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
      .stat { display: flex; flex-direction: column; justify-content: center; min-height: 96px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-row) }
      a.stat:hover { border-color: var(--flame) }
      .stat p { margin: 0; color: var(--text-dim); font-size: var(--dense-size); font-weight: 500 }
      .stat .fig { margin-top: 6px; display: flex; align-items: baseline; font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: var(--stat-size-wide); line-height: 1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums }
      .stat .fig small { font-family: var(--font-sans); font-style: normal; font-weight: 500; font-size: var(--title-size); color: var(--text-faint) }
      .stat.go .fig { color: var(--go-text) }

      /* DayBlock / OutBlock */
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px }
      .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-row) }
      .panel h2 { display: flex; align-items: baseline; gap: 8px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: var(--body-size) }
      .panel h2 span { color: var(--text-faint); font-size: var(--dense-size); font-weight: 500 }
      .panel ul { list-style: none; margin: 0; padding: 0 }
      .panel li { display: flex; align-items: center; gap: 12px; min-height: var(--row-h); padding: 10px 16px; border-bottom: 1px solid var(--line-soft) }
      .panel li:last-child { border-bottom: 0 }
      .row-main { min-width: 0; flex: 1 }
      .row-main .top { display: flex; align-items: center; gap: 8px; min-width: 0 }
      .row-main .top b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
      .row-main .sub { margin-top: 3px; color: var(--text-dim); font-size: var(--dense-size); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
      .row-when { flex: none; font-size: var(--dense-size); font-variant-numeric: tabular-nums }
      .row-when.late { color: var(--danger-text) }
      .row-when.money { font-family: var(--font-mono); font-weight: 700; color: var(--warn-text) }
      .empty { margin: 0; padding: 16px; color: var(--text-dim); font-size: var(--dense-size) }

      .toast {
        position: fixed; right: 24px; bottom: 24px; z-index: 70; padding: 12px 16px; border-radius: var(--radius-row);
        background: var(--surface); border: 1px solid var(--line-soft); box-shadow: var(--shadow-dialog); font-weight: 600;
        animation: rise var(--duration-enter) var(--ease-standard);
      }
      @keyframes rise { from { opacity: 0; transform: translateY(8px) } }
      .enter > * { animation: rise var(--duration-mount) var(--ease-standard) backwards }
      .enter > *:nth-child(2) { animation-delay: var(--stagger-step) }
      .enter > *:nth-child(3) { animation-delay: calc(2 * var(--stagger-step)) }
      .enter > *:nth-child(4) { animation-delay: calc(3 * var(--stagger-step)) }
      .enter > *:nth-child(5) { animation-delay: calc(4 * var(--stagger-step)) }

      /* Bahía: tablet de pie. Sin riel, tarjetas grandes, semana deslizable, cifras 2×2, bloques apilados. */
      [data-density='bahia'] .shell { grid-template-columns: minmax(0, 1fr) }
      [data-density='bahia'] .rail { display: none }
      [data-density='bahia'] .bottom { display: flex }
      [data-density='bahia'] .screen-head .btn { height: 52px; font-size: 16px }
      [data-density='bahia'] .car-body { gap: 12px; padding: 20px }
      [data-density='bahia'] .alerts li { font-size: var(--dense-size) }
      [data-density='bahia'] .week { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px }
      [data-density='bahia'] .wday { flex: 0 0 132px; scroll-snap-align: start; padding: 14px 16px }
      [data-density='bahia'] .wday .v { font-size: 28px }
      [data-density='bahia'] .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) }
      [data-density='bahia'] .pair { grid-template-columns: 1fr }
      [data-density='bahia'] .panel li .btn { height: 44px; padding: 0 16px }

      @media (max-width: 1100px) {
        .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) }
      }
      @media (max-width: 900px) {
        :root { --page-px: 16px; --page-pt: 18px; --page-pb: 108px; --display-size: 30px }
        .shell { grid-template-columns: minmax(0, 1fr) }
        .rail { display: none }
        .bottom { display: flex }
        .pair { grid-template-columns: 1fr }
        .week { display: flex; overflow-x: auto }
        .wday { flex: 0 0 120px }
        .toast { left: 16px; right: 16px; bottom: 84px }
      }
      @media (max-width: 560px) {
        .head-actions, .head-actions .btn { flex: 1 }
        .stats { grid-template-columns: 1fr 1fr }
        .stat .fig { font-size: var(--stat-size) }
      }
      @media (prefers-reduced-motion: reduce) {
        .enter > *, .toast { animation: none !important }
      }
    </style>
  </head>
  <body>
    <div class="proto-bar" role="toolbar" aria-label="Prototipo">
      <strong>Inicio de la renta</strong>
      <div class="seg" role="group" aria-label="Escena">
        <button type="button" data-scene="busy" aria-pressed="true">Con movimiento</button>
        <button type="button" data-scene="quiet" aria-pressed="false">Día tranquilo</button>
      </div>
      <div class="seg" role="group" aria-label="Tema">
        <button type="button" data-theme-set="dark" aria-pressed="true">Oscuro</button>
        <button type="button" data-theme-set="light" aria-pressed="false">Claro</button>
      </div>
      <div class="seg" role="group" aria-label="Densidad">
        <button type="button" data-density-set="mostrador" aria-pressed="true">Mostrador</button>
        <button type="button" data-density-set="bahia" aria-pressed="false">Bahía</button>
      </div>
    </div>

    <div class="shell">
      <nav class="rail" id="rail" aria-label="Módulos"></nav>
      <main class="page" id="screen"></main>
    </div>
    <nav class="bottom" id="bottom" aria-label="Módulos"></nav>
    <div id="toaster" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      // ---------- Carros en 3D ----------
      // Un solo renderer de three.js arma cada carro (tipo + color) una vez, lo fotografía en
      // diagonal de frente y guarda la imagen. Las tarjetas solo muestran esa imagen.
      // Perfiles laterales en metros: x de la cola (0) al frente, y hacia arriba.
      const MODELS = {
        SEDAN: {
          len: 4.5, width: 1.78, wheels: [0.95, 3.55], r: 0.33,
          lower: [[4.55, 0.5], [4.55, 0.72], [4.35, 0.86], [3.3, 0.98], [1.2, 0.98], [0.25, 0.95], [0.02, 0.85], [0, 0.5]],
          cabin: [[1.0, 0.96], [3.4, 0.96], [2.72, 1.4], [1.75, 1.42]], cabW: 1.5,
          roof: [1.8, 2.7, 1.42],
        },
        SUV: {
          len: 4.6, width: 1.9, wheels: [1.0, 3.6], r: 0.38,

          cabin: [[0.12, 1.13], [3.62, 1.13], [3.0, 1.76], [0.3, 1.78]], cabW: 1.7,

      const car3d = (() => {
        if (!window.THREE) return null;
        const T = window.THREE;
        let renderer;
        try {
          renderer = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        } catch {
          return null;
        }
        const W = 520, H = 290;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(W, H);
        renderer.outputEncoding = T.sRGBEncoding;
        renderer.toneMapping = T.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.9;
        const camera = new T.PerspectiveCamera(26, W / H, 0.1, 100);
        camera.position.set(5.4, 3.1, 6.2);
        camera.lookAt(0, 0.62, 0);

        const scene = new T.Scene();
        scene.add(new T.HemisphereLight(0xdfe8ff, 0x1a2233, 0.9));
        const key = new T.DirectionalLight(0xffffff, 1.6);
        key.position.set(4, 7, 5);
        scene.add(key);
        const rim = new T.DirectionalLight(0x9fbfff, 0.7);
        rim.position.set(-6, 3, -4);
        scene.add(rim);
        const front = new T.DirectionalLight(0xffffff, 0.5);
        front.position.set(8, 1.5, 1);
        scene.add(front);

        // Sombra de contacto: un degradado radial en el piso, sin cálculo de sombras.
        const sc = document.createElement('canvas');
        sc.width = sc.height = 128;
        const g = sc.getContext('2d');
        const grad = g.createRadialGradient(64, 64, 4, 64, 64, 64);
        grad.addColorStop(0, 'rgba(0,0,0,0.55)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, 128, 128);
        const shadowMat = new T.MeshBasicMaterial({ map: new T.CanvasTexture(sc), transparent: true, depthWrite: false });

        const mats = {
          glass: new T.MeshStandardMaterial({ color: 0x141d2b, metalness: 0.7, roughness: 0.12 }),
          tire: new T.MeshStandardMaterial({ color: 0x121418, roughness: 0.9 }),
          rim: new T.MeshStandardMaterial({ color: 0xc3cad5, metalness: 0.85, roughness: 0.3 }),
          trim: new T.MeshStandardMaterial({ color: 0x15181e, roughness: 0.6 }),
          head: new T.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff4dc, emissiveIntensity: 0.9 }),
          tail: new T.MeshStandardMaterial({ color: 0xa3121a, emissive: 0x7a0d12, emissiveIntensity: 0.6 }),
          plate: new T.MeshStandardMaterial({ color: 0xeef1f6, roughness: 0.5 }),
        };
        const extrude = (shape, depth, mat, bevel = 0.05) => {
          const geo = new T.ExtrudeGeometry(shape, {
            depth: depth - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel,
            bevelSegments: 3, curveSegments: 16,
          });
          geo.translate(0, 0, -(depth - bevel * 2) / 2);
          return new T.Mesh(geo, mat);
        };
        const box = (w, h, d, mat, x, y, z) => {
          const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
          m.position.set(x, y, z);
          return m;
        };

        function build(cat, paintHex) {
          const m = MODELS[cat];
          const paint = new T.MeshStandardMaterial({ color: new T.Color(paintHex).convertSRGBToLinear(), metalness: 0.35, roughness: 0.38 });
          const car = new T.Group();
          const cy = m.r, ar = m.r + 0.07, by = 0.3;

          // Carrocería baja con los arcos de las ruedas recortados.
          const s = new T.Shape();
          s.moveTo(0.06, by);
          for (const wx of m.wheels) {
            s.lineTo(wx - ar, by);
            s.absarc(wx, cy, ar, Math.PI, 0, true);
          }
          s.lineTo(m.lower[0][0] - 0.08, by);
          for (const [x, y] of m.lower) s.lineTo(x, y);
          s.lineTo(0.06, by);
          car.add(extrude(s, m.width, paint, 0.07));

          // Cabina de vidrio con techo y pilares pintados.
          const c = new T.Shape();
          const [p0, p1, p2, p3] = m.cabin;
          c.moveTo(p0[0], p0[1]);
          c.lineTo(p1[0], p1[1]);
          c.quadraticCurveTo(p2[0] + 0.25, p2[1] - 0.06, p2[0], p2[1]);
          c.lineTo(p3[0], p3[1]);
          c.quadraticCurveTo(p3[0] - 0.25, p3[1] - 0.05, p0[0], p0[1]);
          car.add(extrude(c, m.cabW, mats.glass, 0.06));
          const [rx0, rx1, ry] = m.roof;
          car.add(box(rx1 - rx0 + 0.08, 0.07, m.cabW + 0.02, paint, (rx0 + rx1) / 2, ry + 0.01, 0));
          const bx = (rx0 + rx1) / 2 + (cat === 'SUV' ? 0.25 : 0);
          car.add(box(0.1, ry - p0[1], m.cabW + 0.03, paint, bx, (ry + p0[1]) / 2, 0));
          if (m.rails) {
            for (const z of [-1, 1]) {
              car.add(box(rx1 - rx0 - 0.3, 0.05, 0.05, mats.trim, (rx0 + rx1) / 2, ry + 0.09, z * (m.cabW / 2 - 0.12)));
            }
          }
          if (m.bed) {
            const [x0, x1] = m.bed, h = 0.28, top = 1.15;
            for (const z of [-1, 1]) car.add(box(x1 - x0, h, 0.08, paint, (x0 + x1) / 2, top + h / 2, z * (m.width / 2 - 0.06)));
            car.add(box(0.08, h, m.width - 0.04, paint, x0 + 0.04, top + h / 2, 0));
            car.add(box(x1 - x0 - 0.1, 0.02, m.width - 0.2, mats.trim, (x0 + x1) / 2, top + 0.01, 0));
          }

          // Frente: parrilla, faros y placa. Cola: calaveras. Retrovisores.
          const fx = m.lower[1][0];
          const fy = (m.lower[0][1] + m.lower[1][1]) / 2;
          const gw = cat === 'PICKUP' ? 1.0 : cat === 'SUV' ? 0.8 : 0.62;
          car.add(box(0.06, cat === 'PICKUP' ? 0.32 : 0.18, gw, mats.trim, fx + 0.01, fy + 0.06, 0));
          for (const z of [-1, 1]) {
            car.add(box(0.06, 0.09, 0.34, mats.head, fx - 0.03, fy + 0.13, z * (m.width / 2 - 0.26)));
            car.add(box(0.06, 0.12, 0.24, mats.tail, -0.01, m.lower[m.lower.length - 2][1] - 0.12, z * (m.width / 2 - 0.2)));
            car.add(box(0.12, 0.05, 0.16, mats.trim, m.cabin[1][0] - 0.12, m.cabin[1][1] + 0.08, z * (m.cabW / 2 + 0.1)));
          }
          car.add(box(0.03, 0.12, 0.42, mats.plate, fx + 0.03, m.lower[0][1] - 0.12, 0));

          // Ruedas.
          for (const wx of m.wheels) {
            for (const z of [-1, 1]) {
              const wz = z * (m.width / 2 - 0.17);
              const tire = new T.Mesh(new T.CylinderGeometry(m.r, m.r, 0.26, 28), mats.tire);
              tire.rotation.x = Math.PI / 2;
              tire.position.set(wx, cy, wz);
              const rimM = new T.Mesh(new T.CylinderGeometry(m.r * 0.62, m.r * 0.62, 0.27, 20), mats.rim);
              rimM.rotation.x = Math.PI / 2;
              rimM.position.set(wx, cy, wz + z * 0.005);
              car.add(tire, rimM);
            }
          }

          const shadow = new T.Mesh(new T.PlaneGeometry(m.len + 1.2, m.width + 1.0), shadowMat);
          shadow.rotation.x = -Math.PI / 2;
          shadow.position.set(m.len / 2, 0.002, 0);
          car.add(shadow);
          car.position.x = -m.len / 2;
          return car;
        }

        // Recorta el aire transparente alrededor del carro para que llene el escenario.
        function cropped(src) {
          const w = src.width, h = src.height;
          const cv = document.createElement('canvas');
          cv.width = w;
          cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.drawImage(src, 0, 0);
          const px = ctx.getImageData(0, 0, w, h).data;
          let x0 = w, y0 = h, x1 = 0, y1 = 0;
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              if (px[(y * w + x) * 4 + 3] > 24) {
                if (x < x0) x0 = x;
                if (x > x1) x1 = x;
                if (y < y0) y0 = y;
                if (y > y1) y1 = y;
              }
            }
          }
          if (x1 <= x0) return src.toDataURL('image/png');
          const pad = Math.round(w * 0.01);
          x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
          x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
          const out = document.createElement('canvas');
          out.width = x1 - x0 + 1;
          out.height = y1 - y0 + 1;
          out.getContext('2d').drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
          return out.toDataURL('image/png');
        }
        const cache = new Map();
        return (cat, paintHex) => {
          const k = cat + paintHex;
          if (!cache.has(k)) {
            const car = build(cat, paintHex);
            scene.add(car);
            renderer.render(scene, camera);
            cache.set(k, cropped(renderer.domElement));
            scene.remove(car);
          }
          return cache.get(k);
        };
      })();
    </script>

            <section class="block">
              <h2>Próximos 7 días</h2>
              <div class="week">${d.week.map(([day, n], i) => `
                <div class="wday${i === 0 ? ' today' : ''}">
                  <div class="d">${day}</div>
                  <div class="v num">${n}<span>/${total}</span></div>
                  <div class="bar"><i style="width:${Math.round((n / total) * 100)}%"></i></div>
                </div>`).join('')}
              </div>
            </section>

            <section class="block">
              <h2>Dinero</h2>
              <div class="stats">
                <a class="stat go" href="#" data-act="Caja"><p>Cobrado hoy</p><div class="fig">${d.collectedToday[0]}<small>${d.collectedToday[1]}</small></div></a>
                <div class="stat"><p>Rentado en octubre</p><div class="fig">${d.month.entered[0]}<small>${d.month.entered[1]}</small></div></div>
                <div class="stat"><p>Gastos de octubre</p><div class="fig">${d.month.spent[0]}<small>${d.month.spent[1]}</small></div></div>
                <div class="stat"><p>Ganancia de octubre</p><div class="fig">${d.month.left[0]}<small>${d.month.left[1]}</small></div></div>
              </div>
            </section>

            <div class="block pair">
              ${panel('Salen y vuelven', d.moves, 'Nada hoy ni mañana')}
              ${panel('Pendientes', d.pending, 'Todo en orden')}
            </div>
          </div>`;
      }

      function toast(text) {
        const box = document.getElementById('toaster');
        box.innerHTML = `<div class="toast">${esc(text)}</div>`;
        clearTimeout(toast.t);
        toast.t = setTimeout(() => (box.innerHTML = ''), 1800);
      }

      document.addEventListener('click', (e) => {
        const t = e.target.closest('button, a, [data-open]');
        if (!t) return;
        if (t.dataset.scene) {
          ui.scene = t.dataset.scene; ui.filter = null;
          document.querySelectorAll('[data-scene]').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
          return render();
        }
        if (t.dataset.themeSet) {
          document.documentElement.dataset.theme = t.dataset.themeSet;
          document.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
          return;
        }
        if (t.dataset.densitySet) {
          document.documentElement.dataset.density = t.dataset.densitySet;
          document.querySelectorAll('[data-density-set]').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
          return;
        }
        if (t.dataset.filter !== undefined) {
          ui.filter = t.dataset.filter === '' || ui.filter === t.dataset.filter ? null : t.dataset.filter;
          return render();
        }
        if (t.dataset.act) { e.preventDefault(); e.stopPropagation(); return toast(`Abriría: ${t.dataset.act}`); }
        if (t.dataset.open) return toast(`Abriría la ficha de ${t.dataset.open}`);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.dataset && e.target.dataset.open) toast(`Abriría la ficha de ${e.target.dataset.open}`);
      });

      renderShell();
      render();
    </script>
  </body>
</html>
