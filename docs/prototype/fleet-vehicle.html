<!doctype html>
<html lang="es" data-theme="dark" data-density="mostrador">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elite Service — ficha del carro (propuesta)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,600;0,700;1,600;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* =====================================================================
       * Tokens — copiados de apps/web/DESIGN.md / globals.css.
       * =================================================================== */
      :root {
        --bg: #070e1c;
        --surface: #0b1730;
        --surface-2: #101e3c;
        --surface-3: #152747;
        --line: #1e3358;
        --line-soft: #182b4c;
        --rail: #050a15;
        --plate-bg: #0e1b33;
        --text: #eaf0fa;
        --text-dim: #8fa4c6;
        --text-faint: #7387ac;
        --flame: #f04e23;
        --flame-hot: #f58220;
        --flame-deep: #c4161c;
        --flame-text: #f58220;
        --gradient-action: linear-gradient(100deg, #f58220, #f04e23 55%, #c4161c);
        --on-flame: #ffffff;
        --go-text: #2fbf7c;
        --danger: #a8232b;
        --danger-text: #f08089;
        --warn-text: #e5a64b;
        --info-text: #7fb0ff;
        --consume-text: #d59bf6;
        --backdrop: rgb(2 6 14 / 0.62);

        --radius-sm: 6px;
        --radius-control: 10px;
        --radius-row: 12px;
        --radius-card: 14px;
        --radius-pill: 999px;
        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
        --duration-state: 140ms;

        --row-h: 52px;
        --control-h: 40px;
        --touch-min: 36px;
        --icon-size: 16px;
        --field-px: 16px;
        --field-pt: 8px;
        --field-pb: 10px;

        --font-sans: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-display: Saira, 'Arial Narrow', system-ui, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      [data-theme='light'] {
        --bg: #eef1f6;
        --surface: #ffffff;
        --surface-2: #f6f8fc;
        --surface-3: #e6ebf3;
        --line: #d9e0ec;
        --line-soft: #e6ebf3;
        --rail: #0b1730;
        --plate-bg: #f1f4fa;
        --text: #0b1730;
        --text-dim: #4e5d77;
        --text-faint: #626c80;
        --flame-text: #a8480c;
        --go-text: #0f6b41;
        --danger-text: #a8232b;
        --warn-text: #8a5510;
        --info-text: #1d4ed8;
        --consume-text: #8b2fa8;
        --backdrop: rgb(11 23 48 / 0.45);
      }
      [data-density='bahia'] {
        --row-h: 56px;
        --control-h: 48px;
        --touch-min: 44px;
        --icon-size: 20px;
        --field-px: 18px;
        --field-pt: 10px;
        --field-pb: 12px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 14.5px;
        line-height: 21px;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--flame);
        outline-offset: 2px;
      }
      svg.i {
        width: var(--icon-size);
        height: var(--icon-size);
        stroke: currentColor;
        stroke-width: 1.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
      }
      .num {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .dim {
        color: var(--text-dim);
      }
      .faint {
        color: var(--text-faint);
      }
      .dense {
        font-size: 12.5px;
        line-height: 18px;
      }
      .label {
        font-size: 12px;
        font-weight: 600;
        line-height: 16px;
      }
      .hidden {
        display: none !important;
      }

      /* ---------- Barra del prototipo ---------- */
      .proto-bar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 10px 16px;
        background: var(--rail);
        color: #e6edf9;
        border-bottom: 1px solid var(--line);
      }
      .proto-bar strong {
        font-weight: 600;
        margin-right: auto;
      }
      .seg {
        display: inline-flex;
        border: 1px solid #1e3358;
        border-radius: var(--radius-control);
        overflow: hidden;
      }
      .seg button {
        min-height: 32px;
        padding: 0 12px;
        border: 0;
        background: transparent;
        color: #a8b6ce;
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 600;
      }
      .seg button[aria-pressed='true'] {
        background: #152747;
        color: #e6edf9;
        box-shadow: inset 0 -2px 0 #f04e23;
      }

      /* ---------- Página ---------- */
      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 24px 80px;
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text-dim);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        min-height: var(--touch-min);
      }
      .back:hover {
        color: var(--text);
      }
      .screen-head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin: 8px 0 20px;
      }
      h1 {
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 800;
        font-size: 38px;
        line-height: 0.95;
        letter-spacing: -0.01em;
        margin: 0 0 10px;
      }
      .subtitle {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .head-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .plate {
        font-family: var(--font-mono);
        font-weight: 700;
        letter-spacing: 0.06em;
        font-size: 12px;
        padding: 2px 8px;
        background: var(--plate-bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
      }
      .stamp {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 10px;
        border-radius: var(--radius-pill);
        font-size: 12px;
        font-weight: 600;
        background: color-mix(in srgb, currentColor 12%, transparent);
        border: 1px solid color-mix(in srgb, currentColor 40%, transparent);
      }
      .stamp::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .stamp.green {
        color: var(--go-text);
      }
      .stamp.amber {
        color: var(--warn-text);
      }
      .stamp.neutral {
        color: var(--text-dim);
      }
      .stamp.red {
        color: var(--danger-text);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: var(--control-h);
        padding: 0 20px;
        border-radius: var(--radius-control);
        border: 1px solid var(--line);
        background: var(--surface-2);
        font-weight: 600;
        cursor: pointer;
        transition:
          border-color var(--duration-state) var(--ease-standard),
          filter var(--duration-state) var(--ease-standard);
      }
      .btn:hover {
        border-color: var(--flame);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.primary {
        background: var(--gradient-action);
        color: var(--on-flame);
        border-color: transparent;
      }
      .btn.primary:hover {
        filter: brightness(1.1);
      }
      .btn.destructive {
        color: var(--danger-text);
        background: color-mix(in srgb, var(--danger-text) 12%, transparent);
        border-color: color-mix(in srgb, var(--danger-text) 40%, transparent);
      }
      .btn.destructive-solid {
        background: var(--danger);
        color: #fff;
        border-color: transparent;
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--text-dim);
        padding: 0 10px;
      }
      .btn.ghost:hover {
        color: var(--text);
        border-color: transparent;
        background: var(--surface-2);
      }
      .btn.sm {
        min-height: var(--touch-min);
        padding: 0 12px;
        font-size: 13px;
      }

      /* ---------- Pestañas ---------- */
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 20px;
        overflow-x: auto;
      }
      .tab {
        min-height: var(--touch-min);
        padding: 0 14px;
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        color: var(--text-dim);
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab[aria-selected='true'] {
        color: var(--text);
        border-bottom-color: var(--flame);
      }

      /* ---------- Ficha ---------- */
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        align-items: start;
      }
      [data-density='bahia'] .cards {
        grid-template-columns: minmax(0, 1fr);
      }
      .card {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-card);
        padding: 18px 20px 20px;
      }
      .card.wide {
        grid-column: 1 / -1;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .card-head h2 {
        font-size: 17px;
        line-height: 23px;
        font-weight: 600;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .lock {
        color: var(--text-faint);
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px 20px;
      }
      .card.wide .fields {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      [data-density='bahia'] .card.wide .fields {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .field dt {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text-dim);
        margin-bottom: 2px;
      }
      .field dd {
        margin: 0;
      }
      .field.span {
        grid-column: 1 / -1;
      }
      .hero-rate {
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 700;
        font-size: 30px;
        line-height: 1.1;
      }
      .meter {
        height: 6px;
        border-radius: var(--radius-pill);
        background: var(--surface-3);
        overflow: hidden;
        margin: 8px 0 4px;
      }
      .meter > span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #f58220, #c4161c);
      }
      .note-line {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: var(--radius-row);
        background: var(--surface-2);
        color: var(--text-dim);
        font-size: 12.5px;
        line-height: 18px;
        display: flex;
        gap: 8px;
      }
      .note-line.warn {
        color: var(--warn-text);
        background: color-mix(in srgb, var(--warn-text) 10%, transparent);
      }
      .expiry {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* Las notas del prototipo: el número que explica cada cambio. */
      .pin {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--info-text);
        color: var(--surface);
        font-size: 12px;
        font-weight: 700;
        flex: none;
        cursor: pointer;
        border: 0;
      }
      body:not(.show-notes) .pin {
        display: none;
      }
      .notes-panel {
        margin-top: 28px;
        background: var(--surface);
        border: 1px dashed color-mix(in srgb, var(--info-text) 50%, transparent);
        border-radius: var(--radius-card);
        padding: 18px 20px;
      }
      body:not(.show-notes) .notes-panel {
        display: none;
      }
      .notes-panel h3 {
        margin: 0 0 12px;
        font-size: 17px;
        font-weight: 600;
        color: var(--info-text);
      }
      .notes-panel ol {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 12px;
      }
      .notes-panel li {
        display: flex;
        gap: 12px;
      }
      .notes-panel li.flash {
        animation: flash 1.2s var(--ease-standard);
      }
      @keyframes flash {
        0% {
          background: color-mix(in srgb, var(--info-text) 22%, transparent);
        }
        100% {
          background: transparent;
        }
      }
      .notes-panel b {
        font-weight: 600;
      }

      /* ---------- Lista de la flota ---------- */
      .list {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-card);
        overflow: hidden;
      }
      .row {
        display: grid;
        grid-template-columns: 130px 1fr 120px 120px 130px;
        align-items: center;
        gap: 12px;
        min-height: var(--row-h);
        padding: 0 18px;
        border-top: 1px solid var(--line-soft);
        cursor: pointer;
      }
      .row:hover {
        background: var(--surface-2);
      }
      .row.head {
        cursor: default;
        border-top: 0;
        min-height: 40px;
        color: var(--text-faint);
        font-size: 12px;
        font-weight: 600;
      }
      .row.head:hover {
        background: none;
      }

      /* ---------- Diálogo ---------- */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: var(--backdrop);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .dialog {
        width: min(560px, 100%);
        max-height: calc(100vh - 48px);
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-card);
        box-shadow: 0 24px 64px rgb(0 0 0 / 0.4);
        overflow: hidden;
      }
      .dialog.big {
        width: min(720px, 100%);
      }
      .dialog.small {
        width: min(440px, 100%);
      }
      .d-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--line-soft);
      }
      .d-head h2 {
        margin: 0;
        font-size: 21px;
        line-height: 27px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .d-head p {
        margin: 2px 0 0;
        color: var(--text-dim);
      }
      .d-body {
        padding: 18px 20px 20px;
        overflow-y: auto;
        display: grid;
        gap: 22px;
      }
      .d-foot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 14px 20px;
        border-top: 1px solid var(--line-soft);
      }
      .section h3 {
        margin: 0 0 4px;
        font-size: 17px;
        font-weight: 600;
      }
      .section .hint {
        margin: 0 0 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 10px;
      }
      [data-density='bahia'] .grid {
        grid-template-columns: minmax(0, 1fr);
      }
      .grid .span {
        grid-column: 1 / -1;
      }
      .box {
        display: block;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        padding: var(--field-pt) var(--field-px) var(--field-pb);
        transition: border-color var(--duration-state) var(--ease-standard);
      }
      .box:focus-within {
        border-color: var(--flame);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--flame) 35%, transparent);
      }
      .box.invalid {
        border-color: var(--danger);
      }
      .box span {
        display: block;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text-dim);
      }
      .box input,
      .box select,
      .box textarea {
        width: 100%;
        border: 0;
        background: transparent;
        padding: 2px 0 0;
        outline: none;
        min-height: 22px;
      }
      .box select {
        appearance: none;
        cursor: pointer;
      }
      .box textarea {
        resize: vertical;
        min-height: 64px;
      }
      .box input::placeholder,
      .box textarea::placeholder {
        color: var(--text-faint);
      }
      .box input.m {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .err {
        color: var(--danger-text);
        font-size: 12.5px;
        margin: 4px 0 0;
      }
      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: var(--touch-min);
      }
      .switch-row label {
        font-weight: 600;
        cursor: pointer;
      }
      .switch-row small {
        display: block;
        font-weight: 400;
        color: var(--text-faint);
        font-size: 12.5px;
        line-height: 18px;
      }
      .switch {
        position: relative;
        width: 44px;
        height: 26px;
        flex: none;
        border-radius: var(--radius-pill);
        border: 1px solid var(--line);
        background: var(--surface-3);
        cursor: pointer;
        padding: 0;
      }
      [data-density='bahia'] .switch {
        width: 52px;
        height: 30px;
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: calc(100% / 2 - 4px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--text-dim);
        transition: transform var(--duration-state) var(--ease-standard);
      }
      .switch[aria-checked='true'] {
        background: var(--gradient-action);
        border-color: transparent;
      }
      .switch[aria-checked='true']::after {
        transform: translateX(calc(100% + 2px));
        background: #fff;
      }
      .readonly {
        padding: 2px 0;
      }
      .readonly dt {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text-dim);
      }
      .readonly dd {
        margin: 2px 0 0;
      }
      .status-options {
        display: grid;
        gap: 10px;
      }
      .status-opt {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        text-align: left;
        padding: 12px 14px;
        border-radius: var(--radius-row);
        border: 1px solid var(--line);
        background: var(--surface-2);
        cursor: pointer;
        min-height: var(--row-h);
      }
      .status-opt:hover {
        border-color: var(--flame);
      }
      .status-opt[aria-pressed='true'] {
        border-color: var(--flame);
        box-shadow: inset 3px 0 0 var(--flame);
      }
      .status-opt b {
        display: block;
        font-weight: 600;
      }

      /* ---------- Toast ---------- */
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 60;
        padding: 12px 16px;
        border-radius: var(--radius-row);
        background: var(--surface-3);
        border: 1px solid var(--line);
        box-shadow: 0 12px 32px rgb(0 0 0 / 0.3);
        min-width: 220px;
      }
      .toast b {
        display: block;
        font-weight: 600;
      }

      /* ---------- Cortes ---------- */
      @media (max-width: 1100px) {
        .row {
          grid-template-columns: 110px 1fr 110px;
        }
        .row .c-exp,
        .row .c-type {
          display: none;
        }
      }
      @media (max-width: 900px) {
        .page {
          padding: 20px 16px 80px;
        }
        h1 {
          font-size: 30px;
        }
        .cards {
          grid-template-columns: minmax(0, 1fr);
        }
        .card.wide .fields {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .backdrop {
          place-items: end center;
          padding: 0;
        }
        .dialog,
        .dialog.big,
        .dialog.small {
          width: 100%;
          max-height: 92vh;
          border-radius: var(--radius-card) var(--radius-card) 0 0;
        }
        .grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .d-foot .btn {
          flex: 1;
        }
      }
      @media (max-width: 420px) {
        .fields,
        .card.wide .fields {
          grid-template-columns: minmax(0, 1fr);
        }
        .head-actions .btn {
          flex: 1;
        }
        .head-actions {
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="show-notes">
    <div class="proto-bar" role="toolbar" aria-label="Controles del prototipo">
      <strong>Prototipo · Ficha del carro</strong>
      <div class="seg" aria-label="Tema">
        <button data-theme-set="dark" aria-pressed="true">Oscuro</button>
        <button data-theme-set="light" aria-pressed="false">Claro</button>
      </div>
      <div class="seg" aria-label="Densidad">
        <button data-density-set="mostrador" aria-pressed="true">Mostrador</button>
        <button data-density-set="bahia" aria-pressed="false">Bahía</button>
      </div>
      <div class="seg" aria-label="Quién mira">
        <button data-role-set="admin" aria-pressed="true">Con permiso de costos</button>
        <button data-role-set="desk" aria-pressed="false">Recepción</button>
      </div>
      <div class="seg" aria-label="Notas">
        <button id="notes-toggle" aria-pressed="true">Notas</button>
      </div>
    </div>

    <main class="page" id="app"></main>
    <div id="layer"></div>
    <div id="toast-slot"></div>

    <script>
      /* ===================================================================
       * Datos de juguete. Mismos campos que `FleetVehicle` de @elite/shared,
       * más los que la propuesta agrega (marcados con «nuevo»).
       * ================================================================= */
      const TODAY = '2026-10-01';
      const CATEGORIES = {
        SEDAN: 'Sedán',
        HATCHBACK: 'Hatchback',
        SUV: 'Camioneta',
        PICKUP: 'Pick up',
        VAN: 'Microbús',
        OTHER: 'Otro',
      };
      const STATUS = {
        ACTIVE: { label: 'Disponible', tone: 'green' },
        IN_SHOP: { label: 'En taller', tone: 'amber' },
        RETIRED: { label: 'Retirado', tone: 'neutral' },
      };

      const fleet = [
        {
          id: 'v1',
          plate: 'P98175110',
          make: 'Kia',
          model: 'Rio',
          year: 2022,
          color: 'Gris',
          category: 'SEDAN',
          status: 'ACTIVE',
          dailyRate: '25.00',
          weeklyRate: '22.00',
          monthlyRate: null,
          freeKmPerDay: 200,
          extraKmPrice: '0.15',
          odometerKm: 48210,
          odometerSource: 'Recibido el 28/09/2026 · renta 0741',
          purchasePrice: '14500.00',
          purchasedAt: '2025-03-10',
          financed: true,
          downPayment: '2500.00',
          installment: '310.00',
          termMonths: 48,
          financingStartedAt: '2025-04-10',
          installmentIncludes: false, // nuevo
          insuranceMonthly: '45.00',
          gpsMonthly: '12.00',
          otherFixedMonthly: null,
          insurer: 'Seguros del Pacífico', // nuevo
          policyNumber: 'AU-4471-2025', // nuevo
          insuranceExpiresAt: '2026-10-05',
          registrationExpiresAt: '2027-03-10',
          notes: 'Tiene un rayón en la puerta trasera derecha, ya está en la hoja de golpes.',
        },
        {
          id: 'v2',
          plate: 'P53DBC',
          make: 'Kia',
          model: 'Picanto',
          year: 2024,
          color: 'Blanco',
          category: 'HATCHBACK',
          status: 'ACTIVE',
          dailyRate: '22.00',
          weeklyRate: null,
          monthlyRate: null,
          freeKmPerDay: null,
          extraKmPrice: null,
          odometerKm: 12030,
          odometerSource: 'Entregado el 30/09/2026 · renta 0744',
          purchasePrice: null,
          purchasedAt: null,
          financed: true,
          downPayment: '1800.00',
          installment: '285.00',
          termMonths: 60,
          financingStartedAt: '2024-06-01',
          installmentIncludes: true,
          insuranceMonthly: null,
          gpsMonthly: null,
          otherFixedMonthly: null,
          insurer: null,
          policyNumber: null,
          insuranceExpiresAt: '2027-06-01',
          registrationExpiresAt: '2026-11-20',
          notes: null,
        },
        {
          id: 'v3',
          plate: null,
          make: 'Mazda',
          model: 'BT-50',
          year: 2021,
          color: 'Negro',
          category: 'PICKUP',
          status: 'IN_SHOP',
          dailyRate: '45.00',
          weeklyRate: '40.00',
          monthlyRate: '35.00',
          freeKmPerDay: 250,
          extraKmPrice: '0.20',
          odometerKm: 88540,
          odometerSource: 'Anotado al darlo de alta',
          purchasePrice: '21000.00',
          purchasedAt: '2023-01-15',
          financed: false,
          downPayment: null,
          installment: null,
          termMonths: null,
          financingStartedAt: null,
          installmentIncludes: false,
          insuranceMonthly: '60.00',
          gpsMonthly: '12.00',
          otherFixedMonthly: '10.00',
          insurer: null,
          policyNumber: null,
          insuranceExpiresAt: '2027-01-15',
          registrationExpiresAt: '2027-01-15',
          notes: null,
        },
      ];

      /* ---------- Estado de la vista ---------- */
      const ui = {
        screen: 'list', // list | detail
        vehicleId: 'v1',
        role: 'admin', // admin | desk
      };
      const canSeeCosts = () => ui.role === 'admin';
      const current = () => fleet.find((v) => v.id === ui.vehicleId);

      /* ---------- Formatos ---------- */
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      const money = (v) =>
        v === null || v === ''
          ? '—'
          : '$' +
            Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const km = (n) => (n === null ? '—' : Number(n).toLocaleString('es-SV') + ' km');
      const fmtDate = (d) => {
        if (!d) return '—';
        const [y, m, dd] = d.split('-');
        return `${dd}/${m}/${y}`;
      };
      const toCivil = (masked) => {
        const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(masked.trim());
        return m ? `${m[3]}-${m[2]}-${m[1]}` : null;
      };
      const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
      const name = (v) => [v.make, v.model, v.year].filter(Boolean).join(' ');
      const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

      function financingProgress(v) {
        if (!v.financed || !v.financingStartedAt || !v.termMonths) return null;
        const [y, m] = v.financingStartedAt.split('-').map(Number);
        const [ty, tm] = TODAY.split('-').map(Number);
        const paid = Math.max(0, Math.min(v.termMonths, (ty - y) * 12 + (tm - m) + 1));
        const endIndex = m - 1 + v.termMonths - 1;
        const end = `${MONTHS[endIndex % 12]} ${y + Math.floor(endIndex / 12)}`;
        return { paid, term: v.termMonths, end, left: v.termMonths - paid };
      }

      function expiry(dateStr) {
        if (!dateStr) return '<span class="faint">Sin fecha</span>';
        const d = daysBetween(TODAY, dateStr);
        let stamp = '';
        if (d < 0) stamp = '<span class="stamp red">Vencido</span>';
        else if (d <= 7) stamp = `<span class="stamp amber">Vence en ${d} días</span>`;
        return `<span class="expiry">${fmtDate(dateStr)} ${stamp}</span>`;
      }

      /* ---------- Iconos (trazos de lucide) ---------- */
      const ICON = {
        pencil:
          '<path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        left: '<path d="m15 18-6-6 6-6"/>',
        plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
        lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
        info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
        gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
        wrench:
          '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
      };
      const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
      const pin = (n) => `<button class="pin" data-note="${n}" aria-label="Ver nota ${n}">${n}</button>`;

      /* ===================================================================
       * Pantalla: lista de la flota
       * ================================================================= */
      function renderList() {
        const rows = fleet
          .map(
            (v) => `
          <div class="row" data-open="${v.id}" role="button" tabindex="0">
            <span>${v.plate ? `<span class="plate">${esc(v.plate)}</span>` : '<span class="faint">Sin placa</span>'}</span>
            <span><b style="font-weight:600">${esc(name(v))}</b> <span class="faint dense">${esc(v.color ?? '')}</span></span>
            <span class="c-type dim">${CATEGORIES[v.category]}</span>
            <span class="num">${money(v.dailyRate)}</span>
            <span class="c-exp"><span class="stamp ${STATUS[v.status].tone}">${STATUS[v.status].label}</span></span>
          </div>`,
          )
          .join('');

        return `
          <div class="screen-head">
            <div>
              <h1>Flota</h1>
              <div class="subtitle dim">${fleet.length} carros</div>
            </div>
            <div class="head-actions">
              <button class="btn primary" data-action="new">${icon('plus')} Nuevo carro</button>
              ${pin(1)}
            </div>
          </div>
          <div class="list">
            <div class="row head"><span>Placa</span><span>Carro</span><span class="c-type">Tipo</span><span>Tarifa diaria</span><span class="c-exp">Estado</span></div>
            ${rows}
          </div>
          <p class="dim dense" style="margin-top:12px">Tocá un carro para abrir su ficha.</p>
          ${notesPanel()}`;
      }

      /* ===================================================================
       * Pantalla: ficha del carro
       * ================================================================= */
      function renderDetail() {
        const v = current();
        const s = STATUS[v.status];
        const statusButton =
          v.status === 'ACTIVE'
            ? `<button class="btn" data-action="status">${icon('wrench')} Mandar a taller</button>`
            : v.status === 'IN_SHOP'
              ? `<button class="btn" data-action="status">Volver a disponible</button>`
              : `<button class="btn" data-action="status">Volver a la flota</button>`;

        return `
          <button class="back" data-action="back">${icon('left')} Flota</button>
          <div class="screen-head">
            <div>
              <h1>${esc(name(v))}</h1>
              <div class="subtitle">
                ${v.plate ? `<span class="plate">${esc(v.plate)}</span>` : '<span class="faint">Sin placa</span>'}
                <span class="stamp ${s.tone}">${s.label}</span>
              </div>
            </div>
            <div class="head-actions">
              ${statusButton}
              <button class="btn ghost" data-action="status-all" aria-label="Más estados">Cambiar estado…</button>
              ${pin(2)}
            </div>
          </div>

          <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true">Ficha</button>
            <button class="tab" role="tab" aria-selected="false" data-action="fake-tab">Mantenimiento</button>
            <button class="tab" role="tab" aria-selected="false" data-action="fake-tab">Gastos</button>
            <button class="tab" role="tab" aria-selected="false" data-action="fake-tab">Meses</button>
          </div>

          <div class="cards">
            ${cardIdentity(v)}
            ${cardRates(v)}
            ${canSeeCosts() ? cardPurchase(v) : cardLocked('Compra y financiamiento')}
            ${canSeeCosts() ? cardFixed(v) : cardLocked('Costos fijos mensuales')}
            ${cardDocuments(v)}
            ${cardNotes(v)}
          </div>
          ${notesPanel()}`;
      }

      const editBtn = (section) =>
        `<button class="btn ghost sm" data-edit="${section}">${icon('pencil')} Editar</button>`;
      const field = (label, value, span) =>
        `<div class="field${span ? ' span' : ''}"><dt>${label}</dt><dd>${value}</dd></div>`;

      function cardIdentity(v) {
        return `
          <section class="card">
            <div class="card-head"><h2>Identificación ${pin(3)}</h2>${editBtn('identity')}</div>
            <dl class="fields">
              ${field('Marca y modelo', esc(`${v.make} ${v.model}`))}
              ${field('Año', v.year ?? '—')}
              ${field('Placa', v.plate ? `<span class="plate">${esc(v.plate)}</span>` : '<span class="faint">Sin placa</span>')}
              ${field('Color', esc(v.color ?? '—'))}
              ${field('Tipo', CATEGORIES[v.category])}
              ${field(
                'Kilometraje',
                `<span class="num">${km(v.odometerKm)}</span><div class="faint dense">${esc(v.odometerSource)}</div>`,
              )}
            </dl>
          </section>`;
      }

      function cardRates(v) {
        const weekly = v.weeklyRate ? money(v.weeklyRate) : '<span class="faint">Igual que la diaria</span>';
        const monthly = v.monthlyRate
          ? money(v.monthlyRate)
          : v.weeklyRate
            ? '<span class="faint">Igual que la de 7+</span>'
            : '<span class="faint">Igual que la diaria</span>';
        const free =
          v.freeKmPerDay === null || v.freeKmPerDay === 0
            ? 'Ilimitado'
            : `${km(v.freeKmPerDay)} por día`;
        const extra =
          v.freeKmPerDay === null || v.freeKmPerDay === 0
            ? '<span class="faint">No aplica</span>'
            : `<span class="num">${money(v.extraKmPrice)}</span> por km`;
        return `
          <section class="card">
            <div class="card-head"><h2>Tarifas y km ${pin(4)}</h2>${editBtn('rates')}</div>
            <dl class="fields">
              ${field('Tarifa diaria', `<span class="hero-rate">${money(v.dailyRate)}</span>`, true)}
              ${field('Por día, 7+ días', `<span class="num">${weekly}</span>`)}
              ${field('Por día, 30+ días', `<span class="num">${monthly}</span>`)}
              ${field('Km libres', free)}
              ${field('Km adicional', extra)}
            </dl>
          </section>`;
      }

      function cardPurchase(v) {
        const p = financingProgress(v);
        const financing = v.financed
          ? `
              ${field('Prima', `<span class="num">${money(v.downPayment)}</span>`)}
              ${field('Cuota mensual', `<span class="num">${money(v.installment)}</span>${v.installmentIncludes ? '<div class="faint dense">Incluye seguro y GPS</div>' : ''}`)}
              ${
                p
                  ? field(
                      'Avance',
                      `<div class="meter" aria-hidden="true"><span style="width:${(p.paid / p.term) * 100}%"></span></div>
                       <span class="dense">Cuota <b class="num">${p.paid}</b> de <b class="num">${p.term}</b> · faltan ${p.left} · termina en ${p.end}</span>`,
                      true,
                    )
                  : field('Plazo', v.termMonths ? `${v.termMonths} meses` : '—')
              }`
          : field('Forma de pago', 'Al contado');
        return `
          <section class="card">
            <div class="card-head"><h2>Compra y financiamiento ${pin(5)}</h2>${editBtn('purchase')}</div>
            <dl class="fields">
              ${field('Precio de compra', `<span class="num">${money(v.purchasePrice)}</span>`)}
              ${field('Fecha de compra', fmtDate(v.purchasedAt))}
              ${financing}
            </dl>
          </section>`;
      }

      function cardFixed(v) {
        const total =
          Number(v.insuranceMonthly ?? 0) + Number(v.gpsMonthly ?? 0) + Number(v.otherFixedMonthly ?? 0);
        const includes = v.financed && v.installmentIncludes;
        return `
          <section class="card">
            <div class="card-head"><h2>Costos fijos mensuales ${pin(6)}</h2>${editBtn('fixed')}</div>
            ${
              includes
                ? `<div class="note-line">${icon('info')}<span>La cuota del financiamiento ya trae el seguro y el GPS. Acá solo van los que se pagan aparte.</span></div>`
                : ''
            }
            <dl class="fields" style="${includes ? 'margin-top:14px' : ''}">
              ${includes ? '' : field('Seguro', `<span class="num">${money(v.insuranceMonthly)}</span>`)}
              ${includes ? '' : field('GPS', `<span class="num">${money(v.gpsMonthly)}</span>`)}
              ${field('Otros fijos', `<span class="num">${money(v.otherFixedMonthly)}</span>`)}
              ${field('Total al mes', `<b class="num">${money(String(total))}</b>`)}
            </dl>
          </section>`;
      }

      function cardLocked(title) {
        return `
          <section class="card">
            <div class="card-head"><h2><span class="lock">${icon('lock')}</span> ${title} ${pin(8)}</h2></div>
            <p class="dim" style="margin:0">Solo lo ve quien tiene permiso de costos de la flota.</p>
          </section>`;
      }

      function cardDocuments(v) {
        return `
          <section class="card">
            <div class="card-head"><h2>Seguro y circulación ${pin(7)}</h2>${editBtn('documents')}</div>
            <dl class="fields">
              ${field('Aseguradora', esc(v.insurer ?? '—'))}
              ${field('Póliza', v.policyNumber ? `<span class="num">${esc(v.policyNumber)}</span>` : '—')}
              ${field('Vence el seguro', expiry(v.insuranceExpiresAt))}
              ${field('Vence la tarjeta de circulación', expiry(v.registrationExpiresAt))}
            </dl>
          </section>`;
      }

      function cardNotes(v) {
        return `
          <section class="card">
            <div class="card-head"><h2>Notas</h2>${editBtn('notes')}</div>
            <p style="margin:0;white-space:pre-line" class="${v.notes ? '' : 'faint'}">${esc(v.notes ?? 'Sin notas.')}</p>
          </section>`;
      }

      /* ===================================================================
       * Notas del prototipo
       * ================================================================= */
      const NOTES = [
        [
          'Alta corta.',
          '«Nuevo carro» pide solo lo necesario para rentarlo: identificación, tarifa diaria y km al recibirlo. Lo demás se llena después en la ficha, cuando se tengan los papeles a mano.',
        ],
        [
          'El estado sale del formulario.',
          'Hoy aparece dos veces: en el modal y en los botones de la ficha. Queda solo arriba, con la acción más común a la vista y el resto en «Cambiar estado…». Retirar pide confirmación.',
        ],
        [
          'El kilometraje deja de ser un campo libre.',
          'Lo actualizan solas la entrega y la recepción, y nunca baja. Se ve aquí con su origen («Recibido el 28/09 · renta 0741»). Solo se escribe al dar de alta. El color pasa a esta tarjeta.',
        ],
        [
          'Las tarifas vacías se leen bien.',
          'En vez de $0.00 dice «Igual que la diaria». El km adicional dice «No aplica» si el km es ilimitado, y en el formulario se esconde.',
        ],
        [
          'Financiamiento con avance.',
          'Además de prima y cuota, se ve en qué cuota va y cuándo termina. Nuevo interruptor: «La cuota incluye seguro y GPS».',
        ],
        [
          'Sin cobrar dos veces el seguro.',
          'Si la cuota ya trae seguro y GPS, esos campos se esconden: así la rentabilidad no los cuenta dos veces. Se agrega el total al mes.',
        ],
        [
          'Seguro con aseguradora y póliza (nuevo).',
          'Es lo primero que se busca cuando hay un choque. Los vencimientos se marcan en ámbar a 7 días y en rojo si ya vencieron.',
        ],
        [
          'Recepción no ve los números.',
          'Con el conmutador «Recepción» arriba: compra, financiamiento y costos quedan bajo llave. Sería un permiso nuevo (p. ej. «fleet.costs»), nunca un rol fijo.',
        ],
      ];
      function notesPanel() {
        return `
          <aside class="notes-panel" aria-label="Qué cambia">
            <h3>Qué cambia respecto a hoy</h3>
            <ol>${NOTES.map(
              ([t, d], i) =>
                `<li id="note-${i + 1}"><span class="pin" style="display:inline-grid">${i + 1}</span><span><b>${t}</b> <span class="dim">${d}</span></span></li>`,
            ).join('')}</ol>
            <p class="dense faint" style="margin:16px 0 0">
              Para comparar: <button class="btn ghost sm" data-action="old">Ver el modal de hoy</button>
            </p>
          </aside>`;
      }

      /* ===================================================================
       * Diálogos
       * ================================================================= */
      const input = (id, label, value, opts = {}) => `
        <div class="${opts.span ? 'span' : ''}">
          <label class="box" for="f-${id}">
            <span>${label}</span>
            <input id="f-${id}" name="${id}" value="${esc(value ?? '')}" placeholder="${esc(opts.ph ?? '')}"
              ${opts.mono ? 'class="m"' : ''} inputmode="${opts.mode ?? 'text'}" autocomplete="off" />
          </label>
          ${opts.help ? `<p class="dense faint" style="margin:4px 0 0">${opts.help}</p>` : ''}
          <p class="err hidden" data-err="${id}"></p>
        </div>`;
      const moneyInput = (id, label, value, opts = {}) =>
        input(id, label, value, { mono: true, mode: 'decimal', ph: '0.00', ...opts });
      const dateInput = (id, label, value, opts = {}) =>
        input(id, label, value ? fmtDate(value) : '', { mono: true, mode: 'numeric', ph: 'dd/mm/aaaa', ...opts });
      const select = (id, label, value, options) => `
        <div>
          <label class="box" for="f-${id}">
            <span>${label}</span>
            <select id="f-${id}" name="${id}">
              ${Object.entries(options)
                .map(([k, l]) => `<option value="${k}" ${k === value ? 'selected' : ''}>${l}</option>`)
                .join('')}
            </select>
          </label>
        </div>`;
      const switchRow = (id, label, help, checked) => `
        <div class="switch-row span">
          <label for="f-${id}">${label}<small>${help}</small></label>
          <button type="button" class="switch" role="switch" id="f-${id}" data-switch="${id}" aria-checked="${checked}"></button>
        </div>`;

      const SECTIONS = {
        identity: {
          title: 'Identificación',
          body: (v) => `
            <div class="grid">
              ${input('make', 'Marca', v.make, { ph: 'Kia' })}
              ${input('model', 'Modelo', v.model, { ph: 'Rio' })}
              ${input('plate', 'Placa (opcional)', v.plate, { mono: true, ph: 'P53DBC' })}
              ${input('year', 'Año', v.year, { mode: 'numeric', ph: '2022' })}
              ${input('color', 'Color', v.color, { ph: 'Gris' })}
              ${select('category', 'Tipo', v.category, CATEGORIES)}
            </div>
            <dl class="readonly">
              <dt>Kilometraje</dt>
              <dd><span class="num">${km(v.odometerKm)}</span> <span class="faint dense">· lo actualizan la entrega y la recepción</span></dd>
            </dl>`,
        },
        rates: {
          title: 'Tarifas y km',
          body: (v) => `
            <div class="grid">
              ${moneyInput('dailyRate', 'Tarifa diaria ($)', v.dailyRate, { span: true })}
              ${moneyInput('weeklyRate', 'Por día, 7+ días ($)', v.weeklyRate, { ph: 'Igual que la diaria' })}
              ${moneyInput('monthlyRate', 'Por día, 30+ días ($)', v.monthlyRate, { ph: 'Igual que la de 7+' })}
              ${switchRow('limitedKm', 'Km limitado', 'Si está apagado, el carro sale con km libre.', !(v.freeKmPerDay === null || v.freeKmPerDay === 0))}
              <div class="span grid" data-show-if="limitedKm" style="margin-top:0">
                ${input('freeKmPerDay', 'Km libres por día', v.freeKmPerDay, { mode: 'numeric', ph: '200' })}
                ${moneyInput('extraKmPrice', 'Precio por km adicional ($)', v.extraKmPrice)}
              </div>
            </div>`,
        },
        purchase: {
          title: 'Compra y financiamiento',
          body: (v) => `
            <div class="grid">
              ${moneyInput('purchasePrice', 'Precio de compra ($)', v.purchasePrice)}
              ${dateInput('purchasedAt', 'Fecha de compra', v.purchasedAt)}
              ${switchRow('financed', 'Financiado', 'Prima y cuotas entran al costo del carro.', v.financed)}
              <div class="span grid" data-show-if="financed" style="margin-top:0">
                ${moneyInput('downPayment', 'Prima ($)', v.downPayment)}
                ${moneyInput('installment', 'Cuota mensual ($)', v.installment)}
                ${input('termMonths', 'Plazo (meses)', v.termMonths, { mode: 'numeric', ph: '48' })}
                ${dateInput('financingStartedAt', 'Primera cuota', v.financingStartedAt, { help: 'Si la dejás vacía, se toma la fecha de compra.' })}
                ${switchRow('installmentIncludes', 'La cuota incluye seguro y GPS', 'Así no se cuentan dos veces en la rentabilidad.', v.installmentIncludes)}
              </div>
            </div>`,
        },
        fixed: {
          title: 'Costos fijos mensuales',
          body: (v) => {
            const includes = v.financed && v.installmentIncludes;
            return `
              ${includes ? `<div class="note-line" style="margin:0">${icon('info')}<span>La cuota ya trae el seguro y el GPS. Si alguno se paga aparte, cambialo en «Compra y financiamiento».</span></div>` : ''}
              <div class="grid">
                ${includes ? '' : moneyInput('insuranceMonthly', 'Seguro ($)', v.insuranceMonthly)}
                ${includes ? '' : moneyInput('gpsMonthly', 'GPS ($)', v.gpsMonthly)}
                ${moneyInput('otherFixedMonthly', 'Otros fijos ($)', v.otherFixedMonthly, { help: 'Parqueo, lavado mensual, lo que se pague cada mes.' })}
              </div>`;
          },
        },
        documents: {
          title: 'Seguro y circulación',
          body: (v) => `
            <div class="grid">
              ${input('insurer', 'Aseguradora', v.insurer, { ph: 'Seguros del Pacífico' })}
              ${input('policyNumber', 'Número de póliza', v.policyNumber, { mono: true, ph: 'AU-0000-2026' })}
              ${dateInput('insuranceExpiresAt', 'Vence el seguro', v.insuranceExpiresAt)}
              ${dateInput('registrationExpiresAt', 'Vence la tarjeta de circulación', v.registrationExpiresAt)}
            </div>`,
        },
        notes: {
          title: 'Notas',
          body: (v) => `
            <label class="box" for="f-notes"><span>Notas</span>
              <textarea id="f-notes" name="notes" placeholder="Lo que haya que recordar de este carro">${esc(v.notes ?? '')}</textarea>
            </label>`,
        },
      };

      const layer = document.getElementById('layer');
      let lastFocus = null;

      function openDialog(html, size = '') {
        lastFocus = document.activeElement;
        layer.innerHTML = `<div class="backdrop" data-close-backdrop><div class="dialog ${size}" role="dialog" aria-modal="true">${html}</div></div>`;
        wireSwitches();
        const first = layer.querySelector('input, select, textarea, .status-opt, .btn.primary');
        first?.focus();
      }
      function closeDialog() {
        layer.innerHTML = '';
        lastFocus?.focus?.();
      }
      const head = (title, sub) => `
        <div class="d-head">
          <div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>
          <button class="btn ghost sm" data-action="close" aria-label="Cerrar">${icon('x')}</button>
        </div>`;
      const foot = (primary, extra = '') => `
        <div class="d-foot">${extra}<button class="btn" data-action="close">Cancelar</button>${primary}</div>`;

      function wireSwitches() {
        layer.querySelectorAll('[data-switch]').forEach((sw) => {
          const sync = () => {
            const on = sw.getAttribute('aria-checked') === 'true';
            layer
              .querySelectorAll(`[data-show-if="${sw.dataset.switch}"]`)
              .forEach((el) => el.classList.toggle('hidden', !on));
          };
          sw.addEventListener('click', () => {
            sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true'));
            sync();
          });
          sync();
        });
      }

      function openSection(key) {
        const v = current();
        const s = SECTIONS[key];
        openDialog(
          `<form data-form="${key}" novalidate style="display:contents">
            ${head(s.title, esc(name(v)))}
            <div class="d-body">${s.body(v)}</div>
            ${foot('<button class="btn primary" type="submit">Guardar</button>')}
          </form>`,
          key === 'notes' ? 'small' : '',
        );
      }

      function openNew() {
        openDialog(
          `<form data-form="new" novalidate style="display:contents">
            ${head('Nuevo carro', 'Con esto ya se puede rentar. Tarifas por semana, compra, seguro y vencimientos se llenan en la ficha.')}
            <div class="d-body">
              <div class="grid" style="margin-top:0">
                ${input('make', 'Marca', '', { ph: 'Kia' })}
                ${input('model', 'Modelo', '', { ph: 'Rio' })}
                ${input('plate', 'Placa (opcional)', '', { mono: true, ph: 'P53DBC' })}
                ${input('year', 'Año', '', { mode: 'numeric', ph: '2022' })}
                ${input('color', 'Color', '', { ph: 'Gris' })}
                ${select('category', 'Tipo', 'SEDAN', CATEGORIES)}
                ${moneyInput('dailyRate', 'Tarifa diaria ($)', '')}
                ${input('odometerKm', 'Kilometraje al recibirlo', '', { mode: 'numeric', ph: '48000', help: 'Después lo actualizan solas la entrega y la recepción.' })}
              </div>
            </div>
            ${foot('<button class="btn primary" type="submit">Crear carro</button>')}
          </form>`,
        );
      }

      function openStatus() {
        const v = current();
        const opts = [
          ['ACTIVE', 'Disponible', 'Se puede rentar y aparece en «¿Qué hay libre?».'],
          ['IN_SHOP', 'En taller', 'No se ofrece mientras esté en el taller.'],
          ['RETIRED', 'Retirado', 'Sale de la flota. Su historia y sus reportes se quedan.'],
        ];
        openDialog(
          `${head('Cambiar estado', esc(name(v)))}
           <div class="d-body">
             <div class="status-options">
               ${opts
                 .map(
                   ([k, l, d]) => `
                 <button class="status-opt" data-set-status="${k}" aria-pressed="${k === v.status}">
                   <span class="stamp ${STATUS[k].tone}" style="margin-top:1px">${l}</span>
                   <span class="dim dense">${d}</span>
                 </button>`,
                 )
                 .join('')}
             </div>
           </div>
           ${foot('')}`,
          'small',
        );
      }

      function confirmRetire() {
        const v = current();
        openDialog(
          `${head('¿Retirar este carro?', esc(name(v)))}
           <div class="d-body"><p style="margin:0">Deja de ofrecerse en rentas nuevas. Sus rentas, gastos y reportes se quedan, y se puede volver a la flota cuando quieras.</p></div>
           ${foot('<button class="btn destructive-solid" data-action="do-retire">Retirar de la flota</button>')}`,
          'small',
        );
      }

      /* El modal de hoy, para comparar lado a lado. */
      function openOld() {
        const v = current();
        openDialog(
          `${head('Editar carro', esc(name(v)) + ' · <span class="faint">así está hoy</span>')}
           <div class="d-body">
             <div class="section"><h3>Identificación</h3><div class="grid">
               ${input('o1', 'Marca', v.make)}${input('o2', 'Modelo', v.model)}${input('o3', 'Placa (opcional)', v.plate, { mono: true })}
               ${input('o4', 'Año', v.year)}${input('o5', 'Color', v.color)}${select('o6', 'Tipo', v.category, CATEGORIES)}
             </div></div>
             <div class="section"><h3>Tarifas y km</h3><p class="dense dim hint">La semanal y la mensual son por día y aplican desde 7 y 30 días.</p><div class="grid">
               ${moneyInput('o7', 'Tarifa diaria ($)', v.dailyRate)}${moneyInput('o8', 'Por día, 7+ días ($)', '')}
               ${moneyInput('o9', 'Por día, 30+ días ($)', '')}${input('o10', 'Km libres por día (vacío = ilimitado)', '')}
               ${moneyInput('o11', 'Km adicional ($)', '')}${input('o12', 'Kilometraje actual', v.odometerKm)}
             </div></div>
             <div class="section"><h3>Compra y financiamiento</h3><div class="grid">
               ${moneyInput('o13', 'Precio de compra ($)', '')}${dateInput('o14', 'Fecha de compra', '')}
               ${switchRow('o15', 'Financiado', 'Prima, cuota y plazo entran al costo del carro.', true)}
               <div class="span grid" data-show-if="o15" style="margin-top:0">
                 ${moneyInput('o16', 'Prima ($)', '')}${moneyInput('o17', 'Cuota mensual ($)', '')}
                 ${input('o18', 'Plazo (meses)', '')}${dateInput('o19', 'Inicio del financiamiento', '')}
               </div>
             </div></div>
             <div class="section"><h3>Costos fijos mensuales</h3><div class="grid">
               ${moneyInput('o20', 'Seguro ($)', '')}${moneyInput('o21', 'GPS ($)', '')}${moneyInput('o22', 'Otros fijos ($)', '')}
             </div></div>
             <div class="section"><h3>Vencimientos</h3><div class="grid">
               ${dateInput('o23', 'Vence el seguro', '')}${dateInput('o24', 'Vence la tarjeta de circulación', '')}
             </div></div>
             <div class="section"><h3>Estado y notas</h3><div class="grid">
               <div class="span">${select('o25', 'Estado', v.status, Object.fromEntries(Object.entries(STATUS).map(([k, s]) => [k, s.label])))}</div>
               <div class="span"><label class="box"><span>Notas</span><textarea></textarea></label></div>
             </div></div>
           </div>
           ${foot('<button class="btn primary" data-action="close">Guardar cambios</button>')}`,
          'big',
        );
      }

      /* ---------- Guardar ---------- */
      function readForm(form) {
        const out = {};
        form.querySelectorAll('input[name], select[name], textarea[name]').forEach((el) => {
          out[el.name] = el.value.trim();
        });
        form.querySelectorAll('[data-switch]').forEach((sw) => {
          out[sw.dataset.switch] = sw.getAttribute('aria-checked') === 'true';
        });
        return out;
      }
      function showErrors(form, errors) {
        form.querySelectorAll('[data-err]').forEach((p) => p.classList.add('hidden'));
        form.querySelectorAll('.box.invalid').forEach((b) => b.classList.remove('invalid'));
        let first = null;
        for (const [k, msg] of Object.entries(errors)) {
          const p = form.querySelector(`[data-err="${k}"]`);
          const el = form.querySelector(`[name="${k}"]`);
          if (p) {
            p.textContent = msg;
            p.classList.remove('hidden');
          }
          el?.closest('.box')?.classList.add('invalid');
          first ??= el;
        }
        first?.focus();
        return Object.keys(errors).length === 0;
      }
      const nOrNull = (s) => (s === '' || s === undefined ? null : s);
      const isMoney = (s) => s === '' || /^\d+(\.\d{1,2})?$/.test(s);

      function save(key, form) {
        const d = readForm(form);
        const errors = {};
        const v = key === 'new' ? null : current();

        if ('make' in d && !d.make) errors.make = 'Escribí la marca.';
        if ('model' in d && !d.model) errors.model = 'Escribí el modelo.';
        if ('dailyRate' in d && (!d.dailyRate || !isMoney(d.dailyRate)))
          errors.dailyRate = 'Escribí la tarifa diaria, por ejemplo 25.00.';
        for (const k of ['weeklyRate', 'monthlyRate', 'extraKmPrice', 'purchasePrice', 'downPayment', 'installment', 'insuranceMonthly', 'gpsMonthly', 'otherFixedMonthly'])
          if (k in d && !isMoney(d[k])) errors[k] = 'Escribí un monto, por ejemplo 25.00.';
        for (const k of ['purchasedAt', 'financingStartedAt', 'insuranceExpiresAt', 'registrationExpiresAt'])
          if (k in d && d[k] && !toCivil(d[k])) errors[k] = 'Usá dd/mm/aaaa.';
        if ('odometerKm' in d && d.odometerKm && !/^\d+$/.test(d.odometerKm))
          errors.odometerKm = 'Tiene que ser un número entero.';
        if (!showErrors(form, errors)) return;

        const civil = (k) => (d[k] ? toCivil(d[k]) : null);
        let target = v;

        if (key === 'new') {
          target = {
            id: 'v' + (fleet.length + 1),
            status: 'ACTIVE',
            weeklyRate: null,
            monthlyRate: null,
            freeKmPerDay: null,
            extraKmPrice: null,
            purchasePrice: null,
            purchasedAt: null,
            financed: false,
            downPayment: null,
            installment: null,
            termMonths: null,
            financingStartedAt: null,
            installmentIncludes: false,
            insuranceMonthly: null,
            gpsMonthly: null,
            otherFixedMonthly: null,
            insurer: null,
            policyNumber: null,
            insuranceExpiresAt: null,
            registrationExpiresAt: null,
            notes: null,
            odometerKm: Number(d.odometerKm || 0),
            odometerSource: 'Anotado al darlo de alta',
          };
          fleet.push(target);
        }

        if (key === 'new' || key === 'identity')
          Object.assign(target, {
            make: d.make,
            model: d.model,
            plate: d.plate ? d.plate.toUpperCase().replace(/\s+/g, '') : null,
            year: d.year ? Number(d.year) : null,
            color: nOrNull(d.color),
            category: d.category,
          });
        if (key === 'new') target.dailyRate = Number(d.dailyRate).toFixed(2);
        if (key === 'rates')
          Object.assign(target, {
            dailyRate: Number(d.dailyRate).toFixed(2),
            weeklyRate: nOrNull(d.weeklyRate),
            monthlyRate: nOrNull(d.monthlyRate),
            freeKmPerDay: d.limitedKm && d.freeKmPerDay ? Number(d.freeKmPerDay) : null,
            extraKmPrice: d.limitedKm ? nOrNull(d.extraKmPrice) : null,
          });
        if (key === 'purchase')
          Object.assign(target, {
            purchasePrice: nOrNull(d.purchasePrice),
            purchasedAt: civil('purchasedAt'),
            financed: d.financed,
            downPayment: d.financed ? nOrNull(d.downPayment) : null,
            installment: d.financed ? nOrNull(d.installment) : null,
            termMonths: d.financed && d.termMonths ? Number(d.termMonths) : null,
            financingStartedAt: d.financed ? civil('financingStartedAt') || civil('purchasedAt') : null,
            installmentIncludes: d.financed && d.installmentIncludes,
          });
        if (key === 'fixed')
          Object.assign(target, {
            ...('insuranceMonthly' in d ? { insuranceMonthly: nOrNull(d.insuranceMonthly) } : {}),
            ...('gpsMonthly' in d ? { gpsMonthly: nOrNull(d.gpsMonthly) } : {}),
            otherFixedMonthly: nOrNull(d.otherFixedMonthly),
          });
        if (key === 'documents')
          Object.assign(target, {
            insurer: nOrNull(d.insurer),
            policyNumber: nOrNull(d.policyNumber),
            insuranceExpiresAt: civil('insuranceExpiresAt'),
            registrationExpiresAt: civil('registrationExpiresAt'),
          });
        if (key === 'notes') target.notes = nOrNull(d.notes);

        closeDialog();
        if (key === 'new') {
          ui.screen = 'detail';
          ui.vehicleId = target.id;
          toast('Carro creado', name(target));
        } else {
          toast('Guardado', SECTIONS[key].title);
        }
        render();
      }

      function setStatus(status) {
        if (status === 'RETIRED' && current().status !== 'RETIRED') return confirmRetire();
        current().status = status;
        closeDialog();
        toast('Estado cambiado', STATUS[status].label);
        render();
      }

      /* ---------- Toast ---------- */
      let toastTimer;
      function toast(title, desc) {
        const slot = document.getElementById('toast-slot');
        slot.innerHTML = `<div class="toast" role="status"><b>${esc(title)}</b><span class="dim dense">${esc(desc)}</span></div>`;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (slot.innerHTML = ''), 2600);
      }

      /* ===================================================================
       * Render y eventos
       * ================================================================= */
      function render() {
        document.getElementById('app').innerHTML = ui.screen === 'list' ? renderList() : renderDetail();
      }

      document.addEventListener('click', (e) => {
        const t = e.target.closest('button, [data-open], [data-close-backdrop]');
        if (!t) return;

        if (t.matches('[data-close-backdrop]') && e.target === t) return closeDialog();
        if (t.dataset.open) {
          ui.screen = 'detail';
          ui.vehicleId = t.dataset.open;
          render();
          window.scrollTo(0, 0);
          return;
        }
        if (t.dataset.edit) return openSection(t.dataset.edit);
        if (t.dataset.setStatus) return setStatus(t.dataset.setStatus);
        if (t.dataset.note) {
          const li = document.getElementById('note-' + t.dataset.note);
          li?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          li?.classList.remove('flash');
          void li?.offsetWidth;
          li?.classList.add('flash');
          return;
        }
        if (t.dataset.themeSet) {
          document.documentElement.dataset.theme = t.dataset.themeSet;
          document.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
          return;
        }
        if (t.dataset.densitySet) {
          document.documentElement.dataset.density = t.dataset.densitySet;
          document.querySelectorAll('[data-density-set]').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
          return;
        }
        if (t.dataset.roleSet) {
          ui.role = t.dataset.roleSet;
          document.querySelectorAll('[data-role-set]').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
          render();
          return;
        }
        if (t.id === 'notes-toggle') {
          const on = document.body.classList.toggle('show-notes');
          t.setAttribute('aria-pressed', String(on));
          return;
        }

        switch (t.dataset.action) {
          case 'close':
            return closeDialog();
          case 'new':
            return openNew();
          case 'back':
            ui.screen = 'list';
            return render();
          case 'status': {
            const v = current();
            return setStatus(v.status === 'ACTIVE' ? 'IN_SHOP' : 'ACTIVE');
          }
          case 'status-all':
            return openStatus();
          case 'do-retire':
            current().status = 'RETIRED';
            closeDialog();
            toast('Carro retirado', name(current()));
            return render();
          case 'old':
            return openOld();
          case 'fake-tab':
            return toast('Fuera del prototipo', 'Esa pestaña no cambia con esta propuesta.');
        }
      });

      document.addEventListener('submit', (e) => {
        const form = e.target.closest('[data-form]');
        if (!form) return;
        e.preventDefault();
        save(form.dataset.form, form);
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && layer.innerHTML) closeDialog();
        if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open]')) {
          e.preventDefault();
          e.target.click();
        }
      });

      /* La máscara de fecha: dd/mm/aaaa mientras se escribe. */
      document.addEventListener('input', (e) => {
        if (e.target.placeholder !== 'dd/mm/aaaa') return;
        const digits = e.target.value.replace(/\D/g, '').slice(0, 8);
        e.target.value = [digits.slice(0, 2), digits.slice(2, 4), digits.slice(4)].filter(Boolean).join('/');
      });

      if (matchMedia('(max-width: 900px), (pointer: coarse)').matches) {
        document.querySelector('[data-density-set="bahia"]').click();
      }
      render();
    </script>
  </body>
</html>
