      };
      const fmtTime = (d) => d.toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit' });
      const fmtDate = (d) => d.toLocaleDateString('es-SV', { weekday: 'short', day: 'numeric', month: 'short' });
      const amt = (c) => (c / 100).toFixed(2);
      const parseMoney = (raw) => Math.round((parseFloat(String(raw).replace(/[^0-9.]/g, '')) || 0) * 100);
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

      // =====================================================================
      // Kardex: el único camino que toca la existencia (RN-2, RN-3, RN-13).
      // =====================================================================
      function move(itemId, type, delta, extra = {}) {
        const it = item(itemId);
        if (!it.active && type !== 'ADJUSTMENT') throw new Error('ITEM_INACTIVE');
        const after = it.stock + delta;
        if (after < 0) {
          const e = new Error('INSUFFICIENT_STOCK');
          e.available = it.stock;
          throw e;
        }
        const wasAbove = it.min > 0 && it.stock > it.min;
        if (type === 'ENTRY' && extra.cost != null && delta > 0) {
          it.avgCost = Math.round((it.avgCost * it.stock + extra.cost * delta) / (it.stock + delta));
        }
        it.stock = after;
        MOVES.push(mv(itemId, type, delta, after, { ...extra, at: Date.now() - new Date().setHours(0, 0, 0, 0) }));
        // Aviso una vez por cruce (RN-13).
        if (wasAbove && it.min > 0 && after <= it.min) {
          state.alerts.unshift({ id: 'a' + seq++, itemId, stock: after, min: it.min });
          // Entra al cajón con su filtro «Inventario» y suena una vez.
          NOTES.unshift({ id: 'n' + seq++, at: new Date(), type: 'low_stock', itemId, stock: after, min: it.min, read: false });
          ringBell();
        }
      }

      // =====================================================================
      // Render
      // =====================================================================
      function render() {
        const page = $('#page');
        const bar = $('#bottombar');
        bar.className = 'bottombar';
        bar.innerHTML = '';
        if (state.screen === 'list') page.innerHTML = renderList();
        else if (state.screen === 'detail') page.innerHTML = renderDetail();
        else if (state.screen === 'moves') page.innerHTML = renderMoves();
        else if (state.screen === 'sales') page.innerHTML = renderSales();
        else if (state.screen === 'sale') page.innerHTML = renderSaleDetail();
        else if (state.screen === 'sale-new') page.innerHTML = renderSaleNew();
        else page.innerHTML = renderWash();
        const navKey = state.screen === 'sale' ? 'sales' : state.screen;
        document.querySelectorAll('#screen button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === navKey)));
        bind();
        renderBell();
        if (state.drawer.open) renderDrawer();
      }

      function alertsHtml() {
        return state.alerts
          .map((a) => {
            const it = item(a.itemId);
            return `<div class="callout bad" role="status">${ICONS.bell}<div><b>${esc(it.name)}</b> se está acabando: quedan ${qty(a.stock)} (mínimo ${qty(a.min)}). Entró al cajón de avisos, filtro «Inventario». <button class="ref-link" data-open-drawer="stock">Ver avisos</button></div><button class="x" data-dismiss="${a.id}" aria-label="Cerrar aviso">${ICONS.x}</button></div>`;
          })
          .join('');
      }

      // ---- /inventory ----
      function renderList() {
        const products = ITEMS.filter((i) => i.kind === 'PRODUCT' && (state.showInactive || i.active));
        const supplies = ITEMS.filter((i) => i.kind === 'SUPPLY' && (state.showInactive || i.active));
        const all = state.tab === 'PRODUCT' ? products : supplies;
        const q = state.search.trim().toLowerCase();
        const rows = all.filter((i) => (!q || i.name.toLowerCase().includes(q) || i.code.toLowerCase().includes(q)) && (!state.lowOnly || isLow(i)));
        const lowCount = ITEMS.filter((i) => i.active && isLow(i)).length;
        const isP = state.tab === 'PRODUCT';
        const cols = isP ? '110px minmax(0,2fr) minmax(0,1.2fr) 130px 90px 90px 120px' : '110px minmax(0,2fr) minmax(0,1.2fr) 130px 90px 120px';

        return `
          <header class="page-head">
            <div>
              <h1 class="t-display">Inventario</h1>
              <p class="sub">Productos que se venden en el lavado e insumos que se despachan al equipo.</p>
            </div>
            <div class="actions">
              <button class="btn" data-open="entry">${ICONS.down} Registrar entrada</button>
              <button class="btn" data-open="dispatch">${ICONS.out} Despachar</button>
              <button class="btn primary" data-open="new">${ICONS.plus} Nuevo artículo</button>
            </div>
          </header>
          ${alertsHtml()}
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" data-tab="PRODUCT" aria-selected="${isP}">Productos <span class="cnt">${products.length}</span></button>
            <button class="tab" role="tab" data-tab="SUPPLY" aria-selected="${!isP}">Insumos <span class="cnt">${supplies.length}</span></button>
          </div>
          <div class="filters">
            <div class="field"><label for="q">Buscar</label><input id="q" placeholder="Nombre o código" value="${esc(state.search)}" /></div>
            <button class="chip-toggle" id="low" aria-pressed="${state.lowOnly}"><span class="dot"></span>Bajo mínimo${lowCount ? ` · ${lowCount}` : ''}</button>
            <button class="chip-toggle" id="inactive" aria-pressed="${state.showInactive}">Ver inactivos</button>
          </div>
          ${
            rows.length
              ? `<div class="table" style="--cols:${cols}">
              <div class="thead"><div>Código</div><div>Artículo</div><div>Categoría</div><div class="cell r">Existencia</div><div class="cell r">Mínimo</div>${isP ? '<div class="cell r">Precio</div>' : ''}<div>Estado</div></div>
              ${rows.map((i) => listRow(i, isP)).join('')}
            </div>`
              : `<div class="empty"><div class="t-title">${state.lowOnly ? 'Nada bajo mínimo' : 'Sin artículos'}</div><p>${state.lowOnly ? 'Cuando un artículo llegue a su mínimo va a aparecer acá.' : 'Cuando des de alta un artículo va a aparecer acá.'}</p></div>`
          }
        `;
      }
      function listRow(i, isP) {
        const low = isLow(i);
        const status = !i.active ? '<span class="stamp neutral">Inactivo</span>' : low ? '<span class="stamp red">Bajo mínimo</span>' : '<span class="stamp green">Activo</span>';
        return `<div class="row" data-detail="${i.id}" role="link" tabindex="0">
          <div class="cell"><span class="code">${i.code}</span></div>
          <div class="cell full"><span class="name">${esc(i.name)}</span><span class="sub">${esc(i.unit)}</span></div>
          <div class="cell hide-compact dim">${esc(catName(i.cat))}</div>
          <div class="cell r"><span class="l">Existencia</span><span class="num ${low ? 'neg' : ''}">${qty(i.stock)}</span> <span class="faint t-dense">${esc(i.unit)}</span></div>
          <div class="cell r"><span class="l">Mínimo</span><span class="num dim">${qty(i.min)}</span></div>
          ${isP ? `<div class="cell r"><span class="l">Precio</span><span class="num">${money(i.price)}</span></div>` : ''}
          <div class="cell">${status}</div>
        </div>`;
      }

      // ---- /inventory/:id ----
      function renderDetail() {
        const i = item(state.detailId);
        const moves = MOVES.filter((m) => m.itemId === i.id).sort((a, b) => b.at - a.at);
        const low = isLow(i);
        const isP = i.kind === 'PRODUCT';
        return `
          <button class="back" data-go="list">${ICONS.back} Inventario</button>
          <header class="page-head">
            <div>
              <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
                <span class="code">${i.code}</span>
                <span class="stamp ${isP ? 'flame' : 'amber'}">${isP ? 'Producto' : 'Insumo'}</span>
                ${!i.active ? '<span class="stamp neutral">Inactivo</span>' : low ? '<span class="stamp red">Bajo mínimo</span>' : ''}
              </div>
              <h1 class="t-display">${esc(i.name)}</h1>
              <p class="sub">${esc(catName(i.cat))} · se mide en ${esc(i.unit)}</p>
            </div>
            <div class="actions">
              <button class="btn" data-open="entry" data-item="${i.id}">${ICONS.down} Entrada</button>
              <button class="btn" data-open="dispatch" data-item="${i.id}">${ICONS.out} Despachar</button>
              <button class="btn" data-open="adjust" data-item="${i.id}">Ajustar</button>
              <button class="btn ghost" data-open="edit" data-item="${i.id}">Editar</button>
            </div>
          </header>
          ${alertsHtml()}
          <div class="stats">
            <div class="stat ${low ? 'low' : ''}"><div class="k">Existencia</div><div class="v"><p class="t-figure">${qty(i.stock)}</p><small>${esc(i.unit)}</small></div></div>
            <div class="stat"><div class="k">Mínimo</div><div class="v"><p class="t-figure">${qty(i.min)}</p><small>${esc(i.unit)}</small></div></div>
            <div class="stat"><div class="k">Costo promedio</div><div class="v"><p class="t-figure">${money(i.avgCost)}</p><small>por ${esc(i.unit)}</small></div></div>
            ${isP ? `<div class="stat"><div class="k">Precio de venta</div><div class="v"><p class="t-figure">${money(i.price)}</p><small>IVA incl.</small></div></div>` : `<div class="stat"><div class="k">Valor en bodega</div><div class="v"><p class="t-figure">${money(i.avgCost * i.stock)}</p></div></div>`}
          </div>
          <section class="card">
            <div class="card-title"><h2 class="t-title">Kardex</h2><span class="aside">${moves.length} movimientos · nunca se editan, se corrigen con otro</span></div>
            ${kardexTable(moves, false)}
          </section>
        `;
      }

      function kardexTable(moves, withItem) {
        if (!moves.length) return '<div class="empty"><div class="t-title">Sin movimientos</div><p>La primera entrada va a aparecer acá.</p></div>';
        const cols = withItem
          ? '124px 110px minmax(0,1.6fr) 90px 80px minmax(0,1.4fr) minmax(0,1.6fr)'
          : '124px 110px 90px 80px minmax(0,1.4fr) minmax(0,1.8fr)';
        return `<div class="table" style="--cols:${cols}">
          <div class="thead"><div>Fecha y hora</div><div>Tipo</div>${withItem ? '<div>Artículo</div>' : ''}<div class="cell r">Cantidad</div><div class="cell r">Saldo</div><div>Quién</div><div>Detalle</div></div>
          ${moves.map((m) => kardexRow(m, withItem)).join('')}
        </div>`;
      }
      function kardexRow(m, withItem) {
        const meta = MOVE_META[m.type];
        const it = item(m.itemId);
        const who = m.by ? esc(m.by) : m.byEmp ? `${esc(m.byEmp)} <span class="faint t-dense">· pista</span>` : '—';
        let detail = '';
        if (m.type === 'DISPATCH') detail = `a <b>${esc(m.emp)}</b>${m.reason ? ` · ${esc(m.reason)}` : ''}`;
        else if (m.type === 'SALE' || m.type === 'SALE_RETURN') {
          // Cuelga de un lavado o de una venta suelta, nunca de los dos (RN-20).
          const ref = m.sale
            ? `venta <button class="ref-link" data-sale="${m.sale}" aria-label="Abrir la venta ${m.sale}">${m.sale}</button>`
            : `lavado <button class="ref-link" data-wash="${m.wo}" aria-label="Abrir el lavado ${m.wo}">${m.wo}</button>`;
          detail = `${ref}${m.reason ? ` · ${esc(m.reason)}` : ''}`;
        }
        else if (m.type === 'ENTRY') detail = `${m.cost != null ? `${money(m.cost)} c/u` : ''}${m.ref ? ` · ${esc(m.ref)}` : ''}`;
        else detail = esc(m.reason ?? '');
        return `<div class="row static">
          <div class="cell"><span class="name">${fmtDate(m.at)}</span><span class="sub">${fmtTime(m.at)}${['Hoy', 'Ayer'].includes(fmtDay(m.at)) ? ` · ${fmtDay(m.at)}` : ''}</span></div>
          <div class="cell"><span class="stamp ${meta.tone}">${meta.label}</span></div>
          ${withItem ? `<div class="cell" data-detail="${it.id}" role="link" tabindex="0" style="cursor:pointer"><span class="name">${esc(it.name)}</span><span class="sub code">${it.code}</span></div>` : ''}
          <div class="cell r"><span class="l">Cantidad</span><span class="num ${m.qty > 0 ? 'pos' : 'neg'}">${m.qty > 0 ? '+' : '−'}${qty(Math.abs(m.qty))}</span></div>
          <div class="cell r"><span class="l">Saldo</span><span class="num">${qty(m.after)}</span></div>
          <div class="cell"><span class="l">Quién</span>${who}</div>
          <div class="cell full wrap t-dense dim">${detail}</div>
        </div>`;
      }

      // ---- /inventory/movements ----
      function renderMoves() {
        const f = state.moveFilter;
        const q = f.q.trim().toLowerCase();
        const rows = MOVES.filter((m) => (!f.type || m.type === f.type) && (!f.emp || m.emp === f.emp) && (!q || item(m.itemId).name.toLowerCase().includes(q) || (m.wo ?? '').toLowerCase().includes(q) || (m.sale ?? '').toLowerCase().includes(q))).sort((a, b) => b.at - a.at);
        const dispatched = rows.filter((m) => m.type === 'DISPATCH').length;
        return `
          <header class="page-head">
            <div>
              <h1 class="t-display">Movimientos</h1>
              <p class="sub">Quién despachó qué, a quién, y qué entró. Todo el kardex en una lista.</p>
            </div>
          </header>
          <div class="filters">
            <div class="field"><label for="mq">Buscar</label><input id="mq" placeholder="Artículo, lavado (#7) o venta (V-0003)" value="${esc(f.q)}" /></div>
            <div class="field" style="flex:0 1 200px"><label for="mt">Tipo</label><select id="mt">
              <option value="">Todos</option>${Object.entries(MOVE_META).map(([k, v]) => `<option value="${k}" ${f.type === k ? 'selected' : ''}>${v.label}</option>`).join('')}
            </select></div>
            <div class="field" style="flex:0 1 220px"><label for="me">Recibió</label><select id="me">
              <option value="">Cualquiera</option>${EMPLOYEES.map((e) => `<option value="${esc(e.name)}" ${f.emp === e.name ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}
            </select></div>
          </div>
          <p class="t-dense faint" style="margin:0 0 10px">${rows.length} movimientos${dispatched ? ` · ${dispatched} despachos` : ''}</p>
          ${kardexTable(rows, true)}
        `;
      }

      // ---- bloque «Productos» dentro del alta de lavado ----
      function renderWash() {
        const w = state.wash;
        const q = w.search.trim().toLowerCase();
        const products = ITEMS.filter((i) => i.kind === 'PRODUCT' && i.active && (!q || i.name.toLowerCase().includes(q)));
        const svcTotal = w.services.reduce((a, s) => a + s.cents, 0);
        const prodLines = Object.entries(w.products).filter(([, n]) => n > 0).map(([id, n]) => ({ it: item(id), n }));
        const prodTotal = prodLines.reduce((a, l) => a + l.it.price * l.n, 0);
        const total = svcTotal + prodTotal;

        const bar = $('#bottombar');
        bar.className = 'bottombar show';
        bar.innerHTML = `<div><div class="t-label faint">Total</div><p class="t-figure">${money(total)}</p></div><button class="btn primary">Abrir lavado</button>`;

        return `
          <button class="back" data-go="list">${ICONS.back} Lavados</button>
          <header class="page-head">
            <div>
              <h1 class="t-display">Nuevo lavado</h1>
              <p class="sub"><span class="code" style="color:var(--text)">${w.plate}</span> · ${esc(w.vehicle)} · Pickup</p>
            </div>
          </header>
          <div class="wash">
            <div>
              <section class="card">
                <div class="card-title"><h2 class="t-title">Servicios</h2><span class="aside">uno por categoría (039)</span></div>
                ${w.services.map((s) => `<div class="svc"><span class="name">${esc(s.name)}</span><span class="num">${money(s.cents)}</span></div>`).join('')}
              </section>
              <section class="card">
                <div class="card-title"><h2 class="t-title">Productos</h2><span class="aside">salen del inventario al guardar · vuelven si se quitan</span></div>
                <div class="field" style="margin-top:8px"><label for="pq">Buscar producto</label><input id="pq" placeholder="Cera, aromatizante…" value="${esc(w.search)}" /></div>
                ${products.map((p) => washProduct(p, w.products[p.id] ?? 0)).join('') || '<div class="empty" style="margin-top:10px"><div class="t-title">Nada con ese nombre</div><p>Probá con otra palabra.</p></div>'}
                <p class="t-dense faint" style="margin:12px 0 0">La pista ve este mismo bloque en la tablet: «Hay N» y el precio, sin costos.</p>
              </section>
            </div>
            <aside class="side card">
              <h2 class="t-title" style="margin-bottom:8px">Resumen</h2>
              ${w.services.map((s) => `<div class="sum-row"><span class="dim">${esc(s.name)}</span><span class="num">${money(s.cents)}</span></div>`).join('')}
              ${prodLines.length ? prodLines.map((l, k) => `<div class="sum-row ${k === 0 ? 'line' : ''}"><span class="dim">${esc(l.it.name)} <span class="faint">${l.n} × ${money(l.it.price)}</span></span><span class="num">${money(l.it.price * l.n)}</span></div>`).join('') : ''}
              <div class="sum-row sum-total"><span class="t-title">Total</span><p class="t-figure">${money(total)}</p></div>
              <div class="sum-row"><span class="t-dense faint">Base de comisión (solo servicios)</span><span class="num dim">${money(svcTotal)}</span></div>
              <button class="btn primary block" style="margin-top:14px">Abrir lavado</button>
            </aside>
          </div>
        `;
      }
      function washProduct(p, n) {
        const left = p.stock - n;
        const out = p.stock === 0;
        return `<div class="prod ${n > 0 ? 'on' : ''} ${out ? 'out' : ''}">
          <div class="info">
            <span class="name">${esc(p.name)}</span>
            <span class="sub">${out ? '<span class="neg">Sin existencia</span> · registrá una entrada primero' : `Hay ${qty(left, p.unit)}${left <= p.min ? ' <span class="neg">· bajo mínimo</span>' : ''}`}</span>
          </div>
          <span class="price num">${money(p.price)}</span>
          <div class="stepper ${n > 0 ? 'on' : ''}" role="group" aria-label="Cantidad de ${esc(p.name)}">
            <button data-step="${p.id}" data-d="-1" ${n === 0 ? 'disabled' : ''} aria-label="Quitar uno">−</button>
            <span class="q">${n}</span>
            <button data-step="${p.id}" data-d="1" ${left <= 0 ? 'disabled' : ''} aria-label="Agregar uno" title="${left <= 0 ? 'No hay más existencia' : ''}">+</button>
          </div>
        </div>`;
      }

      // =====================================================================
      // Venta suelta
      // =====================================================================
      const methodSummary = (payments) =>
        payments.length > 1 ? `Partido · ${payments.map((p) => methodOf(p.method).label).join(' + ')}` : methodOf(payments[0].method).label;
      const productsSummary = (lines) => lines.map((l) => `${l.name} ×${qty(l.qty)}`).join(', ');
      const saleStamp = (s) => (s.status === 'VOID' ? '<span class="stamp red">Anulada</span>' : '<span class="stamp green">Pagada</span>');

      // ---- /sales ----
      function renderSales() {
        const paid = SALES.filter((s) => s.status === 'PAID');
        const voids = SALES.filter((s) => s.status === 'VOID');
        const sold = paid.reduce((a, s) => a + saleTotal(s), 0);
        const cash = paid.reduce((a, s) => a + s.payments.filter((p) => p.method === 'CASH').reduce((x, p) => x + p.cents, 0), 0);
        const f = state.salesFilter;
        const rows = SALES.filter((s) => f === 'all' || s.status === f).sort((a, b) => b.at - a.at);
        const cols = '92px 88px minmax(0,1.1fr) minmax(0,2fr) 92px minmax(0,1.3fr) 96px';
        const tab = (id, label, n) => `<button class="tab" role="tab" data-sales-tab="${id}" aria-selected="${f === id}">${label} <span class="cnt">${n}</span></button>`;
        return `
          <header class="page-head">
            <div>
              <h1 class="t-display">Ventas</h1>
              <p class="sub">Productos vendidos sin lavado · hoy, ${fmtDate(new Date())}. Entran al turno de caja y no pagan comisión.</p>
            </div>
            <div class="actions">
              <button class="btn primary" data-go="sale-new">${ICONS.plus} Nueva venta</button>
            </div>
          </header>
          <div class="stats">
            <div class="stat"><div class="k">Vendido hoy</div><div class="v"><p class="t-figure">${money(sold)}</p></div></div>
            <div class="stat"><div class="k">Ventas pagadas</div><div class="v"><p class="t-figure">${paid.length}</p></div></div>
            <div class="stat"><div class="k">En efectivo</div><div class="v"><p class="t-figure">${money(cash)}</p></div></div>
            <div class="stat"><div class="k">Anuladas</div><div class="v"><p class="t-figure">${voids.length}</p></div></div>
          </div>
          <div class="tabs" role="tablist">${tab('all', 'Todas', SALES.length)}${tab('PAID', 'Pagadas', paid.length)}${tab('VOID', 'Anuladas', voids.length)}</div>
          ${
            rows.length
              ? `<div class="table" style="--cols:${cols}">
              <div class="thead"><div>Número</div><div>Hora</div><div>Cliente</div><div>Productos</div><div class="cell r">Total</div><div>Método</div><div>Estado</div></div>
              ${rows.map(saleRow).join('')}
            </div>`
              : `<div class="empty"><div class="t-title">${f === 'VOID' ? 'Ninguna anulada' : 'Sin ventas hoy'}</div><p>${f === 'VOID' ? 'Las ventas anuladas quedan acá, con quién y por qué.' : 'Cuando cobres una venta suelta va a aparecer acá.'}</p></div>`
          }
        `;
      }
      function saleRow(s) {
        const isVoid = s.status === 'VOID';
        return `<div class="row" data-sale="${s.number}" role="link" tabindex="0">
          <div class="cell"><span class="code" style="color:var(--text)">${s.number}</span></div>
          <div class="cell"><span class="l">Hora</span><span class="num dim">${fmtTime(s.at)}</span></div>
          <div class="cell"><span class="l">Cliente</span>${s.customer ? esc(s.customer) : '<span class="faint">Sin nombre</span>'}</div>
          <div class="cell full"><span class="l">Productos</span>${esc(productsSummary(s.lines))}</div>
          <div class="cell r"><span class="l">Total</span><span class="num ${isVoid ? 'struck' : ''}">${money(saleTotal(s))}</span></div>
          <div class="cell"><span class="l">Método</span>${methodSummary(s.payments)}</div>
          <div class="cell">${saleStamp(s)}</div>
        </div>`;
      }

      // ---- /sales/:id ----
      function renderSaleDetail() {
        const s = SALES.find((x) => x.id === state.saleId) ?? SALES[SALES.length - 1];
        const isVoid = s.status === 'VOID';
        return `
          <button class="back" data-go="sales">${ICONS.back} Ventas</button>
          <header class="page-head">
            <div>
              <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
                <span class="stamp flame">Venta suelta</span>${saleStamp(s)}
              </div>
              <h1 class="t-display">${s.number}</h1>
              <p class="sub">${fmtDate(s.at)} · ${fmtTime(s.at)} · vendió ${esc(s.by)} · ${s.customer ? esc(s.customer) : 'sin nombre de cliente'}</p>
            </div>
            ${isVoid ? '' : `<div class="actions"><button class="btn destructive" data-open="void-sale" data-item="${s.id}" ${state.shiftOpen ? '' : 'disabled'}>Anular venta</button></div>`}
          </header>
          ${isVoid ? `<div class="callout bad" role="status">${ICONS.warn}<div><b>Anulada</b> por ${esc(s.voided.by)} el ${fmtDate(s.voided.at)} a las ${fmtTime(s.voided.at)} · «${esc(s.voided.reason)}». Los productos volvieron al inventario y los pagos salieron del turno. No se borra: el kardex la referencia.</div></div>` : ''}
          ${!isVoid && !state.shiftOpen ? `<div class="callout">${ICONS.warn}<div>Solo se anula una venta del turno abierto, y ese turno ya se cerró. (409 CASH_SESSION_GONE)</div></div>` : ''}
          <div class="grid-detail">
            <section class="card">
              <div class="card-title"><h2 class="t-title">Productos</h2><span class="aside">sin comisión</span></div>
              <div>${s.lines
                .map(
                  (l) => `<div class="sline link" data-detail="${l.itemId}" role="link" tabindex="0">
                <div class="info"><span class="name">${esc(l.name)}</span><span class="sub"><span class="code">${l.code}</span>${l.authBy ? ` · <span class="auth-note">${ICONS.lock} Autorizó ${esc(l.authBy)} · ${esc(l.authReason)}</span>` : ''}</span></div>
                ${l.unit !== l.catalog ? `<span class="was">${money(l.catalog)}</span>` : ''}
                <span class="formula">${qty(l.qty)} × ${money(l.unit)} = <b>${money(l.unit * l.qty)}</b></span>
              </div>`,
                )
                .join('')}</div>
              <div class="sum-row sum-total"><span class="t-title">Total</span><p class="t-figure ${isVoid ? 'struck' : ''}">${money(saleTotal(s))}</p></div>
              <p class="t-dense faint" style="margin:8px 0 0">${isVoid ? 'Cada línea volvió al inventario con una devolución que apunta a esta venta.' : 'Cada línea salió del inventario al cobrar, con un movimiento que apunta a esta venta. Tocá un producto para ver su kardex.'}</p>
            </section>
            <section class="card">
              <div class="card-title"><h2 class="t-title">Pagos</h2><span class="aside">${isVoid ? 'salieron del turno' : 'en el turno de caja'}</span></div>
              ${s.payments.map((p) => `<div class="receipt-row">${ICONS[p.method]}<span class="grow">${methodOf(p.method).label}</span><span class="num ${isVoid ? 'struck' : ''}">${money(p.cents)}</span></div>`).join('')}
              ${s.tendered > 0 ? `<div class="receipt-row"><span class="grow dim">Con cuánto pagó</span><span class="num">${money(s.tendered)}</span></div><div class="receipt-row"><span class="grow" style="font-weight:600">Cambio al cliente</span><span class="num pos">${money(s.change)}</span></div>` : ''}
            </section>
          </div>
        `;
      }

      // ---- /sales/new: el borrador vive solo en pantalla (RN-18) ----
      const unitPrice = (id) => state.sale.prices[id]?.cents ?? item(id).price;
      const cartLines = () =>
        Object.entries(state.sale.cart)
          .filter(([, n]) => n > 0)
          .map(([id, n]) => ({ it: item(id), n }));
      const draftTotal = () => cartLines().reduce((a, l) => a + unitPrice(l.it.id) * l.n, 0);
      const draftPaid = () => state.sale.lines.reduce((a, l) => a + l.cents, 0);
      const draftLeft = () => draftTotal() - draftPaid();
      /** Lo que se cobra en efectivo: el total, o la suma de los renglones CASH. */
      const cashDue = () => {
        const d = state.sale;
        if (d.split) return d.lines.filter((l) => l.method === 'CASH').reduce((a, l) => a + l.cents, 0);
        return d.method === 'CASH' ? draftTotal() : 0;
      };
      /** Vuelto. Si no se tecleó nada, se asume pago justo. */
      const change = () => (state.sale.tendered > 0 ? state.sale.tendered - cashDue() : 0);
      const cashShort = () => cashDue() > 0 && state.sale.tendered > 0 && state.sale.tendered < cashDue();
      function saleBlocked() {
        if (!state.shiftOpen) return 'Sin turno abierto';
        if (!cartLines().length) return 'Agregá un producto';
        const left = draftLeft();
        if (state.sale.split && left > 0) return `Falta ${money(left)}`;
        if (state.sale.split && left < 0) return `Sobra ${money(-left)}`;
        if (cashShort()) return 'Falta efectivo';
        return null;
      }
      /** Si cambian las líneas o un precio, el último pago partido absorbe la diferencia. */
      function fitLines() {
        const d = state.sale;
        if (!d.split || !d.lines.length) return;
        const last = d.lines[d.lines.length - 1];
        last.cents = Math.max(0, last.cents + draftLeft());
        last.raw = amt(last.cents);
      }

      function renderSaleNew() {
        const d = state.sale;
        const q = d.search.trim().toLowerCase();
        const products = ITEMS.filter(
          (i) => i.kind === 'PRODUCT' && i.active && (!q || i.name.toLowerCase().includes(q) || i.code.toLowerCase().includes(q) || (i.barcode ?? '').includes(q)),
        );
        const lines = cartLines();
        const stop = saleBlocked();
        const showChange = d.tendered > 0 && cashDue() > 0 && !cashShort();

        const bar = $('#bottombar');
        bar.className = 'bottombar show';
        bar.innerHTML = `<div><div class="t-label faint">Total</div><p class="t-figure">${money(draftTotal())}</p></div>
          ${showChange ? `<div><div class="t-label faint">Cambio</div><p class="t-figure pos">${money(change())}</p></div>` : ''}
          <button class="btn primary" data-sale-charge ${stop ? 'disabled' : ''}>${stop ?? 'Cobrar'}</button>`;

        return `
          <button class="back" data-go="sales">${ICONS.back} Ventas</button>
          <header class="page-head">
            <div>
              <h1 class="t-display">Nueva venta</h1>
              <p class="sub">Productos sin lavado. No se guarda nada hasta cobrar: la venta nace cobrada.</p>
            </div>
          </header>
          ${state.shiftOpen ? '' : `<div class="callout bad" role="alert">${ICONS.warn}<div><b>Sin turno abierto.</b> Abrí el turno en Caja para poder cobrar. Podés armar la venta, pero no se cobra. (409 CASH_NOT_OPEN)</div></div>`}
          <div class="wash">
            <div>
              <section class="card">
                <div class="card-title"><h2 class="t-title">Productos</h2><span class="aside">salen del inventario al cobrar</span></div>
                <div class="field" style="margin-top:8px"><label for="sq">Buscar producto</label><input id="sq" placeholder="Nombre, código o código de barras" value="${esc(d.search)}" /></div>
                ${products.map((p) => saleProduct(p, d.cart[p.id] ?? 0)).join('') || '<div class="empty" style="margin-top:10px"><div class="t-title">Nada con ese nombre</div><p>Probá con el código (INV-0001) o el código de barras.</p></div>'}
              </section>
              <section class="card">
                <div class="card-title"><h2 class="t-title">En la venta</h2><span class="aside">${lines.length ? `${lines.length} producto${lines.length > 1 ? 's' : ''}` : 'vacía'}</span></div>
                ${lines.length ? `<div>${lines.map(saleDraftLine).join('')}</div>` : '<div class="empty" style="margin-top:8px"><div class="t-title">Todavía no hay productos</div><p>Usá el + de un producto para agregarlo.</p></div>'}
                <div class="field" style="margin-top:12px"><label for="scust">Cliente (opcional)</label><input id="scust" placeholder="Nombre libre, sin carro" value="${esc(d.customer)}" /></div>
              </section>
              <section class="card">${paymentBlock()}</section>
            </div>
            <aside class="side card">${saleSummary(stop)}</aside>
          </div>
        `;
      }
      function saleProduct(p, n) {
        const out = p.stock === 0;
        const full = n >= p.stock;
        return `<div class="prod ${n > 0 ? 'on' : ''} ${out ? 'out' : ''}">
          <div class="info">
            <span class="name">${esc(p.name)}</span>
            <span class="sub"><span class="code">${p.code}</span> · ${out ? '<span class="neg">Sin existencia</span>' : `Hay ${qty(p.stock, p.unit)}${n > 0 && full ? ' · <span class="neg">no hay más</span>' : ''}`}</span>
          </div>
          <span class="price num">${money(p.price)}</span>
          <div class="stepper ${n > 0 ? 'on' : ''}" role="group" aria-label="Cantidad de ${esc(p.name)}">
            <button data-sstep="${p.id}" data-d="-1" ${n === 0 ? 'disabled' : ''} aria-label="Quitar uno">−</button>
            <span class="q">${n}</span>
            <button data-sstep="${p.id}" data-d="1" ${full ? 'disabled' : ''} aria-label="Agregar uno" title="${full ? `Hay ${qty(p.stock)}` : ''}">+</button>
          </div>
        </div>`;
      }
      function saleDraftLine(l) {
        const unit = unitPrice(l.it.id);
        const auth = state.sale.prices[l.it.id];
        return `<div class="sline">
          <div class="info">
            <span class="name">${esc(l.it.name)}</span>
            <span class="sub">${auth ? `<span class="auth-note">${ICONS.lock} Autorizó ${esc(auth.by)} · ${esc(auth.reason)}</span>` : 'Precio del catálogo'}</span>
          </div>
          ${unit !== l.it.price ? `<span class="was">${money(l.it.price)}</span>` : ''}
          <span class="formula">${qty(l.n)} × ${money(unit)} = <b>${money(unit * l.n)}</b></span>
          <button class="icon-btn lock" data-open="sale-price" data-item="${l.it.id}" aria-label="Cambiar el precio de ${esc(l.it.name)}" title="Cambiar el precio (pide autorización)">${ICONS.lock}</button>
          <button class="icon-btn" data-sremove="${l.it.id}" aria-label="Quitar ${esc(l.it.name)} de la venta">${ICONS.x}</button>
        </div>`;
      }

      // Bloque de pago: el mismo de la 059 (método, partir, con cuánto paga, cambio).
      function paymentBlock() {
        const d = state.sale;
        const total = draftTotal();
        const left = draftLeft();
        const head = d.split
          ? `<h2 class="t-title">Pago partido</h2><p class="t-dense faint" style="margin:4px 0 0">Un renglón por cada plata que entra. Deben sumar el total.</p>`
          : `<h2 class="t-title">Pago</h2><p class="t-dense faint" style="margin:4px 0 0">Un solo pago por ${money(total)}.</p>`;
        const body = d.split
          ? `<div class="plines">
              ${d.lines
                .map(
                  (l, i) => `<div class="pline" data-pline="${l.id}">
                <div class="mini" role="radiogroup" aria-label="Método del pago ${i + 1}">${METHODS.map((m) => `<button data-pline-method="${m.value}" aria-pressed="${l.method === m.value}">${m.label}</button>`).join('')}</div>
                <label class="money-field"><span>$</span><input inputmode="decimal" data-amount="${l.id}" value="${esc(l.raw)}" aria-label="Monto del pago ${i + 1}" /></label>
                ${d.lines.length > 1 ? `<button class="icon-btn" data-drop-pline="${l.id}" aria-label="Quitar pago ${i + 1}">${ICONS.x}</button>` : ''}
              </div>`,
                )
                .join('')}
            </div>
            <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
              <button class="btn" id="add-pline" ${left <= 0 ? 'disabled' : ''}>${ICONS.plus} Agregar pago</button>
              <button class="btn link" id="go-simple" style="margin-left:auto">Volver a un solo pago</button>
            </div>
            <div class="remaining ${left === 0 ? 'ok' : left < 0 ? 'over' : ''}"><span class="t-label">${left > 0 ? 'Falta' : left < 0 ? 'Se pasó' : 'Cuadra'}</span><span class="v">${money(Math.abs(left))}</span></div>`
          : `<div class="methods" role="radiogroup" aria-label="Método de pago">${METHODS.map((m) => `<button class="method" role="radio" data-method="${m.value}" aria-checked="${d.method === m.value}">${ICONS[m.value]} ${m.label}</button>`).join('')}</div>
            ${total > 0 ? '<div style="margin-top:14px"><button class="btn link" id="go-split">Partir el pago en varios métodos</button></div>' : ''}`;
        return `<div class="card-title"><div>${head}</div></div>${body}${cashBox()}`;
      }
      /** Con cuánto paga y cambio. Solo aparece si algo se paga en efectivo. */
      function cashBox() {
        const d = state.sale;
        const due = cashDue();
        if (due <= 0) return '';
        const short = cashShort();
        const diff = change();
        return `<div class="cash-box">
          <div class="cash-row">
            <div style="flex:1 1 160px"><div class="t-label faint">Efectivo a cobrar</div><div class="num" style="font-size:17px">${money(due)}</div></div>
            <label class="money-field wide"><span>$</span><input inputmode="decimal" id="tendered" value="${esc(d.tenderedRaw)}" placeholder="Con cuánto paga" aria-label="Efectivo que entrega el cliente" /></label>
          </div>
          <div class="change ${short ? 'short' : diff > 0 ? 'ok' : ''}"><span class="t-label faint">${short ? 'FALTA' : 'CAMBIO'}</span><span class="v">${money(Math.abs(d.tendered > 0 ? diff : 0))}</span></div>
          ${d.tendered === 0 ? '<p class="t-dense faint" style="margin:8px 0 0">Vacío = paga justo.</p>' : ''}
        </div>`;
      }
      function saleSummary(stop) {
        const d = state.sale;
        const lines = cartLines();
        const label = stop ?? (d.split ? `Cobrar ${d.lines.length} pagos` : methodOf(d.method).verb);
        return `<h2 class="t-title" style="margin-bottom:8px">Resumen</h2>
          ${lines.map((l) => `<div class="sum-row"><span class="dim">${esc(l.it.name)} <span class="faint">${qty(l.n)} × ${money(unitPrice(l.it.id))}</span></span><span class="num">${money(unitPrice(l.it.id) * l.n)}</span></div>`).join('') || '<p class="t-dense faint" style="margin:0">Sin productos.</p>'}
          <div class="sum-row sum-total"><span class="t-title">Total</span><p class="t-figure">${money(draftTotal())}</p></div>
          ${d.split ? `<div class="sum-row"><span class="t-dense dim">Cubierto</span><span class="num t-dense">${money(draftPaid())}</span></div>` : ''}
          ${
            d.tendered > 0 && cashDue() > 0
              ? `<div class="sum-row"><span class="t-dense dim">Con cuánto paga</span><span class="num t-dense">${money(d.tendered)}</span></div>
                 <div class="sum-row"><span class="t-dense dim">${cashShort() ? 'Falta' : 'Cambio'}</span><span class="num t-dense ${cashShort() ? 'neg' : 'pos'}">${money(Math.abs(change()))}</span></div>`
              : ''
          }
          <div class="sum-row"><span class="t-dense faint">Comisión</span><span class="t-dense faint">no genera</span></div>
          <button class="btn primary block" data-sale-charge style="margin-top:14px" ${stop ? 'disabled' : ''}>${label}</button>
          <p class="t-dense faint" style="margin:10px 0 0">${state.shiftOpen ? 'Entra al turno de caja abierto. Al cobrar abre el detalle de la venta.' : 'No hay turno abierto: no se puede cobrar.'}</p>`;
      }
      function chargeSale() {
        const d = state.sale;
        if (saleBlocked()) return;
        const lines = cartLines();
        // Todo o nada (RN-19): si una línea no alcanza, no se cobra nada.
        const short = lines.find((l) => l.n > l.it.stock);
        if (short) {
          toastError(`No alcanza ${short.it.name}: hay ${qty(short.it.stock)}. (409 INSUFFICIENT_STOCK)`);
          return;
        }
        const number = 'V-' + String(SALES.length + 1).padStart(4, '0');
        const due = cashDue();
        const payments = d.split ? d.lines.filter((l) => l.cents > 0).map((l) => ({ method: l.method, cents: l.cents })) : [{ method: d.method, cents: draftTotal() }];
        lines.forEach((l) => move(l.it.id, 'SALE', -l.n, { sale: number, by: ME }));
        const sale = {
          id: 'v' + seq++,
          number,
          at: new Date(),
          customer: d.customer.trim() || null,
          lines: lines.map((l) => saleLine(l.it.id, l.n, unitPrice(l.it.id), d.prices[l.it.id] ?? null)),
          payments,
          tendered: due > 0 ? d.tendered : 0,
          change: due > 0 && d.tendered > 0 ? d.tendered - due : 0,
          status: 'PAID',
          by: ME,
          voided: null,
        };
        SALES.push(sale);
        state.sale = newSaleDraft();
        state.saleId = sale.id;
        state.screen = 'sale';
        toast(`Venta ${number} cobrada · ${money(saleTotal(sale))}`);
        render();
        window.scrollTo(0, 0);
      }
      /** «ana.castillo@taller.sv» → «Ana Castillo». Solo para el prototipo. */
      const authName = (email) =>
        email
          .split('@')[0]
          .split(/[._-]+/)
          .filter(Boolean)
          .map((w) => w[0].toUpperCase() + w.slice(1))
          .join(' ') || 'Administrador';

      // =====================================================================
      // Cajón de avisos (058)
      // =====================================================================
      const visibleNote = (n) => {
        const f = NOTE_FILTERS.find((x) => x.id === NOTE_KIND[n.type].group);
        return (!f?.perm || PERMISSIONS[f.perm]) && (NOTE_KIND[n.type].group !== 'cash' || PERMISSIONS['carwash.cash']);
      };
      function renderBell() {
        const unread = NOTES.filter((n) => visibleNote(n) && !n.read).length;
        const bell = $('#bell');
        bell.innerHTML = `${ICONS.bell}${unread ? `<span class="badge">${unread}</span>` : ''}`;
        bell.setAttribute('aria-label', unread ? `Avisos, ${unread} sin leer` : 'Avisos');
      }
      function ringBell() {
        const bell = $('#bell');
        bell.classList.add('ring');
        setTimeout(() => bell.classList.remove('ring'), 700);
      }
      function openDrawer(kind) {
        state.drawer.open = true;
        if (kind) state.drawer.kind = kind;
        renderDrawer();
        $('#drawer').classList.add('open');
        $('#scrim').classList.add('open');
        $('#drawer-close').focus();
      }
      function closeDrawer() {
        state.drawer.open = false;
        $('#drawer').classList.remove('open');
        $('#scrim').classList.remove('open');
        $('#bell').focus();
      }
      function renderDrawer() {
        const all = NOTES.filter(visibleNote).sort((a, b) => b.at - a.at);
        const unread = all.filter((n) => !n.read).length;
        $('#drawer-sub').textContent = `Hoy · ${unread} sin leer de ${all.length}`;
        $('#drawer-close').innerHTML = ICONS.x;
        const filters = NOTE_FILTERS.filter((f) => !f.perm || PERMISSIONS[f.perm]);
        $('#nkinds').innerHTML = filters
          .map((f) => {
            const n = f.id === 'all' ? all.length : all.filter((x) => NOTE_KIND[x.type].group === f.id).length;
            return `<button class="nchip" data-nkind="${f.id}" aria-pressed="${state.drawer.kind === f.id}">${f.label}<span class="n">${n}</span></button>`;
          })
          .join('');
        const shown = all.filter((n) => state.drawer.kind === 'all' || NOTE_KIND[n.type].group === state.drawer.kind);
        $('#nlist').innerHTML = shown.length
          ? shown.map(noteRow).join('')
          : `<div class="empty"><div class="t-title">Sin avisos acá</div><p>${state.drawer.kind === 'stock' ? 'Cuando un artículo llegue a su mínimo, el aviso cae acá. Suena una vez por cruce.' : 'No hay avisos de este tipo hoy.'}</p></div>`;
        $('#drawer-foot').innerHTML = state.drawer.kind === 'stock' ? 'Solo con <span class="code">inventory.read</span>' : '';
      }
      function noteRow(n) {
        const k = NOTE_KIND[n.type];
        const isStock = n.type === 'low_stock';
        const meta = isStock
          ? `Inventario · <span class="code">${item(n.itemId).code}</span> · toca para ver el kardex`
          : `<span class="code">${n.plate}</span>${n.detail ? ` · ${n.detail}` : ''}`;
        return `<button class="note ${n.read ? 'read' : ''}" data-note="${n.id}">
          <span class="time">${fmtTime(n.at)}</span>
          <span class="ico ${k.tone}">${ICONS[k.icon]}</span>
          <span class="body">
            <span class="title ${isStock ? 'danger' : ''}">${k.title(n)}</span>
            <span class="meta t-dense">${meta}</span>
            ${n.by ? `<span class="by t-dense">${esc(n.by)}</span>` : ''}
          </span>
          <span class="dot" aria-hidden="true"></span>
        </button>`;
      }

      // =====================================================================
      // Diálogos
      // =====================================================================
      const dlg = { kind: null, data: {} };
      function openDialog(kind, itemId) {
        dlg.kind = kind;
        dlg.data = { itemId: itemId ?? (kind === 'dispatch' ? 's1' : 'p1'), qty: '', cost: '', ref: '', emp: '', note: '', reason: '', sign: -1, newKind: 'PRODUCT', name: '', cat: 'c1', unit: 'unidad', price: '', min: '', error: '', saleId: null, newPrice: '', email: '', pass: '' };
        if (kind === 'void-sale') Object.assign(dlg.data, { saleId: itemId, itemId: 'p1' });
        if (kind === 'sale-price') {
          const cur = state.sale.prices[itemId];
          Object.assign(dlg.data, { newPrice: amt(unitPrice(itemId)), reason: cur?.reason ?? '' });
        }
        if (kind === 'edit') {
          const it = item(itemId);
          Object.assign(dlg.data, { name: it.name, cat: it.cat, unit: it.unit, price: (it.price / 100).toFixed(2), min: String(it.min), newKind: it.kind });
        }
        renderDialog();
        $('#overlay').classList.add('open');
      }
      function closeDialog() {
        $('#overlay').classList.remove('open');
        dlg.kind = null;
      }
      function itemSelect(id, filter) {
        const opts = ITEMS.filter((i) => i.active && (!filter || filter(i)));
        return `<div class="field"><label for="d-item">Artículo</label><select id="d-item">${opts.map((i) => `<option value="${i.id}" ${i.id === id ? 'selected' : ''}>${esc(i.name)} · hay ${qty(i.stock, i.unit)}</option>`).join('')}</select></div>`;
      }
      function renderDialog() {
        const d = dlg.data;
        const it = item(d.itemId);
        const n = parseFloat(d.qty);
        let head = '', body = '', ok = '', valid = false, okClass = 'primary';
        const authBlock = (title) => `<div class="auth-block">
            <p>${ICONS.lock} ${title}</p>
            <div class="field"><label for="d-email">Correo</label><input id="d-email" type="email" autocomplete="off" value="${esc(d.email)}" /></div>
            <div class="field"><label for="d-pass">Contraseña</label><input id="d-pass" type="password" autocomplete="off" value="${esc(d.pass)}" /></div>
          </div>`;

        if (dlg.kind === 'entry') {
          head = ['Registrar entrada', 'Suma existencia. Si trae costo, recalcula el promedio.'];
          valid = n > 0;
          body = `${itemSelect(d.itemId)}
            <div class="grid2">
              <div class="field num"><label for="d-qty">Cantidad</label><div class="with-unit"><input id="d-qty" inputmode="decimal" placeholder="0" value="${esc(d.qty)}" /><span>${esc(it.unit)}</span></div></div>
              <div class="field num"><label for="d-cost">Costo por ${esc(it.unit)} (opcional)</label><div class="with-unit"><span>$</span><input id="d-cost" inputmode="decimal" placeholder="0.00" value="${esc(d.cost)}" /></div></div>
            </div>
            <div class="field"><label for="d-ref">Referencia (factura, proveedor)</label><input id="d-ref" placeholder="Fact. 0460 · Distribuidora…" value="${esc(d.ref)}" /></div>
            <div class="preview"><span class="dim">Quedaría</span><span class="v">${valid ? qty(it.stock + n, it.unit) : qty(it.stock, it.unit)}</span></div>`;
          ok = 'Registrar entrada';
        } else if (dlg.kind === 'dispatch') {
          head = ['Despachar a un empleado', 'Sale del inventario. Queda quién lo entregó y quién lo recibió.'];
          const over = n > it.stock;
          valid = n > 0 && !over && !!d.emp;
          body = `${itemSelect(d.itemId)}
            <div class="grid2">
              <div class="field num ${over ? 'invalid' : ''}"><label for="d-qty">Cantidad</label><div class="with-unit"><input id="d-qty" inputmode="decimal" placeholder="0" value="${esc(d.qty)}" /><span>${esc(it.unit)}</span></div></div>
              <div class="field"><label for="d-emp">Recibe</label><select id="d-emp"><option value="">Elegí un empleado</option>${EMPLOYEES.map((e) => `<option value="${esc(e.name)}" ${d.emp === e.name ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select></div>
            </div>
            ${over ? `<p class="field-error" role="alert" style="margin-top:-6px">Hay ${qty(it.stock, it.unit)}. No se puede despachar más de lo que hay.</p>` : ''}
            <div class="field"><label for="d-note">Motivo (opcional)</label><input id="d-note" placeholder="Reposición semanal" value="${esc(d.note)}" /></div>
            <div class="preview ${over ? 'bad' : ''}"><span class="dim">Quedaría</span><span class="v">${n > 0 ? qty(Math.max(it.stock - n, 0), it.unit) : qty(it.stock, it.unit)}</span></div>
            <p class="t-dense faint" style="margin:0">Despacha <b>${ME}</b>. Solo desde la oficina, con <span class="code">inventory.move</span>.</p>`;
          ok = 'Despachar';
        } else if (dlg.kind === 'adjust') {
          head = ['Ajustar existencia', 'Para un conteo físico. El motivo es obligatorio y queda en el kardex.'];
          const delta = d.sign * (n || 0);
          const over = it.stock + delta < 0;
          valid = n > 0 && !over && d.reason.trim().length > 0;
          body = `<div class="preview"><span class="dim">${esc(it.name)} · hoy</span><span class="v">${qty(it.stock, it.unit)}</span></div>
            <div class="kind-pick" role="radiogroup" aria-label="Sentido">
              <button class="kind" role="radio" data-sign="-1" aria-checked="${d.sign === -1}"><b>Faltó</b><small>Hay menos que en el sistema</small></button>
              <button class="kind" role="radio" data-sign="1" aria-checked="${d.sign === 1}"><b>Sobró</b><small>Hay más que en el sistema</small></button>
            </div>
            <div class="field num ${over ? 'invalid' : ''}"><label for="d-qty">Diferencia</label><div class="with-unit"><input id="d-qty" inputmode="decimal" placeholder="0" value="${esc(d.qty)}" /><span>${esc(it.unit)}</span></div></div>
            ${over ? `<p class="field-error" role="alert" style="margin-top:-6px">La existencia no puede quedar negativa.</p>` : ''}
            <div class="field ${d.reason === '' && d.touched ? 'invalid' : ''}"><label for="d-reason">Motivo</label><textarea id="d-reason" placeholder="Conteo del 20 de septiembre: dos envases rotos">${esc(d.reason)}</textarea></div>
            <div class="preview ${over ? 'bad' : ''}"><span class="dim">Quedaría</span><span class="v">${n > 0 ? qty(Math.max(it.stock + delta, 0), it.unit) : qty(it.stock, it.unit)}</span></div>
            <div class="callout" style="margin:0">${ICONS.warn}<div>Requiere <span class="code">inventory.adjust</span>, distinto de registrar entradas. Un ajuste no se borra: si estuvo mal, se hace otro.</div></div>`;
          ok = 'Ajustar';
        } else if (dlg.kind === 'new' || dlg.kind === 'edit') {
          const isNew = dlg.kind === 'new';
          head = isNew ? ['Nuevo artículo', 'El tipo se elige una vez y no se cambia después.'] : ['Editar artículo', `${it.code} · el tipo no se cambia.`];
          const isP = d.newKind === 'PRODUCT';
          const price = parseFloat(d.price);
          valid = d.name.trim().length > 0 && (!isP || price > 0);
          body = `${isNew ? `<div class="kind-pick" role="radiogroup" aria-label="Tipo">
              <button class="kind" role="radio" data-kind="PRODUCT" aria-checked="${isP}"><b>Producto</b><small>Se vende en el lavado. Tiene precio.</small></button>
              <button class="kind" role="radio" data-kind="SUPPLY" aria-checked="${!isP}"><b>Insumo</b><small>Uso interno. Se despacha al equipo.</small></button>
            </div>` : `<div><span class="stamp ${isP ? 'flame' : 'amber'}">${isP ? 'Producto' : 'Insumo'}</span></div>`}
            <div class="field"><label for="d-name">Nombre</label><input id="d-name" placeholder="${isP ? 'Cera en pasta' : 'Franela microfibra'}" value="${esc(d.name)}" /></div>
            <div class="grid2">
              <div class="field"><label for="d-cat">Categoría</label><select id="d-cat">${CATEGORIES.map((c) => `<option value="${c.id}" ${d.cat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
              <div class="field"><label for="d-unit">Unidad</label><input id="d-unit" list="units" value="${esc(d.unit)}" /><datalist id="units"><option>unidad</option><option>litro</option><option>galón</option><option>par</option><option>caja</option></datalist></div>
            </div>
            <div class="grid2">
              ${isP ? `<div class="field num"><label for="d-price">Precio de venta (IVA incl.)</label><div class="with-unit"><span>$</span><input id="d-price" inputmode="decimal" placeholder="0.00" value="${esc(d.price)}" /></div></div>` : `<div class="field" style="justify-content:center"><span class="t-dense faint">Un insumo no tiene precio: no se vende.</span></div>`}
              <div class="field num"><label for="d-min">Mínimo (avisa al llegar)</label><div class="with-unit"><input id="d-min" inputmode="decimal" placeholder="0" value="${esc(d.min)}" /><span>${esc(d.unit || 'unidad')}</span></div></div>
            </div>
            ${isNew ? '<p class="t-dense faint" style="margin:0">Nace con existencia 0. La primera cantidad entra con «Registrar entrada», con su costo.</p>' : ''}`;
          ok = isNew ? 'Crear artículo' : 'Guardar';
        } else if (dlg.kind === 'sale-price') {
          // Candado de la 060: el cajero escribe precio y motivo; lo aplica la
          // credencial de quien tiene carwash.discount, tecleada acá mismo.
          head = ['Cambiar el precio', `${it.name} · venta suelta`];
          const cents = parseMoney(d.newPrice);
          const above = cents > it.price;
          const same = d.newPrice.trim() !== '' && cents === it.price;
          valid = d.newPrice.trim() !== '' && !above && (same || (d.reason.trim() && d.email.trim() && d.pass));
          body = `<div class="cash-row">
              <div style="flex:1 1 140px"><div class="t-label faint">Precio del catálogo</div><div class="num" style="font-size:17px">${money(it.price)}</div></div>
              <label class="money-field wide"><span>$</span><input inputmode="decimal" id="d-newprice" value="${esc(d.newPrice)}" aria-label="Precio nuevo por unidad" /></label>
            </div>
            ${above ? '<p class="field-error" role="alert" style="margin-top:-6px">No puede pasar del precio del catálogo. (422 PRICE_ABOVE_CATALOG)</p>' : ''}
            <div class="field"><label for="d-reason">Motivo</label><input id="d-reason" placeholder="Por qué se cambia" value="${esc(d.reason)}" /></div>
            ${authBlock('Autorización de alguien con carwash.discount')}
            <p class="t-dense faint" style="margin:0">Queda firmado en la línea: quién autorizó, el precio del catálogo y el motivo. No abre sesión ni cambia el usuario de la pantalla.</p>`;
          ok = same ? 'Volver al precio del catálogo' : 'Autorizar y aplicar';
        } else if (dlg.kind === 'void-sale') {
          const s = SALES.find((x) => x.id === d.saleId);
          head = [`Anular venta ${s.number}`, 'Pide lo mismo que deshacer un cobro: motivo y la autorización de alguien con carwash.void.'];
          valid = !!(d.reason.trim() && d.email.trim() && d.pass);
          body = `<div class="preview"><span class="dim">${s.number} · ${fmtTime(s.at)} · ${esc(productsSummary(s.lines))}</span><span class="v">${money(saleTotal(s))}</span></div>
            <div class="field ${d.touched && !d.reason.trim() ? 'invalid' : ''}"><label for="d-reason">Motivo</label><textarea id="d-reason" placeholder="El cliente devolvió el producto sin abrir">${esc(d.reason)}</textarea></div>
            ${authBlock('Autorización de alguien con carwash.void')}
            <div class="callout" style="margin:0">${ICONS.warn}<div>Los productos vuelven al inventario y los pagos salen del turno. La venta no se borra: queda anulada con quién, cuándo y por qué.</div></div>`;
          ok = 'Anular venta';
          okClass = 'destructive';
        }

        $('#modal').innerHTML = `
          <header><h2 class="t-headline">${head[0]}</h2><p class="t-dense faint" style="margin:4px 0 0">${head[1]}</p></header>
          <div class="body">${body}${d.error ? `<p class="alert" role="alert">${esc(d.error)}</p>` : ''}</div>
          <footer><button class="btn" id="d-cancel">Cancelar</button><button class="btn ${okClass}" id="d-ok" ${valid ? '' : 'disabled'}>${ok}</button></footer>`;
        $('#overlay').setAttribute('aria-label', head[0]);
        bindDialog();
      }
      function bindDialog() {
        const d = dlg.data;
        const m = $('#modal');
        const on = (sel, ev, fn) => { const el = $(sel, m); if (el) el.addEventListener(ev, fn); };
        on('#d-cancel', 'click', closeDialog);
        on('#d-item', 'change', (e) => { d.itemId = e.target.value; renderDialog(); });
        on('#d-qty', 'input', (e) => { d.qty = e.target.value; renderDialog(); refocus('#d-qty'); });
        on('#d-cost', 'input', (e) => { d.cost = e.target.value; });
        on('#d-ref', 'input', (e) => { d.ref = e.target.value; });
        on('#d-emp', 'change', (e) => { d.emp = e.target.value; renderDialog(); });
        on('#d-note', 'input', (e) => { d.note = e.target.value; });
        on('#d-reason', 'input', (e) => { d.reason = e.target.value; d.touched = true; renderDialog(); refocus('#d-reason'); });
        on('#d-name', 'input', (e) => { d.name = e.target.value; renderDialog(); refocus('#d-name'); });
        on('#d-cat', 'change', (e) => { d.cat = e.target.value; });
        on('#d-unit', 'input', (e) => { d.unit = e.target.value; });
        on('#d-price', 'input', (e) => { d.price = e.target.value; renderDialog(); refocus('#d-price'); });
        on('#d-min', 'input', (e) => { d.min = e.target.value; });
        on('#d-newprice', 'input', (e) => { d.newPrice = e.target.value; renderDialog(); refocus('#d-newprice'); });
        on('#d-email', 'input', (e) => { d.email = e.target.value; renderDialog(); refocus('#d-email'); });
        on('#d-pass', 'input', (e) => { d.pass = e.target.value; renderDialog(); refocus('#d-pass'); });
        m.querySelectorAll('[data-sign]').forEach((b) => b.addEventListener('click', () => { d.sign = Number(b.dataset.sign); renderDialog(); }));
        m.querySelectorAll('[data-kind]').forEach((b) => b.addEventListener('click', () => { d.newKind = b.dataset.kind; renderDialog(); }));
        on('#d-ok', 'click', submitDialog);
      }
      function refocus(sel) {
        const el = $(sel, $('#modal'));
        if (!el) return;
        const v = el.value.length;
        el.focus();
        try { el.setSelectionRange(v, v); } catch {}
      }
      function submitDialog() {
        const d = dlg.data;
        const n = parseFloat(d.qty);
        const it = item(d.itemId);
        try {
          if (dlg.kind === 'entry') {
            move(d.itemId, 'ENTRY', n, { cost: d.cost ? Math.round(parseFloat(d.cost) * 100) : null, ref: d.ref || null, by: ME });
            toast(`Entrada registrada: +${qty(n, it.unit)} de ${it.name}`);
          } else if (dlg.kind === 'dispatch') {
            move(d.itemId, 'DISPATCH', -n, { emp: d.emp, reason: d.note || null, by: ME });
            toast(`Despachado: ${qty(n, it.unit)} de ${it.name} a ${d.emp}`);
          } else if (dlg.kind === 'adjust') {
            move(d.itemId, 'ADJUSTMENT', d.sign * n, { reason: d.reason.trim(), by: ME });
            toast(`Existencia ajustada: ${it.name} queda en ${qty(it.stock, it.unit)}`);
          } else if (dlg.kind === 'new') {
            const isP = d.newKind === 'PRODUCT';
            const code = 'INV-' + String(ITEMS.length + 1).padStart(4, '0');
            const id = 'n' + seq++;
            ITEMS.push({ id, code, kind: d.newKind, name: d.name.trim(), cat: d.cat, unit: d.unit.trim() || 'unidad', price: isP ? Math.round(parseFloat(d.price) * 100) : 0, avgCost: 0, stock: 0, min: parseFloat(d.min) || 0, active: true });
            state.tab = d.newKind;
            state.detailId = id;
            toast(`Creado ${code} · ${d.name.trim()}`);
          } else if (dlg.kind === 'edit') {
            Object.assign(it, { name: d.name.trim(), cat: d.cat, unit: d.unit.trim() || 'unidad', price: it.kind === 'PRODUCT' ? Math.round(parseFloat(d.price) * 100) : 0, min: parseFloat(d.min) || 0 });
            toast('Artículo guardado');
          } else if (dlg.kind === 'sale-price') {
            const cents = parseMoney(d.newPrice);
            if (cents === it.price) delete state.sale.prices[d.itemId];
            else state.sale.prices[d.itemId] = { cents, by: authName(d.email), reason: d.reason.trim() };
            fitLines();
            toast(cents === it.price ? `${it.name} vuelve a ${money(it.price)}` : `Precio autorizado: ${it.name} a ${money(cents)}`);
          } else if (dlg.kind === 'void-sale') {
            const s = SALES.find((x) => x.id === d.saleId);
            if (!state.shiftOpen) throw new Error('CASH_SESSION_GONE');
            // Una transacción (RN-22): devolución por línea, pagos fuera del
            // turno y la venta queda VOID con quién, cuándo y motivo.
            const who = authName(d.email);
            s.lines.forEach((l) => move(l.itemId, 'SALE_RETURN', l.qty, { sale: s.number, by: who, reason: 'Venta anulada' }));
            s.status = 'VOID';
            s.voided = { by: who, at: new Date(), reason: d.reason.trim() };
            toast(`Venta ${s.number} anulada · los productos volvieron al inventario`);
          }
          closeDialog();
          render();
        } catch (e) {
          d.error = e.message === 'INSUFFICIENT_STOCK' ? `No alcanza: hay ${qty(e.available, it.unit)}. (409 INSUFFICIENT_STOCK)` : e.message === 'ITEM_INACTIVE' ? 'El artículo está inactivo. (409 ITEM_INACTIVE)' : e.message === 'CASH_SESSION_GONE' ? 'El turno de esa venta ya se cerró. (409 CASH_SESSION_GONE)' : e.message;
          renderDialog();
        }
      }

      // =====================================================================
      // Toast (solo éxitos propios; los avisos van al cajón)
      // =====================================================================
      function toast(text) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = `${ICONS.check}<span>${esc(text)}</span>`;
        $('#toasts').appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }

      // =====================================================================
      // Eventos de pantalla
      // =====================================================================
      function bind() {
        const page = $('#page');
        page.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => { state.screen = b.dataset.go; render(); }));
        page.querySelectorAll('[data-detail]').forEach((r) => {
          const go = () => { state.detailId = r.dataset.detail; state.screen = 'detail'; render(); window.scrollTo(0, 0); };
          r.addEventListener('click', go);
          r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
        });
        page.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => openDialog(b.dataset.open, b.dataset.item)));
        page.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { state.tab = b.dataset.tab; render(); }));
        page.querySelectorAll('[data-dismiss]').forEach((b) => b.addEventListener('click', () => { state.alerts = state.alerts.filter((a) => a.id !== b.dataset.dismiss); render(); }));
        const q = $('#q', page);
        if (q) q.addEventListener('input', (e) => { state.search = e.target.value; render(); refocusPage('#q'); });
        const low = $('#low', page);
        if (low) low.addEventListener('click', () => { state.lowOnly = !state.lowOnly; render(); });
        const ina = $('#inactive', page);
        if (ina) ina.addEventListener('click', () => { state.showInactive = !state.showInactive; render(); });
        const mq = $('#mq', page);
        if (mq) mq.addEventListener('input', (e) => { state.moveFilter.q = e.target.value; render(); refocusPage('#mq'); });
        const mt = $('#mt', page);
        if (mt) mt.addEventListener('change', (e) => { state.moveFilter.type = e.target.value; render(); });
        const me = $('#me', page);
        if (me) me.addEventListener('change', (e) => { state.moveFilter.emp = e.target.value; render(); });
        const pq = $('#pq', page);
        if (pq) pq.addEventListener('input', (e) => { state.wash.search = e.target.value; render(); refocusPage('#pq'); });
        // Stepper del lavado: mueve el kardex al instante (RN-4, RN-5).
        page.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
          const id = b.dataset.step;
          const dlt = Number(b.dataset.d);
          const cur = state.wash.products[id] ?? 0;
          try {
            move(id, dlt > 0 ? 'SALE' : 'SALE_RETURN', -dlt, { wo: state.wash.number, by: ME, reason: dlt < 0 ? 'Línea quitada' : null });
            state.wash.products[id] = cur + dlt;
            render();
          } catch (e) {
            toastError(`No alcanza: hay ${qty(e.available)}. (409 INSUFFICIENT_STOCK)`);
          }
        }));

        // ---- enlaces del kardex y filas de ventas ----
        page.querySelectorAll('[data-sale]').forEach((el) => {
          const go = () => {
            const s = saleByNumber(el.dataset.sale);
            if (!s) return;
            state.saleId = s.id;
            state.screen = 'sale';
            render();
            window.scrollTo(0, 0);
          };
          el.addEventListener('click', go);
          if (el.getAttribute('role') === 'link') el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
        });
        page.querySelectorAll('[data-wash]').forEach((el) => el.addEventListener('click', () => {
          if (el.dataset.wash === state.wash.number) { state.screen = 'wash'; render(); window.scrollTo(0, 0); return; }
          toastInfo(`En la app abre el detalle del lavado ${el.dataset.wash}.`);
        }));
        page.querySelectorAll('[data-open-drawer]').forEach((b) => b.addEventListener('click', () => openDrawer(b.dataset.openDrawer)));
        page.querySelectorAll('[data-sales-tab]').forEach((b) => b.addEventListener('click', () => { state.salesFilter = b.dataset.salesTab; render(); }));

        // ---- nueva venta: nada toca el kardex hasta cobrar (RN-18) ----
        const d = state.sale;
        const sq = $('#sq', page);
        if (sq) sq.addEventListener('input', (e) => { d.search = e.target.value; render(); refocusPage('#sq'); });
        const scust = $('#scust', page);
        if (scust) scust.addEventListener('input', (e) => { d.customer = e.target.value; });
        page.querySelectorAll('[data-sstep]').forEach((b) => b.addEventListener('click', () => {
          const id = b.dataset.sstep;
          const next = Math.min(Math.max((d.cart[id] ?? 0) + Number(b.dataset.d), 0), item(id).stock);
          if (next === 0) { delete d.cart[id]; delete d.prices[id]; } else d.cart[id] = next;
          fitLines();
          render();
        }));
        page.querySelectorAll('[data-sremove]').forEach((b) => b.addEventListener('click', () => {
          delete d.cart[b.dataset.sremove];
          delete d.prices[b.dataset.sremove];
          fitLines();
          render();
        }));
        page.querySelectorAll('[data-method]').forEach((b) => b.addEventListener('click', () => { d.method = b.dataset.method; render(); }));
        const goSplit = $('#go-split', page);
        if (goSplit) goSplit.addEventListener('click', () => {
          // Arranca con el método elegido y el total: partir es quitarle a ese renglón.
          d.split = true;
          d.lines = [{ id: 'l' + seq++, method: d.method, cents: draftTotal(), raw: amt(draftTotal()) }];
          render();
        });
        const goSimple = $('#go-simple', page);
        if (goSimple) goSimple.addEventListener('click', () => { d.split = false; d.lines = []; render(); });
        const addLine = $('#add-pline', page);
        if (addLine) addLine.addEventListener('click', () => {
          const left = draftLeft();
          if (left <= 0) return;
          const used = d.lines.map((l) => l.method);
          const next = METHODS.find((m) => !used.includes(m.value)) ?? METHODS[0];
          d.lines.push({ id: 'l' + seq++, method: next.value, cents: left, raw: amt(left) });
          render();
        });
        page.querySelectorAll('[data-drop-pline]').forEach((b) => b.addEventListener('click', () => {
          d.lines = d.lines.filter((l) => l.id !== b.dataset.dropPline);
          if (!d.lines.length) d.split = false;
          render();
        }));
        page.querySelectorAll('[data-pline-method]').forEach((b) => b.addEventListener('click', () => {
          d.lines.find((l) => l.id === b.closest('[data-pline]').dataset.pline).method = b.dataset.plineMethod;
          render();
        }));
        // Montos: se teclea libre y se normaliza al salir del campo.
        page.querySelectorAll('[data-amount]').forEach((inp) => {
          const line = d.lines.find((l) => l.id === inp.dataset.amount);
          inp.addEventListener('input', (e) => { line.raw = e.target.value; line.cents = parseMoney(e.target.value); render(); refocusPage(`[data-amount="${line.id}"]`); });
          inp.addEventListener('change', (e) => { line.raw = amt(line.cents); e.target.value = line.raw; });
        });
        const tendered = $('#tendered', page);
        if (tendered) {
          tendered.addEventListener('input', (e) => { d.tenderedRaw = e.target.value; d.tendered = parseMoney(e.target.value); render(); refocusPage('#tendered'); });
          tendered.addEventListener('change', (e) => { d.tenderedRaw = d.tendered > 0 ? amt(d.tendered) : ''; e.target.value = d.tenderedRaw; });
        }
        document.querySelectorAll('[data-sale-charge]').forEach((b) => b.addEventListener('click', chargeSale));
      }
      function refocusPage(sel) {
        const el = $(sel, $('#page'));
        if (!el) return;
        const v = el.value.length;
        el.focus();
        try { el.setSelectionRange(v, v); } catch {}
      }
      function toastInfo(text) {
        const el = document.createElement('div');
        el.className = 'toast info';
        el.innerHTML = `${ICONS.bell}<span>${esc(text)}</span>`;
        $('#toasts').appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }
      function toastError(text) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.style.borderColor = 'color-mix(in oklab, var(--danger) 45%, transparent)';
        el.style.color = 'var(--danger-text)';
        el.innerHTML = `${ICONS.warn}<span>${esc(text)}</span>`;
        $('#toasts').appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }

      // Barra del prototipo
      $('#screen').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        state.screen = b.dataset.v;
        render();
        window.scrollTo(0, 0);
      });
      function segToggle(id, attr) {
        $(id).addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          document.documentElement.setAttribute(attr, b.dataset.v);
          $(id).querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        });
      }
      // Turno de caja: sin turno, la venta se arma pero no se cobra (409 CASH_NOT_OPEN).
      $('#shift').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        state.shiftOpen = b.dataset.v === 'open';
        $('#shift').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        render();
      });
      // Cajón de avisos
      $('#bell').addEventListener('click', () => openDrawer());
      $('#scrim').addEventListener('click', closeDrawer);
      $('#drawer').addEventListener('click', (e) => {
        const chip = e.target.closest('[data-nkind]');
        if (chip) { state.drawer.kind = chip.dataset.nkind; renderDrawer(); return; }
        const row = e.target.closest('[data-note]');
        if (row) {
          const n = NOTES.find((x) => x.id === row.dataset.note);
          n.read = true;
          if (n.type === 'low_stock') {
            // Toca → /inventory/:id con su kardex.
            closeDrawer();
            state.detailId = n.itemId;
            state.screen = 'detail';
            render();
            window.scrollTo(0, 0);
          } else {
            renderDrawer();
            renderBell();
            toastInfo(`En la app abre el detalle del lavado ${n.wo}.`);
          }
          return;
        }
        if (e.target.closest('#drawer-close')) { closeDrawer(); return; }
        if (e.target.closest('#mark-all')) { NOTES.forEach((x) => (x.read = true)); renderDrawer(); renderBell(); }
      });
      segToggle('#theme', 'data-theme');
      segToggle('#density', 'data-density');
      // Bahía se activa sola bajo 900px o con puntero grueso, como en la app.
      if (window.matchMedia('(max-width: 900px), (pointer: coarse)').matches) {
        document.documentElement.setAttribute('data-density', 'bahia');
        $('#density').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.v === 'bahia')));
      }
      $('#overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeDialog(); });
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (dlg.kind) closeDialog();
        else if (state.drawer.open) closeDrawer();
      });

      render();
    </script>
  </body>
</html>
