<!doctype html>
<html lang="es" data-theme="dark" data-density="mostrador">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elite Service — inventario, ventas sueltas y avisos (spec 065)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,600;0,700;1,600;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* =====================================================================
       * Tokens — copiados de apps/web/src/app/globals.css. Ningún color,
       * radio, sombra ni duración nace fuera de este bloque.
       * =================================================================== */
      :root {
        --bg: #070e1c;
        --surface: #0b1730;
        --surface-2: #101e3c;
        --surface-3: #152747;
        --line: #1e3358;
        --line-soft: #182b4c;
        --rail: #050a15;
        --plate-bg: #0e1b33;

        --text: #eaf0fa;
        --text-dim: #8fa4c6;
        --text-faint: #7387ac;

        --flame: #f04e23;
        --flame-hot: #f58220;
        --flame-deep: #c4161c;
        --flame-text: #f58220;
        --gradient-action: linear-gradient(
          100deg,
          var(--flame-hot),
          var(--flame) 55%,
          var(--flame-deep)
        );
        --on-flame: #ffffff;

        --go: #2fbf7c;
        --go-text: #2fbf7c;
        --danger: #a8232b;
        --danger-text: #f08089;
        --warn: #e5a64b;
        --warn-text: #e5a64b;

        --overlay: color-mix(in srgb, var(--bg) 80%, transparent);

        --radius-sm: 6px;
        --radius-control: 10px;
        --radius-row: 12px;
        --radius-card: 14px;

        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
        --duration-state: 140ms;
        --duration-enter: 180ms;

        --row-h: 52px;
        --control-h: 40px;
        --touch-min: 36px;
        --plate-pad: 16px;
        --icon-size: 16px;
        --field-px: 16px;
        --field-pt: 8px;
        --field-pb: 10px;
      }
      [data-theme='light'] {
        --bg: #eef1f6;
        --surface: #ffffff;
        --surface-2: #f6f8fc;
        --surface-3: #e6ebf3;
        --line: #d9e0ec;
        --line-soft: #e6ebf3;
        --rail: #0b1730;
        --plate-bg: #f1f4fa;
        --text: #0b1730;
        --text-dim: #4e5d77;
        --text-faint: #626c80;
        --flame-text: #a8480c;
        --go-text: #0f6b41;
        --danger-text: #a8232b;
        --warn-text: #8a5510;
      }
      [data-density='mostrador'] {
        --row-h: 52px;
        --control-h: 40px;
        --touch-min: 36px;
        --plate-pad: 16px;
        --icon-size: 16px;
        --field-px: 16px;
        --field-pt: 8px;
        --field-pb: 10px;
      }
      [data-density='bahia'] {
        --row-h: 56px;
        --control-h: 48px;
        --touch-min: 44px;
        --plate-pad: 20px;
        --icon-size: 20px;
        --field-px: 18px;
        --field-pt: 10px;
        --field-pb: 12px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 14.5px;
        line-height: 21px;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--flame-hot);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }

      /* ---- tipografía ---- */
      .t-display {
        font-family: Saira, 'Arial Narrow', system-ui, sans-serif;
        font-style: italic;
        font-weight: 800;
        font-size: 38px;
        line-height: 0.95;
        letter-spacing: -0.01em;
        margin: 0;
      }
      @media (max-width: 900px) {
        .t-display {
          font-size: 30px;
        }
      }
      .t-figure {
        font-family: Saira, 'Arial Narrow', system-ui, sans-serif;
        font-style: italic;
        font-weight: 700;
        font-size: 30px;
        line-height: 1.1;
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .t-headline {
        font-size: 21px;
        line-height: 27px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .t-title {
        font-size: 17px;
        line-height: 23px;
        font-weight: 600;
        margin: 0;
      }
      .t-dense {
        font-size: 12.5px;
        line-height: 18px;
      }
      .t-label {
        font-size: 12px;
        line-height: 16px;
        font-weight: 600;
      }
      .faint {
        color: var(--text-faint);
      }
      .dim {
        color: var(--text-dim);
      }
      .num {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-weight: 700;
        letter-spacing: 0.06em;
        font-size: 13px;
        color: var(--text-dim);
      }
      .pos {
        color: var(--go-text);
      }
      .neg {
        color: var(--danger-text);
      }

      /* ---- barra del prototipo (no es parte del sistema) ---- */
      .proto {
        position: sticky;
        top: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 9px 14px;
        background: var(--rail);
        color: #e6edf9;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .proto b {
        font-family: Saira, sans-serif;
        font-style: italic;
        font-size: 16px;
      }
      .proto .spacer {
        margin-left: auto;
      }
      .seg {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .seg > span {
        font-size: 11.5px;
        color: #7c8cab;
        font-weight: 600;
      }
      .seg-btns {
        display: flex;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        padding: 3px;
        gap: 2px;
        flex-wrap: wrap;
      }
      .seg-btns button {
        border: 0;
        background: transparent;
        color: #a8b6ce;
        padding: 6px 13px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color var(--duration-state) var(--ease-standard);
      }
      .seg-btns button[aria-pressed='true'] {
        background: var(--gradient-action);
        color: #fff;
      }

      /* ---- estructura de pantalla ---- */
      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 30px 34px 130px;
      }
      @media (max-width: 900px) {
        .page {
          padding: 22px 16px 130px;
        }
      }
      .page-head {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .page-head .sub {
        margin: 6px 0 0;
        color: var(--text-dim);
      }
      .page-head .actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      @media (max-width: 900px) {
        .page-head .actions {
          width: 100%;
          margin-left: 0;
        }
        .page-head .actions .btn {
          flex: 1 1 auto;
        }
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: var(--touch-min);
        color: var(--text-dim);
        text-decoration: none;
        border: 0;
        background: transparent;
        padding: 0;
        cursor: pointer;
        font-weight: 500;
        margin-bottom: 6px;
      }
      .back:hover {
        color: var(--flame-text);
      }
      .back svg {
        width: var(--icon-size);
        height: var(--icon-size);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-card);
        padding: 22px;
      }
      .card + .card {
        margin-top: 16px;
      }
      .card-title {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding-bottom: 10px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--line-soft);
      }
      .card-title .aside {
        margin-left: auto;
        color: var(--text-faint);
        font-size: 12.5px;
      }

      /* ---- stats ---- */
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      @media (max-width: 1180px) {
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-card);
        padding: 16px 18px;
      }
      .stat .k {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-faint);
        margin-bottom: 6px;
      }
      .stat .v {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .stat .v small {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-faint);
      }
      .stat.low .t-figure {
        color: var(--danger-text);
      }

      /* ---- pestañas ---- */
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line-soft);
        margin-bottom: 14px;
      }
      .tab {
        position: relative;
        min-height: var(--touch-min);
        padding: 6px 14px;
        border: 0;
        background: transparent;
        color: var(--text-faint);
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .tab .cnt {
        font-size: 12px;
        color: var(--text-faint);
        font-weight: 500;
      }
      .tab[aria-selected='true'] {
        color: var(--text);
      }
      .tab[aria-selected='true']::after {
        content: '';
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: -1px;
        height: 2.5px;
        background: var(--gradient-action);
        border-radius: 2px;
      }

      /* ---- filtros ---- */
      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        min-height: var(--control-h);
        padding: var(--field-pt) var(--field-px) var(--field-pb);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        min-width: 0;
      }
      .field:focus-within {
        border-color: var(--flame);
      }
      .field.invalid {
        border-color: var(--danger);
      }
      .field label {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text-dim);
        line-height: 16px;
      }
      .field input,
      .field select,
      .field textarea {
        border: 0;
        outline: 0;
        background: transparent;
        padding: 0;
        width: 100%;
        min-width: 0;
        line-height: 21px;
      }
      .field select {
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
      }
      .field textarea {
        resize: vertical;
        min-height: 42px;
      }
      .field.num input {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .field .with-unit {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .field .with-unit span {
        color: var(--text-faint);
        font-size: 12.5px;
        white-space: nowrap;
      }
      .field-error {
        margin: 6px 0 0;
        font-size: 12.5px;
        line-height: 18px;
        color: var(--danger-text);
      }
      .filters .field {
        flex: 1 1 240px;
      }
      .chip-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: var(--control-h);
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--text-dim);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .chip-toggle[aria-pressed='true'] {
        color: var(--danger-text);
        border-color: color-mix(in oklab, var(--danger) 45%, transparent);
        background: color-mix(in oklab, var(--danger) 12%, var(--surface-2));
      }
      .chip-toggle .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: currentColor;
      }

      /* ---- chips de estado (Stamp) ---- */
      .stamp {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 11.5px;
        font-weight: 600;
        white-space: nowrap;
        color: var(--tone, var(--text-dim));
        background: color-mix(in oklab, var(--tone, var(--text-dim)) 12%, transparent);
        border: 1px solid color-mix(in oklab, var(--tone, var(--text-dim)) 40%, transparent);
      }
      .stamp::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: currentColor;
      }
      .stamp.green {
        --tone: var(--go-text);
      }
      .stamp.red {
        --tone: var(--danger-text);
      }
      .stamp.amber {
        --tone: var(--warn-text);
      }
      .stamp.flame {
        --tone: var(--flame-text);
      }
      .stamp.neutral {
        --tone: var(--text-dim);
      }

      /* ---- lista (DataTable) ---- */
      .table {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-row);
        overflow: hidden;
      }
      .thead,
      .row {
        display: grid;
        grid-template-columns: var(--cols);
        gap: 12px;
        align-items: center;
        padding: 0 18px;
      }
      .thead {
        background: var(--surface-2);
        border-bottom: 1px solid var(--line);
        min-height: 40px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-faint);
      }
      .row {
        min-height: var(--row-h);
        border-bottom: 1px solid var(--line-soft);
        cursor: pointer;
        transition: background-color var(--duration-state) var(--ease-standard);
      }
      .row.static {
        cursor: default;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row:hover {
        background: var(--surface-2);
      }
      .row.static:hover {
        background: transparent;
      }
      .cell {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cell.r {
        text-align: right;
      }
      .cell .l {
        display: none;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-faint);
        margin-right: 6px;
      }
      .cell .name {
        display: block;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cell .sub {
        display: block;
        font-size: 12.5px;
        line-height: 18px;
        color: var(--text-faint);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cell.wrap {
        white-space: normal;
      }
      .empty {
        border: 1px dashed var(--line);
        border-radius: var(--radius-row);
        padding: 28px 20px;
        text-align: center;
        background: var(--surface);
      }
      .empty p {
        margin: 4px 0 0;
        color: var(--text-dim);
        font-size: 12.5px;
      }
      @media (max-width: 900px) {
        .thead {
          display: none;
        }
        .row {
          grid-template-columns: 1fr 1fr;
          padding: 12px 16px;
          row-gap: 6px;
        }
        .row .cell:first-child,
        .row .cell.full {
          grid-column: 1 / -1;
        }
        .cell.r {
          text-align: left;
        }
        .cell .l {
          display: inline;
        }
        .cell.hide-compact {
          display: none;
        }
      }

      /* ---- botones ---- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: var(--control-h);
        padding: 0 20px;
        border-radius: var(--radius-control);
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color var(--duration-state) var(--ease-standard),
          border-color var(--duration-state) var(--ease-standard);
      }
      .btn svg {
        width: var(--icon-size);
        height: var(--icon-size);
      }
      .btn:hover {
        border-color: var(--flame);
      }
      .btn.primary {
        background: var(--gradient-action);
        border-color: transparent;
        color: var(--on-flame);
      }
      .btn.primary:hover {
        filter: brightness(1.1);
      }
      .btn.primary:active {
        transform: translateY(1px);
      }
      .btn.primary:disabled,
      .btn:disabled {
        background: var(--surface-2);
        color: var(--text-faint);
        border-color: var(--line);
        cursor: not-allowed;
        filter: none;
      }
      .btn.destructive {
        color: var(--danger-text);
        background: color-mix(in oklab, var(--danger) 12%, transparent);
        border-color: color-mix(in oklab, var(--danger) 40%, transparent);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--text-dim);
      }
      .btn.small {
        min-height: var(--touch-min);
        padding: 0 12px;
        font-size: 13px;
      }
      .btn.block {
        width: 100%;
      }

      /* ---- stepper (− N +) ---- */
      .stepper {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        background: var(--surface);
        overflow: hidden;
      }
      .stepper button {
        width: var(--touch-min);
        height: var(--touch-min);
        border: 0;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        display: grid;
        place-items: center;
        font-size: 18px;
        font-weight: 600;
      }
      .stepper button:hover {
        background: var(--surface-2);
      }
      .stepper button:disabled {
        color: var(--text-faint);
        cursor: not-allowed;
        background: transparent;
      }
      .stepper .q {
        min-width: 34px;
        text-align: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .stepper.on {
        border-color: var(--flame);
      }

      /* ---- bloque de productos en el lavado ---- */
      .wash {
        display: grid;
        gap: 16px;
        grid-template-columns: minmax(0, 1fr) 340px;
        align-items: start;
      }
      @media (max-width: 1180px) {
        .wash {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .side {
        position: sticky;
        top: 70px;
      }
      @media (max-width: 1180px) {
        .side {
          display: none;
        }
      }
      .svc {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: var(--row-h);
        padding: 8px var(--field-px);
        background: var(--surface-2);
        border: 1.5px solid var(--flame);
        border-radius: var(--radius-row);
        margin-top: 8px;
      }
      .svc .name {
        flex: 1;
        font-weight: 600;
      }
      .prod {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: var(--row-h);
        padding: 8px var(--field-px);
        background: var(--surface-2);
        border: 1.5px solid var(--line);
        border-radius: var(--radius-row);
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .prod.on {
        border-color: var(--flame);
        background: color-mix(in oklab, var(--flame) 10%, var(--surface-2));
      }
      .prod.out {
        opacity: 0.7;
      }
      .prod .info {
        flex: 1 1 180px;
        min-width: 0;
      }
      .prod .info .name {
        display: block;
        font-weight: 600;
      }
      .prod .info .sub {
        display: block;
        font-size: 12.5px;
        line-height: 18px;
        color: var(--text-faint);
      }
      .prod .price {
        min-width: 70px;
        text-align: right;
      }
      [data-density='bahia'] .prod .info .name,
      [data-density='bahia'] .svc .name {
        font-size: 16px;
      }
      .sum-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
      }
      .sum-row.line {
        border-top: 1px solid var(--line-soft);
        margin-top: 4px;
        padding-top: 10px;
      }
      .sum-total {
        border-top: 1px solid var(--line);
        margin-top: 8px;
        padding-top: 12px;
      }

      /* ---- avisos ---- */
      .callout {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-bottom: 14px;
        padding: 10px var(--field-px);
        border-radius: var(--radius-row);
        border: 1px solid color-mix(in oklab, var(--warn) 40%, transparent);
        background: color-mix(in oklab, var(--warn) 10%, transparent);
        color: var(--warn-text);
        font-size: 12.5px;
        line-height: 18px;
      }
      .callout.bad {
        border-color: color-mix(in oklab, var(--danger) 45%, transparent);
        background: color-mix(in oklab, var(--danger) 10%, transparent);
        color: var(--danger-text);
      }
      .callout svg {
        flex: 0 0 auto;
        width: var(--icon-size);
        height: var(--icon-size);
        margin-top: 1px;
      }
      .callout .x {
        margin-left: auto;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        min-width: var(--touch-min);
        min-height: var(--touch-min);
        margin: -8px -8px -8px auto;
        display: grid;
        place-items: center;
      }
      .callout .x svg {
        margin: 0;
      }

      /* ---- barra inferior (tablet / bahía) ---- */
      .bottombar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        align-items: center;
        gap: 12px;
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        background: var(--surface);
        border-top: 1px solid var(--line);
        z-index: 40;
      }
      @media (max-width: 1180px) {
        .bottombar.show {
          display: flex;
        }
      }
      .bottombar .t-figure {
        font-size: 26px;
      }
      .bottombar .btn {
        margin-left: auto;
      }

      /* ---- diálogo ---- */
      .overlay {
        position: fixed;
        inset: 0;
        background: var(--overlay);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 80;
      }
      @media (min-width: 900px) {
        .overlay {
          align-items: center;
          padding: 24px;
        }
      }
      .overlay.open {
        display: flex;
      }
      .modal {
        width: 100%;
        max-width: 560px;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-card) var(--radius-card) 0 0;
        overflow: hidden;
      }
      @media (min-width: 900px) {
        .modal {
          border-radius: var(--radius-card);
        }
      }
      .modal header,
      .modal footer {
        padding: 16px var(--field-px);
      }
      .modal header {
        border-bottom: 1px solid var(--line-soft);
      }
      .modal .body {
        padding: 16px var(--field-px);
        overflow: auto;
        display: grid;
        gap: 12px;
      }
      .modal footer {
        border-top: 1px solid var(--line-soft);
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
      }
      @media (max-width: 900px) {
        .modal footer .btn {
          flex: 1;
        }
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      @media (max-width: 520px) {
        .grid2 {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .kind-pick {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .kind {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-height: var(--control-h);
        padding: 10px 14px;
        border-radius: var(--radius-control);
        border: 1.5px solid var(--line);
        background: var(--surface-2);
        color: var(--text-dim);
        text-align: left;
        cursor: pointer;
      }
      .kind b {
        color: var(--text);
      }
      .kind small {
        font-size: 12px;
        line-height: 16px;
        color: var(--text-faint);
      }
      .kind[aria-checked='true'] {
        border-color: var(--flame);
        background: color-mix(in oklab, var(--flame) 12%, var(--surface-2));
      }
      .preview {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 10px var(--field-px);
        border-radius: var(--radius-row);
        border: 1px solid var(--line-soft);
        background: var(--surface-2);
      }
      .preview .v {
        font-family: Saira, 'Arial Narrow', system-ui, sans-serif;
        font-style: italic;
        font-weight: 700;
        font-size: 26px;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .preview.bad .v {
        color: var(--danger-text);
      }
      .alert {
        margin: 0;
        padding: 10px var(--field-px);
        border-radius: var(--radius-row);
        border: 1px solid color-mix(in oklab, var(--danger) 45%, transparent);
        background: color-mix(in oklab, var(--danger) 10%, transparent);
        color: var(--danger-text);
        font-size: 12.5px;
        line-height: 18px;
      }

      /* ---- toast ---- */
      .toasts {
        position: fixed;
        right: 20px;
        bottom: 20px;
        display: grid;
        gap: 8px;
        z-index: 90;
      }
      @media (max-width: 900px) {
        .toasts {
          left: 16px;
          right: 16px;
          top: 60px;
          bottom: auto;
        }
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: var(--radius-row);
        background: var(--surface);
        border: 1px solid color-mix(in oklab, var(--go) 45%, transparent);
        color: var(--go-text);
        font-size: 13px;
        font-weight: 600;
        animation: toast-in var(--duration-enter) var(--ease-standard);
      }
      .toast svg {
        width: 16px;
        height: 16px;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .hidden {
        display: none !important;
      }

      /* ---- enlaces a lavado / venta dentro del kardex ---- */
      .ref-link {
        display: inline;
        border: 0;
        background: transparent;
        padding: 0;
        cursor: pointer;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-weight: 700;
        letter-spacing: 0.04em;
        font-size: 13px;
        color: var(--flame-text);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      [data-density='bahia'] .ref-link {
        display: inline-flex;
        align-items: center;
        min-height: var(--touch-min);
        padding: 0 6px;
        font-size: 14px;
      }

      /* ---- barra de la app (solo la campana) ---- */
      .appbar {
        border-bottom: 1px solid var(--line-soft);
        background: var(--surface);
      }
      .appbar .inner {
        max-width: 1180px;
        margin: 0 auto;
        padding: 8px 34px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      @media (max-width: 900px) {
        .appbar .inner {
          padding: 8px 16px;
        }
      }
      .bell {
        position: relative;
        margin-left: auto;
        display: grid;
        place-items: center;
        width: var(--control-h);
        height: var(--control-h);
        border-radius: var(--radius-control);
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--text-dim);
        cursor: pointer;
      }
      .bell:hover {
        border-color: var(--flame);
        color: var(--text);
      }
      .bell svg {
        width: var(--icon-size);
        height: var(--icon-size);
      }
      .bell .badge {
        position: absolute;
        top: -6px;
        right: -6px;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--gradient-action);
        color: var(--on-flame);
        font-size: 11.5px;
        font-weight: 700;
        line-height: 20px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .bell.ring svg {
        animation: ring 600ms var(--ease-standard);
      }
      @keyframes ring {
        0%,
        100% {
          transform: rotate(0);
        }
        20% {
          transform: rotate(14deg);
        }
        40% {
          transform: rotate(-12deg);
        }
        60% {
          transform: rotate(8deg);
        }
        80% {
          transform: rotate(-4deg);
        }
      }

      /* ---- cajón de avisos (058, simplificado) ---- */
      .scrim {
        position: fixed;
        inset: 0;
        background: var(--overlay);
        z-index: 70;
        display: none;
      }
      .scrim.open {
        display: block;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(460px, 100%);
        z-index: 71;
        display: none;
        flex-direction: column;
        background: var(--surface);
        border-left: 1px solid var(--line-soft);
      }
      .drawer.open {
        display: flex;
        animation: drawer-in var(--duration-enter) var(--ease-standard);
      }
      @keyframes drawer-in {
        from {
          transform: translateX(16px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @media (max-width: 900px) {
        .drawer {
          top: auto;
          left: 0;
          width: 100%;
          max-height: 88vh;
          border-left: 0;
          border-top: 1px solid var(--line-soft);
          border-radius: var(--radius-card) var(--radius-card) 0 0;
        }
      }
      .drawer header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px var(--field-px) 12px;
        border-bottom: 1px solid var(--line-soft);
      }
      .drawer header p {
        margin: 2px 0 0;
      }
      .drawer .chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 12px var(--field-px);
        border-bottom: 1px solid var(--line-soft);
      }
      .drawer .chips::-webkit-scrollbar {
        display: none;
      }
      .nchip {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: var(--control-h);
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text-dim);
        font-size: 12.5px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
      }
      .nchip:hover {
        border-color: var(--flame);
      }
      .nchip[aria-pressed='true'] {
        border-color: var(--flame);
        background: color-mix(in srgb, var(--flame) 12%, transparent);
        color: var(--text);
      }
      .nchip .n {
        font-size: 11.5px;
        color: var(--text-faint);
        font-variant-numeric: tabular-nums;
      }
      .nchip[aria-pressed='true'] .n {
        color: var(--flame-text);
      }
      .drawer .nlist {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px var(--field-px) 16px;
      }
      .note {
        display: flex;
        gap: 12px;
        width: 100%;
        align-items: flex-start;
        min-height: var(--row-h);
        padding: 12px 14px;
        margin-top: 8px;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-row);
        background: var(--surface-2);
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .note:hover {
        background: var(--surface-3);
        border-color: var(--line);
      }
      .note .time {
        flex: none;
        width: 64px;
        padding-top: 4px;
        font-size: 12.5px;
        color: var(--text-faint);
        font-variant-numeric: tabular-nums;
      }
      .note .ico {
        flex: none;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        color: var(--text-dim);
        background: var(--surface-3);
      }
      .note .ico svg {
        width: 15px;
        height: 15px;
      }
      .note .ico.go {
        color: var(--go-text);
      }
      .note .ico.danger {
        color: var(--danger-text);
        background: color-mix(in oklab, var(--danger) 14%, transparent);
      }
      .note .body {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 2px;
      }
      .note .title {
        font-weight: 600;
      }
      .note .title.danger {
        color: var(--danger-text);
      }
      .note .title .qty {
        font-weight: 500;
        color: var(--text-dim);
      }
      .note .meta,
      .note .by {
        color: var(--text-faint);
      }
      .note .dot {
        flex: none;
        width: 8px;
        height: 8px;
        margin-top: 8px;
        border-radius: 999px;
        background: var(--flame);
      }
      .note.read .dot {
        visibility: hidden;
      }
      .note.read .title {
        font-weight: 500;
      }
      [data-density='bahia'] .note .title {
        font-size: 16px;
      }
      .drawer footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px var(--field-px) calc(12px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line-soft);
      }
      .drawer .empty {
        margin-top: 12px;
      }

      /* ---- venta suelta: líneas ---- */
      .icon-btn {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: var(--touch-min);
        height: var(--touch-min);
        border-radius: var(--radius-control);
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text-faint);
        cursor: pointer;
      }
      .icon-btn:hover {
        color: var(--danger-text);
        border-color: color-mix(in oklab, var(--danger) 55%, var(--line));
      }
      .icon-btn.lock:hover {
        color: var(--warn-text);
        border-color: color-mix(in oklab, var(--warn) 55%, var(--line));
      }
      .icon-btn svg {
        width: var(--icon-size);
        height: var(--icon-size);
      }
      .sline {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        min-height: var(--row-h);
        padding: 8px 0;
        border-bottom: 1px solid var(--line-soft);
      }
      .sline:last-child {
        border-bottom: 0;
      }
      .sline .info {
        flex: 1 1 200px;
        min-width: 0;
      }
      .sline .info .name {
        display: block;
        font-weight: 600;
      }
      .sline .info .sub {
        display: block;
        font-size: 12.5px;
        line-height: 18px;
        color: var(--text-faint);
      }
      .sline .formula {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        color: var(--text-dim);
      }
      .sline .formula b {
        font-weight: 700;
        color: var(--text);
      }
      .sline.link {
        cursor: pointer;
      }
      .sline.link:hover .name {
        color: var(--flame-text);
      }
      .was {
        color: var(--text-faint);
        text-decoration: line-through;
        font-size: 12.5px;
      }
      .auth-note {
        color: var(--warn-text);
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .auth-note svg {
        width: 13px;
        height: 13px;
      }
      [data-density='bahia'] .sline .info .name {
        font-size: 16px;
      }
      [data-density='bahia'] .stepper .q {
        min-width: 44px;
        font-size: 17px;
      }
      [data-density='bahia'] .stepper button {
        font-size: 22px;
      }

      /* ---- bloque de pago de la 059 ---- */
      .btn.link {
        background: transparent;
        border: 0;
        color: var(--flame-text);
        padding: 0;
        min-height: var(--touch-min);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .methods {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
      }
      @media (max-width: 520px) {
        .methods {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .method {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: var(--control-h);
        padding: 8px 10px;
        border-radius: var(--radius-control);
        border: 1.5px solid var(--line);
        background: var(--surface-2);
        color: var(--text-dim);
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
      }
      [data-density='bahia'] .method {
        min-height: 52px;
        font-size: 15px;
      }
      .method svg {
        width: var(--icon-size);
        height: var(--icon-size);
      }
      .method[aria-checked='true'] {
        border-color: var(--flame);
        color: var(--text);
        background: color-mix(in oklab, var(--flame) 12%, var(--surface-2));
      }
      .plines {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }
      .pline {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px var(--field-px);
        background: var(--surface-2);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-row);
      }
      .pline .mini {
        display: flex;
        gap: 4px;
        background: var(--surface-3);
        border-radius: 999px;
        padding: 3px;
        flex: 1 1 auto;
      }
      .pline .mini button {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--text-faint);
        min-height: calc(var(--touch-min) - 6px);
        padding: 0 10px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      [data-density='bahia'] .pline .mini button {
        font-size: 14px;
      }
      .pline .mini button[aria-pressed='true'] {
        background: var(--gradient-action);
        color: #fff;
      }
      .money-field {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: var(--control-h);
        padding: 0 12px;
        border-radius: var(--radius-control);
        border: 1.5px solid var(--line);
        background: var(--surface);
        flex: 0 0 132px;
      }
      .money-field.wide {
        flex: 1 1 160px;
      }
      .money-field:focus-within {
        border-color: var(--flame);
      }
      .money-field span {
        color: var(--text-faint);
        font-weight: 600;
      }
      .money-field input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        text-align: right;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      [data-density='bahia'] .money-field input {
        font-size: 16px;
      }
      .cash-box {
        margin-top: 14px;
        padding: 14px var(--field-px);
        border-radius: var(--radius-row);
        border: 1px solid var(--line);
        background: var(--surface-2);
      }
      .cash-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .change {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .change .v {
        font-family: Saira, 'Arial Narrow', system-ui, sans-serif;
        font-style: italic;
        font-weight: 700;
        font-size: 30px;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .change.ok .v {
        color: var(--go-text);
      }
      .change.short .v {
        color: var(--danger-text);
      }
      .remaining {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        padding: 10px var(--field-px);
        border-radius: var(--radius-row);
        border: 1px solid var(--line-soft);
        background: var(--surface-2);
      }
      .remaining.ok {
        border-color: color-mix(in oklab, var(--go) 45%, transparent);
        background: color-mix(in oklab, var(--go) 10%, var(--surface-2));
      }
      .remaining.over {
        border-color: color-mix(in oklab, var(--danger) 45%, transparent);
        background: color-mix(in oklab, var(--danger) 10%, var(--surface-2));
      }
      .remaining .v {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .remaining.ok .v {
        color: var(--go-text);
      }
      .remaining.over .v {
        color: var(--danger-text);
      }
      .auth-block {
        padding: 12px var(--field-px) 14px;
        border-radius: var(--radius-row);
        border: 1px solid color-mix(in oklab, var(--warn) 35%, var(--line));
        background: color-mix(in oklab, var(--warn) 7%, transparent);
        display: grid;
        gap: 10px;
      }
      .auth-block > p {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--warn-text);
        font-size: 12px;
        font-weight: 600;
      }
      .auth-block > p svg {
        width: var(--icon-size);
        height: var(--icon-size);
      }
      .receipt-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: var(--row-h);

      const MOVE_META = {

      // =====================================================================
