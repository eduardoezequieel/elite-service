<!doctype html>
<!--
  Elite Service · Renta de carros simplificada: prototipo HTML aislado, todo en memoria.
  Sale de la auditoría de la renta (informes 01–14; manda el 14 (e)): Hoy 01 · Libre 02, 06 · Rentas 03–05 · Caja 07 · Carros 09–12.
  Tokens de apps/web/DESIGN.md, misma estructura que fleet-centralized.html. Pasada de recorte de texto pedida por el dueño.
-->
<html lang="es" data-theme="dark" data-density="mostrador">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elite Service — renta de carros simplificada (propuesta)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,600;0,700;1,600;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
/* ===========================================================================
 * Tokens: copiados tal cual de apps/web/src/app/globals.css (mismos nombres).
 * Solo se agregan los que el prototipo necesita y la app resuelve con
 * utilidades de Tailwind (--rail-line, --rail-fill, --backdrop, --hero-size…).
 * ========================================================================= */
:root {
  --bg: #070e1c; --surface: #0b1730; --surface-2: #101e3c; --surface-3: #152747;
  --line: #1e3358; --line-soft: #182b4c; --rail: #050a15; --plate-bg: #0e1b33;
  --text: #eaf0fa; --text-dim: #8fa4c6; --text-faint: #7387ac;
  --flame: #f04e23; --flame-hot: #f58220; --flame-deep: #c4161c; --flame-text: #f58220;
  --gradient-action: linear-gradient(100deg, var(--flame-hot), var(--flame) 55%, var(--flame-deep));
  --gradient-rail-active: linear-gradient(180deg, var(--flame-hot), var(--flame-deep));
  --gradient-bar-active: linear-gradient(90deg, var(--flame-hot), var(--flame-deep));
  --go: #2fbf7c; --go-text: #2fbf7c; --danger: #a8232b; --danger-text: #f08089;
  --warn: #e5a64b; --warn-text: #e5a64b; --info-text: #7fb0ff;
  --rail-text: #e6edf9; --rail-dim: #a8b6ce; --rail-faint: #7c8cab;
  --rail-line: rgb(255 255 255 / 0.06); --rail-fill: rgb(255 255 255 / 0.05);
  --on-flame: #ffffff;
  --rail-w: 248px; --active-mark: 3px; --tab-mark: 2.5px; --bottom-bar-h: 64px;
  --shadow-dialog: 0 24px 60px -12px rgb(0 0 0 / 0.85), 0 0 0 1px rgb(255 255 255 / 0.08);
  --backdrop: color-mix(in srgb, var(--bg) 80%, transparent);
  --radius-sm: 6px; --radius-control: 10px; --radius-row: 12px; --radius-card: 14px; --radius-pill: 999px;
  --nav-item-radius: 9px; --check-radius: 5px; --segment-radius: 7px; --bar-radius: 4px;
  --selectable-border: 1.5px;
  --page-max: 1440px; --page-px: 34px; --page-pt: 30px; --page-pb: 60px; --grid-gap: 18px;
  --card-pad: 22px;
  --display-size: 38px; --stat-size: 28px; --stat-size-wide: 32px; --stat-size-lg: 38px;
  --hero-size: clamp(40px, 5.2vw, 60px); /* la cifra grande de caja (cash.html) */
  --nav-badge-size: 10px; --nav-label-size: 11px; --count-size: 11.5px; --meta-size: 12px;
  --control-text-size: 13px; --lead-size: 16px;
  --plate-size-sm: 12px; --plate-size: 13.5px; --plate-size-lg: 16px;
  --tint-fill: 12%; --tint-line: 40%;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --duration-state: 140ms; --duration-enter: 180ms; --duration-mount: 280ms; --stagger-step: 35ms;
  --enter-rise: 8px; --duration-flash: 1.6s;
  /* Densidad: mostrador por defecto. */
  --row-h: 52px; --control-h: 40px; --touch-min: 36px; --plate-pad: 16px; --icon-size: 16px;
  --field-px: 16px; --field-pt: 8px; --field-pb: 10px;
  --body-size: 14.5px; --dense-size: 12.5px; --title-size: 17px; --headline-size: 21px;
  --diagram-w: 240px;
  --font-sans: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-display: Saira, 'Arial Narrow', system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
[data-theme='light'] {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f6f8fc; --surface-3: #e6ebf3;
  --line: #d9e0ec; --line-soft: #e6ebf3; --rail: #0b1730; --plate-bg: #f1f4fa;
  --text: #0b1730; --text-dim: #4e5d77; --text-faint: #626c80;
  --flame-text: #a8480c; --go-text: #0f6b41; --danger-text: #a8232b; --warn-text: #8a5510; --info-text: #1d4ed8;
  --shadow-dialog: 0 24px 60px -12px rgb(11 23 48 / 0.28), 0 2px 8px -2px rgb(11 23 48 / 0.12), 0 0 0 1px rgb(11 23 48 / 0.08);
  --backdrop: rgb(0 0 0 / 0.45);
}
[data-density='bahia'] {
  --row-h: 56px; --control-h: 48px; --touch-min: 44px; --plate-pad: 20px; --icon-size: 20px;
  --field-px: 18px; --field-pt: 10px; --field-pb: 12px;
  --stat-size: var(--stat-size-lg); --stat-size-wide: var(--stat-size-lg);
  --body-size: 15.5px; --dense-size: 14px; --title-size: 18px; --headline-size: 24px;
  --plate-size: 15px; --plate-size-lg: 18px;
  --diagram-w: 320px; --page-pb: 120px;
}

/* ---------- Base ---------- */
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: var(--body-size); line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden }
button, input, select, textarea { font: inherit; color: inherit }
button { -webkit-tap-highlight-color: transparent }
a { color: inherit }
:focus-visible { outline: 2px solid var(--flame-hot); outline-offset: 2px }
::selection { background: color-mix(in srgb, var(--flame) 28%, transparent) }
svg.i { width: var(--icon-size); height: var(--icon-size); stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums }
.dim { color: var(--text-dim) }
.faint { color: var(--text-faint) }
.dense { font-size: var(--dense-size); line-height: 1.4 }
.hidden { display: none !important }
.nowrap { white-space: nowrap }
.red { color: var(--danger-text) }
.go { color: var(--go-text) }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.tint { background-color: color-mix(in oklab, currentColor var(--tint-fill), transparent); border-color: color-mix(in oklab, currentColor var(--tint-line), transparent) }

/* ---------- Barra del prototipo (fuera de la app) ---------- */
.proto-bar { position: sticky; top: 0; z-index: 45; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: #02050c; color: #e6edf9; border-bottom: 1px solid #1e3358; font-size: 13px }
.proto-bar strong { font-weight: 600; margin-right: auto }
.seg { display: inline-flex; border: 1px solid #1e3358; border-radius: var(--radius-control); overflow: hidden }
.seg button { min-height: 32px; padding: 0 12px; border: 0; background: transparent; color: #a8b6ce; cursor: pointer; font-size: 12.5px; font-weight: 600 }
.seg button[aria-pressed='true'] { background: #152747; color: #e6edf9; box-shadow: inset 0 -2px 0 #f04e23 }

/* ---------- Armazón: riel (AppShell / NavRail) ---------- */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100vh }
.rail { position: sticky; top: var(--proto-h, 0px); height: calc(100vh - var(--proto-h, 0px)); overflow-y: auto; background: var(--rail); color: var(--rail-dim); border-right: 1px solid var(--rail-line); display: flex; flex-direction: column; gap: 24px; padding: 16px 14px }
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 6px; color: var(--rail-text) }
.logo svg { width: 46px; height: 28px; flex: none }
.wordmark { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 21px; line-height: 0.88; letter-spacing: 0.01em; color: var(--rail-text) }
.wordmark small { display: block; font-size: 11.5px; font-weight: 700; color: var(--rail-dim); letter-spacing: 0.2em; margin-top: 2px }
.ws-btn { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 10px; border-radius: var(--nav-item-radius); background: rgb(255 255 255 / 0.05); border: 1px solid rgb(255 255 255 / 0.08); color: var(--rail-text); font-weight: 500 }
.ws-btn .flame { color: var(--flame); display: inline-flex }
.ws-btn span.grow { flex: 1 }
.nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.nav-item { position: relative; width: 100%; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 10px; border-radius: var(--nav-item-radius); border: 0; background: none; color: var(--rail-dim); cursor: pointer; font-weight: 500; font-size: 14.5px; text-align: left; transition: background-color var(--duration-state) var(--ease-standard), color var(--duration-state) var(--ease-standard) }
.nav-item svg.i { opacity: 0.8 }
.nav-item:hover { background: var(--rail-fill); color: var(--rail-text) }
.nav-item[aria-current='page'] { background: color-mix(in srgb, var(--flame) 14%, transparent); color: #fff }
.nav-item[aria-current='page'] svg.i { color: var(--flame); opacity: 1 }
.nav-item[aria-current='page']::before { content: ''; position: absolute; left: -14px; top: 8px; bottom: 8px; width: var(--active-mark); border-radius: 0 var(--active-mark) var(--active-mark) 0; background: var(--gradient-rail-active) }
.count { margin-left: auto; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 22px; padding: 1px 7px; border-radius: var(--radius-pill); background: rgb(255 255 255 / 0.09); color: var(--rail-text); text-align: center }
.nav-item[aria-current='page'] .count { background: var(--flame); color: #fff }
.rail-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid rgb(255 255 255 / 0.07) }
.rail-foot .menu-wrap { display: block }
.rail-foot .who { width: 100%; justify-content: flex-start; border: 0; background: none; color: var(--rail-dim); padding: 0 10px; border-radius: var(--radius-control) }
.rail-foot .who:hover { background: rgb(255 255 255 / 0.06); color: var(--rail-text) }
.rail-foot .who .grow { flex: 1; text-align: left }
.rail-foot .menu { top: auto; bottom: calc(100% + 8px); left: 0; right: 0; min-width: 0 }
.bottom-bar { display: none }

/* ---------- Página ---------- */
.page { width: 100%; max-width: var(--page-max); margin: 0 auto; padding: var(--page-pt) var(--page-px) var(--page-pb); min-width: 0 }
.topbar { display: none; align-items: center; gap: 12px; min-height: 48px; margin-bottom: 18px }
.topbar .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text) }
.topbar .brand svg { width: 40px; height: 24px }
.topbar .brand .wordmark { color: var(--text); font-size: 19px }
.topbar .brand .wordmark small { color: var(--text-faint) }
.topbar .spacer { flex: 1 }
.who { display: inline-flex; align-items: center; gap: 8px; min-height: var(--touch-min); padding: 0 12px 0 10px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface-2); cursor: pointer; font-weight: 600; font-size: var(--dense-size) }
.who:hover { border-color: var(--flame) }

/* Entrada en cascada (088): cada pieza sube 8px, un paso tras otro. */
@keyframes elite-enter-rise { from { opacity: 0; transform: translateY(var(--enter-rise)) } }
@keyframes elite-surface-in { from { opacity: 0; transform: scale(0.97) } }
@keyframes elite-fade-in { from { opacity: 0 } }
@keyframes elite-sheet-in { from { transform: translateY(100%) } }
@keyframes elite-toast-in { from { opacity: 0; transform: translateY(12px) } }
@keyframes elite-flash { from { background-color: color-mix(in oklab, var(--flame-text) 18%, transparent) } }
.enter > * { animation: elite-enter-rise var(--duration-mount) var(--ease-standard) backwards }
.enter > *:nth-child(2) { animation-delay: calc(1 * var(--stagger-step)) }
.enter > *:nth-child(3) { animation-delay: calc(2 * var(--stagger-step)) }
.enter > *:nth-child(4) { animation-delay: calc(3 * var(--stagger-step)) }
.enter > *:nth-child(n + 5) { animation-delay: calc(4 * var(--stagger-step)) }
.enter .day-grid > .card:nth-child(2), .enter .cash-top > .card:nth-child(2), .enter .detail > .stack:nth-child(2) { animation: elite-enter-rise var(--duration-mount) var(--ease-standard) calc(2 * var(--stagger-step)) backwards }
.enter .day-grid > .card:nth-child(3) { animation: elite-enter-rise var(--duration-mount) var(--ease-standard) calc(3 * var(--stagger-step)) backwards }

/* ---------- Cabecera de pantalla (ScreenHeader) ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; margin: 0 0 4px -4px; padding: 0 4px; color: var(--text-dim); background: none; border: 0; cursor: pointer; min-height: var(--touch-min); font-size: var(--dense-size); border-radius: var(--radius-control) }
.back:hover { color: var(--text) }
.screen-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 20px; margin: 0 0 24px; min-height: 48px }
h1 { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: var(--display-size); line-height: 0.95; letter-spacing: -0.01em; margin: 0 }
.head-plate + h1 { margin-top: 10px }
.subtitle { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 10px; color: var(--text-dim) }
.head-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
h2.section-title { font-size: var(--title-size); line-height: 1.35; font-weight: 600; margin: 0 }
.section { display: grid; gap: 12px; margin-top: 28px }
.section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px }

/* ---------- Chip de placa (PlateChip) y referencia ---------- */
.plate { display: inline-block; width: fit-content; font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; font-size: var(--plate-size); line-height: 1.2; padding: 4px 9px; background: var(--plate-bg); border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--text); white-space: nowrap }
.plate.sm { font-size: var(--plate-size-sm); padding: 2px 8px }
.plate.lg { font-size: var(--plate-size-lg); padding: 5px 12px }
.ref { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-faint); font-size: var(--plate-size) }

/* ---------- Sello de estado (Stamp): punto + palabra, .tint ---------- */
.stamp { display: inline-flex; align-items: center; justify-content: center; gap: 7px; width: fit-content; padding: 4px 11px; border: 1px solid; border-radius: var(--radius-pill); font-size: var(--dense-size); line-height: 1.35; font-weight: 600; white-space: nowrap; background-color: color-mix(in oklab, currentColor var(--tint-fill), transparent); border-color: color-mix(in oklab, currentColor var(--tint-line), transparent) }
.stamp::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none }
.head-plate .stamp { padding: 6px 14px; gap: 8px; font-size: var(--body-size) }
.t-green { color: var(--go-text) }
.t-amber { color: var(--warn-text) }
.t-red { color: var(--danger-text) }
.t-neutral { color: var(--text-dim) }
.t-info { color: var(--info-text) }
.t-flame { color: var(--flame-text) }
.notice { display: inline-flex; align-items: center; gap: 6px; font-size: var(--dense-size); font-weight: 600 }
.notice svg.i { width: 15px; height: 15px }
.notices { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px }

/* ---------- Botón (Button) ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--control-h); min-height: var(--touch-min); padding: 0 20px; border-radius: var(--radius-control); border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-size: var(--body-size); font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; transition: filter var(--duration-state) var(--ease-standard), background-color var(--duration-state) var(--ease-standard), border-color var(--duration-state) var(--ease-standard), color var(--duration-state) var(--ease-standard) }
.btn:has(> svg.i) { padding: 0 16px }
.btn:hover { border-color: var(--flame) }
.btn:active { transform: translateY(1px) }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; border-color: var(--line); pointer-events: none }
.btn.primary { background-image: var(--gradient-action); background-origin: border-box; background-repeat: no-repeat; color: var(--on-flame); border-color: transparent }
.btn.primary:hover { filter: brightness(1.1) }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-dim); padding: 0 10px }
.btn.ghost:hover { color: var(--text); background: var(--surface-2) }
.btn.sm { height: calc(var(--control-h) - 6px); padding: 0 14px; font-size: var(--dense-size); gap: 6px }
.btn.sm:has(> svg.i) { padding: 0 12px }
.btn.ghost.sm[aria-label] { width: calc(var(--control-h) - 6px); padding: 0 }
.btn.lg { height: calc(var(--control-h) + 8px); padding: 0 28px }
.btn.lg:has(> svg.i) { padding: 0 22px }
.btn.lg[aria-label] { width: calc(var(--control-h) + 8px); padding: 0 }
.linkish { background: none; border: 0; padding: 0; color: var(--text); font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; min-height: var(--touch-min) }
.linkish:hover { text-decoration-color: var(--flame) }

/* ---------- Menú desplegable (DropdownMenu): plano, sin sombra ---------- */
.menu-wrap { position: relative; display: inline-block }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 240px; background: var(--surface); color: var(--text); border: 1px solid var(--line-soft); border-radius: var(--radius-card); padding: 6px; animation: elite-surface-in var(--duration-enter) var(--ease-standard); transform-origin: top right }
.menu button { width: 100%; display: flex; align-items: center; gap: 8px; min-height: var(--touch-min); padding: 6px 10px; border: 0; background: none; border-radius: var(--radius-control); cursor: pointer; text-align: left; font-size: var(--body-size); color: var(--text) }
.menu button svg.i { color: var(--text-faint) }
.menu button:hover { background: var(--surface-2) }
.menu button[disabled] { opacity: 0.5; cursor: not-allowed }
.menu .sep { height: 1px; background: var(--line-soft); margin: 6px -6px }

/* ---------- Filtros y buscador ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 18px }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--touch-min); padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: var(--surface); color: var(--text-dim); font-weight: 600; font-size: var(--control-text-size); cursor: pointer; transition: border-color var(--duration-state) var(--ease-standard), color var(--duration-state) var(--ease-standard), background-color var(--duration-state) var(--ease-standard) }
.chip:hover { color: var(--text); border-color: color-mix(in srgb, var(--flame) 50%, var(--line)) }
.chip.on, .chip[aria-pressed='true'] { border-color: var(--flame); color: var(--text); background: color-mix(in srgb, var(--flame) 10%, var(--surface)) }
.chip .c { font-size: var(--count-size); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-faint) }
.chip .c.red { color: var(--danger-text) }
.filters-big .chip { min-height: 40px; font-size: var(--body-size); padding: 0 18px }
[data-density='bahia'] .chip { font-size: 15px; padding: 0 18px }
[data-density='bahia'] .filters-big { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; width: 100% }
[data-density='bahia'] .filters-big .chip { min-height: 52px; font-size: 16px }
.search { flex: 1 1 260px; max-width: 400px; display: flex; align-items: center; gap: 10px; min-height: var(--control-h); padding: 0 var(--field-px); border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface-2); color: var(--text-faint); transition: border-color var(--duration-state) var(--ease-standard) }
[data-density='bahia'] .search { max-width: none; min-height: 52px }
.search:focus-within { border-color: var(--flame) }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--text) }
.search input::placeholder { color: var(--text-faint) }

/* ---------- Lista (DataTable): tabla o láminas (data-stack lo pone el JS) ---------- */
.dt { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-row); overflow: hidden }
.dt table { width: 100%; border-collapse: collapse }
.dt th { background: var(--surface-2); text-align: left; height: 40px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text-faint); padding: 0 16px; border-bottom: 1px solid var(--line); white-space: nowrap }
.dt td { padding: 10px 16px; border-top: 1px solid var(--line-soft); vertical-align: middle; height: var(--row-h); font-variant-numeric: tabular-nums }
.dt tbody tr:first-child td { border-top: 0 }
.dt th.r, .dt td.r { text-align: right }
.dt tr.click { cursor: pointer }
.dt tr td { transition: background-color var(--duration-state) var(--ease-standard) }
.dt tr.click:hover td { background: var(--surface-2) }
.dt tr.flash td, .flash { animation: elite-flash var(--duration-flash) var(--ease-standard) }
.dt tr.void td { color: var(--text-faint) }
.dt tr.void .money-cell, .pay-row.void .num { text-decoration: line-through; text-decoration-color: var(--line); text-decoration-thickness: 1px; text-decoration-skip-ink: none }

/* ---------- Tarjeta (Card) y cifras (StatCard) ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); padding: var(--card-pad); min-width: 0 }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--grid-gap); align-items: start }

.fig.xl { font-size: var(--hero-size); line-height: 1; margin-top: 8px }
.fig .cents { font-size: 0.5em }
.lbl { font-size: var(--dense-size); font-weight: 500; color: var(--text-dim) }
.stat-link { display: flex; align-items: center; gap: 6px 18px; width: 100%; min-height: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-row); padding: 18px 22px; cursor: pointer; text-align: left; transition: border-color var(--duration-state) var(--ease-standard) }
.stat-link:hover { border-color: var(--flame) }
.stat-link .go-to { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; border-radius: var(--radius-control); border: 1px solid color-mix(in srgb, var(--go) 25%, transparent); background: color-mix(in srgb, var(--go) 10%, transparent); color: var(--go-text) }

/* ---------- Hoy ---------- */
.day-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--grid-gap); align-items: start; margin-top: var(--grid-gap) }
.lrows { list-style: none; margin: 0; padding: 0 }

.lr-main { flex: 1; min-width: 0 }

.empty-line { color: var(--text-faint); padding: 14px 0 8px; margin: 0 }
.strip { display: flex; flex-wrap: wrap; gap: 8px }
.pchip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-weight: 700; font-size: var(--plate-size); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; min-height: var(--touch-min); padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid; background-color: color-mix(in oklab, currentColor var(--tint-fill), transparent); border-color: color-mix(in oklab, currentColor var(--tint-line), transparent); cursor: pointer; transition: background-color var(--duration-state) var(--ease-standard) }
.pchip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none }

/* ---------- Libre ---------- */
.range { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch }

.car-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--grid-gap) }

.car-card { display: grid; gap: 14px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 20px var(--card-pad) var(--card-pad); transition: border-color var(--duration-state) var(--ease-standard) }

/* ---------- Ficha de la renta ---------- */

.big3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin: calc(-1 * var(--card-pad)) calc(-1 * var(--card-pad)) 0; border-bottom: 1px solid var(--line-soft) }

.deposit { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 16px; min-height: var(--row-h); padding: 10px 16px; border-radius: var(--radius-row); background: var(--surface-2); border: 1px solid var(--line-soft) }

.acct-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px }

/* ---------- Caja ---------- */
.cash-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--grid-gap); align-items: start }
.breakdown { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px }
.breakdown div { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--radius-control); padding: 10px 14px }

.breakdown .zero .num { color: var(--text-faint) }
.fold { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-row) }

/* Caja (cash-screen.tsx): bloques con su título, StatCard por método y por turno. */
.block { display: grid; gap: 12px; margin-top: 22px }

.stat { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 96px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-row); min-width: 0 }

.kv { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 0 }

/* ---------- Pestañas (Tabs) ---------- */

/* ---------- Diálogo (Dialog): radio 14, filete suave, sombra de elevación ---------- */
.backdrop { position: fixed; inset: 0; z-index: 50; background: var(--backdrop); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; animation: elite-fade-in var(--duration-enter) var(--ease-standard) }
.dialog { position: relative; width: min(512px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--surface); color: var(--text); border: 1px solid var(--line-soft); border-radius: var(--radius-card); box-shadow: var(--shadow-dialog); overflow: hidden; animation: elite-surface-in var(--duration-enter) var(--ease-standard) }
.dialog.wide { width: min(860px, 100%) }

.d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: var(--plate-pad) var(--plate-pad) calc(var(--plate-pad) - 2px); border-bottom: 1px solid var(--line-soft); flex: none }

[data-density='bahia'] .d-foot .total-line { flex-basis: 100% }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
[data-density='bahia'] .grid { grid-template-columns: minmax(0, 1fr) }
.grid .span { grid-column: 1 / -1 }

/* Caja de campo (FieldBox): etiqueta adentro, arriba del valor. */
.box { display: block; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-control); padding: var(--field-pt) var(--field-px) var(--field-pb); min-width: 0; cursor: text; transition: border-color var(--duration-state) var(--ease-standard) }

/* Reloj del prototipo: hoy es lunes 5 de octubre de 2026, 10:30. */
const NOW = new Date(2026, 9, 5, 10, 30);
const pad = (n) => String(n).padStart(2, '0');

const P = (s) => {
 const [d, t = '00:00'] = String(s).split('T');
 const [y, m, dd] = d.split('-').map(Number);
 const [h, mi] = t.split(':').map(Number);
 return new Date(y, m - 1, dd, h || 0, mi || 0);
};

const dayKey = (s) => String(s).slice(0, 10);
const addDays = (s, n) => {
 const d = P(s);
 d.setDate(d.getDate() + n);
 return S(d);
};
const dayDiff = (a, b) => Math.round((P(dayKey(b)) - P(dayKey(a))) / 86400000);
let tick = 0;

 const d = P(s);
 return `${d.getHours()}:${pad(d.getMinutes())}`;

function spokenDay(s) {
 const diff = dayDiff(TODAY, s);
 if (diff === 0) return 'hoy';
 if (diff === 1) return 'mañana';
 if (diff === -1) return 'ayer';
 const d = P(s);
 const base = `${DOW[d.getDay()]} ${d.getDate()}`;
 return d.getMonth() === NOW.getMonth() ? base : `${base} ${MON[d.getMonth()]}`;
}
const spoken = (s) => `${spokenDay(s)}, ${hhmm(s)}`;

 const d = P(s);
 return `${DOW_LONG[d.getDay()]} ${d.getDate()} de ${MON_LONG[d.getMonth()]}`;

 const d = P(s);

function table(cols, rows, opts = {}) {
 const head = cols.map((c) => `<th class="${c.r ? 'r' : ''} ${c.s === 'ref' ? 'ref-col' : ''}">${c.label}</th>`).join('');

  .map((row) => {
   const attrs = opts.rowAttrs ? opts.rowAttrs(row) : '';
   return `<tr ${attrs}>${cols
    .map((c) => `<td data-s="${c.s || 'field'}" data-label="${esc(c.label)}" class="${c.r ? 'r' : ''}">${c.cell(row)}</td>`)
    .join('')}</tr>`;
  })
  .join('');
 return `<div class="dt"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function rangeText(a) {
 const st = rStatus(a);
 const left = a.out ? a.out.at : a.pickupAt;
 if (st === 'reserved') return `${spoken(a.pickupAt)} → ${spoken(a.returnAt)}`;
 if (st === 'cancelled') return spoken(a.pickupAt);
 return `${spoken(left)} → ${spoken(a.back ? a.back.at : a.returnAt)}`;
}
function keyFact(a) {
 const st = rStatus(a);
 const owed = account(a).owed;
 if (st === 'reserved') return `sale ${spoken(a.pickupAt)}`;
 if (st === 'out') return `vuelve ${spoken(a.returnAt)}`;
 if (st === 'late') return `<span class="red">debía ${spoken(a.returnAt)}</span>`;
 if (st === 'returned' && owed > 0) return `<span class="num red nowrap">Debe ${money(owed)}</span>`;
 return rStamp(a);
}

/* Hoy */
function dayRow(a, kind) {
 const c = carById(a.carId);
 const r = renterById(a.renterId);
 let when;
 let btn;
 if (kind === 'out') {
  when = P(a.pickupAt) < NOW ? `<span class="red">${hhmm(a.pickupAt)}</span>` : hhmm(a.pickupAt);
  btn = `<button class="btn sm" data-action="deliver" data-id="${a.id}">${icon('out')}Entregar</button>`;
 } else if (kind === 'back') {
  when = P(a.returnAt) < NOW ? `<span class="red">${hhmm(a.returnAt)}</span>` : hhmm(a.returnAt);
  btn = `<button class="btn sm" data-action="receive" data-id="${a.id}">${icon('in')}Recibir</button>`;
 } else {
  when = `<span class="red">${spoken(a.status === 'RESERVED' ? a.pickupAt : a.returnAt)}</span>`;
  btn = `<button class="btn sm" data-action="call" data-id="${a.id}">${icon('phone')}Llamar</button>`;
 }
 return `<li class="lrow" data-go="#/rentas/${a.id}">
  <div class="lr-main"><div class="lr-top">${plate(c)}<b>${esc(carName(c))}</b></div><div class="lr-sub">${esc(shortName(r.name))}</div></div>
  <div class="lr-when">${when}</div><div class="lr-act">${btn}</div></li>`;
}
const listCard = (title, rows, kind, cls = '') => `
 <section class="card list-card ${cls}">
  <div class="card-head"><h2>${title} <span class="c">${rows.length}</span></h2></div>
  ${rows.length ? `<ul class="lrows">${rows.map((a) => dayRow(a, kind)).join('')}</ul>` : '<p class="empty-line">Nada por hoy</p>'}
 </section>`;
function plateChip(c) {
 const s = carState(c);
 const attrs = s.a ? `data-go="#/rentas/${s.a.id}"` : s.key === 'shop' ? `data-go="#/carros/${c.id}"` : `data-action="new-with-car" data-car="${c.id}"`;
 return `<button class="pchip t-${s.tone}" ${attrs} aria-label="${esc(c.plate)}, ${s.label}">${esc(c.plate)}</button>`;
}
function renderToday() {
 const salen = agreements.filter((a) => a.status === 'RESERVED' && dayKey(a.pickupAt) === TODAY).sort(byPickup);
 const vuelven = agreements.filter((a) => a.status === 'OUT' && dayKey(a.returnAt) === TODAY).sort(byReturn);
 const late = lateItems().sort(byReturn);
 const cobrado = paymentsOn(TODAY).filter((p) => !p.voided).reduce((s, p) => s + p.amount, 0);
 const list = cars.slice().sort((x, y) => STATE_ORDER[carState(x).key] - STATE_ORDER[carState(y).key]);
 return `<div class="enter">
  <header class="screen-head">
   <h1>Hoy, ${longDate(TODAY)}</h1>

  <button class="stat-link" data-go="#/caja">
   <span><span class="lbl">Cobrado hoy</span><br><span class="fig xl go">${bigMoney(cobrado)}</span></span>

  <div class="day-grid">
   ${listCard('Salen hoy', salen, 'out')}

/* Libre (Calendario + ¿Qué hay libre?) */
function freePresets() {
 const tm = addDays(TODAY + 'T09:00', 1);
 return [
  ['Mañana', tm, addDays(tm, 1)],
  ['Semana', tm, addDays(tm, 7)],
 ];
}
function renderFree() {

   </article>`,
  )
  .join('');
 return `<div class="enter">

   .join('')}
   <button class="chip" data-action="toggle-week" aria-pressed="${ui.showWeek}">${icon('calendar')}Ver la semana</button></div>
  ${bad ? '<p class="err-text">Revisá las fechas</p>' : free.length ? `<div class="car-cards">${cards}</div>` : empty('Nada libre')}
  ${ui.showWeek ? renderWeek() : ''}
 </div>`;
}
function occupantsOn(c, day) {
 const ds = P(day);
 const de = P(addDays(day + 'T00:00', 1));
 return agreements.filter((a) => {
  if (a.carId !== c.id || a.status === 'CANCELLED') return false;
  const start = P(a.out ? a.out.at : a.pickupAt);
  let end = P(a.back ? a.back.at : a.returnAt);
  if (a.status === 'OUT' && end < NOW) end = P(addDays(TODAY + 'T00:00', 1));
  return start < de && end > ds;
 });
}
function renderWeek() {
 const days = Array.from({ length: 7 }, (_, i) => addDays(ui.weekStart + 'T00:00', i).slice(0, 10));
 const head = days.map((d) => `<th class="${d === TODAY ? 'today' : ''}">${DOW[P(d).getDay()]} ${P(d).getDate()}</th>`).join('');
 const rows = cars
  .map((c) => {
   const cells = days
    .map((d) => {
     if (c.status === 'IN_SHOP') return '<td><div class="cell shop">Taller</div></td>';
     const occ = occupantsOn(c, d);
     if (occ.length) {
      const a = occ[0];
      const names = occ.map((o) => firstName(renterById(o.renterId).name)).join(' · ');
      return `<td><button class="cell busy t-${RS[rStatus(a)][1]}" data-go="#/rentas/${a.id}">${esc(names)}</button></td>`;
     }
     if (d < TODAY) return '<td><div class="cell faint">—</div></td>';
     return `<td><button class="cell free" data-action="reserve-cell" data-car="${c.id}" data-day="${d}" aria-label="Reservar">Libre</button></td>`;
    })
    .join('');
   return `<tr><th class="car" scope="row"><span class="cell-name">${plate(c)}<span>${esc(c.model)}</span></span></th>${cells}</tr>`;
  })
  .join('');
 return `<section class="section">
  <div class="section-head">
   <h2 class="section-title">Semana</h2>
   <div class="chips">
    <button class="btn sm" data-action="week-shift" data-n="-7" aria-label="Anterior">${icon('left')}</button>
    <button class="btn sm" data-action="week-today">Hoy</button>
    <button class="btn sm" data-action="week-shift" data-n="7" aria-label="Siguiente">${icon('right')}</button>
   </div>
  </div>
  <div class="week-wrap"><table class="week"><thead><tr><th class="car">Carro</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
 </section>`;
}

/* Rentas */
const RFILTERS = [
 ['soon', 'Por salir', (a) => a.status === 'RESERVED'],
 ['out', 'En la calle', (a) => a.status === 'OUT'],
 ['back', 'Ya volvió', (a) => a.status === 'RETURNED'],
];
const RMORE = [
 ['all', 'Todas', () => true],
 ['cancelled', 'Canceladas', (a) => a.status === 'CANCELLED'],
];
const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[\s-]/g, '');
function renderRentals() {
 const f = [...RFILTERS, ...RMORE].find((x) => x[0] === ui.rentFilter) || RFILTERS[1];
 const q = norm(ui.rentQ);
 const rows = agreements.filter(f[2]).filter((a) => {
  if (!q) return true;
  const c = carById(a.carId);
  const r = renterById(a.renterId);
  return [c.plate, carName(c), r.name, r.doc, r.phone, a.no || ''].some((v) => norm(v).includes(q));
 });
 if (f[0] === 'soon') rows.sort(byPickup);
 else if (f[0] === 'out') rows.sort((a, b) => (rStatus(a) === 'late' ? 0 : 1) - (rStatus(b) === 'late' ? 0 : 1) || byReturn(a, b));
 else rows.sort((a, b) => byPickup(b, a));
 const moreActive = RMORE.some((x) => x[0] === ui.rentFilter);
 const chips = RFILTERS.map(([k, l, fn]) => {
  const late = k === 'out' && agreements.some((a) => rStatus(a) === 'late');
  return `<button class="chip" data-action="rent-filter" data-f="${k}" aria-pressed="${ui.rentFilter === k}">${l}<span class="c ${late ? 'red' : ''}">${agreements.filter(fn).length}</span></button>`;
 }).join('');
 const list = rows.length
  ? table(
    [
     { label: 'Carro', s: 'title', cell: (a) => carCell(carById(a.carId)) },
     { label: 'Cliente', cell: (a) => esc(shortName(renterById(a.renterId).name)) },
     { label: 'Cuándo', r: true, cell: (a) => keyFact(a) },
    ],
    rows,
    { rowAttrs: (a) => `class="click ${ui.focus === a.id ? 'flash' : ''}" data-go="#/rentas/${a.id}"` },
   )
  : empty(q ? 'Sin resultados' : 'Nada por ahora');
 return `<div class="enter">
  <header class="screen-head">
   <h1>Rentas</h1>
   <div class="head-actions"><button class="btn primary lg" data-action="new-rental">${icon('plus')}Nueva renta</button></div>
  </header>
  <div class="toolbar">
   <div class="chips filters-big">${chips}
    <div class="menu-wrap">
     <button class="chip" data-menu="rent-more" aria-pressed="${moreActive}" aria-haspopup="menu">${moreActive ? f[1] : 'Más'}${icon('down')}</button>
     ${ui.menu === 'rent-more' ? `<div class="menu" role="menu">${RMORE.map(([k, l]) => `<button role="menuitem" data-action="rent-filter" data-f="${k}">${l}</button>`).join('')}</div>` : ''}
    </div>
   </div>
   <label class="search">${icon('search')}<input id="rent-q" type="search" placeholder="Placa o cliente" value="${esc(ui.rentQ)}" autocomplete="off" aria-label="Buscar" /></label>
  </div>
  ${list}
 </div>`;
}

/* Ficha de una renta: un botón según el estado, una sola cuenta */
function primaryFor(a) {
 const st = rStatus(a);
 const btn = (act, ic, label) => `<button class="btn primary lg" data-action="${act}" data-id="${a.id}">${ic ? icon(ic) : ''}${label}</button>`;
 if (st === 'reserved') return btn('deliver', 'out', 'Entregar');
 if (st === 'out' || st === 'late') return btn('receive', 'in', 'Recibir');
 if (st === 'returned') return account(a).owed > 0 ? btn('pay', 'banknote', 'Cobrar') : btn('deposit-return', '', 'Devolver');
 return '';
}
function depositLine(a) {
 const d = a.deposit;
 if (d.state === 'held')
  return `<div class="deposit"><span class="grow"><b>Garantía ${money(d.amount)}</b> · ${DEPOSIT_METHODS[d.method]}</span><button class="btn sm" data-action="deposit-return" data-id="${a.id}">Devolver</button></div>`;
 if (d.state === 'returned') return `<div class="deposit"><span class="grow"><b>Garantía ${money(d.amount)}</b> · <span class="go">devuelta</span></span></div>`;
 return '<div class="deposit"><span class="grow faint">Sin garantía</span></div>';
}
function payMenu(p, withOpen) {
 const key = 'pay-' + p.id;
 return `<div class="menu-wrap"><button class="btn ghost sm" data-menu="${key}" aria-label="Opciones" aria-haspopup="menu">${icon('more')}</button>

    ? `<div class="menu" role="menu">

     </div>`
    : ''
  }</div>`;
}
function accountCard(a) {

 const pays = paymentsOf(a);
 const fig = (lbl, v, cls = '') => `<div><div class="lbl">${lbl}</div><div class="fig ${cls}">${v}</div></div>`;
 return `<section class="card">
  <div class="big3">
   ${fig('Total', money(acc.total))}${fig('Pagado', money(acc.paid))}${fig('Debe', money(Math.max(0, acc.owed)), acc.owed > 0 ? 'bad' : 'go')}
  </div>
  <ul class="lines">${acc.lines.map((l) => `<li class="${l.minus ? 'minus' : ''}"><span>${esc(l.label)}</span><span class="num">${money(l.amount)}</span></li>`).join('')}</ul>
  <p class="sub-title">Pagos</p>
  ${
   pays.length
    ? pays
      .map(
       (p) => `<div class="pay-row ${p.voided ? 'void' : ''} ${ui.focus === p.id ? 'flash' : ''}">
        <span class="grow">${spoken(p.at)} · ${METHODS[p.method]}${p.voided ? ' ' + stamp('red', 'Anulado') : ''}</span>
        <span class="num">${money(p.amount)}</span>${p.voided ? '' : payMenu(p, false)}</div>`,
      )
      .join('')
    : '<p class="empty-line">Sin pagos</p>'
  }
  ${acc.owed > 0 && a.status !== 'RETURNED' && a.status !== 'CANCELLED' ? `<div class="acct-actions"><button class="btn" data-action="pay" data-id="${a.id}">${icon('banknote')}Cobrar</button></div>` : ''}
  ${depositLine(a)}
 </section>`;
}
function inspectionCard(title, i, prev) {
 if (!i) return '';
 const newD = prev ? i.damages.filter((z) => !prev.damages.includes(z)) : [];
 const missing = prev ? prev.acc.filter((x) => !i.acc.includes(x)) : [];
 return `<section class="card">
  <div class="card-head"><h2>${title}</h2><span class="dim dense">${spoken(i.at)}</span></div>
  <dl class="fields">
   <div class="field"><dt>Km</dt><dd class="num">${km(i.km)}</dd></div>
   <div class="field"><dt>Combustible</dt><dd>${FUEL[i.fuel]}</dd></div>
   <div class="field"><dt>Golpes</dt><dd>${i.damages.length ? i.damages.map((z) => (newD.includes(z) ? `<span class="red">${esc(zoneName(z))}</span>` : esc(zoneName(z)))).join(' · ') : 'Ninguno'}</dd></div>
   <div class="field"><dt>Accesorios</dt><dd>${missing.length ? `<span class="red">Falta ${esc(missing.join(', '))}</span>` : 'Completos'}</dd></div>
  </dl>
 </section>`;
}

/* Caja: igual que la del lavado (cash-screen.tsx). Turno con fondo, cobrado por
 * método, cobros del turno, historial de cierres y el diálogo «Cerrar caja».
 * Lo propio de la renta —quién debe y garantías— va después. */
const METHOD_ORDER = ['CASH', 'CARD', 'TRANSFER', 'OTHER'];
const METHOD_STAMP = { CASH: 'green', CARD: 'neutral', TRANSFER: 'amber', OTHER: 'neutral' };
const METHOD_ICON = { CASH: 'banknote', CARD: 'card', TRANSFER: 'arrows', OTHER: 'wallet' };
const money2 = (v) => {
 const n = r2(Number(v) || 0);
 const t = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
 return (n < 0 ? '−$' : '$') + t;
};
const WHEN_FMT = new Intl.DateTimeFormat('es-SV', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const formatWhen = (s) => WHEN_FMT.format(P(s)).replaceAll(/[  ]/gu, ' ').replace('a. m.', 'a.m.').replace('p. m.', 'p.m.');
const formatSpan = (s) => (s.closedAt ? `${formatWhen(s.openedAt)} → ${formatWhen(s.closedAt)}` : formatWhen(s.openedAt));
const methodStamp = (m) => `<span class="stamp has-icon t-${METHOD_STAMP[m]}">${icon(METHOD_ICON[m])}${METHODS[m]}</span>`;
function diffStamp(diff) {
 if (diff === null) return stamp('neutral', 'Abierto');
 const c = Math.round(diff * 100);
 if (c === 0) return stamp('green', 'Cuadra');
 return c > 0 ? stamp('amber', `Sobra ${money2(diff)}`) : stamp('red', `Falta ${money2(-diff)}`);
}
const diffLive = (c) => (c === 0 ? ['go', 'Cuadra'] : c > 0 ? ['amber-t', `Sobra ${money2(c / 100)}`] : ['red', `Falta ${money2(-c / 100)}`]);

/* Turnos: el abierto (hoy desde las 8:00) y los cerrados de los días con cobros. */
let sessionSeq = 0;
const sessions = [];
(function seedSessions() {
 const days = [...new Set(payments.map((p) => dayKey(p.at)))].filter((d) => d < TODAY).sort();
 days.forEach((d) => {
  const s = { id: 's' + ++sessionSeq, no: sessionSeq, openedAt: d + 'T08:00', closedAt: d + 'T18:00', float: 20, counted: null, notes: '' };
  sessions.push(s);
  const exp = expectedOf(s);
  s.counted = d === '2026-10-02' ? r2(exp - 2) : d === '2026-09-30' ? r2(exp + 1) : exp;
 });
 sessions.push({ id: 's' + ++sessionSeq, no: sessionSeq, openedAt: TODAY + 'T08:00', closedAt: null, float: 20, counted: null, notes: '' });
})();
function sessionPays(s) {
 return payments
  .filter((p) => !p.voided && P(p.at) >= P(s.openedAt) && (!s.closedAt || P(p.at) <= P(s.closedAt)))
  .sort((x, y) => P(y.at) - P(x.at));
}
function totalsOf(s) {
 const list = sessionPays(s);
 const t = Object.fromEntries(METHOD_ORDER.map((m) => [m, r2(list.filter((p) => p.method === m).reduce((a, p) => a + p.amount, 0))]));
 return { t, list };
}
function expectedOf(s) {
 return r2(s.float + totalsOf(s).t.CASH);
}
const openSession = () => sessions.find((s) => !s.closedAt) || null;
const diffOf = (s) => (s.closedAt && s.counted !== null ? r2(s.counted - expectedOf(s)) : null);

function statCard(label, value, o = {}) {
 const v = typeof value === 'number' ? money2(value) : String(value);
 const i = typeof value === 'number' ? v.indexOf('.') : -1;
 const fig = i < 0 ? `<span>${esc(v)}</span>` : `<span>${v.slice(0, i)}</span><span class="unit dec">${v.slice(i)}</span>`;
 return `<div class="stat ${o.tone ? 'tone-' + o.tone : ''}"><div class="stat-main"><p class="lbl">${label}</p><div class="stat-value">${fig}${o.unit ? `<span class="unit">${o.unit}</span>` : ''}</div></div>${o.icon ? `<span class="stat-icon">${icon(o.icon)}</span>` : ''}</div>`;
}
function methodStats(s) {
 const { t, list } = totalsOf(s);
 const others = list.filter((p) => p.method === 'OTHER');
 return `<div class="stat-grid four">${METHOD_ORDER.map((m) => statCard(METHODS[m], t[m], { tone: m === 'CASH' ? 'go' : '', icon: METHOD_ICON[m] })).join('')}</div>
  ${
   others.length
    ? `<div class="cards"><section class="card"><div class="card-head"><h2>Otro</h2><span class="dim dense num">${money2(t.OTHER)}</span></div>
      ${others.map((p) => `<div class="kv"><span>${esc(p.note || 'Sin descripción')}</span><span class="num">${money2(p.amount)}</span></div>`).join('')}</section></div>`
    : ''
  }`;
}
function cashPaymentsTable(list) {
 if (!list.length) return empty('Todavía no hay cobros');
 return table(
  [
   { label: 'Ref.', s: 'ref', cell: (p) => `<span class="ref">${agrById(p.agreementId).no ? '#' + agrById(p.agreementId).no : '—'}</span>` },
   { label: 'Método', s: 'aside', cell: (p) => methodStamp(p.method) },
   { label: 'Monto', s: 'title', r: true, cell: (p) => `<span class="num">${money2(p.amount)}</span>` },
   {
    label: 'Detalle',
    cell: (p) => {
     const a = agrById(p.agreementId);
     const extra = p.method === 'TRANSFER' && p.ref ? ` · Ref ${esc(p.ref)}` : p.method === 'OTHER' && p.note ? ` · ${esc(p.note)}` : '';
     return `<span class="cell-name dim">${plate(carById(a.carId), 'sm')}<span>${esc(shortName(renterById(a.renterId).name))}${extra}</span></span>`;
    },
   },
   { label: 'Hora', cell: (p) => `<span class="dim nowrap">${formatWhen(p.at)}</span>` },
  ],
  list,
  { rowAttrs: (p) => `class="click ${ui.focus === p.id ? 'flash' : ''}" data-go="#/rentas/${p.agreementId}"` },
 );
}
function debtors() {
 const rank = { returned: 0, late: 1, out: 2 };
 return agreements
  .filter((a) => (a.status === 'RETURNED' || a.status === 'OUT') && account(a).owed > 0)
  .sort((a, b) => rank[rStatus(a)] - rank[rStatus(b)]);
}
function renderCash() {
 const s = openSession();
 const closed = sessions.filter((x) => x.closedAt).sort((a, b) => P(b.openedAt) - P(a.openedAt));
 const debts = debtors();
 const owedTotal = debts.reduce((t, a) => t + account(a).owed, 0);
 const held = agreements.filter((a) => a.deposit.state === 'held');
 const heldTotal = held.reduce((t, a) => t + a.deposit.amount, 0);
 const carCol = { label: 'Carro', s: 'title', cell: (a) => carCell(carById(a.carId)) };
 const clientCol = { label: 'Cliente', cell: (a) => esc(shortName(renterById(a.renterId).name)) };
 const refCol = { label: 'Ref.', s: 'ref', cell: (a) => `<span class="ref">${a.no ? '#' + a.no : '—'}</span>` };
 return `<div class="enter">
  <header class="screen-head">
   <h1>Caja</h1>
   ${s ? '<div class="head-actions"><button class="btn primary" data-action="close-cash">Cerrar caja</button></div>' : ''}
  </header>
  ${
   s
    ? `<section class="block"><h2 class="section-title">Cobrado</h2>${methodStats(s)}</section>
     <section class="block"><h2 class="section-title">Turno</h2>
      <div class="stat-grid three">${statCard('Fondo', s.float)}${statCard('Esperado', expectedOf(s))}${statCard('Cobros', totalsOf(s).list.length)}</div></section>
     <section class="block"><h2 class="section-title">Cobros de este turno</h2>${cashPaymentsTable(totalsOf(s).list)}</section>`
    : `<section class="card open-cash"><form data-form="open-cash" novalidate>
      <label class="box"><span>Fondo</span><input class="m" name="float" inputmode="decimal" value="0.00" autocomplete="off" /></label>
      <button class="btn primary" type="submit">Abrir caja</button>
      <p class="err-text hidden" data-err>Revisá el monto</p></form></section>`
  }
  <section class="block"><h2 class="section-title">Historial</h2>
   ${
    closed.length
     ? table(
       [
        { label: 'Ref.', s: 'ref', cell: (x) => `<span class="ref">#${x.no}</span>` },
        { label: 'Turno', s: 'title', cell: (x) => `<span>${formatSpan(x)}</span>` },
        { label: 'Esperado', r: true, cell: (x) => `<span class="num nowrap">${money2(expectedOf(x))}</span>` },
        { label: 'Contado', r: true, cell: (x) => `<span class="num nowrap">${money2(x.counted ?? 0)}</span>` },
        { label: 'Diferencia', s: 'aside', cell: (x) => diffStamp(diffOf(x)) },
       ],
       closed,
       { rowAttrs: (x) => `class="click ${ui.focus === x.id ? 'flash' : ''}" data-go="#/caja/${x.id}"` },
      )
     : empty('Todavía no hay cierres')
   }
  </section>
  <section class="block"><div class="section-head"><h2 class="section-title">Quién me debe</h2><span class="dim dense num">${money2(owedTotal)}</span></div>
   ${
    debts.length
     ? table(
       [refCol, carCol, clientCol,
        { label: 'Debe', r: true, cell: (a) => `<span class="num red nowrap">${money2(account(a).owed)}</span>` },
        { label: 'Acciones', s: 'actions', cell: (a) => `<button class="btn sm" data-action="pay" data-id="${a.id}">${icon('banknote')}Cobrar</button>` }],
       debts,
       { rowAttrs: (a) => `class="click" data-go="#/rentas/${a.id}"` },
      )
     : empty('Nadie')
   }
  </section>
  <section class="block"><div class="section-head"><h2 class="section-title">Garantías</h2><span class="dim dense num">${money2(heldTotal)}</span></div>
   ${
    held.length
     ? table(
       [refCol, carCol, clientCol,
        { label: 'Método', cell: (a) => methodStamp(a.deposit.method) },
        { label: 'Garantía', r: true, cell: (a) => `<span class="num nowrap">${money2(a.deposit.amount)}</span>` },
        { label: 'Acciones', s: 'actions', cell: (a) => `<button class="btn sm" data-action="deposit-return" data-id="${a.id}">Devolver</button>` }],
       held,
       { rowAttrs: (a) => `class="click" data-go="#/rentas/${a.id}"` },
      )
     : empty('Ninguna')
   }
  </section>
 </div>`;
}
/* El turno cerrado (cash-session-detail-screen.tsx), sin «quién»: la renta es del dueño. */

/* Cerrar caja (close-cash-dialog.tsx): esperado, contado, diferencia en vivo,
 * confirmación desde $10 de diferencia y notas. */
function openCloseCash() {
 const s = openSession();
 if (!s) return;
 dlg = { kind: 'close-cash', sid: s.id, ack: false };
 openDialog(`<form data-form="close-cash" style="display:contents" novalidate>${dHead('Cerrar caja')}
  <div class="d-body">
   <div><p class="lbl">Esperado</p><p class="fig" style="margin:2px 0 0">${money2(expectedOf(s))}</p></div>
   <label class="box"><span>Contado</span><input class="m" name="counted" id="cc-counted" inputmode="decimal" autocomplete="off" /></label>
   <p class="live-diff hidden" id="cc-live"></p>
   <label class="check-row hidden" id="cc-ack"><input type="checkbox" id="cc-ack-box" /><span></span></label>
   <label class="box"><span>Notas</span><textarea name="notes" rows="2"></textarea></label>
   ${errLine}
  </div>
  <div class="d-foot"><button class="btn" type="button" data-action="close">Cancelar</button><button class="btn primary" type="submit" id="cc-submit">Cerrar caja</button></div></form>`);
}
function updateCloseCash() {
 const s = openSession();
 const raw = document.getElementById('cc-counted')?.value.trim() ?? '';
 const live = document.getElementById('cc-live');
 const ack = document.getElementById('cc-ack');
 const n = Number(raw.replace(',', '.'));
 if (!s || !live) return;
 if (raw === '' || Number.isNaN(n)) {
  live.classList.add('hidden');
  ack.classList.add('hidden');
  document.getElementById('cc-submit').disabled = false;
  return;
 }
 const c = Math.round((n - expectedOf(s)) * 100);
 const [tone, label] = diffLive(c);
 live.className = `live-diff ${tone}`;
 live.textContent = label;
 const large = Math.abs(c) >= 1000;
 ack.classList.toggle('hidden', !large);
 ack.querySelector('span').textContent = `Confirmo la diferencia de ${money2(Math.abs(c) / 100)}`;
 document.getElementById('cc-submit').disabled = large && !document.getElementById('cc-ack-box').checked;
}

 const list = expenses.filter((e) => e.carId === c.id).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id));
 const month = list.filter((e) => e.date.slice(0, 7) === TODAY.slice(0, 7)).reduce((s, e) => s + e.amount, 0);
 return `<div class="toolbar" style="justify-content:space-between">
   <span><span class="lbl">Este mes</span> <b class="num">${money(month)}</b></span>
   <button class="btn primary" data-action="new-expense" data-id="${c.id}">${icon('plus')}Anotar</button>
  </div>
  ${
   list.length
    ? table(
      [
       { label: 'Fecha', s: 'aside', cell: (e) => `<span class="num">${shortDate(e.date)}</span>` },
       { label: 'Qué', s: 'title', cell: (e) => `<span class="cell-name"><span>${esc(e.what)}</span>${e.auto ? stamp(...AUTO[e.auto]) : ''}</span>` },
       { label: 'Monto', r: true, cell: (e) => `<span class="num"><b>${money(e.amount)}</b></span>` },

      list,
      { rowAttrs: (e) => `class="${ui.focus === 'e' + e.id ? 'flash' : ''}"` },
     )
    : empty('Nada')
  }`;
}
function incomeOf(c, m) {
 if (m === '2026-10')
  return payments
   .filter((p) => !p.voided && p.at.slice(0, 7) === m && agrById(p.agreementId).carId === c.id)
   .reduce((s, p) => s + p.amount, 0);
 return income[c.id + m] || 0;
}
const spentOf = (c, m) => expenses.filter((e) => e.carId === c.id && e.date.slice(0, 7) === m).reduce((s, e) => s + e.amount, 0) + c.fixed;
const moneyCols = (first) => [
 first,
 { label: 'Entró', r: true, cell: (r) => `<span class="num">${money(r.inc)}</span>` },
 { label: 'Se fue', r: true, cell: (r) => `<span class="num">${money(r.out)}</span>` },
 { label: 'Quedó', r: true, cell: (r) => `<span class="num ${r.inc - r.out < 0 ? 'red' : 'go'}"><b>${money(r.inc - r.out)}</b></span>` },
];
function tabDejo(c) {
 const rows = MONTHS.slice().reverse().map((m) => ({ m, inc: incomeOf(c, m), out: spentOf(c, m) }));
 const tot = rows.reduce((s, r) => ({ inc: s.inc + r.inc, out: s.out + r.out }), { inc: 0, out: 0 });
 return table(
  moneyCols({ label: 'Mes', s: 'title', cell: (r) => `<b>${r.m === 'total' ? 'Total' : MON_LONG[Number(r.m.slice(5)) - 1]}</b>` }),
  [...rows, { m: 'total', ...tot }],
  { rowAttrs: (r) => (r.m === 'total' ? 'class="total"' : '') },
 );
}
function renderDejoFleet() {
 const PER = { month: ['Este mes', ['2026-10']], last: ['Mes pasado', ['2026-09']], all: ['Desde mayo', MONTHS] };
 const months = PER[ui.dejoPeriod][1];
 const rows = cars
  .map((c) => ({ c, inc: months.reduce((s, m) => s + incomeOf(c, m), 0), out: months.reduce((s, m) => s + spentOf(c, m), 0) }))
  .sort((a, b) => b.inc - b.out - (a.inc - a.out));
 const tot = rows.reduce((s, r) => ({ inc: s.inc + r.inc, out: s.out + r.out }), { inc: 0, out: 0 });
 const fig = (l, v, cls = '') => `<div class="card"><div class="lbl">${l}</div><div class="fig ${cls}">${money(v)}</div></div>`;
 return `<div class="enter">
  <header class="screen-head">
   <h1>¿Cuánto dejó?</h1>
   <div class="head-actions">${carsViewSwitch('dejo')}</div>
  </header>
  <div class="toolbar"><div class="chips">${Object.entries(PER).map(([k, [l]]) => `<button class="chip" data-action="dejo-period" data-p="${k}" aria-pressed="${ui.dejoPeriod === k}">${l}</button>`).join('')}</div></div>
  <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px">
   ${fig('Entró', tot.inc)}${fig('Se fue', tot.out)}${fig('Quedó', tot.inc - tot.out, tot.inc - tot.out < 0 ? 'bad' : 'go')}
  </div>
  ${table(moneyCols({ label: 'Carro', s: 'title', cell: (r) => carCell(r.c) }), rows, { rowAttrs: (r) => `class="click" data-go="#/carros/${r.c.id}/dejo"` })}
 </div>`;
}

/* Diálogos */
const layer = document.getElementById('layer');
let lastFocus = null;
let seq = 500;
const nid = (p) => p + ++seq;
function openDialog(html, cls = '') {
 lastFocus = document.activeElement;
 layer.innerHTML = `<div class="backdrop ${cls.includes('full') ? 'full' : ''}" data-close-backdrop><div class="dialog ${cls}" role="dialog" aria-modal="true" aria-labelledby="d-title">${html}</div></div>`;
 const first = layer.querySelector('.d-body input:not([type=hidden]), .d-body select, .d-body textarea');
 (first || layer.querySelector('.btn.primary'))?.focus();
}
function paintDialog(html) {
 const d = layer.querySelector('.dialog');
 if (!d) return;
 const st = d.querySelector('.d-body')?.scrollTop || 0;
 d.innerHTML = html;
 const nb = d.querySelector('.d-body');
 if (nb) nb.scrollTop = st;
}
function closeDialog() {
 layer.innerHTML = '';
 draft = null;
 wiz = null;
 dlg = null;
 lastFocus?.focus?.();
}
const dHead = (title, sub) => `
 <div class="d-head"><div><h2 id="d-title">${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>
 <button type="button" class="btn ghost sm" data-action="close" aria-label="Cerrar">${icon('x')}</button></div>`;
const dFoot = (label) => `<div class="d-foot"><button class="btn" type="button" data-action="close">Cerrar</button><button class="btn primary" type="submit">${label}</button></div>`;
const field = (name, label, value, o = {}) => `
 <label class="box ${o.span ? 'span' : ''}"><span>${label}</span>
  <input name="${name}" ${o.type ? `type="${o.type}"` : ''} value="${esc(value ?? '')}" ${o.mono ? 'class="m"' : ''} inputmode="${o.mode ?? 'text'}" autocomplete="off" ${o.attrs || ''} /></label>`;
const money_ = (name, label, value) => field(name, label, value, { mono: true, mode: 'decimal' });
const errLine = '<p class="err-text hidden" data-err>Revisá los datos</p>';
function picker(name, value, options) {
 return `<div data-group="${name}"><input type="hidden" name="${name}" value="${value}" />
  <div class="opts fill">${(Array.isArray(options) ? options : Object.entries(options)).map(([k, l]) => `<button type="button" class="opt" data-pick="${k}" aria-pressed="${k === value}">${l}</button>`).join('')}</div></div>`;
}
const carSub = (a) => `${plate(carById(a.carId))} ${esc(shortName(renterById(a.renterId).name))}`;
const form = (kind, title, sub, body, label) =>
 `<form data-form="${kind}" style="display:contents" novalidate>${dHead(title, sub)}<div class="d-body">${body}${errLine}</div>${dFoot(label)}</form>`;

/* ---------- Nueva renta: 4 datos y el total ---------- */
function openNewRental(o = {}) {
 const from = o.from || TODAY + 'T11:00';
 draft = {
  renterId: o.renterId || null, q: '', newRenter: null, from, to: o.to || addDays(from, 1), carId: o.carId || null,
  insurance: false, deductible: SETTINGS.deductible, discount: 0, extraDriver: '', notes: '', moreOpen: false, err: '',
 };
 if (draft.carId && !isFree(carById(draft.carId), draft.from, draft.to)) draft.carId = null;
 openDialog(newRentalHtml(), 'wide full');
}
function draftTotal() {
 if (!draft.carId || P(draft.to) <= P(draft.from)) return null;
 const d = rentDays(draft.from, draft.to);
 const t = carById(draft.carId).rate * d + (draft.insurance ? d * SETTINGS.insurancePerDay : 0) - (Number(draft.discount) || 0);
 return Math.max(0, r2(t));
}
function nrResults() {
 const q = norm(draft.q);
 const list = renters.filter((r) => !q || [r.name, r.doc, r.phone].some((v) => norm(v).includes(q))).slice(0, q ? 6 : 4);
 return `${list.map((r) => `<button type="button" class="pick" data-nr-renter="${r.id}"><span class="grow"><b>${esc(r.name)}</b> <span class="faint dense">${esc(r.doc)}</span></span></button>`).join('')}
  <button type="button" class="pick" data-action="nr-new">${icon('plus')}<b>Nuevo cliente</b></button>`;
}
function newRentalHtml() {
 const bad = P(draft.to) <= P(draft.from);
 const r = draft.renterId && renterById(draft.renterId);
 const n = draft.newRenter;
 const nf = (k, label, type = '') => `<label class="box"><span>${label}</span><input ${type ? `type="${type}"` : ''} data-nr-new="${k}" value="${esc(n[k])}" autocomplete="off" /></label>`;
 let client;
 if (r)
  client = `<div class="chosen"><span class="grow"><b>${esc(r.name)}</b> <span class="faint dense">${esc(r.doc)}</span>${r.licenseUntil < TODAY ? ` ${stamp('amber', 'Licencia')}` : ''}</span><button type="button" class="btn sm" data-action="nr-client-change">Cambiar</button></div>`;
 else if (n)
  client = `<div class="grid">${nf('name', 'Nombre')}${nf('doc', 'DUI o pasaporte')}${nf('phone', 'Celular')}${nf('license', 'Licencia')}${nf('licenseUntil', 'Vence', 'date')}</div>
   <button type="button" class="linkish" data-action="nr-new-cancel">Buscar</button>`;
 else
  client = `<label class="search" style="max-width:none">${icon('search')}<input id="nr-q" placeholder="Nombre, DUI o teléfono" value="${esc(draft.q)}" autocomplete="off" aria-label="Cliente" /></label>
   <div class="pick-list" id="nr-results">${nrResults()}</div>`;
 const free = bad ? [] : cars.filter((c) => isFree(c, draft.from, draft.to)).sort((a, b) => a.rate - b.rate);
 const carsHtml = bad
  ? '<p class="err-text">Revisá las fechas</p>'
  : free.length
   ? `<div class="pick-list">${free
     .map(
      (c) => `<button type="button" class="pick" data-nr-car="${c.id}" aria-pressed="${draft.carId === c.id}"><span class="radio"></span>
       <span class="grow">${carCell(c)}<br><span class="dim dense">${priceText(c, draft.from, draft.to)}</span></span></button>`,
     )
     .join('')}</div>`
   : '<p class="empty-line">Nada libre</p>';
 const tot = draftTotal();
 const today = dayKey(draft.from) <= TODAY;
 return `${dHead('Nueva renta')}
  <div class="d-body">
   <div><p class="q-label">Cliente</p>${client}</div>
   <div class="grid">
    <label class="box ${bad ? 'err' : ''}"><span>Sale</span><input type="datetime-local" id="nr-from" value="${draft.from}" /></label>
    <label class="box ${bad ? 'err' : ''}"><span>Regresa</span><input type="datetime-local" id="nr-to" value="${draft.to}" /></label>
   </div>
   <div><p class="q-label">Carro</p>${carsHtml}</div>
   <details class="more-fold" id="nr-more" ${draft.moreOpen ? 'open' : ''}>
    <summary>${icon('down')}Más datos del contrato</summary>
    <div class="inner">
     <div><p class="q-label">Seguro</p>
      <div class="opts fill"><button type="button" class="opt" data-nr-ins="1" aria-pressed="${draft.insurance}">Sí</button><button type="button" class="opt" data-nr-ins="0" aria-pressed="${!draft.insurance}">No</button></div></div>
     <div class="grid">
      <label class="box"><span>Golpe ($)</span><input class="m" data-nr-field="deductible" inputmode="decimal" value="${esc(draft.deductible)}" /></label>
      <label class="box"><span>Descuento ($)</span><input class="m" data-nr-field="discount" inputmode="decimal" value="${draft.discount || ''}" /></label>
      <label class="box span"><span>Conductor</span><input data-nr-field="extraDriver" value="${esc(draft.extraDriver)}" /></label>
      <label class="box span"><span>Notas</span><textarea data-nr-field="notes" rows="2">${esc(draft.notes)}</textarea></label>
     </div>
    </div>
   </details>
   ${draft.err ? `<p class="err-text" role="alert">${esc(draft.err)}</p>` : ''}
  </div>
  <div class="d-foot">
   <span class="total-line"><span class="lbl">Total</span> <span class="fig" id="nr-total">${tot === null ? '—' : money(tot)}</span></span>
   <button type="button" class="btn ${today ? '' : 'primary'}" data-action="nr-commit" data-deliver="0">Reservar</button>
   <button type="button" class="btn ${today ? 'primary' : ''}" data-action="nr-commit" data-deliver="1">${icon('out')}Entregar</button>
  </div>`;
}
function nrCommit(deliver) {
 const errs = [];
 const n = draft.newRenter;
 if (!draft.renterId && !(n && n.name.trim() && n.doc.trim() && n.phone.trim())) errs.push('Falta el cliente');
 if (P(draft.to) <= P(draft.from)) errs.push('Revisá las fechas');
 if (!draft.carId) errs.push('Falta el carro');
 let from = draft.from;
 if (deliver && P(from) > NOW) from = S(NOW);
 if (!errs.length && deliver && !isFree(carById(draft.carId), from, draft.to)) errs.push('No está libre ahora');
 if (errs.length) {
  draft.err = errs.join(' · ');
  return paintDialog(newRentalHtml());
 }
 let renterId = draft.renterId;
 if (!renterId) {
  renterId = nid('r');
  const doc = n.doc.trim();
  renters.push({ id: renterId, name: n.name.trim(), doc, docType: /^\d{8}-?\d$/.test(doc) ? 'DUI' : 'Pasaporte', phone: n.phone.trim(), license: n.license.trim() || '—', licenseUntil: n.licenseUntil || '2030-01-01' });
 }
 const c = carById(draft.carId);
 const a = agr({
  id: nid('a'), carId: c.id, renterId, pickupAt: from, returnAt: draft.to, status: 'RESERVED', rate: c.rate, insurance: draft.insurance,
  deductible: Number(draft.deductible) || SETTINGS.deductible, discount: Number(draft.discount) || 0, extraDriver: draft.extraDriver.trim(), notes: draft.notes.trim(),
 });
 agreements.push(a);
 const who = shortName(renterById(renterId).name);
 closeDialog();
 go('#/rentas/' + a.id);
 if (deliver) return openWizard(a.id, 'out');
 markState('Reservada', 'info', `${c.plate} · ${who}`);
 toast('Reservada');
}

/* Entregar / recibir: 3 pasos (Kilometraje · Golpes · Cobro) */
function oldDamages(a, mode) {
 if (mode === 'back') return a.out ? a.out.damages : [];
 const prev = agreements.filter((x) => x.carId === a.carId && x.back).sort((x, y) => P(y.back.at) - P(x.back.at))[0];
 return prev ? prev.back.damages : [];
}
function openWizard(aid, mode) {
 const a = agrById(aid);
 const c = carById(a.carId);
 let w = wizards[aid];
 if (!w || w.mode !== mode) {
  const back = mode === 'back' && a.out;
  w = {
   aid, mode, step: 1, max: 1, at: S(NOW),
   km: back ? Math.max(a.out.km, c.odo) : c.odo, fuel: back ? a.out.fuel : 4,
   damages: [], acc: back ? a.out.acc.slice() : ALL_ACC.slice(), photos: 0,

function updateNrTotal() {
 const tot = draftTotal();
 const a = document.getElementById('nr-total');
 if (a) a.textContent = tot === null ? '—' : money(tot);
}
document.addEventListener('input', (e) => {
 const t = e.target;
 if (t.id === 'rent-q') {
  ui.rentQ = t.value;
  render();
  const el = document.getElementById('rent-q');
  el.focus();
  el.setSelectionRange(el.value.length, el.value.length);
  return;
 }
 if (t.id === 'cc-counted') return updateCloseCash();
 if (t.id === 'nr-q' && draft) {
  draft.q = t.value;
  document.getElementById('nr-results').innerHTML = nrResults();
  return;
 }
 if (t.dataset.nrNew && draft) {
  draft.newRenter[t.dataset.nrNew] = t.value;
  return;
 }
 if (t.dataset.nrField && draft) {
  draft[t.dataset.nrField] = t.value;
  if (t.dataset.nrField === 'discount') updateNrTotal();
  return;
 }
 if (t.dataset.w && wiz) {
  wiz[t.dataset.w] = t.value;
 }
});
document.addEventListener('change', (e) => {
 const t = e.target;
 if (t.id === 'free-from' || t.id === 'free-to') {
  if (!t.value) return;
  if (t.id === 'free-from') {
   ui.freeFrom = t.value;
   if (P(ui.freeTo) <= P(ui.freeFrom)) ui.freeTo = addDays(ui.freeFrom, 1);
  } else ui.freeTo = t.value;
  return render();
 }
 if ((t.id === 'nr-from' || t.id === 'nr-to') && draft) {
  if (!t.value) return;
  if (t.id === 'nr-from') {
   draft.from = t.value;
   if (P(draft.to) <= P(draft.from)) draft.to = addDays(draft.from, 1);
  } else draft.to = t.value;
  if (draft.carId && (P(draft.to) <= P(draft.from) || !isFree(carById(draft.carId), draft.from, draft.to))) draft.carId = null;
  draft.err = '';
  return paintDialog(newRentalHtml());
 }
 if (t.id === 'cc-ack-box') return updateCloseCash();

 if (t.dataset.w === 'at' && wiz) {
  wiz.at = t.value;
  wiz.pay = null;
 }
});
document.addEventListener(
 'toggle',
 (e) => {
  if (e.target.id === 'nr-more' && draft) draft.moreOpen = e.target.open;
 },
 true,
);

/* ---------- Formularios ---------- */
document.addEventListener('submit', (e) => {
 const form = e.target;
 e.preventDefault();
 const val = (n) => String(form.elements.namedItem(n)?.value ?? '').trim();
 const num = (n) => r2(Number(val(n).replace(',', '.')));
 const fail = (msg) => {
  const p = form.querySelector('[data-err]');
  if (msg) p.textContent = msg;
  p.classList.remove('hidden');
 };
 const kind = form.dataset.form;
 if (kind === 'pay') {
  const a = agrById(dlg.aid);
  const amt = num('amount');
  if (!(amt > 0)) return fail();
  if (!openSession()) return fail('Sin caja abierta');
  if (val('method') === 'OTHER' && !val('note')) return fail('Falta el detalle');
  const before = rStatus(a);
  const p = pay(a.id, stampNow(), amt, val('method'));
  p.ref = val('ref');
  p.note = val('note');
  payments.push(p);
  ui.focus = p.id;
  closeDialog();
  render();
  const after = rStatus(a);
  if (after !== before) markState(RS[after][0], RS[after][1], `#${a.no || '—'} · ${carById(a.carId).plate}`);
  return toast(`Cobrado ${money(amt)}`);
 }
 if (kind === 'open-cash') {
  const f = num('float');
  if (Number.isNaN(f) || f < 0) return fail();
  sessions.push({ id: 's' + ++sessionSeq, no: sessionSeq, openedAt: stampNow(), closedAt: null, float: f, counted: null, notes: '' });
  render();
  return toast('Caja abierta');
 }
 if (kind === 'close-cash') {
  const sx = openSession();
  const counted = num('counted');
  if (!sx || Number.isNaN(counted) || counted < 0 || val('counted') === '') return fail('Revisá el contado');
  const c = Math.round((counted - expectedOf(sx)) * 100);
  if (Math.abs(c) >= 1000 && !layer.querySelector('#cc-ack-box').checked) return fail();
  Object.assign(sx, { closedAt: stampNow(), counted, notes: val('notes') });
  ui.focus = sx.id;
  closeDialog();
  render();
  return toast('Caja cerrada');
 }
 if (kind === 'deposit') {
  const a = agrById(dlg.aid);
  const d = a.deposit;
  const amt = num('amount');
  if (Number.isNaN(amt) || amt < 0 || amt > d.amount) return fail(`Máximo ${money(d.amount)}`);
  const kept = r2(d.amount - amt);
  if (kept > 0 && !val('why')) return fail('Falta el motivo');
  const before = rStatus(a);
  Object.assign(d, { state: 'returned', returnedAt: stampNow(), kept, keptWhy: val('why') });
  closeDialog();
  render();
  const after = rStatus(a);
  if (after !== before) markState(RS[after][0], RS[after][1], `#${a.no || '—'} · ${carById(a.carId).plate}`);
  return toast('Devuelta');
 }
 if (kind === 'void') {
  const p = payments.find((x) => x.id === dlg.pid);
  p.voided = true;
  p.note = val('why') || p.note;
  closeDialog();
  render();
  return toast('Anulado');
 }
 if (kind === 'edit') {
  const a = agrById(dlg.aid);
  const from = a.status === 'RESERVED' ? val('from') || a.pickupAt : a.pickupAt;
  const to = val('to') || a.returnAt;
  if (P(to) <= P(from)) return fail('Revisá las fechas');
  if (!isFree(carById(a.carId), from, to, a.id)) return fail('No está libre');
  Object.assign(a, {
   pickupAt: from, returnAt: to, insurance: val('ins') === '1', discount: num('discount') || 0,
   deductible: num('deductible') || a.deductible, extraDriver: val('extraDriver'), notes: val('notes'),
  });
  closeDialog();
  render();
  return toast('Guardado');
 }
 if (kind === 'cancel') {
  const a = agrById(dlg.aid);
  a.status = 'CANCELLED';
  if (val('why')) a.notes = (a.notes ? a.notes + ' · ' : '') + 'Se canceló: ' + val('why');
  closeDialog();
  render();
  markState('Cancelada', 'neutral', carById(a.carId).plate);
  return toast('Cancelada');
 }
 if (kind === 'car') {
  const rate = num('rate');
  if (!val('plate') || !val('make') || !val('model') || !(rate > 0)) return fail();
  const data = {
   plate: val('plate').toUpperCase(), make: val('make'), model: val('model'), year: Number(val('year')) || new Date().getFullYear(),
   color: val('color') || '—', rate, type: val('type') || 'Sedán', odo: Number(val('odo').replace(/[^\d]/g, '')) || 0,
   insuranceUntil: val('insuranceUntil') || addDays(TODAY + 'T00:00', 365).slice(0, 10), cardUntil: val('cardUntil') || addDays(TODAY + 'T00:00', 365).slice(0, 10),
  };
  if (dlg.cid) {
   Object.assign(carById(dlg.cid), data);
   closeDialog();
   render();
   return toast('Guardado');
  }
  const c = Object.assign({ id: nid('c'), status: 'ACTIVE', fixed: 0, svc: {} }, data);
  cars.push(c);
  MONTHS.forEach((m) => (income[c.id + m] = 0));
  ui.focus = c.id;
  closeDialog();
  go('#/carros');
  return toast('Agregado');
 }
 if (kind === 'expense') {
  const amt = num('amount');
  if (!(amt > 0) || !val('what')) return fail();
  const ex = { id: expId++, carId: dlg.cid, date: val('date') || TODAY, what: val('what'), amount: amt, auto: null };
  expenses.push(ex);
  ui.focus = 'e' + ex.id;
  closeDialog();
  render();
  return toast('Anotado');
 }
 if (kind === 'service') {
  const c = carById(dlg.cid);
  const sel = [...form.querySelectorAll('[data-toggle][aria-pressed="true"]')].map((b) => b.dataset.toggle);
  const other = val('other');
  if (!sel.length && !other) return fail();
  const kmN = Number(val('km').replace(/[^\d]/g, '')) || c.odo;
  const date = val('date') || TODAY;
  const cost = num('cost') || 0;
  const what = [...sel.map((id) => PLAN.find((p) => p.id === id).name), ...(other ? [other] : [])];
  const log = { id: nid('l'), carId: c.id, date, km: kmN, what, cost, note: val('note') };
  logs.push(log);
  sel.forEach((id) => (c.svc[id] = { km: kmN, date }));
  c.odo = Math.max(c.odo, kmN);
  if (cost > 0) expenses.push({ id: expId++, carId: c.id, date, what: `${what.join(', ')} · servicio`, amount: cost, auto: 'service' });
  ui.focus = log.id;
  closeDialog();
  render();
  return toast('Anotado');
 }
 return undefined;
});

/* Arranque */
const protoBar = document.querySelector('.proto-bar');
const syncProto = () => document.documentElement.style.setProperty('--proto-h', protoBar.offsetHeight + 'px');
syncProto();
let wasWide = window.innerWidth >= 900;
window.addEventListener('resize', () => {
 syncStack();
 syncProto();
 const wide = window.innerWidth >= 900;
 if (wide !== wasWide) {
  wasWide = wide;
  render();
 }
});
window.addEventListener('hashchange', () => {
 ui.menu = null;
 render();
 window.scrollTo(0, 0);
});
setTheme(store.get('theme') || 'dark', true);
setDensity(store.get('density') || (window.innerWidth < 900 || matchMedia('(pointer: coarse)').matches ? 'bahia' : 'mostrador'), true);
if (!location.hash) history.replaceState(null, '', '#/hoy');
render();
</script>
