<!doctype html>
<!--
  Elite Service · Historial del cliente en la ficha de la renta, prototipo aislado (regla global 12).
  Hoy: un <details> «Historial» bajo el nombre del cliente que abre la tabla completa (con
  paginador y la renta actual incluida) dentro del encabezado.
  Propuesta:
  1. El encabezado queda con carro, cliente, fechas y acciones. Junto al nombre, un dato corto:
     «5 rentas», «Debe $50.00» (rojo, si debe en otra renta) o «Cliente nuevo».
  2. Al final, la tarjeta «Otras rentas»: las últimas 3, sin la actual ni paginador. Fila: fechas ·
     carro · estado · total (o lo que debe). Cada fila abre esa renta; «Ver todas» lleva a la
     ficha del cliente. Sin otras rentas, la tarjeta no se dibuja.
  El chip del encabezado baja a la tarjeta. Datos en memoria. No es una spec.
-->
<html lang="es" data-theme="dark" data-density="mostrador">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Historial del cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,600;0,700;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #070e1c; --surface: #0b1730; --surface-2: #101e3c; --surface-3: #152747;
  --line: #1e3358; --line-soft: #182b4c; --rail: #050a15; --plate-bg: #0e1b33;
  --text: #eaf0fa; --text-dim: #8fa4c6; --text-faint: #7387ac;
  --flame: #f04e23; --flame-hot: #f58220; --flame-deep: #c4161c; --flame-text: #f58220;
  --gradient-action: linear-gradient(100deg, var(--flame-hot), var(--flame) 55%, var(--flame-deep));
  --gradient-rail-active: linear-gradient(180deg, var(--flame-hot), var(--flame-deep));
  --go: #2fbf7c; --go-text: #2fbf7c; --danger: #a8232b; --danger-text: #f08089;
  --warn: #e5a64b; --warn-text: #e5a64b; --info-text: #7fb0ff;
  --rail-text: #e6edf9; --rail-dim: #a8b6ce; --on-flame: #ffffff;
  --shadow-dialog: 0 24px 60px -12px rgb(0 0 0 / 0.85), 0 0 0 1px rgb(255 255 255 / 0.08);
  --radius-sm: 6px; --radius-control: 10px; --radius-row: 12px; --radius-card: 14px; --radius-pill: 999px;
  --rail-w: 248px; --active-mark: 3px;
  --page-max: 1280px; --page-px: 34px; --page-pt: 30px; --page-pb: 60px;
  --display-size: 38px; --stat-size: 28px; --title-size: 17px; --plate-size-sm: 12px;
  --tint-fill: 12%; --tint-line: 40%;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --duration-state: 140ms; --duration-enter: 180ms; --duration-mount: 280ms;
  --row-h: 52px; --control-h: 40px; --touch-min: 36px; --icon-size: 16px;
  --body-size: 14.5px; --dense-size: 12.5px;
  --font-sans: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-display: Saira, 'Arial Narrow', system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
[data-theme='light'] {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f6f8fc; --surface-3: #e6ebf3;
  --line: #d9e0ec; --line-soft: #e6ebf3; --rail: #0b1730; --plate-bg: #f1f4fa;
  --text: #0b1730; --text-dim: #4e5d77; --text-faint: #626c80;
  --flame-text: #a8480c; --go-text: #0f6b41; --danger-text: #a8232b; --warn-text: #8a5510; --info-text: #1d4ed8;
  --shadow-dialog: 0 24px 60px -12px rgb(11 23 48 / 0.28), 0 0 0 1px rgb(11 23 48 / 0.08);
}
[data-density='bahia'] {
  --row-h: 64px; --control-h: 48px; --touch-min: 44px; --icon-size: 20px;
  --body-size: 15.5px; --dense-size: 14px; --title-size: 18px; --stat-size: 38px;
  --plate-size-sm: 13.5px; --page-max: 1024px;
}
* { box-sizing: border-box }
html { color-scheme: dark }
html[data-theme='light'] { color-scheme: light }
html, body { margin: 0 }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: var(--body-size); line-height: 1.45; -webkit-font-smoothing: antialiased }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent }
a { color: inherit; text-decoration: none }
:focus-visible { outline: 2px solid var(--flame-hot); outline-offset: 2px }
svg.i { width: var(--icon-size); height: var(--icon-size); stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none }
.m { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums }
.dim { color: var(--text-dim) } .faint { color: var(--text-faint) } .red { color: var(--danger-text) }

/* Barra del prototipo */
.proto-bar { position: sticky; top: 0; z-index: 45; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: var(--rail); color: var(--rail-text); border-bottom: 1px solid var(--line); font-size: 13px }
.proto-bar strong { margin-right: auto; font-weight: 600 }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--radius-control); overflow: hidden }
.seg button { min-height: 32px; padding: 0 12px; border: 0; background: transparent; color: var(--rail-dim); cursor: pointer; font-size: 12.5px; font-weight: 600 }
.seg button[aria-pressed='true'] { background: color-mix(in srgb, var(--rail-text) 14%, var(--rail)); color: var(--rail-text); box-shadow: inset 0 -2px 0 var(--flame) }

/* Shell */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100vh - 53px) }
.rail { position: sticky; top: 53px; height: calc(100vh - 53px); background: var(--rail); color: var(--rail-dim); border-right: 1px solid rgb(255 255 255 / 0.06); display: flex; flex-direction: column; gap: 24px; padding: 16px 14px }
.wordmark { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 21px; line-height: 0.88; color: var(--rail-text); padding: 4px 6px }
.wordmark small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.2em; margin-top: 2px; color: var(--rail-dim) }
.nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.nav-item { position: relative; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 10px; border-radius: 9px; color: var(--rail-dim); font-weight: 500 }
.nav-item[aria-current='page'] { background: color-mix(in srgb, var(--flame) 14%, transparent); color: var(--on-flame) }
.nav-item[aria-current='page'] svg.i { color: var(--flame) }
.nav-item[aria-current='page']::before { content: ''; position: absolute; left: -14px; top: 8px; bottom: 8px; width: var(--active-mark); border-radius: 0 3px 3px 0; background: var(--gradient-rail-active) }
.bottom { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--rail); border-top: 1px solid rgb(255 255 255 / 0.08); padding: 8px 6px max(8px, env(safe-area-inset-bottom)) }
.bottom span { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; color: var(--rail-dim); font-size: 11px; font-weight: 500 }
.bottom span svg.i { width: 22px; height: 22px }
.bottom span[aria-current='page'] { color: var(--flame-hot) }
.page { width: 100%; max-width: var(--page-max); margin: 0 auto; padding: var(--page-pt) var(--page-px) var(--page-pb) }

/* ScreenHeader */
.back { display: inline-flex; align-items: center; gap: 6px; min-height: var(--touch-min); color: var(--text-dim); font-weight: 500; margin-bottom: 6px }
.screen-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; margin-bottom: 24px }
.head-main { min-width: 0 }
h1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: var(--display-size); line-height: 0.95; letter-spacing: -0.01em; margin: 0 }
.sub { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; color: var(--text-dim) }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px }
.who .name { color: var(--text); font-weight: 600; text-underline-offset: 4px }
.who .name:hover { text-decoration: underline }
.head-side { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
h2 { font-size: var(--title-size); font-weight: 600; margin: 0 }

/* Button */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--control-h); min-height: var(--touch-min); padding: 0 16px; border-radius: var(--radius-control); border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-size: var(--body-size); font-weight: 600; cursor: pointer; white-space: nowrap; transition: border-color var(--duration-state) var(--ease-standard), filter var(--duration-state) var(--ease-standard) }
.btn:hover { border-color: var(--flame) }
.btn.primary { background-image: var(--gradient-action); color: var(--on-flame); border-color: transparent; padding: 0 20px }
.btn.primary:hover { filter: brightness(1.1) }
.btn.icon { width: var(--control-h); padding: 0 }

/* PlateChip + Stamp */
.plate { display: inline-block; font-family: var(--font-mono); font-style: normal; font-weight: 700; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; font-size: var(--plate-size-sm); line-height: 1.4; padding: 2px 8px; background: var(--plate-bg); border: 1px solid var(--line); border-radius: var(--radius-sm); white-space: nowrap; color: var(--text) }
h1 .plate { font-size: 15px; padding: 3px 10px }
.stamp { display: inline-flex; align-items: center; gap: 6px; width: fit-content; flex: none; padding: 3px 10px; border: 1px solid; border-radius: var(--radius-pill); font-size: var(--dense-size); font-weight: 600; white-space: nowrap; color: var(--tone, var(--text-dim)); background-color: color-mix(in oklab, currentColor var(--tint-fill), transparent); border-color: color-mix(in oklab, currentColor var(--tint-line), transparent) }
.stamp svg.i { width: 14px; height: 14px }
.stamp.lg { padding: 6px 14px; font-size: var(--body-size) }
.stamp.lg svg.i { width: 16px; height: 16px }
.t-go { --tone: var(--go-text) } .t-flame { --tone: var(--flame-text) } .t-red { --tone: var(--danger-text) } .t-info { --tone: var(--info-text) } .t-dim { --tone: var(--text-dim) }

/* Dato del cliente junto al nombre: lleva a la tarjeta */
.tag { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: var(--surface-2); color: var(--text-dim); font-size: var(--dense-size); font-weight: 600; white-space: nowrap; cursor: pointer; transition: border-color var(--duration-state) var(--ease-standard) }
a.tag:hover { border-color: var(--flame); color: var(--text) }
.tag.owes { color: var(--danger-text); border-color: color-mix(in srgb, var(--danger) 55%, transparent); background: color-mix(in srgb, var(--danger) 10%, transparent) }
.tag.new { color: var(--info-text); border-color: color-mix(in srgb, var(--info-text) 40%, transparent); background: color-mix(in srgb, var(--info-text) 8%, transparent); cursor: default }
[data-density='bahia'] .tag { min-height: 34px; padding: 0 14px }

/* Tarjetas */
.stack { display: flex; flex-direction: column; gap: 16px }
.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-card); padding: 18px 20px }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 12px }
.card-head h2 span { color: var(--text-faint); font-weight: 500; margin-left: 6px }
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px }
.figs p { margin: 0; color: var(--text-dim); font-size: var(--dense-size); font-weight: 500 }
.fig { margin-top: 4px; font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: var(--stat-size); line-height: 1; font-variant-numeric: tabular-nums }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; margin: 0 }
.fields dt { font-size: var(--dense-size); font-weight: 500; color: var(--text-dim); margin-bottom: 3px }
.fields dd { margin: 0; font-weight: 500 }
[data-density='bahia'] .fields { grid-template-columns: minmax(0, 1fr) }
.link { display: inline-flex; align-items: center; gap: 4px; min-height: var(--touch-min); color: var(--info-text); font-weight: 600 }
.link:hover { text-decoration: underline; text-underline-offset: 4px }

/* Otras rentas */
.rows { list-style: none; margin: 0; padding: 0 }
.rows li + li { border-top: 1px solid var(--line-soft) }
.row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 120px 120px 20px; align-items: center; gap: 14px; min-height: var(--row-h); padding: 6px 10px; margin: 0 -10px; border-radius: var(--radius-row); cursor: pointer; transition: background var(--duration-state) var(--ease-standard) }
.row:hover { background: var(--surface-2) }
.row .when { color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap }
.row .car { display: flex; align-items: center; gap: 10px; min-width: 0 }
.row .car b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row .amt { text-align: right; white-space: nowrap }
.row .chev { color: var(--text-faint) }
.row:hover .chev { color: var(--text) }
/* Bahía y pantallas angostas: dos renglones, carro y monto arriba, fechas y estado abajo */
[data-density='bahia'] .row { grid-template-columns: minmax(0, 1fr) auto 20px; grid-template-areas: 'car amt chev' 'when st chev'; gap: 6px 12px; padding: 12px 10px }
[data-density='bahia'] .row .car { grid-area: car } [data-density='bahia'] .row .amt { grid-area: amt }
[data-density='bahia'] .row .when { grid-area: when } [data-density='bahia'] .row .st { grid-area: st; justify-self: end }
[data-density='bahia'] .row .chev { grid-area: chev }

/* «Antes»: el <details> de hoy */
details.old summary { min-height: var(--touch-min); display: flex; align-items: center; cursor: pointer; font-weight: 600; width: fit-content }
details.old .old-table { margin-top: 6px; max-width: 380px; overflow-x: auto; border: 1px solid var(--line-soft); border-radius: var(--radius-row) }
details.old table { border-collapse: collapse; font-size: var(--dense-size); min-width: 520px }
details.old th, details.old td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap }
details.old th { color: var(--text-faint); font-weight: 600 }
details.old .pager { display: flex; justify-content: space-between; padding: 8px 10px; color: var(--text-faint); font-size: var(--dense-size) }

.toast { position: fixed; right: 24px; bottom: 24px; z-index: 70; padding: 12px 16px; border-radius: var(--radius-row); background: var(--surface); border: 1px solid var(--line-soft); box-shadow: var(--shadow-dialog); font-weight: 600; animation: rise var(--duration-enter) var(--ease-standard) }
.flash { animation: flash 1.2s var(--ease-standard) }
@keyframes flash { 0%, 40% { border-color: var(--flame) } }
@keyframes rise { from { opacity: 0; transform: translateY(8px) } }
.enter > * { animation: rise var(--duration-mount) var(--ease-standard) backwards }
.enter > *:nth-child(2) { animation-delay: 30ms } .enter > *:nth-child(3) { animation-delay: 60ms } .enter > *:nth-child(4) { animation-delay: 90ms }

/* Bahía: tablet de pie. Sin riel, barra abajo, acciones a todo lo ancho. */
[data-density='bahia'] .shell { grid-template-columns: minmax(0, 1fr) }
[data-density='bahia'] .rail { display: none }
[data-density='bahia'] .bottom { display: flex }
[data-density='bahia'] .page { padding-bottom: 120px }
[data-density='bahia'] .head-side, [data-density='bahia'] .actions { width: 100% }
[data-density='bahia'] .actions .btn.primary { flex: 1; height: 56px; font-size: 17px }
[data-density='bahia'] .actions .btn.icon { height: 56px; width: 56px }

@media (max-width: 900px) {
  :root { --page-px: 16px; --page-pt: 18px; --display-size: 30px }
  .shell { grid-template-columns: minmax(0, 1fr) }
  .rail { display: none }
  .bottom { display: flex }
  .page { padding-bottom: 120px }
  .toast { left: 16px; right: 16px; bottom: 84px }
}
@media (max-width: 640px) {
  .row { grid-template-columns: minmax(0, 1fr) auto 20px; grid-template-areas: 'car amt chev' 'when st chev'; gap: 6px 12px; padding: 12px 10px }
  .row .car { grid-area: car } .row .amt { grid-area: amt } .row .when { grid-area: when } .row .st { grid-area: st; justify-self: end } .row .chev { grid-area: chev }
  .figs .fig { font-size: 24px }
  .fields { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important } }
</style>
</head>
<body>
<div class="proto-bar" role="toolbar" aria-label="Prototipo">
  <strong>Historial del cliente</strong>
  <div class="seg" role="group" aria-label="Versión">
    <button type="button" data-view="before" aria-pressed="false">Antes</button>
    <button type="button" data-view="after" aria-pressed="true">Propuesta</button>
  </div>
  <div class="seg" role="group" aria-label="Cliente">
    <button type="button" data-case="regular" aria-pressed="true">Frecuente</button>
    <button type="button" data-case="owes" aria-pressed="false">Debe en otra</button>
    <button type="button" data-case="new" aria-pressed="false">Nuevo</button>
  </div>
  <div class="seg" role="group" aria-label="Tema">
    <button type="button" data-theme-set="dark" aria-pressed="true">Oscuro</button>
    <button type="button" data-theme-set="light" aria-pressed="false">Claro</button>
  </div>
  <div class="seg" role="group" aria-label="Densidad">
    <button type="button" data-density-set="mostrador" aria-pressed="true">Mostrador</button>
    <button type="button" data-density-set="bahia" aria-pressed="false">Bahía</button>
  </div>
</div>

<div class="shell">
  <nav class="rail" aria-label="Módulos">
    <div class="wordmark">ELITE<small>RENTA</small></div>
    <ul class="nav-list" id="rail"></ul>
  </nav>
  <main class="page" id="screen"></main>
</div>
<nav class="bottom" id="bottom" aria-label="Módulos"></nav>
<div id="toaster" aria-live="polite"></div>

<script>
'use strict';
const PATHS = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  rents: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  car: '<path d="M5 16h14M4 16l1.5-5.5A2 2 0 017.4 9h9.2a2 2 0 011.9 1.5L20 16v3h-3v-2H7v2H4z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0M16 4.5a3.5 3.5 0 010 7M18 14a6 6 0 013.5 6"/>',
  cash: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  reserved: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v3l2 1"/>',
  street: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  late: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3L2 6M19 3l3 3"/>',
  done: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
  ban: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
};
const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${PATHS[n] || ''}</svg>`;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const STATUS = {
  RESERVED: { label: 'Reservada', tone: 't-info', icon: 'reserved' },
  IN_PROGRESS: { label: 'En la calle', tone: 't-flame', icon: 'street' },
  LATE: { label: 'Atrasada', tone: 't-red', icon: 'late' },
  FINISHED: { label: 'Devuelta', tone: 't-go', icon: 'done' },
  CANCELLED: { label: 'Cancelada', tone: 't-dim', icon: 'ban' },
};
const stamp = (s, lg = false) => `<span class="stamp ${STATUS[s].tone}${lg ? ' lg' : ''}">${icon(STATUS[s].icon)}${STATUS[s].label}</span>`;
const money = (c) => '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MO = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const at = (mo, d) => new Date(2026, mo - 1, d);
function span(a, b) {
  if (!b || +a === +b) return `${a.getDate()} ${MO[a.getMonth()]}`;
  return a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MO[a.getMonth()]}` : `${a.getDate()} ${MO[a.getMonth()]} – ${b.getDate()} ${MO[b.getMonth()]}`;
}

// La renta abierta: la del pedido (Honda Fit, reservada, sale hoy).
const CURRENT = { no: null, plate: 'P172-826', car: 'Honda Fit 2007', from: at(10, 20), to: at(10, 22), status: 'RESERVED', total: 10000, balance: 10000 };
const CUSTOMERS = {
  regular: { name: 'María José Hernández', others: [
    { no: '0698', plate: 'P53DBC', car: 'Kia Picanto 2024', from: at(9, 28), to: at(10, 2), status: 'FINISHED', total: 14000, balance: 0 },
    { no: '0671', plate: 'P172-826', car: 'Honda Fit 2007', from: at(9, 10), to: at(9, 12), status: 'FINISHED', total: 7000, balance: 0 },
    { no: null, plate: 'P78F74', car: 'Kia Rio 2022', from: at(9, 1), to: at(9, 3), status: 'CANCELLED', total: 0, balance: 0 },
    { no: '0640', plate: 'P78F74', car: 'Kia Rio 2022', from: at(8, 15), to: at(8, 20), status: 'FINISHED', total: 20000, balance: 0 },
    { no: '0611', plate: 'P53DBC', car: 'Kia Picanto 2024', from: at(7, 2), to: at(7, 5), status: 'FINISHED', total: 10500, balance: 0 },
  ] },
  owes: { name: 'José Roberto Flores', others: [
    { no: '0702', plate: 'P9048B', car: 'Nissan Sentra 2021', from: at(10, 5), to: at(10, 9), status: 'FINISHED', total: 18000, balance: 5000 },
    { no: '0671', plate: 'P172-826', car: 'Honda Fit 2007', from: at(9, 10), to: at(9, 12), status: 'FINISHED', total: 7000, balance: 0 },
    { no: '0640', plate: 'P78F74', car: 'Kia Rio 2022', from: at(8, 15), to: at(8, 20), status: 'FINISHED', total: 20000, balance: 0 },
  ] },
  new: { name: 'Ana Lucía Portillo', others: [] },
};
/** Filas que caben en la tarjeta; el resto, en la ficha del cliente. */
const SHOWN = 3;

const ui = { view: 'after', case: 'regular' };
const NAV = [['home', 'Hoy'], ['rents', 'Rentas'], ['car', 'Flota'], ['users', 'Clientes'], ['cash', 'Caja']];
function renderNav() {
  $('#rail').innerHTML = NAV.map(([i, l]) => `<li><span class="nav-item"${l === 'Rentas' ? ' aria-current="page"' : ''}>${icon(i)}${l}</span></li>`).join('');
  $('#bottom').innerHTML = NAV.map(([i, l]) => `<span${l === 'Rentas' ? ' aria-current="page"' : ''}>${icon(i)}${l}</span>`).join('');
}

function customerTag(c) {
  if (c.others.length === 0) return '<span class="tag new">Cliente nuevo</span>';
  const owed = c.others.reduce((s, a) => s + a.balance, 0);
  const n = c.others.length;
  const count = `<a class="tag" href="#others">${n} ${n === 1 ? 'renta' : 'rentas'}</a>`;
  return owed > 0 ? `<a class="tag owes" href="#others">Debe ${money(owed)}</a>${count}` : count;
}

function oldHistory(c) {
  const all = [CURRENT, ...c.others];
  const rows = all.map((a) => `<tr><td>${a.no ? '#' + a.no : '<span class="faint">—</span>'}</td><td><span class="plate">${a.plate}</span> ${a.car}</td><td>${span(a.from, a.to)}</td><td class="m">${money(a.balance)}</td><td>${stamp(a.status)}</td></tr>`).join('');
  return `<details class="old"><summary>Historial</summary><div class="old-table"><table><thead><tr><th>Ref.</th><th>Carro</th><th>Sale / regresa</th><th>Saldo</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table><div class="pager"><span>${all.length} rentas</span><span>Página 1 de 1</span></div></div></details>`;
}

function othersCard(c) {
  if (c.others.length === 0) return '';
  const rows = c.others.slice(0, SHOWN).map((a, i) => {
    const amt = a.status === 'CANCELLED' ? '<span class="faint">—</span>'
      : a.balance > 0 ? `<span class="m red">Debe ${money(a.balance)}</span>`
      : `<span class="m dim">${money(a.total)}</span>`;
    return `<li><a class="row" href="#" data-open="${i}">
      <span class="when">${span(a.from, a.to)}</span>
      <span class="car"><span class="plate">${a.plate}</span><b>${a.car}</b></span>
      <span class="st">${stamp(a.status)}</span>
      <span class="amt">${amt}</span>
      <span class="chev">${icon('chev')}</span></a></li>`;
  }).join('');
  const all = c.others.length > SHOWN ? `<a class="link" href="#" data-all>Ver todas ${icon('arrow')}</a>` : '';
  return `<section class="card" id="others"><div class="card-head"><h2>Otras rentas<span>${c.others.length}</span></h2>${all}</div><ul class="rows">${rows}</ul></section>`;
}

function render() {
  const c = CUSTOMERS[ui.case];
  const after = ui.view === 'after';
  $('#screen').innerHTML = `
    <a class="back" href="#">${icon('back')}Rentas</a>
    <header class="screen-head">
      <div class="head-main">
        <h1><span class="plate">${CURRENT.plate}</span><span>${CURRENT.car}</span></h1>
        <div class="sub">
          <div class="who"><a class="name" href="#" data-all>${c.name}</a>${after ? customerTag(c) : ''}</div>
          ${after ? '' : oldHistory(c)}
          <span>Sale mar, 20 oct, 10:30 a. m. · Regresa jue, 22 oct, 9:00 a. m.</span>
        </div>
      </div>
      <div class="head-side">
        ${stamp(CURRENT.status, true)}
        <div class="actions"><button type="button" class="btn primary" data-toast="Entregar">Entregar</button><button type="button" class="btn icon" aria-label="Más" data-toast="Más">${icon('more')}</button></div>
      </div>
    </header>
    <div class="stack enter">
      <section class="card"><h2>Cuenta</h2>
        <div class="figs"><div><p>Total</p><div class="fig">${money(CURRENT.total)}</div></div><div><p>Pagado</p><div class="fig">$0.00</div></div><div><p>Debe</p><div class="fig red">${money(CURRENT.balance)}</div></div></div>
      </section>
      <section class="card"><dl class="fields">
        <div><dt>Sale</dt><dd>mar, 20 oct, 10:30 a. m.</dd></div><div><dt>Regresa</dt><dd>jue, 22 oct, 9:00 a. m.</dd></div>
        <div><dt>Seguro</dt><dd>Sí</dd></div><div><dt>Golpe</dt><dd>$500</dd></div>
      </dl></section>
      ${after ? othersCard(c) : ''}
    </div>`;
}

function toast(text) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = text;
  $('#toaster').replaceChildren(el);
  setTimeout(() => el.remove(), 1800);
}
function press(sel, el) { $$(sel).forEach((b) => b.setAttribute('aria-pressed', String(b === el))); }

document.addEventListener('click', (e) => {
  const t = e.target;
  const v = t.closest('[data-view]'); if (v) { ui.view = v.dataset.view; press('[data-view]', v); render(); return; }
  const k = t.closest('[data-case]'); if (k) { ui.case = k.dataset.case; press('[data-case]', k); render(); return; }
  const th = t.closest('[data-theme-set]'); if (th) { document.documentElement.dataset.theme = th.dataset.themeSet; press('[data-theme-set]', th); return; }
  const dn = t.closest('[data-density-set]'); if (dn) { document.documentElement.dataset.density = dn.dataset.densitySet; press('[data-density-set]', dn); return; }
  const tag = t.closest('a.tag'); if (tag) {
    e.preventDefault();
    const card = $('#others'); card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
    return;
  }
  const op = t.closest('[data-open]'); if (op) { e.preventDefault(); const a = CUSTOMERS[ui.case].others[+op.dataset.open]; toast(`Abre la renta ${a.no ? '#' + a.no : 'cancelada'} · ${a.car}`); return; }
  if (t.closest('[data-all]')) { e.preventDefault(); toast(`Ficha de ${CUSTOMERS[ui.case].name}: todas sus rentas`); return; }
  const ts = t.closest('[data-toast]'); if (ts) { toast(ts.dataset.toast); return; }
  if (t.closest('a[href="#"]')) e.preventDefault();
});

renderNav();
render();
</script>
</body>
</html>
