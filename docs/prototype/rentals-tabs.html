<!--

  Copia de rentals-simplified.html; solo cambian la barra, las rutas y el encabezado de Rentas.

  Sale de la auditoría de la renta (informes 01–14; manda el 14 (e)): Hoy 01 · Libre 02, 06 · Rentas 03–05 · Caja 07 · Carros 09–12.
  Tokens de apps/web/DESIGN.md, misma estructura que fleet-centralized.html. Pasada de recorte de texto pedida por el dueño.
-->
<html lang="es" data-theme="dark" data-density="mostrador">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elite Service — Libre y Rentas juntos (propuesta)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,600;0,700;1,600;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"

    <style>
/* ===========================================================================
 * Tokens: copiados tal cual de apps/web/src/app/globals.css (mismos nombres).
 * Solo se agregan los que el prototipo necesita y la app resuelve con
 * utilidades de Tailwind (--rail-line, --rail-fill, --backdrop, --hero-size…).
 * ========================================================================= */
:root {
  --bg: #070e1c; --surface: #0b1730; --surface-2: #101e3c; --surface-3: #152747;
  --line: #1e3358; --line-soft: #182b4c; --rail: #050a15; --plate-bg: #0e1b33;
  --text: #eaf0fa; --text-dim: #8fa4c6; --text-faint: #7387ac;
  --flame: #f04e23; --flame-hot: #f58220; --flame-deep: #c4161c; --flame-text: #f58220;
  --gradient-action: linear-gradient(100deg, var(--flame-hot), var(--flame) 55%, var(--flame-deep));
  --gradient-rail-active: linear-gradient(180deg, var(--flame-hot), var(--flame-deep));
  --gradient-bar-active: linear-gradient(90deg, var(--flame-hot), var(--flame-deep));
  --go: #2fbf7c; --go-text: #2fbf7c; --danger: #a8232b; --danger-text: #f08089;
  --warn: #e5a64b; --warn-text: #e5a64b; --info-text: #7fb0ff;
  --rail-text: #e6edf9; --rail-dim: #a8b6ce; --rail-faint: #7c8cab;
  --rail-line: rgb(255 255 255 / 0.06); --rail-fill: rgb(255 255 255 / 0.05);
  --on-flame: #ffffff;
  --rail-w: 248px; --active-mark: 3px; --tab-mark: 2.5px; --bottom-bar-h: 64px;
  --shadow-dialog: 0 24px 60px -12px rgb(0 0 0 / 0.85), 0 0 0 1px rgb(255 255 255 / 0.08);
  --backdrop: color-mix(in srgb, var(--bg) 80%, transparent);
  --radius-sm: 6px; --radius-control: 10px; --radius-row: 12px; --radius-card: 14px; --radius-pill: 999px;
  --nav-item-radius: 9px; --check-radius: 5px; --segment-radius: 7px; --bar-radius: 4px;
  --selectable-border: 1.5px;
  --page-max: 1440px; --page-px: 34px; --page-pt: 30px; --page-pb: 60px; --grid-gap: 18px;
  --card-pad: 22px;
  --display-size: 38px; --stat-size: 28px; --stat-size-wide: 32px; --stat-size-lg: 38px;
  --hero-size: clamp(40px, 5.2vw, 60px); /* la cifra grande de caja (cash.html) */
  --nav-badge-size: 10px; --nav-label-size: 11px; --count-size: 11.5px; --meta-size: 12px;
  --control-text-size: 13px; --lead-size: 16px;
  --plate-size-sm: 12px; --plate-size: 13.5px; --plate-size-lg: 16px;
  --tint-fill: 12%; --tint-line: 40%;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --duration-state: 140ms; --duration-enter: 180ms; --duration-mount: 280ms; --stagger-step: 35ms;
  --enter-rise: 8px; --duration-flash: 1.6s;
  /* Densidad: mostrador por defecto. */
  --row-h: 52px; --control-h: 40px; --touch-min: 36px; --plate-pad: 16px; --icon-size: 16px;
  --field-px: 16px; --field-pt: 8px; --field-pb: 10px;
  --body-size: 14.5px; --dense-size: 12.5px; --title-size: 17px; --headline-size: 21px;
  --diagram-w: 240px;
  --font-sans: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-display: Saira, 'Arial Narrow', system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
[data-theme='light'] {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f6f8fc; --surface-3: #e6ebf3;
  --line: #d9e0ec; --line-soft: #e6ebf3; --rail: #0b1730; --plate-bg: #f1f4fa;
  --text: #0b1730; --text-dim: #4e5d77; --text-faint: #626c80;
  --flame-text: #a8480c; --go-text: #0f6b41; --danger-text: #a8232b; --warn-text: #8a5510; --info-text: #1d4ed8;
  --shadow-dialog: 0 24px 60px -12px rgb(11 23 48 / 0.28), 0 2px 8px -2px rgb(11 23 48 / 0.12), 0 0 0 1px rgb(11 23 48 / 0.08);
  --backdrop: rgb(0 0 0 / 0.45);
}
[data-density='bahia'] {
  --row-h: 56px; --control-h: 48px; --touch-min: 44px; --plate-pad: 20px; --icon-size: 20px;
  --field-px: 18px; --field-pt: 10px; --field-pb: 12px;
  --stat-size: var(--stat-size-lg); --stat-size-wide: var(--stat-size-lg);
  --body-size: 15.5px; --dense-size: 14px; --title-size: 18px; --headline-size: 24px;
  --plate-size: 15px; --plate-size-lg: 18px;
  --diagram-w: 320px; --page-pb: 120px;
}

/* ---------- Base ---------- */
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: var(--body-size); line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden }
button, input, select, textarea { font: inherit; color: inherit }
button { -webkit-tap-highlight-color: transparent }
a { color: inherit }
:focus-visible { outline: 2px solid var(--flame-hot); outline-offset: 2px }
::selection { background: color-mix(in srgb, var(--flame) 28%, transparent) }
svg.i { width: var(--icon-size); height: var(--icon-size); stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums }
.dim { color: var(--text-dim) }
.faint { color: var(--text-faint) }
.dense { font-size: var(--dense-size); line-height: 1.4 }
.hidden { display: none !important }
.nowrap { white-space: nowrap }
.red { color: var(--danger-text) }
.go { color: var(--go-text) }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.tint { background-color: color-mix(in oklab, currentColor var(--tint-fill), transparent); border-color: color-mix(in oklab, currentColor var(--tint-line), transparent) }

/* ---------- Barra del prototipo (fuera de la app) ---------- */
.proto-bar { position: sticky; top: 0; z-index: 45; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: #02050c; color: #e6edf9; border-bottom: 1px solid #1e3358; font-size: 13px }
.proto-bar strong { font-weight: 600; margin-right: auto }
.seg { display: inline-flex; border: 1px solid #1e3358; border-radius: var(--radius-control); overflow: hidden }
.seg button { min-height: 32px; padding: 0 12px; border: 0; background: transparent; color: #a8b6ce; cursor: pointer; font-size: 12.5px; font-weight: 600 }
.seg button[aria-pressed='true'] { background: #152747; color: #e6edf9; box-shadow: inset 0 -2px 0 #f04e23 }

/* ---------- Armazón: riel (AppShell / NavRail) ---------- */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100vh }
.rail { position: sticky; top: var(--proto-h, 0px); height: calc(100vh - var(--proto-h, 0px)); overflow-y: auto; background: var(--rail); color: var(--rail-dim); border-right: 1px solid var(--rail-line); display: flex; flex-direction: column; gap: 24px; padding: 16px 14px }
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 6px; color: var(--rail-text) }
.logo svg { width: 46px; height: 28px; flex: none }
.wordmark { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 21px; line-height: 0.88; letter-spacing: 0.01em; color: var(--rail-text) }
.wordmark small { display: block; font-size: 11.5px; font-weight: 700; color: var(--rail-dim); letter-spacing: 0.2em; margin-top: 2px }
.ws-btn { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 10px; border-radius: var(--nav-item-radius); background: rgb(255 255 255 / 0.05); border: 1px solid rgb(255 255 255 / 0.08); color: var(--rail-text); font-weight: 500 }
.ws-btn .flame { color: var(--flame); display: inline-flex }
.ws-btn span.grow { flex: 1 }
.nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.nav-item { position: relative; width: 100%; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 10px; border-radius: var(--nav-item-radius); border: 0; background: none; color: var(--rail-dim); cursor: pointer; font-weight: 500; font-size: 14.5px; text-align: left; transition: background-color var(--duration-state) var(--ease-standard), color var(--duration-state) var(--ease-standard) }
.nav-item svg.i { opacity: 0.8 }
.nav-item:hover { background: var(--rail-fill); color: var(--rail-text) }
.nav-item[aria-current='page'] { background: color-mix(in srgb, var(--flame) 14%, transparent); color: #fff }
.nav-item[aria-current='page'] svg.i { color: var(--flame); opacity: 1 }
.nav-item[aria-current='page']::before { content: ''; position: absolute; left: -14px; top: 8px; bottom: 8px; width: var(--active-mark); border-radius: 0 var(--active-mark) var(--active-mark) 0; background: var(--gradient-rail-active) }
.count { margin-left: auto; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 22px; padding: 1px 7px; border-radius: var(--radius-pill); background: rgb(255 255 255 / 0.09); color: var(--rail-text); text-align: center }
.nav-item[aria-current='page'] .count { background: var(--flame); color: #fff }
.rail-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid rgb(255 255 255 / 0.07) }
.rail-foot .menu-wrap { display: block }
.rail-foot .who { width: 100%; justify-content: flex-start; border: 0; background: none; color: var(--rail-dim); padding: 0 10px; border-radius: var(--radius-control) }
.rail-foot .who:hover { background: rgb(255 255 255 / 0.06); color: var(--rail-text) }
.rail-foot .who .grow { flex: 1; text-align: left }
.rail-foot .menu { top: auto; bottom: calc(100% + 8px); left: 0; right: 0; min-width: 0 }
.bottom-bar { display: none }

/* ---------- Página ---------- */
.page { width: 100%; max-width: var(--page-max); margin: 0 auto; padding: var(--page-pt) var(--page-px) var(--page-pb); min-width: 0 }
.topbar { display: none; align-items: center; gap: 12px; min-height: 48px; margin-bottom: 18px }
.topbar .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text) }
.topbar .brand svg { width: 40px; height: 24px }
.topbar .brand .wordmark { color: var(--text); font-size: 19px }
.topbar .brand .wordmark small { color: var(--text-faint) }
.topbar .spacer { flex: 1 }
.who { display: inline-flex; align-items: center; gap: 8px; min-height: var(--touch-min); padding: 0 12px 0 10px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface-2); cursor: pointer; font-weight: 600; font-size: var(--dense-size) }
.who:hover { border-color: var(--flame) }

/* Entrada en cascada (088): cada pieza sube 8px, un paso tras otro. */
@keyframes elite-enter-rise { from { opacity: 0; transform: translateY(var(--enter-rise)) } }
@keyframes elite-surface-in { from { opacity: 0; transform: scale(0.97) } }
@keyframes elite-fade-in { from { opacity: 0 } }
@keyframes elite-sheet-in { from { transform: translateY(100%) } }
@keyframes elite-toast-in { from { opacity: 0; transform: translateY(12px) } }
@keyframes elite-flash { from { background-color: color-mix(in oklab, var(--flame-text) 18%, transparent) } }
.enter > * { animation: elite-enter-rise var(--duration-mount) var(--ease-standard) backwards }
.enter > *:nth-child(2) { animation-delay: calc(1 * var(--stagger-step)) }
.enter > *:nth-child(3) { animation-delay: calc(2 * var(--stagger-step)) }
.enter > *:nth-child(4) { animation-delay: calc(3 * var(--stagger-step)) }
.enter > *:nth-child(n + 5) { animation-delay: calc(4 * var(--stagger-step)) }
.enter .day-grid > .card:nth-child(2), .enter .cash-top > .card:nth-child(2), .enter .detail > .stack:nth-child(2) { animation: elite-enter-rise var(--duration-mount) var(--ease-standard) calc(2 * var(--stagger-step)) backwards }
.enter .day-grid > .card:nth-child(3) { animation: elite-enter-rise var(--duration-mount) var(--ease-standard) calc(3 * var(--stagger-step)) backwards }

/* ---------- Cabecera de pantalla (ScreenHeader) ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; margin: 0 0 4px -4px; padding: 0 4px; color: var(--text-dim); background: none; border: 0; cursor: pointer; min-height: var(--touch-min); font-size: var(--dense-size); border-radius: var(--radius-control) }
.back:hover { color: var(--text) }
.screen-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 20px; margin: 0 0 24px; min-height: 48px }
h1 { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: var(--display-size); line-height: 0.95; letter-spacing: -0.01em; margin: 0 }
.head-plate + h1 { margin-top: 10px }
.subtitle { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 10px; color: var(--text-dim) }
.head-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
h2.section-title { font-size: var(--title-size); line-height: 1.35; font-weight: 600; margin: 0 }
.section { display: grid; gap: 12px; margin-top: 28px }
.section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px }

/* ---------- Chip de placa (PlateChip) y referencia ---------- */
.plate { display: inline-block; width: fit-content; font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; font-size: var(--plate-size); line-height: 1.2; padding: 4px 9px; background: var(--plate-bg); border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--text); white-space: nowrap }
.plate.sm { font-size: var(--plate-size-sm); padding: 2px 8px }
.plate.lg { font-size: var(--plate-size-lg); padding: 5px 12px }
.ref { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-faint); font-size: var(--plate-size) }

/* ---------- Sello de estado (Stamp): punto + palabra, .tint ---------- */
.stamp { display: inline-flex; align-items: center; justify-content: center; gap: 7px; width: fit-content; padding: 4px 11px; border: 1px solid; border-radius: var(--radius-pill); font-size: var(--dense-size); line-height: 1.35; font-weight: 600; white-space: nowrap; background-color: color-mix(in oklab, currentColor var(--tint-fill), transparent); border-color: color-mix(in oklab, currentColor var(--tint-line), transparent) }
.stamp::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none }
.head-plate .stamp { padding: 6px 14px; gap: 8px; font-size: var(--body-size) }
.t-green { color: var(--go-text) }
.t-amber { color: var(--warn-text) }
.t-red { color: var(--danger-text) }
.t-neutral { color: var(--text-dim) }
.t-info { color: var(--info-text) }
.t-flame { color: var(--flame-text) }
.notice { display: inline-flex; align-items: center; gap: 6px; font-size: var(--dense-size); font-weight: 600 }
.notice svg.i { width: 15px; height: 15px }
.notices { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px }

/* ---------- Botón (Button) ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--control-h); min-height: var(--touch-min); padding: 0 20px; border-radius: var(--radius-control); border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-size: var(--body-size); font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; transition: filter var(--duration-state) var(--ease-standard), background-color var(--duration-state) var(--ease-standard), border-color var(--duration-state) var(--ease-standard), color var(--duration-state) var(--ease-standard) }
.btn:has(> svg.i) { padding: 0 16px }
.btn:hover { border-color: var(--flame) }
.btn:active { transform: translateY(1px) }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; border-color: var(--line); pointer-events: none }
.btn.primary { background-image: var(--gradient-action); background-origin: border-box; background-repeat: no-repeat; color: var(--on-flame); border-color: transparent }
.btn.primary:hover { filter: brightness(1.1) }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-dim); padding: 0 10px }
.btn.ghost:hover { color: var(--text); background: var(--surface-2) }
.btn.sm { height: calc(var(--control-h) - 6px); padding: 0 14px; font-size: var(--dense-size); gap: 6px }
.btn.sm:has(> svg.i) { padding: 0 12px }
.btn.ghost.sm[aria-label] { width: calc(var(--control-h) - 6px); padding: 0 }
.btn.lg { height: calc(var(--control-h) + 8px); padding: 0 28px }
.btn.lg:has(> svg.i) { padding: 0 22px }
.btn.lg[aria-label] { width: calc(var(--control-h) + 8px); padding: 0 }
.linkish { background: none; border: 0; padding: 0; color: var(--text); font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; min-height: var(--touch-min) }
.linkish:hover { text-decoration-color: var(--flame) }

/* ---------- Menú desplegable (DropdownMenu): plano, sin sombra ---------- */
.menu-wrap { position: relative; display: inline-block }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 240px; background: var(--surface); color: var(--text); border: 1px solid var(--line-soft); border-radius: var(--radius-card); padding: 6px; animation: elite-surface-in var(--duration-enter) var(--ease-standard); transform-origin: top right }
.menu button { width: 100%; display: flex; align-items: center; gap: 8px; min-height: var(--touch-min); padding: 6px 10px; border: 0; background: none; border-radius: var(--radius-control); cursor: pointer; text-align: left; font-size: var(--body-size); color: var(--text) }
.menu button svg.i { color: var(--text-faint) }
.menu button:hover { background: var(--surface-2) }
.menu button[disabled] { opacity: 0.5; cursor: not-allowed }
.menu .sep { height: 1px; background: var(--line-soft); margin: 6px -6px }

/* ---------- Filtros y buscador ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 18px }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--touch-min); padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: var(--surface); color: var(--text-dim); font-weight: 600; font-size: var(--control-text-size); cursor: pointer; transition: border-color var(--duration-state) var(--ease-standard), color var(--duration-state) var(--ease-standard), background-color var(--duration-state) var(--ease-standard) }
.chip:hover { color: var(--text); border-color: color-mix(in srgb, var(--flame) 50%, var(--line)) }
.chip.on, .chip[aria-pressed='true'] { border-color: var(--flame); color: var(--text); background: color-mix(in srgb, var(--flame) 10%, var(--surface)) }
.chip .c { font-size: var(--count-size); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-faint) }
.chip .c.red { color: var(--danger-text) }
.filters-big .chip { min-height: 40px; font-size: var(--body-size); padding: 0 18px }
[data-density='bahia'] .chip { font-size: 15px; padding: 0 18px }
[data-density='bahia'] .filters-big { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; width: 100% }
[data-density='bahia'] .filters-big .chip { min-height: 52px; font-size: 16px }
.search { flex: 1 1 260px; max-width: 400px; display: flex; align-items: center; gap: 10px; min-height: var(--control-h); padding: 0 var(--field-px); border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface-2); color: var(--text-faint); transition: border-color var(--duration-state) var(--ease-standard) }
[data-density='bahia'] .search { max-width: none; min-height: 52px }
.search:focus-within { border-color: var(--flame) }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--text) }
.search input::placeholder { color: var(--text-faint) }

/* ---------- Lista (DataTable): tabla o láminas (data-stack lo pone el JS) ---------- */
.dt { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-row); overflow: hidden }
.dt table { width: 100%; border-collapse: collapse }
.dt th { background: var(--surface-2); text-align: left; height: 40px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text-faint); padding: 0 16px; border-bottom: 1px solid var(--line); white-space: nowrap }
.dt td { padding: 10px 16px; border-top: 1px solid var(--line-soft); vertical-align: middle; height: var(--row-h); font-variant-numeric: tabular-nums }
.dt tbody tr:first-child td { border-top: 0 }
.dt th.r, .dt td.r { text-align: right }
.dt tr.click { cursor: pointer }
.dt tr td { transition: background-color var(--duration-state) var(--ease-standard) }
.dt tr.click:hover td { background: var(--surface-2) }
.dt tr.flash td, .flash { animation: elite-flash var(--duration-flash) var(--ease-standard) }
.dt tr.void td { color: var(--text-faint) }

/* ---------- Tarjeta (Card) y cifras (StatCard) ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); padding: var(--card-pad); min-width: 0 }

.fig .cents { font-size: 0.5em }
.lbl { font-size: var(--dense-size); font-weight: 500; color: var(--text-dim) }
.stat-link { display: flex; align-items: center; gap: 6px 18px; width: 100%; min-height: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-row); padding: 18px 22px; cursor: pointer; text-align: left; transition: border-color var(--duration-state) var(--ease-standard) }

.stat-link .go-to { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; border-radius: var(--radius-control); border: 1px solid color-mix(in srgb, var(--go) 25%, transparent); background: color-mix(in srgb, var(--go) 10%, transparent); color: var(--go-text) }

/* ---------- Hoy ---------- */
.day-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--grid-gap); align-items: start; margin-top: var(--grid-gap) }

.strip { display: flex; flex-wrap: wrap; gap: 8px }
.pchip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-weight: 700; font-size: var(--plate-size); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; min-height: var(--touch-min); padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid; background-color: color-mix(in oklab, currentColor var(--tint-fill), transparent); border-color: color-mix(in oklab, currentColor var(--tint-line), transparent); cursor: pointer; transition: background-color var(--duration-state) var(--ease-standard) }

/* ---------- Libre ---------- */

.car-card { display: grid; gap: 14px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 20px var(--card-pad) var(--card-pad); transition: border-color var(--duration-state) var(--ease-standard) }

/* ---------- Ficha de la renta ---------- */

.deposit { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 16px; min-height: var(--row-h); padding: 10px 16px; border-radius: var(--radius-row); background: var(--surface-2); border: 1px solid var(--line-soft) }

/* ---------- Caja ---------- */
.cash-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--grid-gap); align-items: start }
.breakdown { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px }
.breakdown div { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--radius-control); padding: 10px 14px }

.fold { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-row) }

.stat { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 96px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-row); min-width: 0 }

.d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: var(--plate-pad) var(--plate-pad) calc(var(--plate-pad) - 2px); border-bottom: 1px solid var(--line-soft); flex: none }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }

/* Caja de campo (FieldBox): etiqueta adentro, arriba del valor. */
.box { display: block; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-control); padding: var(--field-pt) var(--field-px) var(--field-pb); min-width: 0; cursor: text; transition: border-color var(--duration-state) var(--ease-standard) }

.opts { display: flex; flex-wrap: wrap; gap: 8px }
.opt { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--control-h); padding: 0 16px; border-radius: var(--radius-control); border: var(--selectable-border) solid var(--line); background: var(--surface-2); color: var(--text); font-weight: 600; cursor: pointer; transition: border-color var(--duration-state) var(--ease-standard), background-color var(--duration-state) var(--ease-standard) }
.opt:hover { border-color: color-mix(in srgb, var(--flame) 55%, var(--line)) }
.opt[aria-pressed='true'] { border-color: var(--flame); background: color-mix(in srgb, var(--flame) 12%, var(--surface-2)) }
.opt svg.i { color: var(--flame-text) }
.opts.fill { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)) }

.fuel-gauge { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; width: 100%; max-width: 72px }
.fuel-gauge i { display: block; height: 6px; border-radius: 2px; background: var(--line) }
.fuel-gauge i.on { background: var(--flame) }
.opt[aria-pressed='true'] .fuel-gauge i:not(.on) { background: color-mix(in srgb, var(--flame) 22%, var(--line)) }

.pick-list { display: grid; gap: 8px }
.pick { display: flex; align-items: center; gap: 12px; width: 100%; min-height: var(--row-h); padding: 10px 16px; border: var(--selectable-border) solid var(--line); border-radius: var(--radius-control); background: var(--surface-2); color: var(--text); cursor: pointer; text-align: left; transition: border-color var(--duration-state) var(--ease-standard), background-color var(--duration-state) var(--ease-standard) }
.pick:hover { border-color: color-mix(in srgb, var(--flame) 55%, var(--line)) }
.pick[aria-pressed='true'] { border-color: var(--flame); background: color-mix(in srgb, var(--flame) 10%, var(--surface-2)) }
.pick .grow { flex: 1; min-width: 0 }
.pick .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; transition: border-width var(--duration-state) var(--ease-standard), border-color var(--duration-state) var(--ease-standard) }
[data-density='bahia'] .pick .radio { width: 22px; height: 22px }
.pick[aria-pressed='true'] .radio { border: 6px solid var(--flame) }
.pick > svg.i { color: var(--flame-text) }
.chosen { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px 10px 16px; border-radius: var(--radius-control); background: color-mix(in oklab, var(--go) 8%, var(--surface-2)); border: var(--selectable-border) solid color-mix(in oklab, var(--go) 40%, transparent) }
.chosen .grow { flex: 1 1 200px }
.more-fold { border: 1px solid var(--line-soft); border-radius: var(--radius-control); background: var(--surface) }
.more-fold summary { display: flex; align-items: center; gap: 8px; min-height: var(--touch-min); padding: 6px 14px; cursor: pointer; list-style: none; color: var(--text-dim); font-weight: 600 }

.more-fold .inner { padding: 14px; display: grid; gap: 14px }

/* Interruptor (Switch): verde encendido, superficie 3 apagado. */
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--row-h); padding: 6px 0; border-top: 1px solid var(--line-soft) }
.switch-row .what { font-weight: 600 }
.switch-row small { display: block; font-weight: 600; color: var(--text-dim); font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--dense-size) }
.switch { position: relative; width: 36px; height: 20px; flex: none; border-radius: var(--radius-pill); border: 0; background: var(--surface-3); cursor: pointer; padding: 0; transition: background-color var(--duration-state) var(--ease-standard) }
.switch::before { content: ''; position: absolute; top: 50%; left: 50%; width: var(--touch-min); height: var(--touch-min); transform: translate(-50%, -50%) }
[data-density='bahia'] .switch { width: 48px; height: 28px }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; height: calc(100% - 6px); aspect-ratio: 1; border-radius: 50%; background: var(--text-faint); transition: transform var(--duration-state) var(--ease-standard), background-color var(--duration-state) var(--ease-standard) }
.switch[aria-checked='true'] { background: var(--go) }
.switch[aria-checked='true']::after { transform: translateX(16px); background: #fff }
[data-density='bahia'] .switch[aria-checked='true']::after { transform: translateX(20px) }

/* ---------- Asistente de entregar / recibir ---------- */
.steps.four { grid-template-columns: repeat(4, minmax(0, 1fr)) }
@media (max-width: 520px) { .steps.four .step-label { display: none } .steps.four .step[aria-current='step'] .step-label { display: inline } }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 14px var(--plate-pad) 0; flex: none }
.step { position: relative; display: flex; align-items: center; gap: 8px; min-height: var(--touch-min); padding: 14px 2px 4px; background: none; border: 0; color: var(--text-faint); font-weight: 600; text-align: left; cursor: pointer }
.step::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; border-radius: 2px; background: var(--line); transition: background-color var(--duration-state) var(--ease-standard) }
.step[disabled] { cursor: default }
.step .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 1.5px solid currentColor; flex: none; font-variant-numeric: tabular-nums }
.step .n svg.i { width: 14px; height: 14px; stroke-width: 2.5 }
[data-density='bahia'] .step .n { width: 30px; height: 30px; font-size: 14px }
.step.done { color: var(--text-dim) }
.step.done::before, .step[aria-current='step']::before { background: var(--flame) }
.step.done .n { color: var(--go-text); border-color: color-mix(in oklab, var(--go-text) 40%, transparent); background: color-mix(in oklab, var(--go-text) 12%, transparent) }
.step[aria-current='step'] { color: var(--text) }
.step[aria-current='step'] .n { color: var(--on-flame); border-color: transparent; background-image: var(--gradient-action) }
.step-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.w2 { display: grid; grid-template-columns: var(--diagram-w) minmax(0, 1fr); gap: 24px; align-items: start }
.diagram { display: grid; place-items: center; padding: 14px 10px 10px; border-radius: var(--radius-row); background: var(--surface-2); border: 1px solid var(--line-soft) }
.diagram svg { width: 100%; max-width: calc(var(--diagram-w) - 24px); height: auto; overflow: visible }
.car-wheel { fill: var(--text-faint); opacity: 0.55 }
.car-body { fill: var(--surface-3); stroke: var(--text-faint); stroke-width: 1.5 }
.car-mirror { fill: var(--surface-3); stroke: var(--text-faint); stroke-width: 1.5 }
.car-glass { fill: color-mix(in oklab, var(--info-text) 14%, var(--surface-2)); stroke: var(--text-faint); stroke-width: 1.25 }
.car-roof { fill: var(--surface-3); stroke: color-mix(in oklab, var(--text-faint) 55%, transparent); stroke-width: 1 }
.car-line { fill: none; stroke: color-mix(in oklab, var(--text-faint) 45%, transparent); stroke-width: 1.25; stroke-linecap: round }
.car-light { fill: color-mix(in oklab, var(--warn) 55%, var(--surface-3)) }
.car-tail { fill: color-mix(in oklab, var(--danger) 70%, var(--surface-3)) }
.car-front { fill: var(--text-faint); font-family: var(--font-sans); font-size: 11px; font-weight: 600 }
.zone { cursor: pointer; outline: none }
.zone .hit { fill: transparent }
.zone .ring { fill: color-mix(in oklab, var(--bg) 35%, transparent); stroke: var(--text-faint); stroke-width: 1.5; stroke-dasharray: 2.5 3; transition: fill var(--duration-state) var(--ease-standard), stroke var(--duration-state) var(--ease-standard) }
.zone .mark-x, .zone .mark-o { display: none }
.zone:hover .ring, .zone:focus-visible .ring { stroke: var(--flame-hot); stroke-dasharray: none; stroke-width: 2; fill: color-mix(in oklab, var(--flame) 14%, transparent) }
.zone:focus-visible .ring { stroke-width: 2.5 }
.zone.old { cursor: default }
.zone.old .ring { fill: color-mix(in oklab, var(--warn) 28%, transparent); stroke: var(--warn); stroke-dasharray: none }
.zone.old .mark-o { display: block; fill: var(--warn) }
.zone.new .ring { fill: var(--danger); stroke: var(--danger-text); stroke-dasharray: none; stroke-width: 2 }
.zone.new .mark-x { display: block; stroke: #fff; stroke-width: 2.25; stroke-linecap: round }
.photos { display: flex; flex-wrap: wrap; gap: 10px }
.photo { width: 84px; height: 64px; border-radius: var(--radius-control); background: var(--surface-3); border: 1px solid var(--line); display: grid; place-content: center; justify-items: center; gap: 2px; color: var(--text-dim); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums }

.photo.add { border: 1.5px dashed var(--line); cursor: pointer; background: transparent; color: var(--text-dim); transition: border-color var(--duration-state) var(--ease-standard), color var(--duration-state) var(--ease-standard) }
.photo.add:hover { border-color: var(--flame); color: var(--text) }
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px }
.sum-box { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: var(--radius-row); background: var(--surface-2); border: 1px solid var(--line-soft) }

/* ---------- Aviso flotante (toast) y marca de estado (063) ---------- */

@keyframes mark-out { 0% { opacity: 0; transform: scale(0.9) } 15% { opacity: 1; transform: scale(1) } 80% { opacity: 1 } 100% { opacity: 0 } }
.mark { position: fixed; inset: 0; z-index: 65; display: grid; place-content: center; justify-items: center; gap: 12px; pointer-events: none; animation: mark-out 1200ms var(--ease-standard) both }
.mark .ring { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; background-color: var(--surface); background-image: linear-gradient(color-mix(in oklab, currentColor 14%, transparent), color-mix(in oklab, currentColor 14%, transparent)); border: 4px solid currentColor; box-shadow: var(--shadow-dialog) }

/* ---------- Bahía: barra abajo siempre, una columna ---------- */
[data-density='bahia'] .shell { grid-template-columns: minmax(0, 1fr) }

[data-density='bahia'] .topbar { display: flex }

.bottom-bar nav { display: flex; width: 100% }
.bottom-bar button { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: max(var(--touch-min), 52px); padding: 6px 2px; border: 0; background: none; color: var(--rail-dim); font-size: var(--nav-label-size); line-height: 16px; font-weight: 500; cursor: pointer; min-width: 0; transition: color var(--duration-state) var(--ease-standard) }

.bottom-bar button[aria-current='page']::before { content: ''; position: absolute; top: -8px; left: 16%; right: 16%; height: var(--active-mark); border-radius: 0 0 var(--active-mark) var(--active-mark); background: var(--gradient-bar-active) }
.bottom-bar .badge { position: absolute; top: -6px; right: -10px; font-size: var(--nav-badge-size); line-height: 16px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 6px; border-radius: var(--radius-pill); background: var(--flame); color: #fff }
[data-density='bahia'] .bottom-bar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--rail); border-top: 1px solid rgb(255 255 255 / 0.08); padding: 8px 6px max(8px, env(safe-area-inset-bottom)) }

/* ---------- Cortes ---------- */
@media (max-width: 1180px) { .day-grid, .detail { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 899.98px) {
  :root { --page-px: 16px; --page-pt: 18px; --page-pb: 120px; --display-size: 30px }
  [data-density='bahia'] h1 { --display-size: 30px }
  .shell { grid-template-columns: minmax(0, 1fr) }
  .rail { display: none }
  .topbar { display: flex }
  .cards, .cash-top { grid-template-columns: minmax(0, 1fr) }
  .bottom-bar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--rail); border-top: 1px solid rgb(255 255 255 / 0.08); padding: 8px 6px max(8px, env(safe-area-inset-bottom)) }
  .backdrop, [data-density='bahia'] .backdrop.full { place-items: end center; padding: 0 }
  .dialog, .dialog.wide, [data-density='bahia'] .dialog.full { width: 100%; height: auto; max-height: calc(100svh - 48px); border-radius: var(--radius-card) var(--radius-card) 0 0; border: 0; border-top: 1px solid var(--line-soft); animation: elite-sheet-in 0.24s var(--ease-standard) }
  .grid, .w2 { grid-template-columns: minmax(0, 1fr) }

  .search { max-width: none }
}
@media (max-width: 560px) {
  .fields, .breakdown { grid-template-columns: minmax(0, 1fr) }
  .breakdown div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px }
  .breakdown .num { margin-top: 0 }
  .big3 > div, .sum-box > div { padding: 14px 12px 16px }
  .big3 .fig, .sum-box .fig { font-size: 26px }
  .step-label { display: none }
  .diagram svg { max-width: 250px }
  .head-actions { width: 100% }
  .head-actions > .btn.primary { flex: 1 1 200px }
  .topbar .who-name { display: none }
  [data-density='bahia'] .filters-big { grid-template-columns: repeat(3, minmax(0, 1fr)) }
  .d-foot { flex-direction: column-reverse; align-items: stretch }
  .d-foot .btn, [data-density='bahia'] .d-foot .btn { flex: none; width: 100% }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important }
  .enter > *, .enter *, .flash, .dt tr.flash td, [data-stack] .dt tr.flash, .dialog, .backdrop, .menu, .toast, .mark { animation: none !important }
}

@media (max-width: 767px) {
 .rf.inline .rf-scrim { display: block; z-index: 59 }
 .rf.inline .rf-panel, [data-density='bahia'] .rf.inline .rf-panel { top: auto !important; left: 0 !important; right: 0; bottom: 0; width: auto !important; max-height: calc(100svh - 48px); border-bottom: 0; border-radius: var(--radius-card) var(--radius-card) 0 0 }
 .rf.inline .rf-grab { display: block }
}

        // Recorta el aire transparente alrededor del carro para que llene el escenario.
        function cropped(src) {
          const w = src.width, h = src.height;
          const cv = document.createElement('canvas');
          cv.width = w;
          cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.drawImage(src, 0, 0);
          const px = ctx.getImageData(0, 0, w, h).data;
          let x0 = w, y0 = h, x1 = 0, y1 = 0;
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              if (px[(y * w + x) * 4 + 3] > 24) {
                if (x < x0) x0 = x;
                if (x > x1) x1 = x;
                if (y < y0) y0 = y;
                if (y > y1) y1 = y;
              }
            }
          }
          if (x1 <= x0) return src.toDataURL('image/png');
          const pad = Math.round(w * 0.01);
          x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
          x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
          const out = document.createElement('canvas');
          out.width = x1 - x0 + 1;
          out.height = y1 - y0 + 1;
          out.getContext('2d').drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
          return out.toDataURL('image/png');
        }
        const cache = new Map();
        return (cat, paintHex) => {
          const k = cat + paintHex;
          if (!cache.has(k)) {
            const car = build(cat, paintHex);
            scene.add(car);
            renderer.render(scene, camera);
            cache.set(k, cropped(renderer.domElement));
            scene.remove(car);
          }
          return cache.get(k);

/* Caja: igual que la del lavado (cash-screen.tsx). Turno con fondo, cobrado por
 * método, cobros del turno, historial de cierres y el diálogo «Cerrar caja».
 * Lo propio de la renta —quién debe y garantías— va después. */
const METHOD_ORDER = ['CASH', 'CARD', 'TRANSFER', 'OTHER'];
const METHOD_STAMP = { CASH: 'green', CARD: 'neutral', TRANSFER: 'amber', OTHER: 'neutral' };
const METHOD_ICON = { CASH: 'banknote', CARD: 'card', TRANSFER: 'arrows', OTHER: 'wallet' };
const money2 = (v) => {
 const n = r2(Number(v) || 0);
 const t = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
 return (n < 0 ? '−$' : '$') + t;
};
const WHEN_FMT = new Intl.DateTimeFormat('es-SV', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const formatWhen = (s) => WHEN_FMT.format(P(s)).replaceAll(/[  ]/gu, ' ').replace('a. m.', 'a.m.').replace('p. m.', 'p.m.');
const formatSpan = (s) => (s.closedAt ? `${formatWhen(s.openedAt)} → ${formatWhen(s.closedAt)}` : formatWhen(s.openedAt));
const methodStamp = (m) => `<span class="stamp has-icon t-${METHOD_STAMP[m]}">${icon(METHOD_ICON[m])}${METHODS[m]}</span>`;
function diffStamp(diff) {
 if (diff === null) return stamp('neutral', 'Abierto');
 const c = Math.round(diff * 100);
 if (c === 0) return stamp('green', 'Cuadra');
 return c > 0 ? stamp('amber', `Sobra ${money2(diff)}`) : stamp('red', `Falta ${money2(-diff)}`);
}

 const h = panel.offsetHeight;

function nrCommit(deliver) {
 const errs = [];

 if (P(draft.to) <= P(draft.from)) errs.push('Revise las fechas');
 if (!draft.carId) errs.push('Falta el carro');
 let from = draft.from;
 if (deliver && P(from) > NOW) from = S(NOW);
 if (!errs.length && deliver && !isFree(carById(draft.carId), from, draft.to)) errs.push('No está libre ahora');

  draft.err = errs.join(' · ');

 }
 const c = carById(draft.carId);
 const a = agr({
  id: nid('a'), carId: c.id, renterId, pickupAt: from, returnAt: draft.to, status: 'RESERVED', rate: c.rate, insurance: draft.insurance,

 });
 agreements.push(a);
 const who = shortName(renterById(renterId).name);

 toast('Reservada');
}

/* Entregar / recibir: 3 pasos (Kilometraje · Golpes · Cobro) */
function oldDamages(a, mode) {
 if (mode === 'back') return a.out ? a.out.damages : [];
 const prev = agreements.filter((x) => x.carId === a.carId && x.back).sort((x, y) => P(y.back.at) - P(x.back.at))[0];

}
function openWizard(aid, mode) {

 const c = carById(a.carId);

 if (!w || w.mode !== mode) {
  const back = mode === 'back' && a.out;
  w = {
   aid, mode, step: 1, max: 1, at: S(NOW),
   km: back ? Math.max(a.out.km, c.odo) : c.odo, fuel: back ? a.out.fuel : 4,
   damages: [], acc: back ? a.out.acc.slice() : ALL_ACC.slice(), photos: 0,
   pay: null, method: 'CASH', depOn: true, depAmount: SETTINGS.deposit, depMethod: 'CASH', depReturn: null,
   chargeOn: { late: true, fuel: true, dmg: false, acc: true }, err: '',
  };
  wizards[aid] = w;
 }
 wiz = w;
 openDialog(wizardHtml(), 'wide full');
}
function wizCharges(w, a) {
 if (w.mode !== 'back') return [];
 const list = [];
 const extraH = (P(w.at || S(NOW)) - P(a.returnAt)) / 3600000 - SETTINGS.graceHours;
 if (extraH > 0) {
  const d = Math.ceil(extraH / 24);
  list.push({ key: 'late', label: `${plural(d, 'día', 'días')} de más`, amount: d * a.rate, kind: 'late' });
 }
 if (a.out && w.fuel < a.out.fuel) list.push({ key: 'fuel', label: 'Combustible', amount: (a.out.fuel - w.fuel) * SETTINGS.fuelQuarter, kind: 'fuel' });
 if (w.damages.length) list.push({ key: 'dmg', label: 'Golpe', amount: a.deductible, kind: 'damage' });
 const missing = a.out ? a.out.acc.filter((x) => !w.acc.includes(x)) : [];
 if (missing.length) list.push({ key: 'acc', label: `Falta ${missing.join(', ')}`, amount: 15 * missing.length, kind: 'acc' });
 return list;
}
function wizMoney(w, a) {
 const acc = account(a);
 const extra = wizCharges(w, a).filter((c) => w.chargeOn[c.key]).reduce((s, c) => s + c.amount, 0);
 const total = r2(acc.total + extra);
 return { total, paid: acc.paid, owed: r2(total - acc.paid) };
}

 w.err = '';
 if (w.step === 1) {
  const k = Number(String(w.km).replace(/[^\d]/g, ''));

 if (amount < 0) {

 }
 if (amount > 0 && !openSession()) {

  return paintWizard();

 if (w.mode === 'out') {
  const depAmt = r2(Number(w.depAmount) || 0);
  a.status = 'OUT';
  a.no = a.no || nextNo();
  a.out = { at, km: kmN, fuel: w.fuel, damages: [...oldDamages(a, 'out'), ...w.damages], acc: w.acc.slice(), photos: w.photos };
  if (w.depOn && a.deposit.state === 'none' && depAmt > 0) a.deposit = { amount: depAmt, method: w.depMethod, state: 'held' };
 } else {
  wizCharges(w, a)
   .filter((x) => w.chargeOn[x.key])
   .forEach((x) => a.charges.push({ label: x.label, amount: x.amount, kind: x.kind }));
  a.status = 'RETURNED';
  a.back = { at, km: kmN, fuel: w.fuel, damages: [...(a.out ? a.out.damages : []), ...w.damages], acc: w.acc.slice(), photos: w.photos };
  if (a.deposit.state === 'held' && w.depReturn) Object.assign(a.deposit, { state: 'returned', returnedAt: stampNow() });
 }
 c.odo = Math.max(c.odo, kmN);
 if (amount > 0) payments.push(pay(a.id, stampNow(), amount, w.method));
 delete wizards[a.id];
 const mode = w.mode;
 closeDialog();
 render();
 const st = rStatus(a);
 markState(RS[st][0], RS[st][1], `#${a.no} · ${c.plate}`);
 toast(mode === 'out' ? 'Entregado' : 'Recibido');

let toastTimer = null;
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function toast(title) {
 const slot = document.getElementById('toast-slot');
 slot.innerHTML = `<div class="toast" role="status">${icon('checkCircle')}<b>${esc(title)}</b></div>`;
 clearTimeout(toastTimer);
 toastTimer = setTimeout(() => (slot.innerHTML = ''), 4500);
}
function markState(label, tone, sub) {

 el.className = 'mark t-' + tone;
 el.setAttribute('aria-hidden', 'true');
 el.innerHTML = `<div class="ring">${icon('check')}</div><b>${esc(label)}</b><span>${esc(sub)}</span>`;

 const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
 return { screen: parts[0] || 'hoy', id: parts[1], tab: parts[2] };
}
function go(hash) {
 if (location.hash === hash) render();
 else location.hash = hash;
}
function render() {
 const r = route();
 let html;
 let active = r.screen;
 if (r.screen === 'libre') {
  html = renderFree();
  active = 'rentas';
 } else if (r.screen === 'rentas') html = r.id === 'lista' ? renderRentals() : r.id === 'historial' ? renderHistory() : r.id && agrById(r.id) ? renderRental(agrById(r.id)) : renderFree();
 else if (r.screen === 'caja') html = r.id && sessions.some((x) => x.id === r.id) ? renderCashSession(sessions.find((x) => x.id === r.id)) : renderCash();
 else if (r.screen === 'carros') {

  else if (r.id && carById(r.id)) html = renderCar(carById(r.id), r.tab || 'ficha');
  else html = renderCars();
 } else if (r.screen === 'ajustes') {
  html = renderSettings();
  active = '';
 } else {

 /* La cascada de entrada solo cuando cambia la pantalla, no al filtrar ni al cobrar. */
 if (location.hash === lastRoute) html = html.replace('<div class="enter">', '<div>');
 lastRoute = location.hash;
 app.innerHTML = html;

 ui.focus = null;
}

  if (val('method') === 'OTHER' && !val('note')) return fail('Falta el detalle');
  const before = rStatus(a);
  const p = pay(a.id, stampNow(), amt, val('method'));
  p.ref = val('ref');
  p.note = val('note');
  payments.push(p);
  ui.focus = p.id;
  closeDialog();
  render();
  const after = rStatus(a);
  if (after !== before) markState(RS[after][0], RS[after][1], `#${a.no || '—'} · ${carById(a.carId).plate}`);
  return toast(`Cobrado ${money(amt)}`);
 }
 if (kind === 'open-cash') {
  const f = num('float');
  if (Number.isNaN(f) || f < 0) return fail();
  sessions.push({ id: 's' + ++sessionSeq, no: sessionSeq, openedAt: stampNow(), closedAt: null, float: f, counted: null, notes: '' });
  render();
  return toast('Caja abierta');
 }
 if (kind === 'close-cash') {
  const sx = openSession();
  const counted = num('counted');
  if (!sx || Number.isNaN(counted) || counted < 0 || val('counted') === '') return fail('Revise el contado');
  const c = Math.round((counted - expectedOf(sx)) * 100);
  if (Math.abs(c) >= 1000 && !layer.querySelector('#cc-ack-box').checked) return fail();
  Object.assign(sx, { closedAt: stampNow(), counted, notes: val('notes') });
  ui.focus = sx.id;
  closeDialog();
  render();
  return toast('Caja cerrada');
 }
 if (kind === 'deposit') {
  const a = agrById(dlg.aid);
  const d = a.deposit;
  const amt = num('amount');
  if (Number.isNaN(amt) || amt < 0 || amt > d.amount) return fail(`Máximo ${money(d.amount)}`);
  const kept = r2(d.amount - amt);
  if (kept > 0 && !val('why')) return fail('Falta el motivo');
  const before = rStatus(a);
  Object.assign(d, { state: 'returned', returnedAt: stampNow(), kept, keptWhy: val('why') });
  closeDialog();
  render();
  const after = rStatus(a);
  if (after !== before) markState(RS[after][0], RS[after][1], `#${a.no || '—'} · ${carById(a.carId).plate}`);
  return toast('Devuelta');
 }
 if (kind === 'void') {
  const p = payments.find((x) => x.id === dlg.pid);
  p.voided = true;
  p.note = val('why') || p.note;
  closeDialog();
  render();
  return toast('Anulado');
 }
 if (kind === 'edit') {
  const a = agrById(dlg.aid);
  const from = a.status === 'RESERVED' ? val('from') || a.pickupAt : a.pickupAt;
  const to = val('to') || a.returnAt;
  if (P(to) <= P(from)) return fail('Revise las fechas');
  if (!isFree(carById(a.carId), from, to, a.id)) return fail('No está libre');
  Object.assign(a, {
   pickupAt: from, returnAt: to, insurance: val('ins') === '1', discount: num('discount') || 0,
   deductible: num('deductible') || a.deductible, extraDriver: val('extraDriver'), notes: val('notes'),
  });
  closeDialog();
  render();
  return toast('Guardado');
 }
 if (kind === 'cancel') {
  const a = agrById(dlg.aid);
  a.status = 'CANCELLED';
  if (val('why')) a.notes = (a.notes ? a.notes + ' · ' : '') + 'Se canceló: ' + val('why');
  closeDialog();
  render();
  markState('Cancelada', 'neutral', carById(a.carId).plate);
  return toast('Cancelada');
 }
 if (kind === 'car') {
  const rate = num('rate');
  if (!val('plate') || !val('make') || !val('model') || !(rate > 0)) return fail();
  const data = {
   plate: val('plate').toUpperCase(), make: val('make'), model: val('model'), year: Number(val('year')) || new Date().getFullYear(),
   color: val('color') || '—', rate, type: val('type') || 'Sedán', odo: Number(val('odo').replace(/[^\d]/g, '')) || 0,
   insuranceUntil: val('insuranceUntil') || addDays(TODAY + 'T00:00', 365).slice(0, 10), cardUntil: val('cardUntil') || addDays(TODAY + 'T00:00', 365).slice(0, 10),
  };
  if (dlg.cid) {
   Object.assign(carById(dlg.cid), data);
   closeDialog();
   render();
   return toast('Guardado');
  }
  const c = Object.assign({ id: nid('c'), status: 'ACTIVE', fixed: 0, svc: {} }, data);
  cars.push(c);
  MONTHS.forEach((m) => (income[c.id + m] = 0));
  ui.focus = c.id;
  closeDialog();
  go('#/carros');
  return toast('Agregado');
 }
 if (kind === 'expense') {
  const amt = num('amount');
  if (!(amt > 0) || !val('what')) return fail();
  const ex = { id: expId++, carId: dlg.cid, date: val('date') || TODAY, what: val('what'), amount: amt, auto: null };
  expenses.push(ex);
  ui.focus = 'e' + ex.id;
  closeDialog();
  render();
  return toast('Anotado');
 }
 if (kind === 'service') {
  const c = carById(dlg.cid);
  const sel = [...form.querySelectorAll('[data-toggle][aria-pressed="true"]')].map((b) => b.dataset.toggle);
  const other = val('other');
  if (!sel.length && !other) return fail();
  const kmN = Number(val('km').replace(/[^\d]/g, '')) || c.odo;
  const date = val('date') || TODAY;
  const cost = num('cost') || 0;
  const what = [...sel.map((id) => PLAN.find((p) => p.id === id).name), ...(other ? [other] : [])];
  const log = { id: nid('l'), carId: c.id, date, km: kmN, what, cost, note: val('note') };
  logs.push(log);
  sel.forEach((id) => (c.svc[id] = { km: kmN, date }));
  c.odo = Math.max(c.odo, kmN);
  if (cost > 0) expenses.push({ id: expId++, carId: c.id, date, what: `${what.join(', ')} · servicio`, amount: cost, auto: 'service' });
  ui.focus = log.id;
  closeDialog();
  render();
  return toast('Anotado');
 }
 return undefined;
});

/* Arranque */
const protoBar = document.querySelector('.proto-bar');
const syncProto = () => document.documentElement.style.setProperty('--proto-h', protoBar.offsetHeight + 'px');
syncProto();
let wasWide = window.innerWidth >= 900;
window.addEventListener('resize', () => {
 syncStack();
 syncProto();
 const wide = window.innerWidth >= 900;
 if (wide !== wasWide) {
  wasWide = wide;
  render();
 }
});
window.addEventListener('hashchange', () => {
 ui.menu = null;
 render();
 window.scrollTo(0, 0);
});
setTheme(store.get('theme') || 'dark', true);
setDensity(store.get('density') || (window.innerWidth < 900 || matchMedia('(pointer: coarse)').matches ? 'bahia' : 'mostrador'), true);
if (!location.hash) history.replaceState(null, '', '#/hoy');
render();
</script>
