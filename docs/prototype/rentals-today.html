<!doctype html>
<!--
  Elite Service · Hoy de la rentadora, prototipo aislado.
  Reemplaza el tablero de ceros (cobrado + tres «nada por hoy» + placas sueltas).
  La pantalla es la flota ahora: quién tiene cada carro, qué hay que hacer y
  cuántos quedan libres. El día se elige en un calendario: cada fecha muestra
  los carros libres. Sale del Inicio de Riveras
  (docs/legacy/riveras-rent-a-car.html, VIEWS.inicio), con el lenguaje de la app.
  Tokens de apps/web/DESIGN.md. Datos en memoria. No es una spec.
-->
<html lang="es" data-theme="dark" data-density="mostrador">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elite Service — Hoy de la renta (propuesta)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,600;0,700;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #070e1c; --surface: #0b1730; --surface-2: #101e3c; --surface-3: #152747;
        --line: #1e3358; --line-soft: #182b4c; --rail: #050a15; --plate-bg: #0e1b33;
        --text: #eaf0fa; --text-dim: #8fa4c6; --text-faint: #7387ac;
        --flame: #f04e23; --flame-hot: #f58220; --flame-deep: #c4161c; --flame-text: #f58220;
        --gradient-action: linear-gradient(100deg, var(--flame-hot), var(--flame) 55%, var(--flame-deep));
        --gradient-rail-active: linear-gradient(180deg, var(--flame-hot), var(--flame-deep));
        --gradient-bar-active: linear-gradient(90deg, var(--flame-hot), var(--flame-deep));
        --go: #2fbf7c; --go-text: #2fbf7c; --danger: #a8232b; --danger-text: #f08089;
        --warn: #e5a64b; --warn-text: #e5a64b; --info-text: #7fb0ff;
        --rail-text: #e6edf9; --rail-dim: #a8b6ce; --rail-faint: #7c8cab;
        --on-flame: #ffffff;
        --rail-w: 248px; --active-mark: 3px; --bottom-bar-h: 64px;
        --shadow-dialog: 0 24px 60px -12px rgb(0 0 0 / 0.85), 0 0 0 1px rgb(255 255 255 / 0.08);
        --backdrop: color-mix(in srgb, var(--bg) 80%, transparent);
        --radius-sm: 6px; --radius-control: 10px; --radius-row: 12px; --radius-card: 14px; --radius-pill: 999px;
        --nav-item-radius: 9px; --selectable-border: 1.5px;
        --page-max: 1440px; --page-px: 34px; --page-pt: 30px; --page-pb: 60px;
        --display-size: 38px; --stat-size: 28px; --title-size: 17px; --headline-size: 21px;
        --plate-size-sm: 12px; --plate-size: 13.5px;
        --tint-fill: 12%; --tint-line: 40%;
        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
        --duration-state: 140ms; --duration-enter: 180ms; --duration-mount: 280ms; --stagger-step: 35ms;
        --enter-rise: 8px; --duration-flash: 1.6s;
        --row-h: 52px; --control-h: 40px; --touch-min: 36px; --icon-size: 16px;
        --field-px: 16px; --field-pt: 8px; --field-pb: 10px;
        --body-size: 14.5px; --dense-size: 12.5px;
        --font-sans: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-display: Saira, 'Arial Narrow', system-ui, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      [data-theme='light'] {
        --bg: #eef1f6; --surface: #ffffff; --surface-2: #f6f8fc; --surface-3: #e6ebf3;
        --line: #d9e0ec; --line-soft: #e6ebf3; --rail: #0b1730; --plate-bg: #f1f4fa;
        --text: #0b1730; --text-dim: #4e5d77; --text-faint: #626c80;
        --flame-text: #a8480c; --go-text: #0f6b41; --danger-text: #a8232b; --warn-text: #8a5510; --info-text: #1d4ed8;
        --shadow-dialog: 0 24px 60px -12px rgb(11 23 48 / 0.28), 0 2px 8px -2px rgb(11 23 48 / 0.12), 0 0 0 1px rgb(11 23 48 / 0.08);
        --backdrop: rgb(0 0 0 / 0.45);
      }
      [data-density='bahia'] {
        --row-h: 56px; --control-h: 48px; --touch-min: 44px; --icon-size: 20px;
        --field-px: 18px; --field-pt: 10px; --field-pb: 12px;
        --body-size: 15.5px; --dense-size: 14px; --title-size: 18px; --headline-size: 24px;
        --plate-size: 15px; --page-pb: 120px;
      }
      * { box-sizing: border-box }
      html { color-scheme: dark }
      html[data-theme='light'] { color-scheme: light }
      html, body { margin: 0 }
      body {
        background: var(--bg); color: var(--text); font-family: var(--font-sans);
        font-size: var(--body-size); line-height: 1.45; -webkit-font-smoothing: antialiased;
      }
      button, input, select { font: inherit; color: inherit }
      button { -webkit-tap-highlight-color: transparent }
      a { color: inherit }
      :focus-visible { outline: 2px solid var(--flame-hot); outline-offset: 2px }
      ::selection { background: color-mix(in srgb, var(--flame) 28%, transparent) }
      * { scrollbar-width: thin; scrollbar-color: var(--line) transparent }
      svg.i { width: var(--icon-size); height: var(--icon-size); stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none }
      .num { font-variant-numeric: tabular-nums }
      .dim { color: var(--text-dim) }
      .faint { color: var(--text-faint) }
      .go { color: var(--go-text) }
      .hidden { display: none !important }

      .proto-bar {
        position: sticky; top: 0; z-index: 45; display: flex; flex-wrap: wrap; align-items: center;
        gap: 8px 12px; padding: 10px 16px; background: var(--rail); color: var(--rail-text);
        border-bottom: 1px solid var(--line); font-size: 13px;
      }
      .proto-bar strong { font-weight: 600 }
      .proto-bar .note { margin-right: auto; color: var(--rail-dim); font-size: 12.5px }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-control); overflow: hidden }
      .seg button {
        min-height: 32px; padding: 0 12px; border: 0; background: transparent; color: var(--rail-dim);
        cursor: pointer; font-size: 12.5px; font-weight: 600;
      }
      .seg button[aria-pressed='true'] { background: color-mix(in srgb, var(--rail-text) 14%, var(--rail)); color: var(--rail-text); box-shadow: inset 0 -2px 0 var(--flame) }

      .shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100vh - var(--proto-h, 53px)) }
      .rail {
        position: sticky; top: var(--proto-h, 53px); height: calc(100vh - var(--proto-h, 53px));
        overflow-y: auto; background: var(--rail); color: var(--rail-dim);
        border-right: 1px solid rgb(255 255 255 / 0.06);
        display: flex; flex-direction: column; gap: 24px; padding: 16px 14px;
      }
      .logo { display: flex; align-items: center; gap: 10px; padding: 4px 6px; color: var(--rail-text) }
      .logo svg { width: 46px; height: 28px; flex: none }
      .wordmark { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 21px; line-height: 0.88; letter-spacing: 0.01em }
      .wordmark small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.2em; margin-top: 2px; color: var(--rail-dim) }
      .ws-btn {
        width: 100%; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 10px;
        border-radius: var(--nav-item-radius); background: rgb(255 255 255 / 0.05);
        border: 1px solid rgb(255 255 255 / 0.08); color: var(--rail-text); font-weight: 500;
      }
      .ws-btn .flame { color: var(--flame); display: inline-flex }
      .nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
      .nav-item {
        position: relative; width: 100%; display: flex; align-items: center; gap: 10px; min-height: 40px;
        padding: 8px 10px; border-radius: var(--nav-item-radius); border: 0; background: none;
        color: var(--rail-dim); cursor: pointer; font-weight: 500; font-size: 14.5px; text-align: left;
      }
      .nav-item svg.i { opacity: 0.8 }
      .nav-item:hover { background: rgb(255 255 255 / 0.05); color: var(--rail-text) }
      .nav-item[aria-current='page'] { background: color-mix(in srgb, var(--flame) 14%, transparent); color: var(--on-flame) }
      .nav-item[aria-current='page'] svg.i { color: var(--flame); opacity: 1 }
      .nav-item[aria-current='page']::before {
        content: ''; position: absolute; left: -14px; top: 8px; bottom: 8px; width: var(--active-mark);
        border-radius: 0 var(--active-mark) var(--active-mark) 0; background: var(--gradient-rail-active);
      }
      .rail-foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid rgb(255 255 255 / 0.07); color: var(--rail-dim); font-weight: 600; font-size: var(--dense-size) }
      .bottom { display: none }
      .topbar { display: none }

      .page { width: 100%; max-width: var(--page-max); margin: 0 auto; padding: var(--page-pt) var(--page-px) var(--page-pb) }
      .screen-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin: 0 0 18px; min-height: 48px }
      .head-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px }
      h1 { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: var(--display-size); line-height: 0.95; letter-spacing: -0.01em; margin: 0 }
      .subtitle { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 10px 0 0; color: var(--text-dim); font-size: var(--dense-size) }
      .subtitle b { color: var(--text); font-weight: 600 }
      .collected {
        display: inline-flex; align-items: baseline; gap: 6px; min-height: var(--touch-min);
        padding: 0; border: 0; background: none; color: var(--text-dim); cursor: pointer; font-weight: 500;
      }
      .collected:hover { color: var(--text) }
      .collected b { font-family: var(--font-mono); font-weight: 700; color: var(--go-text) }

      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        height: var(--control-h); min-height: var(--touch-min); padding: 0 16px;
        border-radius: var(--radius-control); border: 1px solid var(--line); background: var(--surface-2);
        color: var(--text); font-size: var(--body-size); font-weight: 600; cursor: pointer; white-space: nowrap;
        text-decoration: none;
        transition: filter var(--duration-state) var(--ease-standard), border-color var(--duration-state) var(--ease-standard), background-color var(--duration-state) var(--ease-standard);
      }
      .btn:hover { border-color: var(--flame) }
      .btn:active { transform: translateY(1px) }
      .btn[disabled] { opacity: 0.5; cursor: not-allowed; pointer-events: none }
      .btn.primary { background-image: var(--gradient-action); color: var(--on-flame); border-color: transparent }
      .btn.primary:hover { filter: brightness(1.1) }
      .btn.ghost { background: transparent; border-color: transparent; color: var(--text-dim); padding: 0 10px }
      .btn.ghost:hover { color: var(--text); background: var(--surface-2) }
      .btn.sm { height: calc(var(--control-h) - 4px); padding: 0 12px; font-size: var(--dense-size) }
      .btn.icon { width: var(--touch-min); padding: 0 }

      .plate {
        display: inline-block; width: fit-content; font-family: var(--font-mono); font-weight: 700;
        letter-spacing: 0.06em; font-variant-numeric: tabular-nums; font-size: var(--plate-size-sm);
        line-height: 1.2; padding: 2px 8px; background: var(--plate-bg); border: 1px solid var(--line);
        border-radius: var(--radius-sm); color: var(--text); white-space: nowrap;
      }
      .no-plate { font-size: var(--dense-size); font-weight: 600; color: var(--text-faint) }
      .stamp {
        display: inline-flex; align-items: center; gap: 6px; width: fit-content; padding: 2px 9px;
        border: 1px solid; border-radius: var(--radius-pill); font-size: var(--dense-size); font-weight: 600;
        white-space: nowrap;
        background-color: color-mix(in oklab, currentColor var(--tint-fill), transparent);
        border-color: color-mix(in oklab, currentColor var(--tint-line), transparent);
      }
      .stamp::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
      .t-go { color: var(--go-text) }
      .t-flame { color: var(--flame-text) }
      .t-danger { color: var(--danger-text) }
      .t-info { color: var(--info-text) }
      .t-warn { color: var(--warn-text) }
      .ref { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-faint); font-weight: 700; letter-spacing: 0.04em }

      h2 { font-size: var(--title-size); line-height: 1.35; font-weight: 600; margin: 0 }
      .block { margin-top: 28px }
      .block-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 12px }

      .date-pick { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 2px }
      .date-pick > .btn { height: 52px }
      .date-pick > .btn.icon { width: 44px }
      .date-btn {
        display: inline-flex; align-items: center; gap: 10px; min-width: 210px; height: 52px; padding: 0 14px;
        border-radius: var(--radius-control); border: 1px solid var(--line); background: var(--surface);
        color: inherit; text-align: left; cursor: pointer;
      }
      .date-btn:hover { border-color: var(--flame) }
      .date-btn[aria-expanded='true'] { border-color: var(--flame); box-shadow: inset 0 0 0 1px var(--flame) }
      .date-copy { display: grid; min-width: 0 }
      .date-when { font-weight: 600; line-height: 1.2; white-space: nowrap }
      .date-free { font-size: var(--dense-size); font-weight: 600; line-height: 1.2; color: var(--go-text); white-space: nowrap }
      .date-free.none { color: var(--text-faint) }
      .cal {
        position: absolute; z-index: 30; top: calc(100% + 8px); left: 0;
        width: min(680px, calc(100vw - 32px)); max-height: min(560px, calc(100svh - var(--proto-h, 53px) - 140px));
        overflow: auto; padding: 12px; background: var(--surface); color: var(--text);
        border: 1px solid var(--line-soft); border-radius: var(--radius-card); box-shadow: var(--shadow-dialog);
      }
      .cal-top { display: grid; grid-template-columns: var(--touch-min) minmax(0, 1fr) var(--touch-min); gap: 8px; align-items: center }
      .cal-titles { display: grid; grid-template-columns: repeat(var(--months), minmax(0, 1fr)); gap: 12px }
      .cal-titles h3 { margin: 0; text-align: center; font-size: 16px; font-weight: 600 }
      .cal-months { display: grid; grid-template-columns: repeat(var(--months), minmax(0, 1fr)); gap: 12px; margin-top: 8px }
      .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px }
      .cal-dow { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-faint); padding: 4px 0 6px }
      .cal-empty { min-height: 48px }
      .cal-day {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
        min-height: 48px; padding: 4px 0; border: 0; border-radius: 8px; background: transparent;
        color: inherit; cursor: pointer;
      }
      .cal-day:hover:not(:disabled) { background: var(--surface-2) }
      .cal-day .n { font-weight: 600; font-size: 14px; line-height: 1 }
      .cal-day .c { font-size: 11px; font-weight: 700; line-height: 1; color: var(--go-text); font-variant-numeric: tabular-nums }
      .cal-day .c.none { color: var(--text-faint); font-weight: 600 }
      .cal-day[aria-pressed='true'] { background: color-mix(in srgb, var(--flame) 16%, var(--surface)); box-shadow: inset 0 0 0 1.5px var(--flame) }
      .cal-day.today:not([aria-pressed='true']) .n { text-decoration: underline; text-underline-offset: 3px }
      .cal-day:disabled { color: var(--text-faint); opacity: 0.4; cursor: default }
      .cal-note { margin: 12px 4px 2px; color: var(--text-dim); font-size: 12.5px }

      .cars { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-row); overflow: hidden }
      .car {
        display: grid; grid-template-columns: minmax(0, 1fr) 6.75rem; column-gap: 12px; align-items: center;
        padding: 0 12px 0 16px; border-top: 1px solid var(--line-soft);
        transition: background-color var(--duration-state) var(--ease-standard);
      }
      .cars .car:first-of-type { border-top: 0 }
      .car:hover { background: var(--surface-2) }
      .car.flash { animation: elite-flash var(--duration-flash) var(--ease-standard) }
      .car-hit {
        display: grid; grid-template-columns: 6.25rem 9.5rem 5.75rem minmax(0, 1fr); column-gap: 12px;
        align-items: center; min-width: 0; min-height: var(--row-h); padding: 8px 0;
        border: 0; background: none; color: inherit; text-align: left; cursor: pointer;
      }
      .verb-slot { display: flex; min-width: 0 }
      .verb-slot .btn { width: 100% }
      .cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
      .cell.name { font-weight: 600 }
      .cell.state { font-size: var(--dense-size); font-weight: 600 }
      .cell.detail { color: var(--text-dim) }
      .alert { font-size: var(--dense-size); font-weight: 600 }
      .alert.warn { color: var(--warn-text) }
      .alert.due { color: var(--danger-text) }

      .pend { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-row); overflow: hidden }
      .pend button {
        width: 100%; display: block; min-height: var(--row-h); padding: 12px 16px; border: 0;
        border-top: 1px solid var(--line-soft); background: none; color: inherit; text-align: left; cursor: pointer;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .pend li:first-child button { border-top: 0 }
      .pend button:hover { background: var(--surface-2) }
      .pend b { font-weight: 600 }

      .backdrop {
        position: fixed; inset: 0; z-index: 50; background: var(--backdrop);
        display: grid; place-items: center; padding: 16px;
        animation: elite-fade-in var(--duration-enter) var(--ease-standard);
      }
      .dialog {
        width: min(520px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column;
        background: var(--surface); color: var(--text); border: 1px solid var(--line-soft);
        border-radius: var(--radius-card); box-shadow: var(--shadow-dialog); overflow: hidden;
        animation: elite-surface-in var(--duration-enter) var(--ease-standard);
      }
      .d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 16px 14px; border-bottom: 1px solid var(--line-soft) }
      .d-head h2 { font-size: var(--headline-size); letter-spacing: -0.01em }
      .d-head p { margin: 6px 0 0; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center }
      .d-body { padding: 16px; overflow-y: auto; display: grid; gap: 14px }
      .d-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--line-soft) }
      .d-foot .quote { margin-right: auto; min-width: 0 }
      .d-foot .fig { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: var(--stat-size); line-height: 1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums }
      .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin: 0 }
      .facts dt { font-size: var(--dense-size); color: var(--text-dim); font-weight: 500 }
      .facts dd { margin: 2px 0 0 }
      .phone { font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.03em; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px }
      .box { display: block; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-control); padding: var(--field-pt) var(--field-px) var(--field-pb) }
      .box:focus-within { border-color: var(--flame); outline: 2px solid var(--flame-hot); outline-offset: 2px }
      .box > span { display: block; font-size: 12.5px; font-weight: 500; color: var(--text-dim) }
      .box input, .box select { width: 100%; border: 0; background: transparent; padding: 2px 0 0; outline: none; min-height: 26px }
      .opts { display: flex; flex-wrap: wrap; gap: 8px }
      .opt {
        display: inline-flex; align-items: center; gap: 8px; min-height: var(--control-h); padding: 0 12px;
        border-radius: var(--radius-control); border: var(--selectable-border) solid var(--line);
        background: var(--surface-2); cursor: pointer; font-weight: 600;
      }
      .opt:disabled { opacity: 0.55; cursor: not-allowed }
      .opt[aria-pressed='true'] { border-color: var(--flame); background: color-mix(in srgb, var(--flame) 12%, var(--surface-2)) }
      .err { margin: 0; color: var(--danger-text); font-size: var(--dense-size); font-weight: 600 }
      .tier { margin: 2px 0 0; color: var(--text-dim); font-size: var(--dense-size) }

      .toast {
        position: fixed; right: 24px; bottom: 24px; z-index: 70; display: flex; gap: 14px; align-items: center;
        padding: 12px 12px 12px 16px; border-radius: var(--radius-row); background: var(--surface);
        border: 1px solid var(--line-soft); box-shadow: var(--shadow-dialog); max-width: min(420px, calc(100vw - 32px));
        animation: elite-toast-in var(--duration-enter) var(--ease-standard);
      }
      .toast p { margin: 0; font-weight: 600 }

      @keyframes elite-enter-rise { from { opacity: 0; transform: translateY(var(--enter-rise)) } }
      @keyframes elite-fade-in { from { opacity: 0 } }
      @keyframes elite-surface-in { from { opacity: 0; transform: scale(0.98) } }
      @keyframes elite-sheet-in { from { transform: translateY(16px); opacity: 0 } }
      @keyframes elite-toast-in { from { opacity: 0; transform: translateY(8px) } }
      @keyframes elite-flash { from { background-color: color-mix(in oklab, var(--flame-text) 18%, transparent) } }
      .enter > * { animation: elite-enter-rise var(--duration-mount) var(--ease-standard) backwards }

  <body>
    <div class="proto-bar" role="toolbar" aria-label="Prototipo">

    <div class="shell">

    <div id="layer"></div>
    <div id="toaster" aria-live="polite"></div>

    <script>
      const TODAY = '2026-10-11';
      const NOW_ISO = '2026-10-11T11:30';
      const HOUR = 60 * 60 * 1000;
      const DAY = 24 * HOUR;
      const MARGIN = HOUR;
      const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      const DOW_LONG = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      const MONTH_FULL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const LABEL = { free: 'Libre', out: 'En renta', late: 'Atrasado', booked: 'Reservado', shop: 'Taller' };
      const TONE = { free: 'go', out: 'flame', late: 'danger', booked: 'info', shop: 'warn' };
      const NAV = [
        ['hoy', 'Hoy', 'house'],
        ['libre', 'Libre', 'calendar'],
        ['rentas', 'Rentas', 'file'],
        ['caja', 'Caja', 'banknote'],
        ['carros', 'Carros', 'car'],
      ];
      const ICON = {
        house: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
        calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
        file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
        banknote: '<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',
        car: '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
        plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
        'chevron-left': '<path d="m15 18-6-6 6-6"/>',
        'chevron-right': '<path d="m9 18 6-6-6-6"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        key: '<path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor" stroke="none"/>',
      };
      const LOGO = '<svg viewBox="0 0 96 56" aria-hidden="true"><path d="M10 50a38 38 0 0 1 76 0" fill="none" stroke="var(--flame)" stroke-width="9" stroke-dasharray="5 4.5" pathLength="100"/><path d="M48 50 66 24" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="48" cy="50" r="5" fill="currentColor"/></svg>';

      const PEOPLE0 = {
        ana: { name: 'Ana Méndez', phone: '7742-1900' },
        carlos: { name: 'Carlos Rivas', phone: '7011-2233' },
        luis: { name: 'Luis Guzmán', phone: '7890-1144' },
        maria: { name: 'María López', phone: '7600-2211' },
        jose: { name: 'José Álvarez', phone: '7210-8899' },
        pedro: { name: 'Pedro Hernández', phone: '7555-0101' },
      };

      /** Reloj fijo del domingo 11 oct, 11:30 a.m., para que las horas del día se lean igual siempre. */
      const NOW = () => parse(NOW_ISO);

      const ui = { scene: 'busy', day: TODAY, month: '2026-10', calendar: false, dialog: null, toast: null, flash: null, enter: true };
      let people = {};
      let cars = [];
      let agreements = [];
      let collected = 0;
      let nextNo = 733;
      let undo = null;
      let seq = 1;

      function parse(value) {
        const [date, time] = String(value).split('T');
        const [year, month, day] = date.split('-').map(Number);
        const [hour, minute] = (time || '00:00').split(':').map(Number);
        return new Date(year, month - 1, day, hour || 0, minute || 0, 0, 0);
      }
      function isoOf(date) {
        const pad = (n) => String(n).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }
      function addDays(value, n) {
        const date = parse(value);
        date.setDate(date.getDate() + n);
        return isoOf(date);
      }
      function round2(n) {
        return Math.round(n * 100) / 100;
      }
      function money(n) {
        return `$${round2(n).toFixed(2)}`;
      }
      function esc(value) {
        return String(value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      }
      function icon(name) {
        return `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[name] || ''}</svg>`;
      }
      function clock(value) {
        const date = parse(value);
        let hour = date.getHours();
        const minute = String(date.getMinutes()).padStart(2, '0');
        const suffix = hour >= 12 ? 'p.m.' : 'a.m.';
        hour = hour % 12 || 12;
        return `${hour}:${minute} ${suffix}`;
      }
      function dayWord(value) {
        const day = String(value).slice(0, 10);
        if (day === TODAY) return 'hoy';
        if (day === addDays(TODAY, -1).slice(0, 10)) return 'ayer';
        if (day === addDays(TODAY, 1).slice(0, 10)) return 'mañana';
        return `${Number(day.slice(8, 10))} de ${MONTHS[Number(day.slice(5, 7)) - 1]}`;
      }
      function spoken(value) {
        return `${dayWord(value)} ${clock(value)}`;
      }
      function rentalDays(outAt, backAt) {
        const span = parse(backAt) - parse(outAt);
        if (!(span > 0)) return null;
        return Math.max(1, Math.ceil((span - HOUR) / DAY));
      }
      function rateFor(car, days) {
        if (days >= 30) return car.rate30 || car.rate7 || car.rate;
        if (days >= 7) return car.rate7 || car.rate;
        return car.rate;
      }
      function person(id) {
        return people[id] || { name: 'Sin cliente', phone: '' };
      }
      function firstName(name) {
        const clean = String(name || '').trim();
        return clean.split(/\s+/)[0] || clean;
      }
      function carById(id) {
        return cars.find((car) => car.id === id);
      }
      function agreementById(id) {
        return agreements.find((row) => row.id === id);
      }
      function balance(row) {
        return round2((row.total || 0) - (row.paid || 0));
      }
      function isOverdue(car) {
        return agreements.some((row) => row.carId === car.id && row.status === 'OUT' && parse(row.backAt) < NOW());
      }
      function availability(car) {
        if (car.shop) return { key: 'shop', agreement: null };
        const out = agreements.find((row) => row.carId === car.id && row.status === 'OUT');
        if (out) return { key: parse(out.backAt) < NOW() ? 'late' : 'out', agreement: out };
        const next = agreements
          .filter((row) => row.carId === car.id && row.status === 'RESERVED' && parse(row.backAt) > NOW())
          .sort((a, b) => parse(a.outAt) - parse(b.outAt))[0];
        if (next && parse(next.outAt) - NOW() < 2 * DAY) return { key: 'booked', agreement: next };
        return { key: 'free', agreement: next || null };
      }
      function occupiedOn(car, day) {
        const start = parse(`${day}T00:00`).getTime();
        const end = parse(addDays(`${day}T00:00`, 1)).getTime();
        return agreements.some((row) => {
          if (row.carId !== car.id || (row.status !== 'RESERVED' && row.status !== 'OUT')) return false;
          const from = parse(row.outAt).getTime();
          let to = parse(row.backAt).getTime();
          if (row.status === 'OUT' && to < NOW().getTime()) to = NOW().getTime();
          return from < end && to > start;
        });
      }
      function covering(car, day) {
        return agreements
          .filter((row) => row.carId === car.id && (row.status === 'RESERVED' || row.status === 'OUT'))
          .filter((row) => {
            const start = parse(`${day}T00:00`).getTime();
            const end = parse(addDays(`${day}T00:00`, 1)).getTime();
            return parse(row.outAt).getTime() < end && parse(row.backAt).getTime() > start;
          })
          .sort((a, b) => parse(a.outAt) - parse(b.outAt));
      }
      /** Estado del carro en un día que no es hoy: lo que le pasa ese día, no ahora. */
      function dayState(car, day) {
        if (car.shop) return 'shop';
        if (isOverdue(car)) return 'late';
        const hit = covering(car, day)[0];
        if (!hit) return 'free';
        if (hit.status === 'RESERVED' && hit.outAt.slice(0, 10) === day) return 'booked';
        return 'out';
      }
      function addDay(day, n) {
        return addDays(`${day}T00:00`, n).slice(0, 10);
      }
      function offerable(car, day) {
        return !car.shop && !isOverdue(car) && !occupiedOn(car, day);
      }
      function freeCount(day) {
        if (day === TODAY) return cars.filter((car) => availability(car).key === 'free').length;
        return cars.filter((car) => offerable(car, day)).length;
      }
      function suggestOut(car, day) {
        if (day === TODAY && availability(car).key === 'free') return NOW_ISO;
        const hits = covering(car, day);
        if (!hits.length) return `${day}T09:00`;
        const end = Math.max(...hits.map((row) => parse(row.backAt).getTime()));
        const start = new Date(end + MARGIN);
        if (isoOf(start).slice(0, 10) !== day) return null;
        return isoOf(start);
      }
      function conflict(carId, outAt, backAt, exceptId) {
        const car = carById(carId);
        if (!car) return { kind: 'missing' };
        if (car.shop) return { kind: 'shop', car };
        if (isOverdue(car)) return { kind: 'late', car };
        const start = parse(outAt).getTime();
        const end = parse(backAt).getTime();
        if (!(end > start)) return { kind: 'order' };
        const hit = agreements.find((row) => {
          if (row.id === exceptId || row.carId !== carId) return false;
          if (row.status !== 'RESERVED' && row.status !== 'OUT') return false;
          const from = parse(row.outAt).getTime();
          let to = parse(row.backAt).getTime();
          if (row.status === 'OUT' && to < NOW().getTime()) to = NOW().getTime();
          return from < end + MARGIN && to + MARGIN > start;
        });
        return hit ? { kind: 'busy', agreement: hit } : null;
      }
      function conflictText(hit) {
        if (!hit) return '';
        if (hit.kind === 'order') return 'La vuelta tiene que ser después de la salida.';
        if (hit.kind === 'shop') return `${hit.car.name} está en el taller.`;
        if (hit.kind === 'late') {
          const row = agreements.find((item) => item.carId === hit.car.id && item.status === 'OUT');
          const who = row ? person(row.customerId).name : 'el cliente';
          return `Está atrasado con ${who}. No lo reserves hasta que vuelva.`;
        }
        if (hit.kind === 'busy') {
          return `Ese horario choca con la renta de ${person(hit.agreement.customerId).name} (${spoken(hit.agreement.outAt)} a ${spoken(hit.agreement.backAt)}). Dejá una hora entre rentas.`;
        }
        return 'Ese carro no está libre.';
      }

      function loadScene(name) {
        people = structuredClone(PEOPLE0);
        undo = null;
        ui.dialog = null;
        ui.toast = null;
        ui.flash = null;
        ui.day = TODAY;
        ui.month = TODAY.slice(0, 7);
        ui.calendar = false;
        ui.scene = name;
        if (name === 'quiet') {
          collected = 0;
          nextNo = 733;
          cars = [
            { id: 'p123', plate: 'P123-432', name: 'Kia Picanto 2024', rate: 25, rate7: 22, rate30: 0 },
            { id: 'p213', plate: 'P213123', name: 'Nissan Versa 2019', rate: 24, rate7: 0, rate30: 0 },
          ];
          agreements = [];
          return;
        }
        collected = 65;
        nextNo = 746;
        cars = [
          { id: 'gris', plate: 'P55B30', name: 'Kia Picanto gris', rate: 25, rate7: 22, rate30: 0 },
          { id: 'blanco', plate: 'P53DBC', name: 'Kia Picanto blanco', rate: 25, rate7: 22, rate30: 0 },
          { id: 'sentra', plate: 'P9048B', name: 'Nissan Sentra', rate: 28, rate7: 0, rate30: 0 },
          { id: 'rio', plate: '78F74', name: 'Kia Rio', rate: 27, rate7: 24, rate30: 0 },
          { id: 'forte', plate: 'P812AA', name: 'Kia Forte', rate: 30, rate7: 27, rate30: 0 },
          { id: 'scion', plate: 'P463C1', name: 'Scion iA', rate: 22, rate7: 0, rate30: 0 },
          {
            id: 'versa',
            plate: 'P00011',
            name: 'Nissan Versa',
            rate: 24,
            rate7: 0,
            rate30: 0,
            alert: { level: 'warn', text: 'El seguro vence el 20 oct' },
          },
          {
            id: 'bt50',
            plate: '',
            name: 'Mazda BT-50',
            rate: 35,
            rate7: 0,
            rate30: 0,
            shop: true,
            shopNote: 'En el taller desde el 9 oct · cambio de aceite',
          },
        ];
        agreements = [
          agree({ id: 'a-gris', no: '0741', carId: 'gris', customerId: 'carlos', status: 'OUT', outAt: '2026-10-08T18:00', backAt: '2026-10-10T18:00', paid: 25 }),
          agree({ id: 'a-blanco', no: '0742', carId: 'blanco', customerId: 'ana', status: 'OUT', outAt: '2026-10-11T08:00', backAt: '2026-10-11T17:00', paid: 25 }),
          agree({ id: 'a-sentra', no: '0744', carId: 'sentra', customerId: 'luis', status: 'RESERVED', outAt: '2026-10-11T14:00', backAt: '2026-10-13T14:00', paid: 0 }),
          agree({ id: 'a-rio', no: '0739', carId: 'rio', customerId: 'maria', status: 'OUT', outAt: '2026-10-10T10:00', backAt: '2026-10-12T10:00', paid: 54 }),
          agree({ id: 'a-forte', no: '0745', carId: 'forte', customerId: 'jose', status: 'RESERVED', outAt: '2026-10-12T09:00', backAt: '2026-10-19T09:00', paid: 0 }),
          agree({ id: 'a-pedro', no: '0736', carId: 'scion', customerId: 'pedro', status: 'RETURNED', outAt: '2026-10-01T09:00', backAt: '2026-10-02T09:00', paid: 25, total: 40 }),
        ];
      }
      function agree(partial) {
        const car = cars.find((item) => item.id === partial.carId);
        const days = rentalDays(partial.outAt, partial.backAt);
        const total = partial.total != null ? partial.total : round2(rateFor(car, days) * days);
        return { paid: 0, leftAt: null, ...partial, total };
      }

      function rowState(car) {
        return ui.day === TODAY ? availability(car).key : dayState(car, ui.day);
      }
      function rateFact(car) {
        return car.rate ? `${money(car.rate)} por día` : '';
      }
      function shopFact(car) {
        const note = car.shopNote || '';
        const bit = (note.includes('·') ? note.split('·').pop() : note).trim();
        if (!bit) return 'En el taller';
        return bit.charAt(0).toUpperCase() + bit.slice(1);
      }
      function factFor(agreement, key) {
        const who = firstName(person(agreement.customerId).name);
        if (key === 'late') {
          const due = balance(agreement);
          return due > 0.009 ? `${who} · debe ${money(due)}` : `${who} · sin volver`;
        }
        if (key === 'out') {
          const back = agreement.backAt;
          const day = back.slice(0, 10);
          if (day === TODAY) return `${who} · ${clock(back)}`;
          if (day === addDays(TODAY, 1).slice(0, 10)) return `${who} · mañana ${clock(back)}`;
          return `${who} · ${dayWord(back)}`;
        }
        const day = agreement.outAt.slice(0, 10);
        if (day === TODAY) return `${who} · ${clock(agreement.outAt)}`;
        if (day === addDays(TODAY, 1).slice(0, 10)) return `${who} · mañana`;
        return `${who} · ${dayWord(agreement.outAt)}`;
      }
      function factOnDay(car) {
        if (isOverdue(car)) {
          const row = agreements.find((item) => item.carId === car.id && item.status === 'OUT');
          return row ? factFor(row, 'late') : 'Sin volver';
        }

        } else {
          const state = availability(car);
          if (state.key === 'free') button = `<button type="button" class="btn sm" data-action="rent" data-car="${car.id}">Rentar</button>`;
          else if (state.key === 'booked' && state.agreement.outAt.slice(0, 10) === TODAY) button = `<button type="button" class="btn sm" data-action="deliver" data-id="${state.agreement.id}">Entregar</button>`;

      function shiftMonth(ym, delta) {

      function renderChrome() {
        const item = ([key, label, glyph]) =>
          `<button type="button" class="nav-item" data-action="${key === 'hoy' ? 'noop' : 'nav'}" ${key === 'hoy' ? 'aria-current="page"' : ''}>${icon(glyph)}<span>${label}</span></button>`;
        document.getElementById('rail').innerHTML = `<div class="logo">${LOGO}<span class="wordmark">ELITE<small>SERVICE</small></span></div><div class="ws-btn"><span class="flame">${icon('key')}</span><span>Renta</span></div><ul class="nav-list">${NAV.map((entry) => `<li>${item(entry)}</li>`).join('')}</ul><div class="rail-foot">Recepción</div>`;
        document.getElementById('topbar').innerHTML = `<span class="brand">${LOGO}<span class="wordmark">ELITE<small>SERVICE</small></span></span><span class="spacer"></span><span class="dim">Recepción</span>`;
        document.getElementById('bottom').innerHTML = NAV.map(
          ([key, label, glyph]) =>
            `<button type="button" data-action="${key === 'hoy' ? 'noop' : 'nav'}" ${key === 'hoy' ? 'aria-current="page"' : ''}>${icon(glyph)}<span>${label}</span></button>`,
        ).join('');
      }
      function render() {
        document.getElementById('scene-note').textContent =
          ui.scene === 'quiet'
            ? 'Placas de tu pantalla. Carro y tarifa, de muestra. Reloj fijo: 11:30 a.m.'
            : 'Domingo con la flota en la calle. Datos de muestra. Reloj fijo: 11:30 a.m.';
        document.querySelectorAll('[data-scene]').forEach((button) => {
          button.setAttribute('aria-pressed', String(button.getAttribute('data-scene') === ui.scene));
        });
        renderChrome();
        document.getElementById('screen').innerHTML = screenHtml();
        document.getElementById('layer').innerHTML = layerHtml();
        const toaster = document.getElementById('toaster');
        const toastId = ui.toast ? String(ui.toast.id) : '';
        if (toaster.dataset.id !== toastId) {
          toaster.dataset.id = toastId;
          toaster.innerHTML = ui.toast
            ? `<div class="toast" role="status"><p>${esc(ui.toast.message)}</p>${ui.toast.withUndo ? '<button type="button" class="btn sm" data-action="undo">Deshacer</button>' : ''}</div>`
            : '';
          clearTimeout(toastTimer);
          if (ui.toast) {
            const shown = ui.toast;
            toastTimer = setTimeout(() => {
              if (ui.toast !== shown) return;
              ui.toast = null;
              render();
            }, shown.withUndo ? 8000 : 4000);
          }
        }
        ui.enter = false;
        ui.flash = null;
        const bar = document.querySelector('.proto-bar');
        document.documentElement.style.setProperty('--proto-h', `${bar.offsetHeight}px`);
      }
      function syncDraftFromForm() {
        const draft = ui.dialog;
        if (!draft || draft.type !== 'rent') return;
        const outAt = document.getElementById('out-at');
        const backAt = document.getElementById('back-at');
        const who = document.getElementById('who');
        if (outAt) draft.outAt = outAt.value;
        if (backAt) draft.backAt = backAt.value;
        if (who) draft.customerId = who.value;
        const walkName = document.getElementById('walk-name');
        const walkPhone = document.getElementById('walk-phone');
        if (walkName) draft.walkName = walkName.value;
        if (walkPhone) draft.walkPhone = walkPhone.value;
      }

      function onClick(event) {
        const scene = event.target.closest('[data-scene]');
        if (scene) {
          loadScene(scene.getAttribute('data-scene'));
          ui.enter = true;
          render();
          return;
        }
        const theme = event.target.closest('[data-theme-set]');
        if (theme) {
          document.documentElement.setAttribute('data-theme', theme.getAttribute('data-theme-set'));
          document.querySelectorAll('[data-theme-set]').forEach((button) => {
            button.setAttribute('aria-pressed', String(button === theme));
          });
          return;
        }
        const density = event.target.closest('[data-density-set]');
        if (density) {
          document.documentElement.setAttribute('data-density', density.getAttribute('data-density-set'));
          document.querySelectorAll('[data-density-set]').forEach((button) => {
            button.setAttribute('aria-pressed', String(button === density));
          });
          render();
          return;
        }
        const target = event.target.closest('[data-action]');
        if (!target) {
          if (event.target.classList?.contains('backdrop')) {
            ui.dialog = null;
            ui.calendar = false;
            render();
            return;
          }
          if (ui.calendar && !event.target.closest('[data-cal]')) {
            ui.calendar = false;
            render();
          }
          return;
        }
        const action = target.getAttribute('data-action');
        const id = target.getAttribute('data-id');
        const carId = target.getAttribute('data-car');
        const calNav = action === 'open-cal' || action === 'cal-prev' || action === 'cal-next' || action === 'cal-day';
        if (!calNav) ui.calendar = false;
        if (action === 'close') {
          ui.dialog = null;
          render();
        } else if (action === 'noop') {
          /* Hoy ya está abierto. */
        } else if (action === 'nav') {
          toast('Esa pestaña no cambia. Esta maqueta es solo Hoy.', false);
          render();
        } else if (action === 'cash') {
          toast('Eso abre Caja.', false);
          render();
        } else if (action === 'open-cal') {
          ui.calendar = !ui.calendar;
          if (ui.calendar) ui.month = ui.day.slice(0, 7);
          render();
          if (ui.calendar) focusDay(ui.day);
        } else if (action === 'cal-prev') {
          const next = shiftMonth(ui.month, -1);
          if (next >= TODAY.slice(0, 7)) ui.month = next;
          render();
        } else if (action === 'cal-next') {
          const next = shiftMonth(ui.month, 1);
          if (next <= shiftMonth(TODAY.slice(0, 7), 14)) ui.month = next;
          render();
        } else if (action === 'cal-day') {
          ui.day = target.getAttribute('data-day');
          ui.calendar = false;
          render();
          focusTrigger();
        } else if (action === 'day-prev' || action === 'day-next' || action === 'day-today') {
          const next = action === 'day-today' ? TODAY : addDay(ui.day, action === 'day-prev' ? -1 : 1);
          if (next >= TODAY && next <= lastDay()) ui.day = next;
          render();
          const keep = document.querySelector(`[data-action="${action}"]:not(:disabled)`);
          if (keep) keep.focus();
          else focusTrigger();
        } else if (action === 'rent') openRent(carId);
        else if (action === 'open') openCar(carId);
        else if (action === 'open-agreement') {
          ui.dialog = { type: 'agreement', id };
          render();
        } else if (action === 'pick-car') {
          syncDraftFromForm();
          ui.dialog.carId = carId;
          const start = suggestOut(carById(carId), ui.day) || ui.dialog.outAt;
          ui.dialog.outAt = start;
          ui.dialog.backAt = addDays(start, 1);
          render();
        } else if (action === 'deliver') deliver(id);
        else if (action === 'receive') receive(id, null);
        else if (action === 'receive-keep') receive(id, false);
        else if (action === 'receive-take') receive(id, true);
        else if (action === 'charge') charge(id);
        else if (action === 'call') call(id);
        else if (action === 'undo' && undo) {
          restore(undo);
          undo = null;
          ui.dialog = null;
          toast('Listo, quedó como estaba.', false);
          render();
        }
      }
      function focusDay(day) {
        const cell = document.querySelector(`.cal-day[data-day="${day}"]:not(:disabled)`) || document.querySelector('.cal-day:not(:disabled)');
        if (cell) cell.focus();
      }
      function focusTrigger() {
        const trigger = document.querySelector('[data-action="open-cal"]');
        if (trigger) trigger.focus();
      }
      function boot() {
        loadScene('busy');
        document.body.addEventListener('click', onClick);
        document.body.addEventListener('input', (event) => {
          if (!ui.dialog || ui.dialog.type !== 'rent') return;
          if (!event.target.closest('#rent-form')) return;
          syncDraftFromForm();
          const quote = quoteOf(ui.dialog);
          const slot = document.getElementById('quote');
          const submit = document.querySelector('#rent-form button[type="submit"]');
          if (slot && submit) {
            if (quote.error) {
              slot.innerHTML = `<p class="err">${esc(quote.error)}</p>`;
              submit.disabled = true;
            } else {
              slot.innerHTML = `<div class="fig">${money(quote.total)}</div><p class="tier">${quote.days} ${quote.days === 1 ? 'día' : 'días'} × ${money(quote.rate)}${quote.tier ? ` · ${quote.tier}` : ''}</p>`;
              submit.disabled = false;
              submit.textContent = parse(ui.dialog.outAt) <= NOW() ? 'Entregar ahora' : 'Reservar';
            }
          }
        });
        document.body.addEventListener('change', (event) => {
          if (event.target.id !== 'who' || !ui.dialog || ui.dialog.type !== 'rent') return;
          syncDraftFromForm();
          render();
        });
        document.body.addEventListener('submit', (event) => {
          if (event.target.id !== 'rent-form') return;
          event.preventDefault();
          syncDraftFromForm();
          const draft = ui.dialog;
          if (draft.customerId === 'new') {
            draft.walkName = document.getElementById('walk-name')?.value || '';
            draft.walkPhone = document.getElementById('walk-phone')?.value || '';
          }
          if (!draft.customerId) {
            toast('Elegí quién se lo lleva.', false);
            render();
            return;
          }
          createRental(draft);
        });
        document.addEventListener('keydown', (event) => {
          const cell = event.target.closest && event.target.closest('.cal-day');
          const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[event.key];
          if (cell && step) {
            event.preventDefault();
            const next = addDay(cell.getAttribute('data-day'), step);
            if (next < TODAY || next > lastDay()) return;
            const span = calendarSpan();
            const ym = next.slice(0, 7);
            if (ym < ui.month) ui.month = ym;
            else if (ym > shiftMonth(ui.month, span - 1)) ui.month = shiftMonth(ym, -(span - 1));
            render();
            focusDay(next);
            return;
          }
          if (event.key !== 'Escape') return;
          if (ui.calendar) {
            ui.calendar = false;
            render();
            focusTrigger();
            return;
          }
          if (ui.dialog) {
            ui.dialog = null;
            render();
          }
        });
        render();
      }

      function selfCheck() {
        loadScene('busy');
        const problems = [];
        if (freeCount(TODAY) !== 2) problems.push(`hoy ${freeCount(TODAY)}`);
        if (freeCount('2026-10-12') !== 3) problems.push(`lunes ${freeCount('2026-10-12')}`);
        if (freeCount('2026-10-15') !== 5) problems.push(`jueves ${freeCount('2026-10-15')}`);
        if (rentalDays('2026-10-11T11:30', '2026-10-12T11:30') !== 1) problems.push('1 día');
        if (rentalDays('2026-10-11T11:30', '2026-10-12T12:31') !== 2) problems.push('2 días');
        const forte = agreements.find((row) => row.id === 'a-forte');
        if (forte.total !== 189) problems.push(`forte ${forte.total}`);
        const gris = agreements.find((row) => row.id === 'a-gris');
        if (gris.total !== 50 || balance(gris) !== 25) problems.push('gris');
        if (availability(carById('forte')).key !== 'booked') problems.push('forte estado');
        if (availability(carById('gris')).key !== 'late') problems.push('gris estado');
        if (conflict('sentra', '2026-10-13T15:00', '2026-10-14T15:00')) problems.push('sentra martes 3pm');
        if (!conflict('sentra', '2026-10-13T14:30', '2026-10-14T14:30')) problems.push('margen');
        if (shiftMonth('2026-10', 1) !== '2026-11' || shiftMonth('2026-12', 1) !== '2027-01') problems.push('mes');
        const oct = monthCells('2026-10');
        if (oct[4] !== '2026-10-01' || oct.filter(Boolean).length !== 31) problems.push('grilla');
        if (triggerWhen(TODAY) !== 'Hoy, 11 oct' || triggerWhen('2026-10-12') !== 'Lunes 12 oct') problems.push('fecha');
        const facts = {
          gris: 'Carlos · debe $25.00',
          blanco: 'Ana · 5:00 p.m.',
          sentra: 'Luis · 2:00 p.m.',
          rio: 'María · mañana 10:00 a.m.',
          forte: 'José · mañana',
          scion: '$22.00 por día',
          versa: '$24.00 por día',
          bt50: 'Cambio de aceite',
        };
        Object.entries(facts).forEach(([id, fact]) => {
          const got = factOf(carById(id));
          if (got !== fact) problems.push(`${id} «${got}»`);
        });
        if (dayState(carById('sentra'), '2026-10-12') !== 'out') problems.push('sentra lunes');
        if (dayState(carById('forte'), '2026-10-12') !== 'booked') problems.push('forte lunes');
        if (dayState(carById('scion'), '2026-10-12') !== 'free') problems.push('scion lunes');
        if (titleOf(TODAY) !== 'Hoy, 11 de oct' || titleOf('2026-10-15') !== 'Jueves 15 de oct') problems.push('título');
        if (addDay('2026-10-31', 1) !== '2026-11-01' || lastDay() !== '2027-12-31') problems.push(`días ${lastDay()}`);
        ui.day = '2026-10-12';
        if (factOf(carById('rio')) !== 'María · vuelve 10:00 a.m.') problems.push(`rio lunes «${factOf(carById('rio'))}»`);
        if (factOf(carById('forte')) !== 'José · sale 9:00 a.m.') problems.push('forte sale');
        ui.day = '2026-10-15';
        if (factOf(carById('forte')) !== 'José') problems.push('forte jueves');
        if (factOf(carById('scion')) !== '$22.00 por día') problems.push('scion jueves');
        if (factOf(carById('gris')) !== 'Carlos · debe $25.00') problems.push('gris jueves');
        ui.day = TODAY;
        if (problems.length) throw new Error(problems.join(', '));
      }

      if (typeof document === 'undefined') selfCheck();
      else boot();
    </script>
  </body>
</html>
