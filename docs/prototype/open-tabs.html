<!doctype html>
<html lang="es" data-theme="dark" data-density="mostrador">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elite Service — cuentas abiertas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,600;0,700;1,600;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* =====================================================================
       * Tokens — copiados de apps/web/src/app/globals.css / DESIGN.md.
       * Ningún color, radio ni duración nace fuera de este bloque.
       * =================================================================== */
      :root {
        --bg: #070e1c;
        --surface: #0b1730;
        --surface-2: #101e3c;
        --surface-3: #152747;
        --line: #1e3358;
        --line-soft: #182b4c;
        --rail: #050a15;

        --text: #eaf0fa;
        --text-dim: #8fa4c6;
        --text-faint: #7387ac;

        --flame: #f04e23;
        --flame-hot: #f58220;
        --flame-deep: #c4161c;
        --flame-text: #f58220;
        --gradient-action: linear-gradient(100deg, var(--flame-hot), var(--flame) 55%, var(--flame-deep));
        --gradient-bar-active: linear-gradient(90deg, var(--flame-hot), var(--flame-deep));
        --on-flame: #ffffff;

        --go: #2fbf7c;
        --go-text: #2fbf7c;
        --danger: #a8232b;
        --danger-text: #f08089;
        --warn: #e5a64b;
        --warn-text: #e5a64b;
        --info-text: #7fb0ff;
        --consume-text: #d59bf6;

        --tint-fill: 12%;
        --tint-line: 40%;

        --shadow-dialog: 0 24px 60px -12px rgb(0 0 0 / 0.85), 0 0 0 1px rgb(255 255 255 / 0.08);
        --overlay: color-mix(in srgb, var(--bg) 80%, transparent);

        --radius-sm: 6px;
        --radius-control: 10px;
        --radius-row: 12px;
        --radius-card: 14px;
        --segment-radius: 7px;
        --tab-mark: 2.5px;
        --selectable-border: 1.5px;

        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
        --duration-state: 140ms;
        --duration-enter: 180ms;

        --row-h: 52px;
        --control-h: 40px;
        --touch-min: 36px;
        --icon-size: 16px;
        --field-px: 16px;
        --tile-min: 150px;
        --figure-size: 30px;
        --stat-size: 28px;
        --lead-size: 16px;
      }

      [data-theme='light'] {
        --bg: #eef1f6;
        --surface: #ffffff;
        --surface-2: #f6f8fc;
        --surface-3: #e6ebf3;
        --line: #d9e0ec;
        --line-soft: #e6ebf3;
        --rail: #0b1730;

        --text: #0b1730;
        --text-dim: #4e5d77;
        --text-faint: #626c80;

        --flame-text: #a8480c;
        --go-text: #0f6b41;
        --danger-text: #a8232b;
        --warn-text: #8a5510;
        --info-text: #1d4ed8;
        --consume-text: #8b2fa8;

        --shadow-dialog: 0 24px 60px -12px rgb(11 23 48 / 0.28), 0 2px 8px -2px rgb(11 23 48 / 0.12),
          0 0 0 1px rgb(11 23 48 / 0.08);
        --overlay: color-mix(in srgb, var(--rail) 45%, transparent);
      }

      [data-density='bahia'] {
        --row-h: 64px;
        --control-h: 48px;
        --touch-min: 44px;
        --icon-size: 20px;
        --field-px: 18px;
        --tile-min: 190px;
        --figure-size: 38px;
        --stat-size: 38px;
      }

      /* ===================================================================== Base */
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14.5px;
        line-height: 21px;
        -webkit-font-smoothing: antialiased;
      }
      [data-density='bahia'] body { font-size: 16px; line-height: 23px; }
      button, input, textarea, select { font: inherit; color: inherit; }
      h1 {
        font-family: 'Saira', 'Arial Narrow', system-ui, sans-serif;
        font-style: italic; font-weight: 800; letter-spacing: -0.01em;
        font-size: 38px; line-height: 0.95; margin: 0;
      }
      h2 { font-size: 21px; font-weight: 600; line-height: 27px; letter-spacing: -0.01em; margin: 0; }
      h3 { font-size: 17px; font-weight: 600; line-height: 23px; margin: 0; }
      p { margin: 0; }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13.5px; font-weight: 700; letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
      }
      [data-density='bahia'] .mono { font-size: 15px; }
      .tabular { font-variant-numeric: tabular-nums; }
      .figure {
        font-family: 'Saira', 'Arial Narrow', system-ui, sans-serif;
        font-style: italic; font-weight: 700; letter-spacing: -0.01em;
        font-size: var(--figure-size); line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .dim { color: var(--text-dim); }
      .faint { color: var(--text-faint); }
      .dense { font-size: 12.5px; line-height: 18px; }
      [data-density='bahia'] .dense { font-size: 14px; line-height: 20px; }
      .label { font-size: 12px; font-weight: 600; line-height: 16px; }
      :focus-visible { outline: 2px solid var(--flame-hot); outline-offset: 2px; }
      [hidden] { display: none !important; }
      svg.i { width: var(--icon-size); height: var(--icon-size); flex: 0 0 auto; }

      /* ===================================================================== Marco del prototipo */
      .proto {
        position: sticky; top: 0; z-index: 30;
        background: var(--rail); color: #e6edf9;
        border-bottom: 1px solid var(--line-soft);
      }
      .proto-in {
        max-width: 1280px; margin: 0 auto; padding: 10px 30px;
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      }
      .proto-title { font-size: 12px; font-weight: 600; color: #a8b6ce; }
      .proto-title b { color: #e6edf9; }
      .proto .seg { background: #0b1730; border-color: #1e3358; }
      .proto .seg button { color: #a8b6ce; }
      .proto .seg button[aria-pressed='true'] { background: #152747; border-color: #1e3358; color: #fff; }
      .proto-switches { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
      @media (max-width: 899.98px) {
        .proto-in { padding: 10px 16px; }
        .proto-switches { margin-left: 0; }
      }

      .page {
        max-width: 1280px; margin: 0 auto; padding: 30px 30px 80px;
        display: flex; flex-direction: column; gap: 22px;
      }
      @media (max-width: 899.98px) {
        .page { padding: 22px 16px 110px; }
        h1 { font-size: 30px; }
      }

      .back {
        display: inline-flex; align-items: center; gap: 6px;
        min-height: var(--touch-min);
        color: var(--text-dim); font-size: 13.5px; font-weight: 600;
        background: none; border: 0; padding: 0; cursor: pointer; align-self: flex-start;
      }
      .back:hover { color: var(--text); }
      .head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
      .head .sub { margin-top: 8px; color: var(--text-dim); max-width: 64ch; }
      .head-actions { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }

      /* ===================================================================== Controles */
      .seg {
        display: inline-flex; background: var(--surface-2);
        border: 1px solid var(--line); border-radius: var(--radius-control);
        padding: 3px; gap: 3px;
      }
      .seg button {
        border: 1px solid transparent; background: transparent; color: var(--text-faint);
        font-weight: 600; font-size: 13px;
        min-height: calc(var(--touch-min) - 6px); padding: 0 12px;
        border-radius: var(--segment-radius); cursor: pointer;
        transition: color var(--duration-state) var(--ease-standard), background-color var(--duration-state) var(--ease-standard);
      }
      .seg button[aria-pressed='true'] { background: var(--surface); border-color: var(--line); color: var(--text); }
      .seg.wide { display: flex; }
      .seg.wide button { flex: 1; min-height: calc(var(--control-h) - 6px); font-size: 14px; }

      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        min-height: var(--control-h); padding: 0 18px;
        border-radius: var(--radius-control); border: 1px solid transparent;
        font-weight: 600; cursor: pointer; background: transparent; color: var(--text);
        white-space: nowrap;
        transition: filter var(--duration-state) var(--ease-standard), border-color var(--duration-state) var(--ease-standard);
      }
      .btn-primary { background-image: var(--gradient-action); color: var(--on-flame); }
      .btn-primary:hover { filter: brightness(1.1); }
      .btn-primary:disabled { filter: grayscale(0.8) brightness(0.7); cursor: not-allowed; }
      .btn-outline { background: var(--surface-2); border-color: var(--line); }
      .btn-outline:hover { border-color: var(--flame); }
      .btn-ghost:hover { background: var(--surface-2); }
      .btn-danger { background: var(--danger); color: #fff; }
      .btn-sm { min-height: var(--touch-min); padding: 0 12px; font-size: 13px; }
      .btn-block { width: 100%; }

      .field { display: flex; flex-direction: column; gap: 6px; }
      .field > span { font-size: 13px; font-weight: 600; color: var(--text-dim); }
      .input {
        min-height: var(--control-h); padding: 0 var(--field-px);
        background: var(--surface-2); border: 1px solid var(--line);
        border-radius: var(--radius-control); outline: none; width: 100%;
      }
      .input:focus { border-color: var(--flame); }
      textarea.input { padding-top: 10px; padding-bottom: 10px; min-height: 84px; resize: vertical; }
      .search { position: relative; }
      .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
      .search .input { padding-left: 38px; }

      .chip {
        display: inline-flex; align-items: center; gap: 6px;
        border-radius: 999px; padding: 1px 9px;
        font-size: 12px; font-weight: 600; line-height: 18px;
        border: 1px solid; white-space: nowrap;
      }
      [data-density='bahia'] .chip { font-size: 13px; line-height: 21px; padding: 1px 11px; }
      .tint-consume { color: var(--consume-text); background: color-mix(in srgb, var(--consume-text) var(--tint-fill), transparent); border-color: color-mix(in srgb, var(--consume-text) var(--tint-line), transparent); }
      .tint-info { color: var(--info-text); background: color-mix(in srgb, var(--info-text) var(--tint-fill), transparent); border-color: color-mix(in srgb, var(--info-text) var(--tint-line), transparent); }
      .tint-go { color: var(--go-text); background: color-mix(in srgb, var(--go) var(--tint-fill), transparent); border-color: color-mix(in srgb, var(--go) var(--tint-line), transparent); }
      .tint-warn { color: var(--warn-text); background: color-mix(in srgb, var(--warn) var(--tint-fill), transparent); border-color: color-mix(in srgb, var(--warn) var(--tint-line), transparent); }
      .tint-flame { color: var(--flame-text); background: color-mix(in srgb, var(--flame) var(--tint-fill), transparent); border-color: color-mix(in srgb, var(--flame) var(--tint-line), transparent); }
      .tint-muted { color: var(--text-faint); background: var(--surface-2); border-color: var(--line); }

      .filter-chip {
        display: inline-flex; align-items: center; gap: 6px;
        min-height: var(--touch-min); padding: 0 12px;
        border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
        color: var(--text-dim); font-weight: 600; font-size: 13px; cursor: pointer;
      }
      .filter-chip[aria-pressed='true'] { border-color: var(--flame); color: var(--text); background: var(--surface-2); }
      .filter-chip .n { font-size: 11.5px; color: var(--text-faint); }

      .card {
        background: var(--surface); border: 1px solid var(--line-soft);
        border-radius: var(--radius-card); padding: 22px;
      }

      /* ===================================================================== Pestañas */
      .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line-soft); overflow-x: auto; }
      .tab {
        position: relative; background: none; border: 0; cursor: pointer;
        padding: 10px 2px 12px; min-height: var(--touch-min);
        color: var(--text-dim); font-weight: 600; font-size: 14.5px; white-space: nowrap;
        display: inline-flex; align-items: center; gap: 8px;
      }
      [data-density='bahia'] .tab { font-size: var(--lead-size); padding-bottom: 14px; }
      .tab[aria-selected='true'] { color: var(--text); }
      .tab[aria-selected='true']::after {
        content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: var(--tab-mark);
        background: var(--gradient-action); border-radius: 999px;
      }
      .tab .count {
        font-size: 11.5px; padding: 0 7px; border-radius: 999px;
        background: var(--surface-2); border: 1px solid var(--line); color: var(--text-dim);
      }
      .tab[aria-selected='true'] .count { color: var(--flame-text); border-color: color-mix(in srgb, var(--flame) var(--tint-line), transparent); }

      /* ===================================================================== Stats */
      .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
      .stat { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-card); padding: 16px 20px; }
      .stat .k { font-size: 12px; font-weight: 600; color: var(--text-faint); }
      .stat .v {
        font-family: 'Saira', 'Arial Narrow', system-ui, sans-serif; font-style: italic; font-weight: 700;
        font-size: var(--stat-size); line-height: 1.15; font-variant-numeric: tabular-nums; margin-top: 4px;
      }
      .stat .s { margin-top: 2px; }
      @media (max-width: 899.98px) { .stats { grid-template-columns: 1fr 1fr; } .stats .stat:last-child { grid-column: 1 / -1; } }

      .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .toolbar .search { flex: 1 1 260px; max-width: 380px; }

      /* ===================================================================== Filas */
      .rows { display: flex; flex-direction: column; gap: 10px; }
      .tab-row {
        display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 16px;
        min-height: var(--row-h); padding: 14px 18px;
        background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-row);
        text-align: left; cursor: pointer; width: 100%;
        transition: border-color var(--duration-state) var(--ease-standard), background-color var(--duration-state) var(--ease-standard);
      }
      .tab-row:hover { border-color: var(--line); background: var(--surface-2); }
      .avatar {
        width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center;
        background: var(--surface-3); border: 1px solid var(--line); font-weight: 700; font-size: 13.5px; color: var(--text-dim);
      }
      [data-density='bahia'] .avatar { width: 48px; height: 48px; font-size: 15px; }
      .tab-row .who { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .tab-row .name { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      [data-density='bahia'] .tab-row .name { font-size: 17px; }
      .tab-row .owe { text-align: right; }
      .tab-row .owe .mono { font-size: 16px; }
      [data-density='bahia'] .tab-row .owe .mono { font-size: 19px; }
      .tab-row .chev { color: var(--text-faint); }
      .tab-row.closed { opacity: 0.75; }
      .tab-row.flash { animation: flash 1.6s var(--ease-standard); }
      @keyframes flash { 0%, 40% { border-color: var(--flame); background: var(--surface-2); } }
      @media (max-width: 599.98px) {
        .tab-row { grid-template-columns: auto minmax(0, 1fr) auto; }
        .tab-row .chev { display: none; }
      }

      .empty {
        border: 1px dashed var(--line); border-radius: var(--radius-row); padding: 34px 22px;
        text-align: center; color: var(--text-dim);
      }
      .empty b { display: block; color: var(--text); font-size: var(--lead-size); margin-bottom: 4px; }

      /* Tabla de ventas */
      .table { width: 100%; border-collapse: separate; border-spacing: 0; }
      .table th {
        text-align: left; font-size: 12px; font-weight: 600; color: var(--text-faint);
        padding: 0 14px 10px; border-bottom: 1px solid var(--line-soft);
      }
      .table td { padding: 0 14px; height: var(--row-h); border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
      .table tr:last-child td { border-bottom: 0; }
      .table .num { text-align: right; font-variant-numeric: tabular-nums; }
      .table-card { padding: 14px 8px 4px; overflow-x: auto; }
      @media (max-width: 899.98px) { .table .hide-sm { display: none; } }

      /* ===================================================================== Nueva venta */
      .sale-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 22px; align-items: start; }
      [data-density='bahia'] .sale-grid { grid-template-columns: minmax(0, 1fr) 440px; }
      @media (max-width: 1099.98px) { .sale-grid, [data-density='bahia'] .sale-grid { grid-template-columns: 1fr; } }
      .cats { display: flex; gap: 8px; flex-wrap: wrap; }
      .products { display: flex; flex-direction: column; gap: 6px; }
      .product-row {
        display: grid; grid-template-columns: minmax(0, 1fr) auto 72px 132px; gap: 14px; align-items: center;
        min-height: var(--row-h); padding: 6px 8px 6px 16px;
        background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-row);
      }
      [data-density='bahia'] .product-row { grid-template-columns: minmax(0, 1fr) auto 80px 152px; padding-left: 18px; }
      .product-row.picked { border-color: color-mix(in srgb, var(--flame) var(--tint-line), transparent); }
      .product-row.out { opacity: 0.55; }
      .product-row .pn { font-weight: 600; min-width: 0; }
      [data-density='bahia'] .product-row .pn { font-size: 17px; }
      .product-row .mono { text-align: right; }
      .product-row .pc { display: flex; justify-content: flex-end; }
      .add-btn {
        width: var(--touch-min); height: var(--touch-min); display: grid; place-items: center; cursor: pointer;
        border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface-2); color: var(--text);
      }
      .add-btn:hover { border-color: var(--flame); }
      @media (max-width: 599.98px) {
        .product-row { grid-template-columns: minmax(0, 1fr) auto auto; }
        .product-row .dense { display: none; }
      }

      .cart { position: sticky; top: 74px; display: flex; flex-direction: column; gap: 16px; }
      @media (max-width: 1099.98px) { .cart { position: static; } }
      .cart-lines { display: flex; flex-direction: column; }
      .cart-line {
        display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center;
        padding: 10px 0; border-bottom: 1px solid var(--line-soft);
      }
      .cart-line:last-child { border-bottom: 0; }
      .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--surface-2); }
      .stepper button {
        width: var(--touch-min); height: var(--touch-min); border: 0; background: none; cursor: pointer;
        display: grid; place-items: center; color: var(--text-dim);
      }
      .stepper button:hover { color: var(--text); }
      .stepper span { min-width: 34px; text-align: center; }
      .total-row { display: flex; justify-content: space-between; align-items: baseline; }

      .how { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
      .note {
        display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px;
        border-radius: var(--radius-control); background: var(--surface-2); border: 1px solid var(--line-soft);
        color: var(--text-dim); font-size: 13px; line-height: 19px;
      }
      [data-density='bahia'] .note { font-size: 14.5px; line-height: 21px; }
      .note svg { color: var(--info-text); margin-top: 1px; }
      .methods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .method {
        min-height: var(--control-h); border-radius: var(--radius-control); cursor: pointer;
        border: var(--selectable-border) solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 13px;
      }
      .method[aria-pressed='true'] { border-color: var(--flame); background: var(--surface); }
      .change { display: flex; justify-content: space-between; align-items: center; }

      /* Selector de persona */
      .people { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; padding: 2px; }
      .person {
        display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center;
        min-height: var(--row-h); padding: 8px 12px; text-align: left; cursor: pointer; width: 100%;
        border-radius: var(--radius-control); border: var(--selectable-border) solid var(--line-soft); background: var(--surface);
      }
      .person:hover { border-color: var(--line); }
      .person[aria-pressed='true'] { border-color: var(--flame); background: var(--surface-2); }
      .person .avatar { width: 32px; height: 32px; font-size: 12px; }
      [data-density='bahia'] .person .avatar { width: 40px; height: 40px; font-size: 14px; }
      /* Selector flotante: el campo se queda en su lugar y la lista flota encima del resto */
      .combo { position: relative; }
      .popover {
        position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20;
        max-height: min(360px, 55vh); overflow-y: auto; padding: 6px;
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card);
        box-shadow: var(--shadow-dialog);
        display: flex; flex-direction: column; gap: 2px;
        animation: rise var(--duration-enter) var(--ease-standard);
      }
      .option {
        display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center;
        min-height: var(--row-h); padding: 8px 10px; width: 100%; text-align: left; cursor: pointer;
        border: 0; border-radius: var(--radius-control); background: transparent;
      }
      .option:hover, .option[aria-selected='true'] { background: var(--surface-2); }
      .option[aria-selected='true'] { outline: 1px solid var(--line); }
      .option .avatar { width: 32px; height: 32px; font-size: 12px; }
      [data-density='bahia'] .option .avatar { width: 40px; height: 40px; font-size: 14px; }
      .picked-person { min-height: var(--control-h); }
      .group-label { font-size: 12px; font-weight: 600; color: var(--text-faint); margin: 8px 2px 2px; }

      /* ===================================================================== Detalle de cuenta */
      .tab-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 22px; align-items: end; }
      @media (max-width: 899.98px) { .tab-head { grid-template-columns: 1fr; } }
      .balance-card { display: flex; gap: 0; padding: 0; overflow: hidden; }
      .balance-card > div { padding: 16px 22px; border-right: 1px solid var(--line-soft); }
      .balance-card > div:last-child { border-right: 0; }
      .balance-card .k { font-size: 12px; font-weight: 600; color: var(--text-faint); }
      .balance-card .owe-fig { color: var(--flame-text); }
      .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
      @media (max-width: 1099.98px) { .detail-grid { grid-template-columns: 1fr; } }

      .day { display: flex; flex-direction: column; }
      .day + .day { margin-top: 18px; }
      .day-label { font-size: 12px; font-weight: 600; color: var(--text-faint); padding: 0 4px 8px; display: flex; justify-content: space-between; }
      .entry {
        display: grid; grid-template-columns: 74px minmax(0, 1fr) auto auto; gap: 14px; align-items: center;
        min-height: var(--row-h); padding: 8px 14px;
        background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-row);
      }
      .entry + .entry { margin-top: 6px; }
      .entry .time { color: var(--text-faint); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .entry .what { min-width: 0; }
      .entry .what .t { font-weight: 600; }
      .entry.payment { background: color-mix(in srgb, var(--go) 6%, var(--surface)); border-color: color-mix(in srgb, var(--go) 25%, var(--line-soft)); }
      .entry.payment .amt { color: var(--go-text); }
      .entry.voided .t, .entry.voided .amt { text-decoration: line-through; color: var(--text-faint); }
      .entry .act { min-width: 74px; display: flex; justify-content: flex-end; }
      @media (max-width: 599.98px) {
        .entry { grid-template-columns: minmax(0, 1fr) auto; }
        .entry .time { grid-column: 1 / -1; }
        .entry .act { grid-column: 1 / -1; justify-content: flex-start; }
      }
      /* bahía: la columna de hora sube a la segunda línea para dar aire al nombre */
      [data-density='bahia'] .entry { grid-template-columns: 88px minmax(0, 1fr) auto auto; padding: 12px 16px; }
      [data-density='bahia'] .entry .time { font-size: 14px; }
      [data-density='bahia'] .entry .what .t { font-size: 17px; }

      .side { display: flex; flex-direction: column; gap: 14px; }
      .kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
      .kv:last-child { border-bottom: 0; }

      /* ===================================================================== Inventario: qué cambia */
      .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      @media (max-width: 899.98px) { .compare { grid-template-columns: 1fr; } }
      .compare h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .flow { display: flex; flex-direction: column; gap: 8px; }
      .flow-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-row); border: 1px solid var(--line-soft); background: var(--surface-2); }
      .flow-item b { display: block; }
      .flow-item.gone { opacity: 0.6; }
      .flow-item.gone b { text-decoration: line-through; }
      .mini-tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line-soft); margin-bottom: 14px; }
      .mini-tabs span { padding: 8px 0 10px; font-weight: 600; color: var(--text-dim); position: relative; font-size: 13.5px; }
      .mini-tabs span.on { color: var(--text); }
      .mini-tabs span.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: var(--tab-mark); background: var(--gradient-action); border-radius: 999px; }
      .mini-tabs span.gone { text-decoration: line-through; color: var(--text-faint); }

      /* ===================================================================== Diálogo */
      .overlay {
        position: fixed; inset: 0; z-index: 50; background: var(--overlay);
        display: grid; place-items: center; padding: 16px;
        animation: fade var(--duration-enter) var(--ease-standard);
      }
      .dialog {
        width: min(480px, 100%); max-height: calc(100vh - 32px); overflow-y: auto;
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card);
        box-shadow: var(--shadow-dialog); padding: 22px; display: flex; flex-direction: column; gap: 16px;
        animation: rise var(--duration-enter) var(--ease-standard);
      }
      [data-density='bahia'] .dialog { width: min(560px, 100%); padding: 26px; }
      .dialog-foot { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
      @media (max-width: 599.98px) {
        .overlay { place-items: end center; padding: 0; }
        .dialog { width: 100%; border-radius: var(--radius-card) var(--radius-card) 0 0; }
        .dialog-foot .btn { flex: 1; }
      }
      @keyframes fade { from { opacity: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

      .toast {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60;
        background: var(--surface-3); border: 1px solid var(--line); border-radius: var(--radius-row);
        padding: 12px 18px; display: flex; gap: 10px; align-items: center; font-weight: 600;
        box-shadow: var(--shadow-dialog); animation: rise var(--duration-enter) var(--ease-standard);
        max-width: calc(100vw - 32px);
      }
      .toast svg { color: var(--go-text); }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="proto">
      <div class="proto-in">
        <span class="proto-title"><b>Prototipo</b> · Cuentas abiertas en Ventas</span>
        <div class="seg" role="group" aria-label="Pantalla del prototipo" id="proto-nav">
          <button data-go="sales" aria-pressed="false">Ventas</button>
          <button data-go="tabs" aria-pressed="true">Cuentas abiertas</button>
          <button data-go="new" aria-pressed="false">Nueva venta</button>
          <button data-go="inventory" aria-pressed="false">Qué cambia en Inventario</button>
        </div>
        <div class="proto-switches">
          <div class="seg" role="group" aria-label="Tema">
            <button data-theme-set="dark" aria-pressed="true">Oscuro</button>
            <button data-theme-set="light" aria-pressed="false">Claro</button>
          </div>
          <div class="seg" role="group" aria-label="Densidad">
            <button data-density-set="mostrador" aria-pressed="true">Mostrador</button>
            <button data-density-set="bahia" aria-pressed="false">Bahía</button>
          </div>
        </div>
      </div>
    </div>

    <main class="page" id="app"></main>
    <div id="layer"></div>

    <script>
      /* ===================================================================
       * Datos de ejemplo. Todo en centavos enteros, como el web (spec 076).
       * =================================================================== */
      const TODAY = '2026-10-05';
      const CASHIER = 'Karla (caja)';

      const PEOPLE = [
        { id: 'e1', kind: 'EMP', name: 'Juan Pérez', extra: 'Lavador' },
        { id: 'e2', kind: 'EMP', name: 'Ana López', extra: 'Lavadora' },
        { id: 'e3', kind: 'EMP', name: 'Carlos Méndez', extra: 'Pulidor' },
        { id: 'e4', kind: 'EMP', name: 'Luis Ramírez', extra: 'Lavador' },
        { id: 'e5', kind: 'EMP', name: 'Marta Díaz', extra: 'Cajera' },
        { id: 'c1', kind: 'CUS', name: 'Roberto Alas', extra: 'P 512-873' },
        { id: 'c2', kind: 'CUS', name: 'Transportes Lemus', extra: 'Flotilla · 6 carros' },
        { id: 'c3', kind: 'CUS', name: 'Gabriela Henríquez', extra: 'P 308-114' },
      ];

      const CATS = ['Bebidas', 'Snacks', 'Accesorios'];
      const PRODUCTS = [
        { id: 'p1', code: 'PRD-0001', cat: 'Bebidas', name: 'Coca-Cola lata', price: 100, stock: 34 },
        { id: 'p2', code: 'PRD-0002', cat: 'Bebidas', name: 'Agua Cristal 600 ml', price: 75, stock: 48 },
        { id: 'p3', code: 'PRD-0003', cat: 'Bebidas', name: 'Gatorade', price: 150, stock: 12 },
        { id: 'p4', code: 'PRD-0004', cat: 'Bebidas', name: 'Red Bull', price: 250, stock: 6 },
        { id: 'p5', code: 'PRD-0005', cat: 'Bebidas', name: 'Café', price: 50, stock: 80 },
        { id: 'p6', code: 'PRD-0006', cat: 'Bebidas', name: 'Jugo del Valle', price: 90, stock: 0 },
        { id: 'p7', code: 'PRD-0007', cat: 'Snacks', name: 'Churritos', price: 60, stock: 25 },
        { id: 'p8', code: 'PRD-0008', cat: 'Snacks', name: 'Galletas Pozuelo', price: 80, stock: 18 },
        { id: 'p9', code: 'PRD-0009', cat: 'Snacks', name: 'Maní salado', price: 50, stock: 30 },
        { id: 'p10', code: 'PRD-0010', cat: 'Accesorios', name: 'Ambientador pino', price: 300, stock: 9 },
        { id: 'p11', code: 'PRD-0011', cat: 'Accesorios', name: 'Toallitas para tablero', price: 450, stock: 5 },
      ];

      let seq = 100;
      const id = () => `x${++seq}`;
      const L = (at, pid, qty, by = CASHIER) => ({ id: id(), at, pid, qty, price: product(pid).price, by, voided: null });
      const P = (at, amount, method, by = CASHIER) => ({ id: id(), at, amount, method, by });

      const TABS = [
        {
          id: 't12', number: 12, personId: 'e1', openedAt: '2026-09-27T08:10', closedAt: null,
          lines: [
            L('2026-09-27T08:10', 'p5', 1), L('2026-09-27T12:30', 'p1', 1), L('2026-09-29T11:05', 'p3', 1, 'Marta Díaz'),
            L('2026-10-01T09:40', 'p7', 2), L('2026-10-03T13:15', 'p1', 2), L('2026-10-05T10:40', 'p2', 1),
          ],
          payments: [P('2026-09-30T17:20', 300, 'CASH')],
        },
        {
          id: 't14', number: 14, personId: 'e3', openedAt: '2026-10-01T10:00', closedAt: null,
          lines: [L('2026-10-01T10:00', 'p4', 1), L('2026-10-02T15:30', 'p4', 1), L('2026-10-04T09:10', 'p1', 1), L('2026-10-05T08:55', 'p5', 2)],
          payments: [],
        },
        {
          id: 't15', number: 15, personId: 'e2', openedAt: '2026-10-03T12:00', closedAt: null,
          lines: [L('2026-10-03T12:00', 'p2', 2), L('2026-10-05T11:20', 'p8', 1)],
          payments: [],
        },
        {
          id: 't13', number: 13, personId: 'c2', openedAt: '2026-09-28T09:00', closedAt: null,
          lines: [L('2026-09-28T09:00', 'p10', 4), L('2026-10-02T16:00', 'p11', 2, 'Marta Díaz')],
          payments: [P('2026-10-02T16:05', 1000, 'TRANSFER')],
        },
        {
          id: 't11', number: 11, personId: 'e4', openedAt: '2026-09-20T09:00', closedAt: '2026-09-30T17:30',
          lines: [L('2026-09-20T09:00', 'p1', 3), L('2026-09-25T10:00', 'p7', 2)],
          payments: [P('2026-09-30T17:30', 420, 'CASH')],
        },
      ];
      // Una línea quitada, para mostrar cómo se ve.
      TABS[0].lines[2].voided = { at: '2026-09-29T11:20', by: CASHIER, reason: 'Se anotó a Juan pero era de Luis' };

      const SALES = [
        { ref: 'V-0231', at: '2026-10-05T11:42', desc: 'Coca-Cola lata ×2, Churritos', method: 'CASH', total: 260 },
        { ref: 'V-0230', at: '2026-10-05T10:15', desc: 'Ambientador pino · con lavado #482', method: 'CARD', total: 300 },
        { ref: 'V-0229', at: '2026-10-05T09:02', desc: 'Gatorade', method: 'CASH', total: 150 },
      ];

      const METHODS = { CASH: 'Efectivo', CARD: 'Tarjeta', TRANSFER: 'Transferencia', OTHER: 'Otro' };

      /* =================================================================== Helpers */
      function product(pid) { return PRODUCTS.find((p) => p.id === pid); }
      function person(pid) { return PEOPLE.find((p) => p.id === pid); }
      function money(c) { const s = c < 0 ? '-' : ''; const a = Math.abs(Math.round(c)); return `${s}$${Math.trunc(a / 100)}.${String(a % 100).padStart(2, '0')}`; }
      function toCents(t) { const m = /^(\d+)(?:\.(\d{1,2}))?$/.exec(String(t).trim()); return m ? Number(m[1]) * 100 + Number((m[2] || '').padEnd(2, '0')) : null; }
      function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
      function initials(n) { return n.split(' ').map((w) => w[0]).slice(0, 2).join('').toUpperCase(); }
      function ref(n) { return `C-${String(n).padStart(4, '0')}`; }
      const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sept', 'oct', 'nov', 'dic'];
      const WEEKDAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      function dayOf(at) { return at.slice(0, 10); }
      function timeOf(at) { const [h, m] = at.slice(11, 16).split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'a. m.' : 'p. m.'}`; }
      function dateLabel(day) {
        if (day === TODAY) return 'Hoy';
        const d = new Date(`${day}T12:00:00`);
        const diff = Math.round((new Date(`${TODAY}T12:00:00`) - d) / 86400000);
        if (diff === 1) return 'Ayer';
        return `${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`.replace(/^./, (c) => c.toUpperCase());
      }
      function shortDate(day) { const d = new Date(`${day}T12:00:00`); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
      function daysOpen(t) { return Math.round((new Date(`${TODAY}T12:00:00`) - new Date(`${dayOf(t.openedAt)}T12:00:00`)) / 86400000); }
      function nowAt() { const d = new Date(); return `${TODAY}T${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }

      function consumed(t) { return t.lines.filter((l) => !l.voided).reduce((s, l) => s + l.qty * l.price, 0); }
      function paid(t) { return t.payments.reduce((s, p) => s + p.amount, 0); }
      function balance(t) { return consumed(t) - paid(t); }
      function units(t) { return t.lines.filter((l) => !l.voided).reduce((s, l) => s + l.qty, 0); }
      function lastMove(t) { const all = [...t.lines.map((l) => l.at), ...t.payments.map((p) => p.at)].sort(); return all[all.length - 1]; }
      function openTabOf(pid) { return TABS.find((t) => t.personId === pid && !t.closedAt); }

      const ICON = {
        plus: '<path d="M12 5v14M5 12h14"/>',
        minus: '<path d="M5 12h14"/>',
        chev: '<path d="m9 6 6 6-6 6"/>',
        back: '<path d="m15 6-6 6 6 6"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
        info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
        check: '<path d="m5 12 5 5 9-10"/>',
        x: '<path d="M6 6l12 12M18 6 6 18"/>',
        bag: '<path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
        cash: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
        arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
        box: '<path d="M3 7l9-4 9 4v10l-9 4-9-4V7Z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
      };
      const icon = (n) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
      const kindChip = (p) => (p.kind === 'EMP' ? '<span class="chip tint-consume">Trabajador</span>' : '<span class="chip tint-info">Cliente</span>');

      /* =================================================================== Estado */
      const state = {
        screen: 'tabs',
        filter: 'ALL',
        query: '',
        tabId: null,
        // Nueva venta
        cart: {},
        cat: 'Bebidas',
        how: 'NOW',
        method: 'CASH',
        received: '',
        payee: null,
        payeeQuery: '',
        productQuery: '',
        payeeOpen: false,
        payeeActive: 0,
        presetFromTab: null,
        flashTab: null,
      };

      /* =================================================================== Pantallas */
      function render() {
        const app = document.getElementById('app');
        document.querySelectorAll('#proto-nav button').forEach((b) => {
          const s = state.screen === 'tab' ? 'tabs' : state.screen;
          b.setAttribute('aria-pressed', String(b.dataset.go === s));
        });
        if (state.screen === 'sales' || state.screen === 'tabs') app.innerHTML = salesFrame();
        else if (state.screen === 'tab') app.innerHTML = tabDetail();
        else if (state.screen === 'new') app.innerHTML = newSale();
        else app.innerHTML = inventoryChange();
      }

      function salesFrame() {
        const open = TABS.filter((t) => !t.closedAt);
        return `
          <div class="head">
            <div>
              <h1>Ventas</h1>
            </div>
            <div class="head-actions">
              <button class="btn btn-primary" data-action="new-sale">${icon('plus')} Nueva venta</button>
            </div>
          </div>
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="${state.screen === 'sales'}" data-go="sales">Ventas del día</button>
            <button class="tab" role="tab" aria-selected="${state.screen === 'tabs'}" data-go="tabs">Cuentas abiertas <span class="count">${open.length}</span></button>
          </div>
          ${state.screen === 'sales' ? salesList() : tabsList()}
        `;
      }

      function salesList() {
        const rows = SALES.map((s) => `
          <tr>
            <td><span class="mono">${s.ref}</span></td>
            <td class="hide-sm faint tabular">${timeOf(s.at)}</td>
            <td>${esc(s.desc)}</td>
            <td class="hide-sm">${METHODS[s.method]}</td>
            <td>${s.tab ? '<span class="chip tint-consume">De cuenta</span>' : '<span class="chip tint-go">Cobrada</span>'}</td>
            <td class="num"><span class="mono">${money(s.total)}</span></td>
          </tr>`).join('');
        return `
          <div class="card table-card">
            <table class="table">
              <thead><tr><th>Ref.</th><th class="hide-sm">Hora</th><th>Detalle</th><th class="hide-sm">Pago</th><th>Estado</th><th class="num">Total</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
      }

      function tabsList() {
        const open = TABS.filter((t) => !t.closedAt);
        const owed = open.reduce((s, t) => s + balance(t), 0);
        const owedBy = (kind) => open.filter((t) => person(t.personId).kind === kind).reduce((s, t) => s + balance(t), 0);
        const counts = {
          ALL: open.length,
          EMP: open.filter((t) => person(t.personId).kind === 'EMP').length,
          CUS: open.filter((t) => person(t.personId).kind === 'CUS').length,
          CLOSED: TABS.filter((t) => t.closedAt).length,
        };
        const q = state.query.trim().toLowerCase();
        const list = TABS.filter((t) => {
          const p = person(t.personId);
          if (state.filter === 'CLOSED') { if (!t.closedAt) return false; }
          else if (t.closedAt) return false;
          if (state.filter === 'EMP' && p.kind !== 'EMP') return false;
          if (state.filter === 'CUS' && p.kind !== 'CUS') return false;
          return !q || p.name.toLowerCase().includes(q) || ref(t.number).toLowerCase().includes(q);
        }).sort((a, b) => balance(b) - balance(a) || lastMove(b).localeCompare(lastMove(a)));

        const chip = (k, label) => `<button class="filter-chip" aria-pressed="${state.filter === k}" data-filter="${k}">${label} <span class="n">${counts[k]}</span></button>`;

        const rows = list.length
          ? list.map((t) => {
              const p = person(t.personId);
              return `
                <button class="tab-row ${t.closedAt ? 'closed' : ''} ${state.flashTab === t.id ? 'flash' : ''}" data-open-tab="${t.id}">
                  <span class="avatar">${initials(p.name)}</span>
                  <span class="who">
                    <span class="name">${esc(p.name)} ${kindChip(p)}</span>
                    <span class="dense faint"><span class="mono" style="font-size:12px">${ref(t.number)}</span> · ${units(t)} productos</span>
                  </span>
                  <span class="owe">
                    ${t.closedAt ? '<span class="chip tint-go">Pagada</span>' : `<span class="mono">${money(balance(t))}</span>`}
                  </span>
                  <span class="chev">${icon('chev')}</span>
                </button>`;
            }).join('')
          : `<div class="empty"><b>${q ? 'Sin resultados' : state.filter === 'CLOSED' ? 'Ninguna cerrada' : 'Nadie debe nada'}</b></div>`;

        return `
          <div class="stats">
            <div class="stat"><div class="k">Por cobrar</div><div class="v">${money(owed)}</div></div>
            <div class="stat"><div class="k">Trabajadores</div><div class="v">${money(owedBy('EMP'))}</div></div>
            <div class="stat"><div class="k">Clientes</div><div class="v">${money(owedBy('CUS'))}</div></div>
          </div>
          <div class="toolbar">
            <label class="search">${icon('search')}<input class="input" placeholder="Buscar" value="${esc(state.query)}" data-input="query" aria-label="Buscar cuenta" /></label>
            ${chip('ALL', 'Todas')}${chip('EMP', 'Trabajadores')}${chip('CUS', 'Clientes')}${chip('CLOSED', 'Cerradas')}
            <button class="btn btn-outline btn-sm" style="margin-left:auto" data-action="open-tab-dialog">${icon('plus')} Abrir cuenta</button>
          </div>
          <div class="rows">${rows}</div>`;
      }

      function tabDetail() {
        const t = TABS.find((x) => x.id === state.tabId);
        const p = person(t.personId);
        const bal = balance(t);
        const events = [
          ...t.lines.map((l) => ({ type: 'line', at: l.at, l })),
          ...t.payments.map((pm) => ({ type: 'pay', at: pm.at, pm })),
        ].sort((a, b) => b.at.localeCompare(a.at));
        const byDay = {};
        events.forEach((e) => { (byDay[dayOf(e.at)] ||= []).push(e); });

        const days = Object.keys(byDay).sort().reverse().map((day) => {
          const dayTotal = byDay[day].filter((e) => e.type === 'line' && !e.l.voided).reduce((s, e) => s + e.l.qty * e.l.price, 0);
          return `
            <div class="day">
              <div class="day-label"><span>${dateLabel(day)}</span><span class="tabular">${dayTotal ? money(dayTotal) : ''}</span></div>
              ${byDay[day].map((e) => (e.type === 'line' ? lineEntry(e.l, t) : payEntry(e.pm))).join('')}
            </div>`;
        }).join('');

        return `
          <button class="back" data-go="tabs">${icon('back')} Cuentas abiertas</button>
          <div class="tab-head">
            <div>
              <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
                ${kindChip(p)}
                <span class="mono faint" style="font-size:12.5px">${ref(t.number)}</span>
                ${t.closedAt ? '<span class="chip tint-go">Pagada</span>' : ''}
              </div>
              <h1>${esc(p.name)}</h1>
            </div>
            ${t.closedAt ? '' : `
            <div class="head-actions">
              <button class="btn btn-outline" data-action="add-to-tab">${icon('plus')} Anotar productos</button>
              <button class="btn btn-primary" data-action="charge-tab" ${bal <= 0 ? 'disabled' : ''}>${icon('cash')} Cobrar</button>
            </div>`}
          </div>

          <div style="max-width:820px">
            <div>
              <div class="card balance-card" style="margin-bottom:18px">
                <div style="flex:1.3"><div class="k">${t.closedAt ? 'Saldo' : 'Debe'}</div><div class="figure ${bal > 0 ? 'owe-fig' : ''}">${money(bal)}</div></div>
                <div style="flex:1"><div class="k">Anotado</div><div class="figure dim" style="font-size:calc(var(--figure-size) * .7)">${money(consumed(t))}</div></div>
                <div style="flex:1"><div class="k">Abonado</div><div class="figure dim" style="font-size:calc(var(--figure-size) * .7)">${money(paid(t))}</div></div>
              </div>
              ${days || '<div class="empty"><b>Vacía</b></div>'}
            </div>
          </div>`;
      }

      function lineEntry(l, t) {
        const pr = product(l.pid);
        const canVoid = !t.closedAt && !l.voided && balance(t) - l.qty * l.price >= 0;
        return `
          <div class="entry ${l.voided ? 'voided' : ''}">
            <span class="time">${timeOf(l.at)}</span>
            <div class="what">
              <div class="t">${esc(pr.name)}${l.qty > 1 ? ` <span class="faint">×${l.qty}</span>` : ''}</div>
              ${l.voided ? `<div class="dense faint">${esc(l.voided.reason)}</div>` : ''}
            </div>
            <span class="amt mono">${money(l.qty * l.price)}</span>
            <span class="act">${l.voided ? '<span class="chip tint-muted">Quitado</span>' : canVoid ? `<button class="btn btn-ghost btn-sm" data-void="${l.id}">Quitar</button>` : ''}</span>
          </div>`;
      }

      function payEntry(pm) {
        return `
          <div class="entry payment">
            <span class="time">${timeOf(pm.at)}</span>
            <div class="what">
              <div class="t">Abono <span class="faint">· ${METHODS[pm.method]}</span></div>
            </div>
            <span class="amt mono">−${money(pm.amount)}</span>
            <span class="act"></span>
          </div>`;
      }

      /* ------------------------------------------------------------- Nueva venta */
      function cartLines() { return Object.entries(state.cart).filter(([, q]) => q > 0).map(([pid, q]) => ({ p: product(pid), q })); }
      function cartTotal() { return cartLines().reduce((s, { p, q }) => s + p.price * q, 0); }

      function newSale() {
        const pq = state.productQuery.trim().toLowerCase();
        const items = pq ? PRODUCTS.filter((p) => p.name.toLowerCase().includes(pq)) : PRODUCTS.filter((p) => p.cat === state.cat);
        const lines = cartLines();
        const total = cartTotal();
        const fromTab = state.presetFromTab ? TABS.find((t) => t.id === state.presetFromTab) : null;

        const tiles = items.map((p) => {
          const inCart = state.cart[p.id] || 0;
          const left = p.stock - inCart;
          const control = p.stock === 0
            ? '<span class="chip tint-muted">Agotado</span>'
            : inCart
              ? `<span class="stepper">
                  <button data-dec="${p.id}" aria-label="Quitar uno de ${esc(p.name)}">${icon('minus')}</button>
                  <span class="mono">${inCart}</span>
                  <button data-add="${p.id}" aria-label="Agregar uno de ${esc(p.name)}" ${left <= 0 ? 'disabled' : ''}>${icon('plus')}</button>
                </span>`
              : `<button class="add-btn" data-add="${p.id}" aria-label="Agregar ${esc(p.name)}">${icon('plus')}</button>`;
          return `
            <div class="product-row ${inCart ? 'picked' : ''} ${p.stock === 0 ? 'out' : ''}">
              <span class="pn">${esc(p.name)}</span>
              <span class="dense faint tabular">${p.stock === 0 ? '' : `Hay ${left}`}</span>
              <span class="mono">${money(p.price)}</span>
              <span class="pc">${control}</span>
            </div>`;
        }).join('');

        const cart = lines.length
          ? lines.map(({ p, q }) => `
              <div class="cart-line">
                <div style="font-weight:600">${esc(p.name)}</div>
                <span class="faint tabular">×${q}</span>
                <span class="mono" style="min-width:64px;text-align:right">${money(p.price * q)}</span>
              </div>`).join('')
          : '<div class="empty" style="padding:22px">Sin productos</div>';

        return `
          <button class="back" data-action="leave-new">${icon('back')} ${fromTab ? esc(person(fromTab.personId).name) : 'Ventas'}</button>
          <div class="head">
            <div>
              <h1>${fromTab ? `Anotar a ${esc(person(fromTab.personId).name.split(' ')[0])}` : 'Nueva venta'}</h1>
            </div>
          </div>
          <div class="sale-grid">
            <section style="display:flex;flex-direction:column;gap:14px">
              <label class="search">${icon('search')}<input class="input" placeholder="Buscar producto" aria-label="Buscar producto" value="${esc(state.productQuery)}" data-input="productQuery" /></label>
              ${pq ? '' : `<div class="cats">${CATS.map((c) => `<button class="filter-chip" aria-pressed="${state.cat === c}" data-cat="${c}">${c}</button>`).join('')}</div>`}
              <div class="products">${tiles || '<div class="empty">Sin resultados</div>'}</div>
            </section>
            <aside class="card cart">
              <div class="cart-lines">${cart}</div>
              <div class="total-row"><span class="dim">Total</span><span class="figure">${money(total)}</span></div>
              ${fromTab ? anotarFixed(fromTab, total) : howBlock(total)}
            </aside>
          </div>`;
      }

      function anotarFixed(t, total) {
        const p = person(t.personId);
        return `
          <div class="how">
            <div class="total-row"><span class="dim">Queda debiendo</span><span class="mono">${money(balance(t) + total)}</span></div>
            <button class="btn btn-primary btn-block" data-action="confirm-tab" ${total ? '' : 'disabled'}>Anotar ${money(total)} a ${esc(p.name.split(' ')[0])}</button>
          </div>`;
      }

      function howBlock(total) {
        const seg = `
          <div class="seg wide" role="group" aria-label="Cómo se paga">
            <button aria-pressed="${state.how === 'NOW'}" data-how="NOW">Cobrar ahora</button>
            <button aria-pressed="${state.how === 'TAB'}" data-how="TAB">Anotar a cuenta</button>
          </div>`;

        if (state.how === 'NOW') {
          const rec = toCents(state.received);
          const change = rec !== null && rec >= total ? rec - total : null;
          return `
            <div class="how">
              ${seg}
              <div class="methods">${Object.entries(METHODS).map(([k, v]) => `<button class="method" aria-pressed="${state.method === k}" data-method="${k}">${v}</button>`).join('')}</div>
              ${state.method === 'CASH' ? `
                <label class="field"><span>Recibido</span><input class="input mono" inputmode="decimal" placeholder="${(total / 100).toFixed(2)}" value="${esc(state.received)}" data-input="received" /></label>
                <div class="change"><span class="dim">Vuelto</span><span class="mono" style="font-size:17px">${change !== null ? money(change) : '—'}</span></div>` : ''}
              <button class="btn btn-primary btn-block" data-action="confirm-now" ${total ? '' : 'disabled'}>Cobrar ${money(total)}</button>
            </div>`;
        }

        const matches = payeeMatches();
        const owes = (p) => {
          const t = openTabOf(p.id);
          return t
            ? `<span class="mono" style="font-size:12.5px">${money(balance(t))}</span>`
            : '';
        };
        const option = (p) => `
          <button class="option" role="option" id="opt-${p.id}" aria-selected="${matches[state.payeeActive]?.id === p.id}" data-payee="${p.id}" tabindex="-1">
            <span class="avatar">${initials(p.name)}</span>
            <span><span style="font-weight:600;display:block">${esc(p.name)}</span><span class="dense faint">${esc(p.extra)}</span></span>
            ${owes(p)}
          </button>`;
        const emps = matches.filter((p) => p.kind === 'EMP');
        const cus = matches.filter((p) => p.kind === 'CUS');
        const sel = state.payee ? person(state.payee) : null;
        const selTab = sel ? openTabOf(sel.id) : null;

        // Cerrado y con alguien elegido: la persona ocupa el lugar del campo.
        // Abierto (o sin elegir): el campo de búsqueda, con la lista flotando debajo.
        const field = sel && !state.payeeOpen
          ? `
            <button class="person picked-person" aria-pressed="true" data-action="payee-change" aria-label="Cambiar a quién se le anota">
              <span class="avatar">${initials(sel.name)}</span>
              <span><span style="font-weight:600;display:block">${esc(sel.name)}</span><span class="dense faint">${esc(sel.extra)}</span></span>
              <span class="dense" style="color:var(--flame-text);font-weight:600">Cambiar</span>
            </button>`
          : `
            <label class="search">${icon('search')}<input class="input" placeholder="¿A quién se le anota?" value="${esc(state.payeeQuery)}" data-input="payeeQuery" aria-label="Buscar persona"
              role="combobox" aria-expanded="${state.payeeOpen}" aria-controls="payee-list" ${state.payeeOpen && matches[state.payeeActive] ? `aria-activedescendant="opt-${matches[state.payeeActive].id}"` : ''} autocomplete="off" /></label>
            ${state.payeeOpen ? `
              <div class="popover" id="payee-list" role="listbox" aria-label="Personas">
                ${emps.length ? `<div class="group-label">Trabajadores</div>${emps.map(option).join('')}` : ''}
                ${cus.length ? `<div class="group-label">Clientes</div>${cus.map(option).join('')}` : ''}
                ${!matches.length ? '<div class="empty" style="padding:16px">Nadie con ese nombre.</div>' : ''}
              </div>` : ''}`;

        return `
          <div class="how">
            ${seg}
            <div class="combo">${field}</div>
            ${selTab ? `<div class="total-row"><span class="dim">Queda debiendo</span><span class="mono">${money(balance(selTab) + total)}</span></div>` : ''}
            <button class="btn btn-primary btn-block" data-action="confirm-tab" ${total && sel ? '' : 'disabled'}>${sel ? `Anotar ${money(total)} a ${esc(sel.name.split(' ')[0])}` : 'Anotar'}</button>
          </div>`;
      }

      // Trabajadores primero, después clientes: el mismo orden en que se dibuja la lista.
      function payeeMatches() {
        const q = state.payeeQuery.trim().toLowerCase();
        const match = (p) => !q || p.name.toLowerCase().includes(q) || p.extra.toLowerCase().includes(q);
        return [...PEOPLE.filter((p) => p.kind === 'EMP' && match(p)), ...PEOPLE.filter((p) => p.kind === 'CUS' && match(p))];
      }
      function pickPayee(pid) { state.payee = pid; state.payeeOpen = false; state.payeeQuery = ''; state.payeeActive = 0; render(); }

      function nextNumber() { return Math.max(...TABS.map((t) => t.number)) + 1; }

      /* ------------------------------------------------------------- Inventario */
      function inventoryChange() {
        return `
          <div class="head">
            <div>
              <h1>Qué cambia en Inventario</h1>
            </div>
          </div>
          <div class="compare">
            <div class="card">
              <h3>Hoy</h3>
              <div class="mini-tabs"><span class="on">Existencias</span><span>Movimientos</span><span>Consumos del personal</span></div>
              <div class="flow">
                <div class="flow-item">${icon('box')}<div><b>Despacho de insumos</b></div></div>
                <div class="flow-item">${icon('bag')}<div><b>Consumo de empleado</b></div></div>
              </div>
            </div>
            <div class="card">
              <h3>Con este cambio</h3>
              <div class="mini-tabs"><span class="on">Existencias</span><span>Movimientos</span><span class="gone">Consumos del personal</span></div>
              <div class="flow">
                <div class="flow-item">${icon('box')}<div><b>Despacho de insumos</b></div></div>
                <div class="flow-item gone">${icon('bag')}<div><b>Consumo de empleado</b></div></div>
                <div class="flow-item" style="border-color:color-mix(in srgb, var(--flame) var(--tint-line), transparent)">${icon('arrow')}<div><b>Ventas → Cuentas abiertas</b></div></div>
              </div>
            </div>
          </div>
          <div class="card">
            <h3 style="margin-bottom:12px">Kardex</h3>
            <table class="table">
              <thead><tr><th>Cuándo</th><th>Movimiento</th><th class="hide-sm">A quién</th><th class="num">Cant.</th></tr></thead>
              <tbody>
                <tr><td class="tabular">Hoy 10:40 a. m.</td><td><span class="chip tint-info">Venta</span> <span class="mono dense">${ref(12)}</span></td><td class="hide-sm">Juan Pérez</td><td class="num mono">−1</td></tr>
                <tr><td class="tabular">Hoy 9:02 a. m.</td><td><span class="chip tint-info">Venta</span> <span class="mono dense">V-0229</span></td><td class="hide-sm faint">—</td><td class="num mono">−1</td></tr>
                <tr><td class="tabular">26 sept</td><td><span class="chip tint-consume">Consumo</span></td><td class="hide-sm">Ana López</td><td class="num mono">−2</td></tr>
              </tbody>
            </table>
          </div>`;
      }

      /* =================================================================== Diálogos */
      const layer = document.getElementById('layer');
      function closeLayer() { layer.innerHTML = ''; }
      function toast(msg) {
        const el = document.createElement('div');
        el.className = 'toast'; el.innerHTML = `${icon('check')}<span>${msg}</span>`;
        document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
      }

      let charge = null;
      function openCharge() {
        const t = TABS.find((x) => x.id === state.tabId);
        charge = { amount: (balance(t) / 100).toFixed(2), method: 'CASH', received: '' };
        drawCharge();
      }
      function drawCharge() {
        const t = TABS.find((x) => x.id === state.tabId);
        const p = person(t.personId);
        const bal = balance(t);
        const amt = toCents(charge.amount);
        const valid = amt !== null && amt > 0 && amt <= bal;
        const rest = valid ? bal - amt : null;
        const rec = toCents(charge.received);
        const change = valid && rec !== null && rec >= amt ? rec - amt : null;
        layer.innerHTML = `
          <div class="overlay" data-close>
            <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
              <div><h2 id="dlg-t">Cobrar a ${esc(p.name)}</h2><p class="dim" style="margin-top:4px">Debe <b class="mono">${money(bal)}</b></p></div>
              <label class="field"><span>Monto</span><input class="input mono" inputmode="decimal" value="${esc(charge.amount)}" data-charge="amount" /></label>
              <div class="cats">
                <button class="filter-chip" data-charge-quick="${bal}">Todo · ${money(bal)}</button>
                ${bal > 500 ? `<button class="filter-chip" data-charge-quick="500">$5.00</button>` : ''}
                ${bal > 1000 ? `<button class="filter-chip" data-charge-quick="1000">$10.00</button>` : ''}
              </div>
              <div class="methods">${Object.entries(METHODS).map(([k, v]) => `<button class="method" aria-pressed="${charge.method === k}" data-charge-method="${k}">${v}</button>`).join('')}</div>
              ${charge.method === 'CASH' ? `
                <label class="field"><span>Recibido</span><input class="input mono" inputmode="decimal" placeholder="${valid ? (amt / 100).toFixed(2) : ''}" value="${esc(charge.received)}" data-charge="received" /></label>
                <div class="change"><span class="dim">Vuelto</span><span class="mono" style="font-size:17px">${change !== null ? money(change) : '—'}</span></div>` : ''}
              ${valid && rest > 0 ? `<div class="total-row"><span class="dim">Queda debiendo</span><span class="mono">${money(rest)}</span></div>` : ''}
              <div class="dialog-foot">
                <button class="btn btn-ghost" data-action="close">Cancelar</button>
                <button class="btn btn-primary" data-action="do-charge" ${valid ? '' : 'disabled'}>${valid ? (rest === 0 ? `Cobrar ${money(amt)} y cerrar` : `Abonar ${money(amt)}`) : 'Cobrar'}</button>
              </div>
            </div>
          </div>`;
      }

      let voidLine = null;
      function drawVoid() {
        const t = TABS.find((x) => x.id === state.tabId);
        const l = t.lines.find((x) => x.id === voidLine.id);
        const pr = product(l.pid);
        layer.innerHTML = `
          <div class="overlay" data-close>
            <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-v">
              <div><h2 id="dlg-v">Quitar</h2><p class="dim" style="margin-top:4px">${esc(pr.name)}${l.qty > 1 ? ` ×${l.qty}` : ''} · ${money(l.qty * l.price)}</p></div>
              <label class="field"><span>Motivo</span><textarea class="input" data-void-reason>${esc(voidLine.reason)}</textarea></label>
              <div class="dialog-foot">
                <button class="btn btn-ghost" data-action="close">Cancelar</button>
                <button class="btn btn-danger" data-action="do-void" ${voidLine.reason.trim() ? '' : 'disabled'}>Quitar</button>
              </div>
            </div>
          </div>`;
      }

      let opener = null;
      function drawOpener() {
        const q = opener.query.trim().toLowerCase();
        const list = PEOPLE.filter((p) => !q || p.name.toLowerCase().includes(q));
        const sel = opener.pick ? person(opener.pick) : null;
        const existing = sel ? openTabOf(sel.id) : null;
        layer.innerHTML = `
          <div class="overlay" data-close>
            <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-o">
              <div><h2 id="dlg-o">Abrir cuenta</h2></div>
              <label class="search">${icon('search')}<input class="input" placeholder="Buscar" value="${esc(opener.query)}" data-opener-q /></label>
              <div class="people">${list.map((p) => {
                const t = openTabOf(p.id);
                return `<button class="person" aria-pressed="${opener.pick === p.id}" data-opener-pick="${p.id}"><span class="avatar">${initials(p.name)}</span><span><span style="font-weight:600;display:block">${esc(p.name)}</span><span class="dense faint">${esc(p.extra)}</span></span>${t ? `<span class="chip tint-flame">${ref(t.number)}</span>` : ''}</button>`;
              }).join('')}</div>
              <div class="dialog-foot">
                <button class="btn btn-ghost" data-action="close">Cancelar</button>
                <button class="btn btn-primary" data-action="do-open" ${sel ? '' : 'disabled'}>${existing ? `Ir a ${ref(existing.number)}` : 'Abrir y anotar'}</button>
              </div>
            </div>
          </div>`;
      }

      /* =================================================================== Acciones */
      function go(screen) {
        state.screen = screen;
        if (screen === 'new') { state.presetFromTab = null; }
        render(); window.scrollTo({ top: 0 });
      }
      function resetCart() { state.cart = {}; state.received = ''; state.payee = null; state.payeeQuery = ''; state.productQuery = ''; state.payeeOpen = false; state.payeeActive = 0; state.how = 'NOW'; state.method = 'CASH'; }

      document.addEventListener('click', (e) => {
        if (state.payeeOpen && !e.target.closest('.combo')) { state.payeeOpen = false; render(); }
        const el = e.target.closest('button, a, [data-close]');
        if (!el) return;

        if (el.matches('[data-close]') && e.target === el) { closeLayer(); return; }
        if (el.dataset.themeSet) {
          document.documentElement.dataset.theme = el.dataset.themeSet;
          el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); return;
        }
        if (el.dataset.densitySet) {
          document.documentElement.dataset.density = el.dataset.densitySet;
          el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); return;
        }
        if (el.dataset.go) { if (el.dataset.go === 'new') resetCart(); go(el.dataset.go); return; }
        if (el.dataset.openTab) { e.preventDefault(); state.tabId = el.dataset.openTab; go('tab'); return; }
        if (el.dataset.filter) { state.filter = el.dataset.filter; render(); return; }
        if (el.dataset.cat) { state.cat = el.dataset.cat; render(); return; }
        if (el.dataset.add) { const p = product(el.dataset.add); const q = state.cart[p.id] || 0; if (q < p.stock) state.cart[p.id] = q + 1; render(); return; }
        if (el.dataset.dec) { const q = (state.cart[el.dataset.dec] || 0) - 1; if (q <= 0) delete state.cart[el.dataset.dec]; else state.cart[el.dataset.dec] = q; render(); return; }
        if (el.dataset.how) { state.how = el.dataset.how; render(); return; }
        if (el.dataset.method) { state.method = el.dataset.method; render(); return; }
        if (el.dataset.payee) { pickPayee(el.dataset.payee); return; }
        if (el.dataset.void) { voidLine = { id: el.dataset.void, reason: '' }; drawVoid(); layer.querySelector('textarea').focus(); return; }
        if (el.dataset.chargeQuick) { charge.amount = (Number(el.dataset.chargeQuick) / 100).toFixed(2); drawCharge(); return; }
        if (el.dataset.chargeMethod) { charge.method = el.dataset.chargeMethod; drawCharge(); return; }
        if (el.dataset.openerPick) { opener.pick = el.dataset.openerPick; drawOpener(); return; }

        switch (el.dataset.action) {
          case 'new-sale': resetCart(); go('new'); break;
          case 'leave-new': if (state.presetFromTab) { state.tabId = state.presetFromTab; go('tab'); } else go('sales'); break;
          case 'add-to-tab': resetCart(); state.presetFromTab = state.tabId; state.screen = 'new'; render(); window.scrollTo({ top: 0 }); break;
          case 'confirm-now': {
            const total = cartTotal();
            cartLines().forEach(({ p, q }) => { p.stock -= q; });
            SALES.unshift({ ref: `V-0${232 + SALES.length - 3}`, at: nowAt(), desc: cartLines().map(({ p, q }) => (q > 1 ? `${p.name} ×${q}` : p.name)).join(', '), method: state.method, total });
            resetCart(); go('sales'); toast('Cobrada'); break;
          }
          case 'confirm-tab': {
            const total = cartTotal();
            const pid = state.presetFromTab ? TABS.find((t) => t.id === state.presetFromTab).personId : state.payee;
            let t = openTabOf(pid);
            if (!t) { t = { id: id(), number: nextNumber(), personId: pid, openedAt: nowAt(), closedAt: null, lines: [], payments: [] }; TABS.push(t); }
            cartLines().forEach(({ p, q }) => { p.stock -= q; t.lines.push({ id: id(), at: nowAt(), pid: p.id, qty: q, price: p.price, by: CASHIER, voided: null }); });
            const back = state.presetFromTab;
            resetCart(); state.presetFromTab = null; state.tabId = t.id;
            if (back) go('tab');
            else { state.filter = 'ALL'; state.query = ''; state.flashTab = t.id; go('tabs'); state.flashTab = null; }
            toast(`Anotado a ${person(pid).name.split(' ')[0]}`); break;
          }
          case 'payee-change': state.payeeOpen = true; state.payeeActive = 0; render(); refocus('[data-input="payeeQuery"]'); break;
          case 'charge-tab': openCharge(); break;
          case 'do-charge': {
            const t = TABS.find((x) => x.id === state.tabId);
            const amt = toCents(charge.amount);
            t.payments.push({ id: id(), at: nowAt(), amount: amt, method: charge.method, by: CASHIER });
            SALES.unshift({ ref: `V-0${232 + SALES.length - 3}`, at: nowAt(), desc: `Cuenta de ${person(t.personId).name}`, method: charge.method, total: amt, tab: t.id });
            const closed = balance(t) === 0;
            if (closed) t.closedAt = nowAt();
            closeLayer(); render(); toast(closed ? 'Pagada' : `Abono de ${money(amt)}`); break;
          }
          case 'do-void': {
            const t = TABS.find((x) => x.id === state.tabId);
            const l = t.lines.find((x) => x.id === voidLine.id);
            l.voided = { at: nowAt(), by: CASHIER, reason: voidLine.reason.trim() };
            product(l.pid).stock += l.qty;
            closeLayer(); render(); toast('Quitado'); break;
          }
          case 'open-tab-dialog': opener = { query: '', pick: null }; drawOpener(); break;
          case 'do-open': {
            const existing = openTabOf(opener.pick);
            closeLayer();
            if (existing) { state.tabId = existing.id; go('tab'); }
            else { resetCart(); state.how = 'TAB'; state.payee = opener.pick; state.presetFromTab = null; state.screen = 'new'; render(); window.scrollTo({ top: 0 }); }
            break;
          }
          case 'close': closeLayer(); break;
        }
      });

      // Los campos de texto no redibujan toda la pantalla al teclear (se perdería el foco):
      // redibujan y devuelven el foco al mismo campo con el cursor al final.
      function refocus(sel) { const f = document.querySelector(sel); if (f) { f.focus(); const v = f.value; f.setSelectionRange?.(v.length, v.length); } }
      // Búsquedas con debounce de 250 ms, el mismo SEARCH_DEBOUNCE_MS del web: el valor se guarda
      // al teclear y la lista se filtra cuando el usuario deja de escribir. Si para entonces el foco
      // ya está en otro lado, se redibuja sin robárselo.
      const SEARCH_DEBOUNCE_MS = 250;
      const timers = {};
      function debounced(key, selector, draw) {
        clearTimeout(timers[key]);
        timers[key] = setTimeout(() => {
          const typing = document.activeElement?.matches(selector);
          draw();
          if (typing) refocus(selector);
        }, SEARCH_DEBOUNCE_MS);
      }
      const SEARCHES = ['query', 'payeeQuery', 'productQuery'];

      document.addEventListener('input', (e) => {
        const t = e.target;
        if (t.dataset.input && SEARCHES.includes(t.dataset.input)) {
          const key = t.dataset.input;
          state[key] = t.value;
          if (key === 'payeeQuery') { state.payeeOpen = true; state.payeeActive = 0; }
          debounced(key, `[data-input="${key}"]`, render);
        }
        else if (t.dataset.input) {
          state[t.dataset.input] = t.value;
          render(); refocus(`[data-input="${t.dataset.input}"]`);
        }
        else if (t.dataset.charge) { charge[t.dataset.charge] = t.value; drawCharge(); refocus(`[data-charge="${t.dataset.charge}"]`); }
        else if (t.matches('[data-void-reason]')) { voidLine.reason = t.value; const b = layer.querySelector('[data-action="do-void"]'); b.disabled = !t.value.trim(); }
        else if (t.matches('[data-opener-q]')) { opener.query = t.value; debounced('opener', '[data-opener-q]', drawOpener); }
      });
      // Al entrar al campo se abre la lista; flechas para moverse, Enter elige, Escape cierra.
      document.addEventListener('focusin', (e) => {
        if (e.target.matches('[data-input="payeeQuery"]') && !state.payeeOpen) { state.payeeOpen = true; render(); refocus('[data-input="payeeQuery"]'); }
      });
      document.addEventListener('keydown', (e) => {
        if (state.payeeOpen && e.target.matches('[data-input="payeeQuery"]')) {
          const list = payeeMatches();
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (!list.length) return;
            state.payeeActive = (state.payeeActive + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length;
            render(); refocus('[data-input="payeeQuery"]');
            document.getElementById(`opt-${list[state.payeeActive].id}`)?.scrollIntoView({ block: 'nearest' });
            return;
          }
          if (e.key === 'Enter' && list[state.payeeActive]) { e.preventDefault(); pickPayee(list[state.payeeActive].id); return; }
          if (e.key === 'Escape') { state.payeeOpen = false; render(); return; }
        }
        if (e.key === 'Escape') closeLayer();
      });

      render();
    </script>
  </body>
</html>
