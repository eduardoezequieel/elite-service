packages:
  - 'apps/*'
  - 'packages/*'

# pnpm bloquea por defecto los scripts de instalacion de las dependencias.
# Solo se habilitan las que de verdad los necesitan:
# - prisma y @prisma/engines bajan el motor de consultas; sin esto el CLI no corre.
# - esbuild instala su binario nativo.
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
